[build]
  command = "mkdir -p public && cp index.html public/index.html"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/tripadvisor/:endpoint"
  to = "/.netlify/functions/tripadvisor?endpoint=:endpoint"
  status = 200

[[redirects]]
  from = "/api/destination/discover"
  to = "/.netlify/functions/discover"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
