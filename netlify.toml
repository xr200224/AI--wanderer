[build]
  command = "mkdir -p public && cp index.html public/index.html"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/tripadvisor/health"
  to = "/.netlify/functions/tripadvisor-health"
  status = 200

[[redirects]]
  from = "/api/tripadvisor/search"
  to = "/.netlify/functions/tripadvisor-search"
  status = 200

[[redirects]]
  from = "/api/tripadvisor/reviews"
  to = "/.netlify/functions/tripadvisor-reviews"
  status = 200

[[redirects]]
  from = "/api/tripadvisor/hotels"
  to = "/.netlify/functions/tripadvisor-hotels"
  status = 200

[[redirects]]
  from = "/api/tripadvisor/destination"
  to = "/.netlify/functions/tripadvisor-destination"
  status = 200

[[redirects]]
  from = "/api/destination/discover"
  to = "/.netlify/functions/discover"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
