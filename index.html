function renderMorphRouteCard(cardId, options = {}) {
  const root = document.getElementById(`morph-route-card-${cardId}`);
  const state = window.__MORPH_ROUTE_CARDS[cardId];
  if (!root || !state) {
    syncMorphSpotDetailPortal(null);
    return;
  }
  const panel = getResponsePanel();
  const previousScrollTop = panel ? panel.scrollTop : null;
  const previousScrollBehavior = panel ? panel.style.scrollBehavior : '';
  const anchorBefore = options.anchorSpotId ? findMorphSpotCardElement(root, options.anchorSpotId) : null;
  const anchorTop = anchorBefore ? anchorBefore.getBoundingClientRect().top : null;
  const startHeight = root.getBoundingClientRect().height;
  if (!options.skipHeightTransition) root.style.height = `${startHeight}px`;
  root.dataset.cardStage = state.cardStage;
  const previousSuppressPickAnimation = state.suppressPickAnimation;
  if (options.suppressPickAnimation) state.suppressPickAnimation = true;
  root.innerHTML = morphRouteCardInnerHTML(state);
  syncMorphSpotDetailPortal(state);
  state.suppressPickAnimation = previousSuppressPickAnimation;
  if (options.skipHeightTransition) {
    root.style.height = 'auto';
  } else {
    requestAnimationFrame(() => {
      root.style.height = `${root.scrollHeight}px`;
      clearTimeout(root._heightTimer);
      root._heightTimer = setTimeout(() => {
        root.style.height = 'auto';
      }, 540);
    });
  }
  const restoreViewportPosition = () => {
    if (!panel) return;
    panel.style.scrollBehavior = 'auto';
    if (anchorTop != null && options.anchorSpotId) {
      const anchorAfter = findMorphSpotCardElement(root, options.anchorSpotId);
      if (anchorAfter) {
        panel.scrollTop += anchorAfter.getBoundingClientRect().top - anchorTop;
        return;
      }
    }
    if (options.preserveScroll && previousScrollTop != null) {
      panel.scrollTop = previousScrollTop;
    }
  };
  if ((options.preserveScroll || options.anchorSpotId) && panel) {
    restoreViewportPosition();
    requestAnimationFrame(() => {
      restoreViewportPosition();
      panel.style.scrollBehavior = previousScrollBehavior;
    });
  }
  scheduleMorphSpotImageHydration(cardId);
  saveConversationSnapshot();
}

const MORPH_SPOT_PHOTO_CACHE = {};
const MORPH_FAILED_PHOTOS = new Set();

function morphSpotPhotoCacheKey(spot, city) {
  return `${city || ''}:${normalizeSpotKey(spot?.name || spot?.poi_name || '')}:${spot?.category || ''}`;
}

async function resolveMorphSpotPhoto(spot, city) {
  if (!spot) return '';
  const category = normalizeSpotCategory(spot.category, spot);
  const key = morphSpotPhotoCacheKey(spot, city);
  if (MORPH_SPOT_PHOTO_CACHE[key] && !MORPH_FAILED_PHOTOS.has(MORPH_SPOT_PHOTO_CACHE[key])) {
    return MORPH_SPOT_PHOTO_CACHE[key];
  }

  const explicit = spot.img || spot.img_url || spot.image_url || spot.photo_url || curatedPlaceImage(spot, city);
  if (isUsablePlacePhoto(explicit) && !MORPH_FAILED_PHOTOS.has(explicit)) {
    MORPH_SPOT_PHOTO_CACHE[key] = explicit;
    return explicit;
  }

  const exact = curatedPlacePhotoOverride(spot, city);
  if (isUsablePlacePhoto(exact) && !MORPH_FAILED_PHOTOS.has(exact)) {
    MORPH_SPOT_PHOTO_CACHE[key] = exact;
    return exact;
  }

  const photos = await searchPlacePhotos(spot, city, 8, { includeCityFallback: false });
  const real = (photos || []).find(url => isUsablePlacePhoto(url) && !MORPH_FAILED_PHOTOS.has(url));
  if (real) {
    MORPH_SPOT_PHOTO_CACHE[key] = real;
    return real;
  }

  const categoryPhoto = curatedCategoryPhoto(city, category, spot.name || key);
  if (isUsablePlacePhoto(categoryPhoto) && !MORPH_FAILED_PHOTOS.has(categoryPhoto)) {
    MORPH_SPOT_PHOTO_CACHE[key] = categoryPhoto;
    return categoryPhoto;
  }

  return '';
}

function scheduleMorphSpotImageHydration(cardId) {
  const state = window.__MORPH_ROUTE_CARDS[cardId];
  if (!state || state.cardStage !== 'loading_pick') return;
  clearTimeout(state.imageHydrationTimer);
  state.imageHydrationTimer = setTimeout(() => hydrateMorphSpotImages(cardId), 40);
}

async function hydrateMorphSpotImages(cardId) {
  const state = window.__MORPH_ROUTE_CARDS[cardId];
  const root = document.getElementById(`morph-route-card-${cardId}`);
  if (!state || !root || state.cardStage !== 'loading_pick') return;
  const visibleCards = [...root.querySelectorAll('.morph-spot-card[data-morph-spot-id]')];
  await Promise.allSettled(visibleCards.map(async card => {
    const spot = (state.spots || []).find(item => item.id === card.dataset.morphSpotId);
    if (!spot) return;
    const url = await resolveMorphSpotPhoto(spot, state.city);
    if (!isUsablePlacePhoto(url)) return;
    spot.img = url;
    const img = card.querySelector('.morph-spot-img');
    if (img && img.getAttribute('src') !== url) {
      img.classList.remove('img-fail');
      img.dataset.fallbackApplied = '';
      img.src = url;
    }
  }));
  if (state.expandedSpotId) {
    const spot = (state.spots || []).find(item => item.id === state.expandedSpotId);
    const url = await resolveMorphSpotPhoto(spot, state.city);
    const detailImg = document.querySelector('#morph-spot-detail-root .morph-detail-hero img');
    if (spot && detailImg && isUsablePlacePhoto(url) && detailImg.getAttribute('src') !== url) {
      spot.img = url;
      detailImg.classList.remove('img-fail');
      detailImg.dataset.fallbackApplied = '';
      detailImg.src = url;
    }
  }
}

async function handleMorphSpotImageError(img, cardId, spotId) {
  const state = window.__MORPH_ROUTE_CARDS?.[cardId];
  const spot = (state?.spots || []).find(item => item.id === spotId);
  const failedSrc = img?.currentSrc || img?.src || '';
  if (failedSrc) {
    MORPH_FAILED_PHOTOS.add(failedSrc);
    delete MORPH_SPOT_PHOTO_CACHE[morphSpotPhotoCacheKey(spot, state?.city)];
  }
  if (!img || !state || !spot || img.dataset.fallbackApplied === 'true') {
    if (img) img.classList.add('img-fail');
    return;
  }
  img.dataset.fallbackApplied = 'true';
  const fallback = await resolveMorphSpotPhoto({ ...spot, img: '' }, state.city);
  if (isUsablePlacePhoto(fallback)) {
    spot.img = fallback;
    img.classList.remove('img-fail');
    img.src = fallback;
  } else {
    img.classList.add('img-fail');
  }
}

function realtimePoiToSelectableSpot(poi, city, index = 0) {

  if (!spotMatchesCategory(poi, category)) return null;
  if (!spotLooksLikeTravelChoice(poi, city, category)) return null;
  const node = {
    ...(poi?.source_node || {}),
    ...poi,
    name: poi?.poi_name || poi?.card_title || poi?.name,
    desc: poi?.highlight || poi?.desc || poi?.card_rank || poi?.rank,
    img_url: poi?.img_url || poi?.image_url,
    category,
    popularity: inferSpotPopularity(poi, index) + 5,
  };
  return selectableSpotFromNode(node, city, index, 'realtime');
}

const REALTIME_SPOT_QUERIES = {
  night: { keyword: '夜景 夜游 灯光 地标', limit: 6, wiki: ['夜景 地标 夜游', '灯光 公园 海滨'] },
  art: { keyword: '拍照 出片 艺术 博物馆 美术馆', limit: 6, wiki: ['艺术 博物馆 建筑 街区', '创意 设计 展览'] },
  food: { keyword: '美食 小吃 餐厅 夜市', limit: 6, wiki: ['美食 小吃 街', '夜市 餐厅 早茶'] },
  classic: { keyword: '经典景点 地标 公园 博物馆', limit: 6, wiki: ['著名 景点 旅游', '地标 公园 博物馆'] },
};

function wikiSpotLooksUseful(title = '', extract = '', city = '') {
  const text = `${title}${extract}`;
  if (!title || title === city || title === `${city}市`) return false;
  if (/疫情|地图|列表|名录|第[一二三四五六七八九十\d]+批|文物保护单位|保护单位|行政区|市辖区|县|區|大学|校区|公司|电视剧|电影|歌曲|人物|选举|铁路车站|机场/.test(text)) return false;
  if (city && !text.includes(city) && !title.includes(city)) return false;
  return /景|园|街|城|塔|馆|寺|庙|山|湖|湾|海|岛|港|场|中心|世界|古|文化|艺术|美食|夜/.test(text);
}

function wikiImageUrl(page) {
  const source = page?.thumbnail?.source || '';
  return source && !isBadCoverUrl(source) ? source : '';
}

async function fetchWikipediaCategoryPOIs(city, category, limit = 4) {
  const config = REALTIME_SPOT_QUERIES[category] || REALTIME_SPOT_QUERIES.classic;
  const queries = config.wiki.map(term => `${city} ${term}`);
  const allPages = [];
  for (const query of queries) {
    const url = 'https://zh.wikipedia.org/w/api.php?' + new URLSearchParams({
      action: 'query',
      generator: 'search',
      gsrsearch: query,
      gsrlimit: String(limit + 4),
      prop: 'pageimages|extracts',
      pithumbsize: '360',
      exintro: '1',
      explaintext: '1',
      exchars: '120',
      format: 'json',
      origin: '*',
    }).toString();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6500);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) continue;
      const data = await res.json();
      const pages = data.query?.pages ? Object.values(data.query.pages) : [];
      allPages.push(...pages);
    } catch (e) {
      continue;
    } finally {
      clearTimeout(timer);
    }
  }
  const seen = new Set();
  return allPages
    .filter(page => wikiSpotLooksUseful(page.title, page.extract, city))
    .filter(page => {
      const key = normalizeSpotKey(page.title);
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .slice(0, limit)
    .map((page, index) => ({
      poi_id: `wiki_${city}_${category}_${page.pageid || index}`,
      poi_name: page.title.replace(/\s*\(.+?\)\s*$/, ''),
      card_title: page.title,
      highlight: page.extract || `${city}公开百科实时结果`,
      rank: `${city}百科实时匹配 · ${morphSpotCategoryLabel(category)}`,
      heat: '公开数据',
      img_url: wikiImageUrl(page) || placeholderImage(page.title, `${city}公开百科图片待同步`),
      source_url: page.fullurl || `https://zh.wikipedia.org/?curid=${page.pageid}`,
      source_node: {
        name: page.title.replace(/\s*\(.+?\)\s*$/, ''),
        desc: page.extract || `${city}公开百科实时结果`,
        city,
        tag: morphSpotCategoryLabel(category),
        category,
        coords: CITY_DB[city]?.center || null,
        image_url: wikiImageUrl(page),
      },
      _realtimeCategory: category,
      realtime_provider: 'Wikipedia',
    }))
    .filter(poi => spotMatchesCategory(poi, category))
    .filter(poi => spotLooksLikeTravelChoice(poi, city, category));
}

async function fetchRealtimeCategoryPOIs(city, category, limit = 6) {
  const config = REALTIME_SPOT_QUERIES[category] || REALTIME_SPOT_QUERIES.classic;
  const amap = (await fetchAMapPOIs(city, config.keyword, category, limit + 6))
    .filter(poi => spotMatchesCategory(poi, category))
    .filter(poi => spotLooksLikeTravelChoice(poi, city, category))
    .slice(0, limit);
  const needAfterAmap = Math.max(0, limit - amap.length);
  const tripadvisor = needAfterAmap
    ? (await fetchTripAdvisorPOIs(city, config.keyword, needAfterAmap + 4))
      .filter(poi => spotMatchesCategory(poi, category))
      .filter(poi => spotLooksLikeTravelChoice(poi, city, category))
      .slice(0, needAfterAmap)
    : [];
  const merged = dedupeByName([...amap, ...tripadvisor].map(poi => ({
    ...poi,
    name: poi.poi_name || poi.card_title || poi.name,
  })));
  if (merged.length >= Math.min(3, limit)) return merged.slice(0, limit);
  const wiki = await fetchWikipediaCategoryPOIs(city, category, limit - merged.length);
  return [...merged, ...wiki].slice(0, limit);
}

async function fetchRealtimeSpotPool(city) {
  const results = await Promise.allSettled(filterableCategories.map(async ({ id: category }) => {
    const limit = REALTIME_SPOT_QUERIES[category]?.limit || 6;
    const list = await fetchRealtimeCategoryPOIs(city, category, limit);
    return (list || []).map((poi, index) => ({
      ...poi,
      category: spotMatchesCategory(poi, category) ? category : normalizeSpotCategory(poi.category, poi),
      source_node: { ...(poi.source_node || {}) },
      _realtimeCategory: category,
      _sourceKeyword: REALTIME_SPOT_QUERIES[category]?.keyword || '景点',
      _sourceIndex: index,
    }));
  }));
  return results.flatMap(result => result.status === 'fulfilled' ? result.value : []);
}

async function refreshMorphSpotCatalog(cardId) {
  const state = window.__MORPH_ROUTE_CARDS[cardId];
  if (!state || state.isSpotRefreshing) return;
  state.isSpotRefreshing = true;
  state.sourceLabel = '实时热度接入中';
  if (state.cardStage === 'loading_pick') renderMorphRouteCard(cardId);
  try {
    const realtimePois = await Promise.race([
      fetchRealtimeSpotPool(state.city),
      morphRouteDelay(4500).then(() => []),
    ]);
    const realtimeSpots = (realtimePois || [])
      .map((poi, index) => realtimePoiToSelectableSpot(poi, state.city, index))
      .filter(Boolean);
    if (realtimeSpots.length) {
      state.spots = ensureSpotCategoryCoverage(
        rankSelectableSpots(mergeSelectableSpots(realtimeSpots, state.spots, getSelectableSpots(state.city))).slice(0, 28),
        state.city
      );
      state.sourceLabel = realtimePois.some(poi => poi.realtime_provider === 'Wikipedia')
        ? '实时公开数据 + 热门景点池'
        : '实时热度 + 热门景点池';
    } else {
      state.spots = ensureSpotCategoryCoverage(state.spots, state.city).slice(0, 28);
      state.sourceLabel = '热门景点池';
    }
  } catch (error) {
    state.spots = ensureSpotCategoryCoverage(state.spots, state.city).slice(0, 28);
    state.sourceLabel = '热门景点池';
  } finally {
    state.isSpotRefreshing = false;
    if (spotSelectorState.city === state.city) {
      spotSelectorState.spots = state.spots;
    }
    if (state.cardStage === 'loading_pick') renderMorphRouteCard(cardId);
  }
}

function syncMorphRoutePlan(state, routeData, opts = {}) {
  const plan = window.__PLANS[state.planId];
  if (!plan) return;
  const route = normalizeAIItineraryData(routeData);
  const startDate = route.start_date || route.startDate || state.startDate || state.intent?.travelDate || plan.startDate || dateOnlyISO();
  const routeDays = Math.max(1, Number(route.days || route.day_count || state.days || plan.days || route.itinerary?.length || 1));
  route.start_date = startDate;
  route.startDate = startDate;
  route.days = routeDays;
  route.day_count = routeDays;
  plan.startDate = startDate;
  plan.travelDate = startDate;
  plan.days = routeDays;
  const flat = flattenInstantItinerary(route);
  plan.routeData = route;
  plan.nodes = flat.map((spot, index) => ({
    id: index + 1,
    name: spot.name,
    desc: spot.sub_name || spot.reason || 'AI 定制推荐',
    tag: spot.time || timeLabelForIndex(index),
  }));
  window.__INSTANT_ROUTE_STATE[state.planId] = {
    planId: state.planId,
    data: cloneRouteData(route),
    baseItinerary: cloneRouteData(route.itinerary || []),
    tip: itineraryReasonText(route),
    changedSpotId: opts.changedSpotId || null,
    lastFilter: opts.lastFilter || null,
    flashId: opts.lastFilter ? 1 : 0,
  };
  plan.instantNodes = instantNodesForPlan(plan, window.__INSTANT_ROUTE_STATE[state.planId]);
  window.__HOME_ACTIVE_PLAN_ID = state.planId;
  homeSelectedCity = normalizeHomeCityName(state.city || plan.city || homeSelectedCity);
  setHomeCityName(homeSelectedCity);
  currentPlan = {
    type:'city',
    city: state.city || plan.city,
    cities:[state.city || plan.city].filter(Boolean),
    people: currentPlan.people || 2,
    budget: currentPlan.budget,
    days: routeDays,
    startDate,
  };
  renderHomeTripState();
  renderHomeRecommendations();
  if (typeof renderTimeline === 'function') renderTimeline();
}

function routeNeedsSmartEnhancement(routeData, state) {
  const route = normalizeAIItineraryData(routeData);
  const flat = flattenInstantItinerary(route);
  const poolCount = (state.spots || []).length || getSelectableSpots(state.city).length;
  const minimum = Math.min(poolCount, Math.max(state.days * 4, (state.selectedSpots || []).length + 2));
  const broadTimeOnly = flat.length > 0 && flat.every(spot => /^(上午|下午|晚上)$/.test(String(spot.time || '')));
  return flat.length < minimum || (broadTimeOnly && flat.length <= state.days * 3);
}

function ensureMorphRouteRichness(routeData, state, variant = 'base') {
  if ((state.selectedSpots || []).length) {
    return buildSmartRouteData(state.city, state.days, state.selectedSpots, {
      ...(state.intent || {}),
      routeVariant: variant,
    }, { variant });
  }
  if (routeNeedsSmartEnhancement(routeData, state) || routeHasUnbalancedDays(routeData, state.days)) {
    return buildSmartRouteData(state.city, state.days, state.selectedSpots, {
      ...(state.intent || {}),
      routeVariant: variant,
    }, { variant });
  }
  const normalized = normalizeAIItineraryData(routeData);
  if (!normalized.reason) {
    const count = flattenInstantItinerary(normalized).length;
    normalized.reason = `已根据接口返回结果整理为 ${count} 个真实地点，并保留用户选择优先级。`;
  }
  return normalized;
}

async function requestMorphRouteData(cardId) {
  const state = window.__MORPH_ROUTE_CARDS[cardId];
  if (!state) return;
  const token = Date.now();
  state.requestToken = token;
  spotSelectorState.spots = state.spots;
  spotSelectorState.city = state.city;
  spotSelectorState.days = state.days;
  spotSelectorState.intent = state.intent;
  lastPlannedCity = state.city;
  let data;
  try {
    const [resolved] = await Promise.all([
      fetchSpotCustomizedItinerary({
        city: state.city,
        days: state.days,
        selectedSpotIds: state.selectedSpots,
        intent: state.intent,
      }),
      morphRouteDelay(720),
    ]);
    data = ensureMorphRouteRichness(resolved, state, 'base');
  } catch (error) {
    console.warn('[AI Wanderer] morph itinerary fallback:', error.message);
    await morphRouteDelay(520);
    data = buildFallbackRouteData(state.city, state.days, state.selectedSpots, state.intent);
  }
  if (state.requestToken !== token) return;
  const route = setRouteData(data);
  state.routeData = route;
  state.baseRouteData = cloneRouteData(route);
  if (Array.isArray(route.raw_spots_pool) && route.raw_spots_pool.length) {
    const rawPoolSpots = route.raw_spots_pool
      .map((spot, index) => selectableSpotFromRawPoolSpot(spot, state.city, index))
      .filter(Boolean);
    if (rawPoolSpots.length) {
      state.spots = ensureSpotCategoryCoverage(rawPoolSpots, state.city).slice(0, 28);
      spotSelectorState.spots = state.spots;
    }
  }
  state.cardStage = 'display_route';
  state.title = route.title || state.title;
  state.matchRate = route.match_rate || state.matchRate;
  state.tip = itineraryReasonText(route);
  state.lastFilter = null;
  state.changedSpotId = null;
  syncMorphRoutePlan(state, route);
  if (typeof currentPlan !== 'undefined') {
    currentPlan = { type:'city', city:state.city, cities:[state.city], people:state.intent?.people || 2, budget: currentPlan.budget, startDate: state.startDate || route.start_date || dateOnlyISO() };
  }
  setStep('itinerary');
  setCardStage('display_route');
  renderMorphRouteCard(cardId);
  scrollToElementTop(document.querySelector(`[data-morph-card-id="${cardId}"]`) || document.getElementById(`morph-route-card-${cardId}`), 28);
}

function applyMorphRouteFilter(cardId, type) {

  if (!state || state.cardStage !== 'display_route') return;
  spotSelectorState.spots = state.spots;

  state.lastFilter = type;
  state.changedSpotId = flat[0]?.id || null;

  syncMorphRoutePlan(state, route, { lastFilter: type, changedSpotId: state.changedSpotId });

}

function itineraryReasonText(data) {
  if (data?.reason) return data.reason;
  const pools = data?.backup_pool || {};
  const firstReason = [
    ...(pools.niche_alternatives || []),
    ...(pools.relax_alternatives || []),
    ...(pools.photo_alternatives || []),
  ].find(item => item && item.reason)?.reason;
  return firstReason || 'AI 已按你选择的景点、顺路程度和游玩节奏生成本次定制路线。';
}

function renderItineraryRouteData(data) {
  const route = normalizeAIItineraryData(data);
  const tags = (route.tags || []).map(tag => `<span class="itinerary-result-tag">${escapeHTML(tag)}</span>`).join('');
  const days = (route.itinerary || []).map(day => {

          <div class="itinerary-result-sub">${escapeHTML(spot.sub_name || spot.reason || 'AI 定制推荐')}</div>

        <div class="itinerary-result-day-title">${escapeHTML(day.day_title || `Day ${day.day || 1}`)}</div>
        ${spots}

  return `
    <div class="itinerary-result">

      ${days || '<section class="itinerary-result-day"><div class="itinerary-result-day-title">暂无可用行程</div></section>'}

    </div>`;
}

const BILL_STORAGE_KEY = 'ai-wanderer-bill-entries-v1';
const BILL_MEMBERS_STORAGE_KEY = 'ai-wanderer-bill-members-v1';
let billEntries = [];
let billMembers = [];

function billLocalDateISO() {
  const date = new Date();
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function billShortDate(dateText) {
  const parts = String(dateText || '').split('-');
  return parts.length === 3 ? `${parts[1]}.${parts[2]}` : '今天';
}

function billMoney(amount) {
  return `¥${Number(amount || 0).toLocaleString('zh-CN', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  })}`;
}

function loadBillEntries() {
  try {
    const saved = JSON.parse(localStorage.getItem(BILL_STORAGE_KEY) || '[]');
    billEntries = Array.isArray(saved)
      ? saved.map((item, index) => ({
        ...item,
        id: item.id || `bill_legacy_${index}_${stableHash(`${item.name || ''}_${item.amount || ''}_${item.date || ''}`)}`,
      }))
      : [];
  } catch (error) {
    billEntries = [];
  }
  return billEntries;
}

function saveBillEntries() {
  try {
    localStorage.setItem(BILL_STORAGE_KEY, JSON.stringify(billEntries));
  } catch (error) {
    console.warn('保存账单失败', error);
  }
}

function normalizeBillMembers(list) {
  const names = Array.isArray(list)
    ? list.map(name => String(name || '').trim()).filter(Boolean)
    : [];
  const unique = [];
  ['我', ...names].forEach(name => {
    if (!unique.includes(name)) unique.push(name);
  });
  return unique;
}

function loadBillMembers() {
  try {
    billMembers = normalizeBillMembers(JSON.parse(localStorage.getItem(BILL_MEMBERS_STORAGE_KEY) || '[]'));
  } catch (error) {
    billMembers = ['我'];
  }
  return billMembers;
}

function saveBillMembers() {
  try {
    localStorage.setItem(BILL_MEMBERS_STORAGE_KEY, JSON.stringify(normalizeBillMembers(billMembers)));
  } catch (error) {
    console.warn('保存同行成员失败', error);
  }
}

function billParticipantsForCount(count) {
  const total = Math.max(1, Number(count || 1));
  const participants = [...loadBillMembers()];
  while (participants.length < total) {
    participants.push(`成员${participants.length + 1}`);
  }
  return participants.slice(0, total);
}

function billEntryParticipants(item) {
  const saved = Array.isArray(item?.participants)
    ? item.participants.map(name => String(name || '').trim()).filter(Boolean)
    : [];
  if (saved.length) return [...new Set(saved)];
  return billParticipantsForCount(item?.people || 1);
}

function billMemberInitial(name) {
  return String(name || '旅').trim().slice(0, 1) || '旅';
}

function renderBillEntryOptions(options = {}) {
  const members = loadBillMembers();
  const payerSelect = document.getElementById('bill-item-payer');
  const peopleSelect = document.getElementById('bill-item-people');
  const total = Math.max(1, members.length);
  if (payerSelect) {
    const current = payerSelect.value || members[0];
    payerSelect.innerHTML = members
      .map(name => `<option value="${escapeHTML(name)}">${escapeHTML(name)}</option>`)
      .join('');
    payerSelect.value = members.includes(current) ? current : members[0];
  }
  if (peopleSelect) {
    const currentPeople = options.preferAll ? total : Math.max(1, Number(peopleSelect.value || total));
    const selectedPeople = Math.min(total, currentPeople);
    peopleSelect.innerHTML = Array.from({ length: total }, (_, index) => {
      const count = index + 1;
      const selected = count === selectedPeople ? ' selected' : '';
      return `<option value="${count}"${selected}>${count}人</option>`;
    }).join('');
  }
}

function calculateBillSplit(entries = billEntries) {
  loadBillMembers();
  const participantSet = new Set(billMembers);
  const rowsByName = {};
  const ensure = name => {
    const safeName = String(name || '').trim() || '我';
    participantSet.add(safeName);
    if (!rowsByName[safeName]) {
      rowsByName[safeName] = { name: safeName, paid: 0, owed: 0, net: 0 };
    }
    return rowsByName[safeName];
  };
  participantSet.forEach(ensure);

  const total = entries.reduce((sum, item) => {
    const amount = Number(item.amount || 0);
    if (!Number.isFinite(amount) || amount <= 0) return sum;
    const payer = ensure(item.payer || '我');
    const participants = billEntryParticipants(item);
    const share = amount / Math.max(1, participants.length);
    payer.paid += amount;
    participants.forEach(name => {
      ensure(name).owed += share;
    });
    return sum + amount;
  }, 0);

  const participants = Object.values(rowsByName).map(row => ({
    ...row,
    paid: Math.round(row.paid * 100) / 100,
    owed: Math.round(row.owed * 100) / 100,
    net: Math.round((row.paid - row.owed) * 100) / 100,
  }));

  const creditors = participants
    .filter(row => row.net > 0.009)
    .map(row => ({ ...row, balance: row.net }))
    .sort((a, b) => b.balance - a.balance);
  const debtors = participants
    .filter(row => row.net < -0.009)
    .map(row => ({ ...row, balance: -row.net }))
    .sort((a, b) => b.balance - a.balance);
  const settlements = [];
  let debtorIndex = 0;
  let creditorIndex = 0;
  while (debtors[debtorIndex] && creditors[creditorIndex]) {
    const debtor = debtors[debtorIndex];
    const creditor = creditors[creditorIndex];
    const amount = Math.min(debtor.balance, creditor.balance);
    if (amount > 0.009) {
      settlements.push({
        from: debtor.name,
        to: creditor.name,
        amount: Math.round(amount * 100) / 100,
      });
    }
    debtor.balance = Math.round((debtor.balance - amount) * 100) / 100;
    creditor.balance = Math.round((creditor.balance - amount) * 100) / 100;
    if (debtor.balance <= 0.009) debtorIndex += 1;
    if (creditor.balance <= 0.009) creditorIndex += 1;
  }

  return { total, participants, settlements };
}

}

  const activePeople = billEntries.length ? Math.max(1, splitState.participants.length) : 0;

  const subEl = document.getElementById('bill-summary-sub');
  const emptyEl = document.querySelector('.bill-empty-state');
  const ledgerWrap = document.getElementById('bill-ledger-wrap');
  if (totalEl) totalEl.textContent = billMoney(total);
  if (subEl) {
    subEl.textContent = billEntries.length
      ? `${activePeople}人参与 · 人均${billMoney(total / activePeople)}`
      : '添加支出后自动计算人均';
  }
  if (emptyEl) emptyEl.style.display = billEntries.length ? 'none' : 'grid';

  ledgerWrap.style.display = billEntries.length ? 'block' : 'none';

    window.lucide?.createIcons?.();

    const date = item.date || billLocalDateISO();

    .sort(([a], [b]) => b.localeCompare(a))
    .map(([date, items]) => `

    return;
  }
  const average = state.participants.length ? state.total / state.participants.length : 0;
  const rows = state.participants.map(row => {
    const isNegative = row.net < -0.009;
    const netText = Math.abs(row.net) <= 0.009
      ? '已平衡'

  const settlements = state.settlements.length

  if (!Number.isFinite(amount) || amount <= 0) {

  const value = String(city || '').trim();

const PROFILE_MEMORY_KEY = 'ai-wanderer-profile-memories';

function profileKnownPlans() {
  const plans = [];
  const seen = new Set();
  const addPlan = plan => {
    if (!plan) return;
    const id = plan.id || `${plan.city || ''}_${plan.startDate || plan.travelDate || ''}_${plans.length}`;
    if (seen.has(id)) return;
    seen.add(id);
    plans.push(plan);
  };
  if (window.__PLANS && typeof window.__PLANS === 'object') {
    Object.values(window.__PLANS).forEach(addPlan);
  }
  if (typeof homeActiveRoutePlan === 'function') addPlan(homeActiveRoutePlan());
  return plans.filter(plan => plan?.city || plan?.routeData?.itinerary?.length || plan?.nodes?.length);
}

function profileHasActiveTrip() {
  return typeof homeHasItinerary === 'function' ? homeHasItinerary() : false;
}

function profileCityName() {
  const activeCity = profileHasActiveTrip() && typeof homeTripCity === 'function'
    ? homeTripCity()
    : '';
  return profileNormalizeCity(
    activeCity
      || '未选择'
  );
}

function profileTripCount() {
  return profileHasActiveTrip() ? 1 : 0;
}

function profileCompletedCount() {
  if (!profileHasActiveTrip()) return 0;
  const plan = typeof homeActiveRoutePlan === 'function' ? homeActiveRoutePlan() : null;
  return plan?.status === 'completed' || plan?.completed || plan?.isCompleted ? 1 : 0;
}

function profileCityCount() {
  return profileHasActiveTrip() && profileCityName() !== '未选择' ? 1 : 0;
}

function profileBillSpend() {
  const entries = typeof loadBillEntries === 'function' ? loadBillEntries() : (billEntries || []);
  return entries.reduce((sum, item) => {
    const amount = Number(item?.amount || 0);
    return Number.isFinite(amount) ? sum + amount : sum;
  }, 0);
}

function profileCompactMoney(value) {
  const amount = Number(value || 0);
  if (!Number.isFinite(amount) || amount <= 0) return '0';
  if (amount >= 10000) return `${Number((amount / 10000).toFixed(1))}W`;
  if (amount >= 1000) return `${Number((amount / 1000).toFixed(1))}K`;
  return String(Math.round(amount));
}

function profileSpotImage(spot, city) {
  const image = spot?.img
    || spot?.img_url
    || spot?.image_url
    || spot?.photo_url
    || (typeof curatedPlaceImage === 'function' ? curatedPlaceImage(spot, city) : '');
  if (!image) return '';
  if (typeof isSyntheticImageUrl === 'function' && isSyntheticImageUrl(image)) return '';
  if (typeof isBadCoverUrl === 'function' && isBadCoverUrl(image)) return '';
  if (/^data:image\/svg/i.test(String(image))) return '';
  return image;
}

function profileUploadedMemories() {
  try {
    const raw = localStorage.getItem(PROFILE_MEMORY_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed)
      ? parsed.filter(item => item?.image && /^data:image\//i.test(String(item.image)))
      : [];
  } catch {
    return [];
  }
}

function profileSaveUploadedMemories(items) {
  localStorage.setItem(PROFILE_MEMORY_KEY, JSON.stringify(items.slice(0, 12)));
}

function profileMemoryItems() {
  return profileUploadedMemories().slice(0, 3);
}

function handleProfileMemoryUpload(input) {
  const files = Array.from(input?.files || [])
    .filter(file => /^image\//i.test(file.type || ''))
    .slice(0, 9);
  if (input) input.value = '';
  if (!files.length) return;
  const readers = files.map(file => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve({
      image: reader.result,
      name: file.name || '旅行照片',
      createdAt: Date.now(),
    });
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  }));
  Promise.all(readers).then(results => {
    const next = results.filter(Boolean).concat(profileUploadedMemories()).slice(0, 12);
    try {
      profileSaveUploadedMemories(next);
      renderProfilePanel();
      showToast('照片已添加');
    } catch {
      showToast('照片过大，换一张小一点的试试');
    }
  });
}

function deleteProfileMemory(index) {
  const memories = profileUploadedMemories();
  if (!Number.isInteger(index) || index < 0 || index >= memories.length) return;
  memories.splice(index, 1);
  try {
    profileSaveUploadedMemories(memories);
    renderProfilePanel();
    showToast('照片已删除');
  } catch {
    showToast('删除失败，请再试一次');
  }
}

      </section>
      <section class="profile-memory" aria-label="旅行回忆">
        <div class="profile-memory-head">
          <div class="profile-memory-title">旅行回忆</div>
          <div class="profile-memory-tools">

function switchTab(tab) {
  currentTab = tab;
  document.body.dataset.activeTab = tab;
  syncLockedTripHomeLayout();
  if (tab !== 'planner') document.body.classList.remove('planner-chat-mode');
  if (tab === 'chat' && ['loading_pick', 'generating'].includes(document.body.dataset.cardStage || '')) {
    setCardStage('');
  }
  const chatTab = document.getElementById('tab-chat');
  const routeTab = document.getElementById('tab-route');
  const chatPanel = document.getElementById('chat-panel');
  const timelinePanel = document.getElementById('timeline-panel');
  const plannerPanel = document.getElementById('planner-panel');
  const billPanel = document.getElementById('bill-panel');
  const profilePanel = document.getElementById('profile-panel');
  const homeNav = document.querySelector('.trip-nav-item[aria-label="首页"]');
  const routeNav = document.querySelector('.trip-nav-item[aria-label="行程"]');
  const billNav = document.querySelector('.trip-nav-item[aria-label="账单"]');
  const profileNav = document.querySelector('.trip-nav-item[aria-label="我的"]');
  const fabNav = document.querySelector('.trip-fab[aria-label="我的旅行规划"]');
  chatTab?.classList.toggle('active', tab === 'chat');
  routeTab?.classList.toggle('active', tab === 'route');
  if (chatPanel) {
    chatPanel.style.display = tab === 'chat'
      ? (document.body.classList.contains('trip-overview-mode') ? 'block' : 'flex')
      : 'none';
  }
  if (timelinePanel) timelinePanel.style.display = tab === 'route' ? 'block' : 'none';
  if (plannerPanel) plannerPanel.style.display = tab === 'planner' ? 'block' : 'none';
  if (billPanel) billPanel.style.display = tab === 'bill' ? 'block' : 'none';
  if (profilePanel) profilePanel.style.display = tab === 'profile' ? 'block' : 'none';
  homeNav?.classList.toggle('active', tab === 'chat');
  routeNav?.classList.toggle('active', tab === 'route');
  billNav?.classList.toggle('active', tab === 'bill');
  profileNav?.classList.toggle('active', tab === 'profile');
  fabNav?.classList.toggle('active', tab === 'planner');
  if (tab === 'bill') {
    renderBillPanel();
  }
  if (tab === 'profile') {
    renderProfilePanel();
  }
  // 地图内嵌在行程面板内，显示时需重新计算尺寸
  if (tab === 'route' && typeof map !== 'undefined') {
    renderTimeline();
    setTimeout(() => {
      map.invalidateSize();
      if (NODES.length > 0) {
        map.flyToBounds(NODES.map(n => L.latLng(n.coords)), { padding:[40,40], duration:0.6 });
      } else if (userMarker) {
        map.setView(userMarker.getLatLng(), 13);
      }
    }, 80);
  }
}

function readRecentConversations() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
  catch (e) { return []; }
}

function writeRecentConversations(list) {
  localStorage.setItem(RECENT_KEY, JSON.stringify((list || []).slice(0, 12)));
}

function snapshotCurrentConversation() {
  const panel = getResponsePanel();
  if (!panel) return '';
  const clone = panel.cloneNode(true);
  clone.querySelector('#home-hero')?.remove();
  clone.querySelector('#bubble-thinking')?.remove();
  clone.querySelectorAll('.morph-spot-detail-backdrop').forEach(node => node.remove());
  return clone.innerHTML.trim();
}

function jsonCloneSafe(value, fallback = null) {
  try { return JSON.parse(JSON.stringify(value)); }
  catch (e) { return fallback; }
}

function currentConversationMorphCardIds() {
  const panels = [getResponsePanel(), document.getElementById('chat-panel'), document.getElementById('planner-results')]
    .filter(Boolean);
  const seenPanels = [...new Set(panels)];
  return [...new Set(seenPanels.flatMap(panel => [...panel.querySelectorAll('[data-morph-card-id]')]
    .map(node => node.dataset.morphCardId)
    .filter(Boolean)))];
}

function snapshotConversationRuntimeState() {
  const ids = currentConversationMorphCardIds();
  const activeTab = document.body.dataset.activeTab || currentTab || 'chat';
  const baseRuntime = {
    version: 2,
    activeTab,
    isPlanner: activeTab === 'planner' || document.body.classList.contains('planner-chat-mode'),
    morphRouteSeq,
    lastPlannedCity,
    step,
    selectedSpots: jsonCloneSafe(selectedSpots, []),
    routeData: jsonCloneSafe(routeData, null),
  };
  if (!ids.length) return baseRuntime;
  const morphCards = {};
  const plans = {};
  const instantRouteState = {};
  ids.forEach(id => {
    const state = window.__MORPH_ROUTE_CARDS?.[id];
    if (!state) return;
    const cleanState = jsonCloneSafe({
      ...state,
      expandedSpotId: null,
      isSpotRefreshing: false,
      requestToken: null,
    });
    if (!cleanState) return;
    morphCards[id] = cleanState;
    if (cleanState.planId && window.__PLANS?.[cleanState.planId]) {
      plans[cleanState.planId] = jsonCloneSafe(window.__PLANS[cleanState.planId], {});
    }
    if (cleanState.planId && window.__INSTANT_ROUTE_STATE?.[cleanState.planId]) {
      instantRouteState[cleanState.planId] = jsonCloneSafe(window.__INSTANT_ROUTE_STATE[cleanState.planId], {});
    }
  });
  if (!Object.keys(morphCards).length) return baseRuntime;
  return {
    ...baseRuntime,
    morphCards,
    plans,
    instantRouteState,
  };
}

function restoreConversationRuntimeState(runtimeState) {
  const runtime = runtimeState && typeof runtimeState === 'object' ? runtimeState : null;
  window.__MORPH_ROUTE_CARDS = {};
  if (!runtime) {
    setStep('input');
    setCardStage('');
    setSelectedSpots([]);
    setRouteData(null);
    return false;
  }
  window.__MORPH_ROUTE_CARDS = jsonCloneSafe(runtime.morphCards, {}) || {};
  window.__PLANS = {
    ...(window.__PLANS || {}),
    ...(jsonCloneSafe(runtime.plans, {}) || {}),
  };
  window.__INSTANT_ROUTE_STATE = {
    ...(window.__INSTANT_ROUTE_STATE || {}),
    ...(jsonCloneSafe(runtime.instantRouteState, {}) || {}),
  };
  const restoredIds = Object.keys(window.__MORPH_ROUTE_CARDS);
  const maxRestoredSeq = restoredIds.reduce((max, id) => {
    const match = String(id).match(/^morph_(\d+)$/);
    return match ? Math.max(max, Number(match[1]) || 0) : max;
  }, Number(runtime.morphRouteSeq) || 0);
  morphRouteSeq = Math.max(morphRouteSeq, maxRestoredSeq);
  lastPlannedCity = runtime.lastPlannedCity || lastPlannedCity;
  setSelectedSpots(runtime.selectedSpots || []);
  setRouteData(runtime.routeData || null);
  const latestCard = restoredIds.map(id => window.__MORPH_ROUTE_CARDS[id]).filter(Boolean).pop();
  if (latestCard) {
    spotSelectorState.spots = latestCard.spots || spotSelectorState.spots;
    spotSelectorState.city = latestCard.city || spotSelectorState.city;
    spotSelectorState.days = latestCard.days || spotSelectorState.days;
    spotSelectorState.intent = latestCard.intent || {};
    spotSelectorState.activeCategory = latestCard.activeCategory || 'classic';
    setStep(latestCard.cardStage === 'display_route' ? 'itinerary' : 'select_spots');
    setCardStage(latestCard.cardStage || '');
  } else {
    setStep(runtime.step || 'input');
    setCardStage('');
  }
  return true;
}

function restoreLegacyMorphRuntimeFromPanel(panel) {
  const ids = [...(panel || document).querySelectorAll('[data-morph-card-id]')]
    .map(node => node.dataset.morphCardId)
    .filter(id => id && window.__MORPH_ROUTE_CARDS?.[id]);
  if (!ids.length) return false;
  const latestCard = window.__MORPH_ROUTE_CARDS[ids[ids.length - 1]];
  if (latestCard) {
    spotSelectorState.spots = latestCard.spots || spotSelectorState.spots;
    spotSelectorState.city = latestCard.city || spotSelectorState.city;
    spotSelectorState.days = latestCard.days || spotSelectorState.days;
    spotSelectorState.intent = latestCard.intent || {};
    spotSelectorState.activeCategory = latestCard.activeCategory || 'classic';
    setSelectedSpots(latestCard.selectedSpots || []);
    setRouteData(latestCard.routeData || null);
    setStep(latestCard.cardStage === 'display_route' ? 'itinerary' : 'select_spots');
    setCardStage(latestCard.cardStage || '');
  }
  return true;
}

function saveConversationSnapshot() {
  const list = readRecentConversations();
  const idx = list.findIndex(item => item.id === activeConversationId);
  if (idx === -1) return;
  const snapshot = snapshotCurrentConversation();
  if (!snapshot) return;
  const runtimeState = snapshotConversationRuntimeState();
  list[idx] = { ...list[idx], snapshot, runtimeState, sourceTab: runtimeState?.activeTab || currentTab, time: Date.now() };
  writeRecentConversations(list);
}

function rememberConversation(text) {
  const title = String(text || '').trim();
  if (!title) return;
  const list = readRecentConversations().filter(item => item.id !== activeConversationId && item.title !== title);
  list.unshift({
    id: activeConversationId,
    title,
    time: Date.now(),
    snapshot: snapshotCurrentConversation(),
    runtimeState: snapshotConversationRuntimeState(),
    sourceTab: document.body.dataset.activeTab || currentTab,
  });
  writeRecentConversations(list);
}

function formatRecentTime(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
  return `${Math.floor(diff / 86400000)}天前`;
}

function renderRecentConversations() {
  const list = readRecentConversations();
  const box = document.getElementById('recent-list');
  if (!box) return;
  box.innerHTML = list.length
    ? list.map((item, index) => `
        <button class="recent-item"
          onclick="resumeConversationByIndex(${index})"
          oncontextmenu="showRecentDeleteMenu(event, ${index})"
          ontouchstart="startRecentLongPress(event, ${index})"
          ontouchend="cancelRecentLongPress()"
          ontouchmove="cancelRecentLongPress()">
          <div class="recent-item-title">${escapeHTML(item.title)}</div>
          <div class="recent-item-meta">${formatRecentTime(item.time)}</div>
        </button>`).join('')
    : `<div class="recent-empty">还没有最近对话。发送一个旅行需求后，这里会自动保存。</div>`;
}

function openRecentConversations() {

  document.getElementById('recent-backdrop')?.classList.add('open');
  document.getElementById('recent-drawer')?.classList.add('open');

function closeRecentConversations() {
  document.getElementById('recent-backdrop')?.classList.remove('open');

function isPlannerHistoryItem(item) {
  const snapshot = String(item?.snapshot || '');
  return item?.runtimeState?.activeTab === 'planner'
    || item?.runtimeState?.isPlanner === true
    || item?.sourceTab === 'planner'
    || snapshot.includes('data-morph-card-id')
    || snapshot.includes('morph-route-card')
    || snapshot.includes('instant-route-card')
    || snapshot.includes('morph-choice-panel');
}

function resumeConversationByIndex(index) {
  const item = readRecentConversations()[index];
  if (!item) return;
  closeRecentConversations();
  closePOI();
  closeHotelBooking();
  activeConversationId = item.id || Date.now();
  const targetTab = isPlannerHistoryItem(item) ? 'planner' : 'chat';
  switchTab(targetTab);
  if (targetTab === 'planner') {
    preparePlannerConversation();
    keepPlannerNavActive();
  }
  const panel = targetTab === 'planner'
    ? document.getElementById('planner-results')
    : document.getElementById('chat-panel');
  if (item.snapshot && panel) {
    if (item.runtimeState) restoreConversationRuntimeState(item.runtimeState);
    panel.innerHTML = item.snapshot;
    if (!item.runtimeState) restoreLegacyMorphRuntimeFromPanel(panel);
    panel.scrollTop = targetTab === 'planner' ? 0 : panel.scrollHeight;
    const list = readRecentConversations();
    const current = list.splice(index, 1)[0];
    current.time = Date.now();
    current.sourceTab = targetTab;
    current.runtimeState = current.runtimeState || snapshotConversationRuntimeState();
    if (current.runtimeState) {
      current.runtimeState.activeTab = targetTab;
      current.runtimeState.isPlanner = targetTab === 'planner';
    }
    list.unshift(current);
    writeRecentConversations(list);
    return;
  }
  resumeConversation(item.title);
}

function showRecentDeleteMenu(event, index) {
  event.preventDefault();
  event.stopPropagation();
  recentMenuIndex = index;
  const menu = document.getElementById('recent-menu');
  if (!menu) return;
  const point = event.touches?.[0] || event.changedTouches?.[0] || event;
  const x = Math.min(point.clientX || 24, window.innerWidth - 132);
  const y = Math.min(point.clientY || 80, window.innerHeight - 56);
  menu.style.left = `${Math.max(10, x)}px`;
  menu.style.top = `${Math.max(10, y)}px`;
  menu.classList.add('open');
}

function closeRecentDeleteMenu() {
  document.getElementById('recent-menu')?.classList.remove('open');
  recentMenuIndex = null;
}

function deleteRecentFromMenu() {
  if (recentMenuIndex == null) return;
  const list = readRecentConversations();
  list.splice(recentMenuIndex, 1);
  writeRecentConversations(list);
  closeRecentDeleteMenu();
  renderRecentConversations();
}

function startRecentLongPress(event, index) {
  cancelRecentLongPress();
  recentLongPressTimer = setTimeout(() => showRecentDeleteMenu(event, index), 560);
}

function cancelRecentLongPress() {
  clearTimeout(recentLongPressTimer);
  recentLongPressTimer = null;
}

let thinkingTimer = null;
const THINK_STEPS = ['正在理解你的出行需求…','正在分析目的地特色…','正在筛选热门景点…','正在生成专属路线方案…'];
function addThinkingBubble(steps) {
  const list = (steps && steps.length) ? steps : THINK_STEPS;
  const el = document.createElement('div');
  el.className = 'plan-response';
  el.id = 'bubble-thinking';
  el.innerHTML = `
    <div class="ai-thinking-line">
      <span class="ai-think-spin"></span>
      <span id="ai-think-text">${list[0]}</span>
    </div>`;
  getResponsePanel().appendChild(el);
  let i = 0;
  clearInterval(thinkingTimer);
  thinkingTimer = setInterval(() => {
    i = (i + 1) % list.length;
    const t = document.getElementById('ai-think-text');

// レスポンスの先頭（直前のユーザー吹き出し）を画面上部に合わせる

  const prev = el.previousElementSibling;
  const target = (prev && prev.classList.contains('bubble-user')) ? prev : el;
  const topInset = window.innerWidth <= 640 ? 74 : 56;
  setTimeout(() => panel.scrollTo({ top: Math.max(0, target.offsetTop - topInset), behavior: 'smooth' }), 40);
}

function aiNodeLink(node, label = node.name) {
  return `<span class="ai-place-link" role="button" tabindex="0"
    onclick="focusNode(${node.id}, true)"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();focusNode(${node.id}, true)}">${label}</span>`;
}

function aiHotelLink(hotel) {
  const encoded = encodeURIComponent(hotel.name);
  return `<span class="ai-place-link" role="button" tabindex="0"
    onclick="focusHotelByName(decodeURIComponent('${encoded}'))"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();focusHotelByName(decodeURIComponent('${encoded}'))}">${hotel.name}</span>`;
}

function findNodeByPlaceName(name) {
  return NODES.find(node =>
    node.name === name ||
    node.fullName === name ||
    name.includes(node.name) ||
    node.name.includes(name)
  );
}

function aiMaybePlaceLink(name) {
  const node = findNodeByPlaceName(name);
  if (node) return aiNodeLink(node, name);
  if (hotelMarkerIndex[name]) return aiHotelLink(hotelMarkerIndex[name].poi);
  if (nearbyPoiIndex[name]) {
    const encoded = encodeURIComponent(name);
    return `<span class="ai-place-link" role="button" tabindex="0"
      onclick="focusNearbyByName(decodeURIComponent('${encoded}'))"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();focusNearbyByName(decodeURIComponent('${encoded}'))}">${name}</span>`;
  }
  return name;
}

function parseTripDays(text) {
  const CN_NUM = {'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  const m = text.match(/([一两二三四五六七八九十\d]+)\s*[天日]/);
  if (!m) return 1;
  const raw = m[1];
  return Math.max(1, Math.min(7, CN_NUM[raw] || parseInt(raw) || 1));
}

function dayCountText(days) {
  const CN = ['','一天','两天','三天','四天','五天','六天','七天'];
  return CN[days] || `${days}天`;
}

function estimateCost(text) {
  if (!text) return 0;
  if (text.includes('免费')) return 0;
  const m = text.match(/(?:票价|人均|约|~¥)\s*(\d+)/);
  return m ? parseInt(m[1]) : 40;
}

function formatPlanCost(cost) {
  return cost === 0 ? '免费' : `~¥${cost}`;
}

function itineraryLine(time, action, place, cost) {
  const placeText = place ? aiMaybePlaceLink(place) : '';
  return `<div class="itinerary-line"><span class="time">${time}</span> - ${action}${placeText ? ` ${placeText}` : ''} (${formatPlanCost(cost)})</div>`;
}

function buildGenericCityDayPlan(city, cityData, days) {
  const nearby = cityData.nearby || [];
  const candidates = [
    ...(cityData.nodes || []).map(n => ({name:n.name, desc:n.desc})),
    ...nearby.map(n => ({name:n.name, desc:n.desc})),
  ];
  const dayPlans = [];
  let cursor = 0;
  for (let day = 0; day < days; day++) {
    const meal = getMealPlan(city, day);
    const first = candidates[cursor % candidates.length] || {name:`${city}城市漫步`, desc:'免费'};
    const second = candidates[(cursor + 1) % candidates.length] || first;
    const third = candidates[(cursor + 2) % candidates.length] || second;
    cursor += 3;
    dayPlans.push({
      title: `Day ${day + 1}: ${city}${day === 0 ? '文化探索' : day === 1 ? '自然与美食' : '深度漫游'}`,
      lines: [
        ['09:00', '早餐在', meal.breakfast[0], meal.breakfast[1]],
        ['10:30', first.desc?.includes('人均') ? '品尝' : '游览', first.name, estimateCost(first.desc)],
        ['12:30', '午餐在', meal.lunch[0], meal.lunch[1]],
        ['14:30', second.desc?.includes('人均') ? '品尝' : '游览', second.name, estimateCost(second.desc)],
        ['16:30', third.desc?.includes('人均') ? '品尝' : '参观', third.name, estimateCost(third.desc)],
        ['18:30', '晚餐在', meal.dinner[0], meal.dinner[1]],
      ],
    });
  }
  return dayPlans;
}

function renderItineraryDays(dayPlans) {
  return dayPlans.map(day => `
    <div class="itinerary-day">
      <div class="itinerary-day-title">${day.title}</div>
      ${day.lines.map(line => itineraryLine(...line)).join('')}
    </div>
  `).join('');
}

function sumDayPlans(dayPlans) {
  return dayPlans.reduce((sum, day) => sum + day.lines.reduce((daySum, line) => daySum + (line[3] || 0), 0), 0);
}

// 富文本路线规划气泡内容生成
function buildRouteBubbleHTML(originCity, destCity, cities, people, budget, nodes, days = 1) {
  const totalDist = calcTotalDist(cities);
  const fuelCost  = Math.round(totalDist * 0.07 * 8);
  const tollCost  = Math.round(totalDist * 0.05);
  const poiCost   = nodes.filter(n=>n.type!=='drive'&&n.type!=='summary')
    .reduce((s,n)=>{ const m=(n.desc||'').match(/票价(\d+)/); return s+(m?parseInt(m[1]):0); }, 0);
  const totalPer  = Math.round(fuelCost/people + tollCost/people + poiCost);
  const budgetOk  = !budget || totalPer <= budget;
  const tagClass  = budgetOk ? 'ai-tag-ok' : 'ai-tag-warn';
  const tagText   = budgetOk
    ? `✅ 人均约 ${totalPer}元，预算内`
    : `⚠️ 人均约 ${totalPer}元，超出 ${totalPer-(budget||0)}元`;

  const stops = nodes.filter(n=>n.type!=='drive'&&n.type!=='summary');
  const effectiveDays = Math.max(days || 1, Math.min(3, Math.ceil(stops.length / 2) || 1));
  const routeDayPlans = [];
  for (let day = 0; day < effectiveDays; day++) {
    const city = cities.filter(c => CITY_DB[c])[Math.min(day, cities.filter(c => CITY_DB[c]).length - 1)] || destCity;
    const meal = getMealPlan(city, day);
    const dayStops = stops.slice(day * 2, day * 2 + 2);
    const lines = [
      ['09:00', '早餐在', meal.breakfast[0], meal.breakfast[1]],
      ...dayStops.map((n, index) => [index === 0 ? '10:30' : '14:30', n.desc?.includes('人均') ? '品尝' : '游览', n.name, estimateCost(n.desc)]),
      ['18:30', '晚餐在', meal.dinner[0], meal.dinner[1]],
    ];
    routeDayPlans.push({
      title: `Day ${day + 1}: ${city}${day === 0 ? '出发探索' : '深度游玩'}`,
      lines,
    });
  }
  const hotelLines = getRecommendedHotels(cities, 1).map(h =>
    `<div class="itinerary-line">🏨 ${aiHotelLink(h)}（${h.cityName} · ${h.desc}）</div>`
  ).join('');
  const planCost = sumDayPlans(routeDayPlans);
  const grandTotal = Math.round(planCost + fuelCost/people + tollCost/people);

  return `
    <div class="itinerary-intro">感谢您的信息！以下是从 ${originCity} 到 ${destCity} 的${dayCountText(effectiveDays)}自驾行程安排：</div>
    ${renderItineraryDays(routeDayPlans)}

    </div>
    <div class="itinerary-total">总计: ¥${grandTotal} / 人</div>
    <div class="itinerary-note">
      全程约 ${totalDist} km，预计行驶 ${Math.round(totalDist/80)} 小时。价格为估算，实际费用可能会有所不同。您是否需要更多的细节或其他建议？

  `;
}

// ══════════════════════════════════════════
// 路线解析：从文本中提取起点、终点、人数、预算
// ══════════════════════════════════════════
function parseRouteInput(text) {
  let origin = null, dest = null, people = 2, budget = null;

  const cleanPlaceText = s => (s || '')
    .replace(/^(我在|人在|目前在|现在在|从|自|由)/, '')
    .replace(/(出发|启程|出行|发车).*$/, '')
    .replace(/[，,。；;\s].*$/, '')
    .trim();

  // 起点 / 终点：「从X到Y」「X出发到Y」「我在X想去Y」「X→Y」
  const patterns = [
    /我(?:在|从)?(.{2,8})[，,\s]*(?:想|要|准备|计划)?(?:去|到|前往)(.{2,8})/,
    /(?:从|自|由)(.{2,8})(?:出发|启程|出行)?[，,\s]*(?:去|到|前往)(.{2,8})/,
    /(.{2,8})(?:出发|启程|出行)[，,\s]*(?:去|到|前往)(.{2,8})/,
    /(?:出发地|起点)[:：]?(.{2,8}).*?(?:目的地|终点)[:：]?(.{2,8})/,
    /从(.{2,5})[到去](.{2,5})/,
    /(.{2,5})出发[，,到去]?(.{2,5})/,
    /(.{2,5})[→-](.{2,5})/,
    /起点[:：]?(.{2,5})[，,\s]终点[:：]?(.{2,5})/,
  ];
  for (const p of patterns) {
    const m = text.match(p);
    if (m) { origin = cleanPlaceText(m[1]); dest = cleanPlaceText(m[2]); break; }
  }

  // 人数：「2人」「两人」「3个人」「共4人」
  const CN_NUM = {'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  const pm = text.match(/([一两二三四五六七八九十\d]+)[人个名]/);
  if (pm) {
    const raw = pm[1];
    people = CN_NUM[raw] ?? parseInt(raw) ?? 2;
  }

  // 预算：「预算2000」「总预算3000元」「人均500」「500元/人」
  const bm = text.match(/人均\s*(\d+)|(\d+)\s*元[\/每]人|预算\s*(\d+)|总(?:预算|费用)\s*(\d+)/);
  if (bm) {
    const raw = parseInt(bm[1]||bm[2]||bm[3]||bm[4]);
    // 判断是人均还是总预算
    budget = (bm[1]||bm[2]) ? raw : Math.round(raw / people);  // 统一转为人均
  }

  return { origin, dest, people, budget };
}

// 从模糊文本找到数据库中的城市名
function findCity(text) {
  if (!text) return null;
  // 优先精确匹配
  if (CITY_DB[text]) return text;
  // 再用关键词匹配
  return detectCity(text);
}

};

function getRoutePath(originCity, destCity) {
  const key1 = `${originCity}-${destCity}`;
  const key2 = `${destCity}-${originCity}`;
  if (ROUTE_PATHS[key1]) return ROUTE_PATHS[key1];
  if (ROUTE_PATHS[key2]) return [...ROUTE_PATHS[key2]].reverse();
  return [originCity, destCity];  // 直达
}

function buildRouteTrip(cities, people, budget, originCity, destCity) {
  // 从每个途经城市挑 1-2 个节点组成行程
  NODES.length = 0;
  Object.values(markers).forEach(m => m.marker.remove());
  Object.keys(markers).forEach(k => delete markers[k]);
  clearNearbyMarkers();
  currentId = null;

  let hour = 8, nodeId = 1;
  const allNearby = [];

  cities.forEach((cityName, ci) => {
    const cityData = CITY_DB[cityName];
    if (!cityData) return;

    // 驾车节点（非起点）
    if (ci > 0) {
      const prevCity = cities[ci - 1];
      const prevData = CITY_DB[prevCity];
      const rawDist = prevData
        ? haversine(prevData.center, cityData.center)
        : 100;
      const dist = Math.round(rawDist * 1.35); // 实际路程系数
      const durationMin = Math.round(dist / 0.9);  // 约90km/h均速
      const driveHours = durationMin / 60;
      const timeStr = formatTime(hour) + ' → ' + formatTime(hour + driveHours);
      hour += driveHours + 0.3;  // 加休息

      NODES.push({
        id: nodeId++,
        time: timeStr,
        name: `${prevCity} → ${cityName}`,
        desc: `自驾约 ${dist}km · 预计 ${Math.round(durationMin/60)}h${durationMin%60}min`,
        icon: '🚗', color: '#4A90D9', type: 'drive',
        coords: cityData.center,
        tag: '自驾', tagBg: '#EFF6FF', tagColor: '#4A90D9',
        fullName: `${prevCity} → ${cityName} 自驾段`,
        rating: null, reviewCount: null,
        fullDesc: `全程约 ${dist} 公里，建议沿途适当休息，每2小时停车10分钟。`,
        photoCats:[{label:'全部',photos:[
          {url:placeholderImage(`${prevCity} → ${cityName}`, '自驾路段配图待同步', 'route'), caption:'自驾路段配图待同步'},
        ]}],
        infoList:[
          {icon:'🛣️', label:'距离', value:`约 ${dist} km`, sub:''},
          {icon:'⏱️', label:'预计耗时', value:`${Math.round(durationMin/60)}h${durationMin%60}min`, sub:'含服务区休息'},
          {icon:'⛽', label:'油费估算', value:`约 ${Math.round(dist*0.07*8)}元`, sub:`按7L/百km·8元/L`},
        ],
        tags:['自驾路段','高速公路'],
      });
    }

    // 该城市挑 1-2 个景点
    const picks = cityData.nodes.slice(0, ci === 0 || ci === cities.length-1 ? 2 : 1);
    picks.forEach(n => {
      const img = safeImageUrl(curatedPlaceImage(n, cityName) || n.image_url, n.name, `${cityName}实景图待同步`);
      NODES.push({
        ...n,
        id: nodeId++,
        time: formatTime(hour),
        fullName: n.name,
        rating: n.rating || null,
        reviewCount: n.reviewCount || null,
        fullDesc: n.desc + `。位于${cityName}，是此次自驾沿途的精选打卡地。`,
        photoCats:[{label:'全部',photos:[
          {url:img, caption:`${n.name} · 真实图片待同步`},
        ]}],
        infoList:[
          {icon:'📍', label:'所在城市', value:cityName, sub:''},
          {icon:'🎫', label:'门票', value:n.desc.includes('免费')?'免费':n.desc.match(/票价\d+元/)?.[0]||'请现场确认', sub:''},
          {icon:'⏰', label:'建议游览', value:'1.5–2 小时', sub:''},
        ],
        tags:[n.tag,'沿途打卡','待核验'],
      });
      hour += 2.5;
    });

    // 收集周边 POI
    if (cityData.nearby) allNearby.push(...cityData.nearby);
  });

  // 费用摘要节点
  const totalDist = calcTotalDist(cities);
  const fuelCost = Math.round(totalDist * 0.07 * 8);
  const tollCost = Math.round(totalDist * 0.05);
  const poiCost  = NODES.filter(n => n.type !== 'drive').reduce((s, n) => {
    const m = (n.desc||'').match(/票价(\d+)/);
    return s + (m ? parseInt(m[1]) : 0);
  }, 0);
  const totalPerPerson = fuelCost/people + tollCost/people + poiCost;
  const budgetOk = !budget || totalPerPerson <= budget;

  NODES.push({
    id: nodeId++,
    time: '行程总计',
    name: '💰 费用摘要',
    desc: `全程 ${totalDist}km · ${people}人 · 人均约 ${Math.round(totalPerPerson)}元`,
    icon: '📊', color: '#16A34A', type: 'summary',
    coords: CITY_DB[destCity]?.center || NODES[NODES.length-1]?.coords,
    tag: budgetOk ? '✅ 预算内' : '⚠️ 超预算',
    tagBg: budgetOk ? '#DCFCE7' : '#FEF2F2',
    tagColor: budgetOk ? '#16A34A' : '#DC2626',
    fullName: '费用明细',
    rating: null, reviewCount: null,
    fullDesc: `全程 ${totalDist}km，油费约 ${fuelCost}元，过路费约 ${tollCost}元，景点票价合计 ${poiCost}元/人。\n${people}人同行人均约 ${Math.round(totalPerPerson)}元。${budget ? (budgetOk ? `✅ 在人均${budget}元预算内。` : `⚠️ 超出人均${budget}元预算 ${Math.round(totalPerPerson-budget)}元。`) : ''}`,
    photoCats:[{label:'全部',photos:[{url:placeholderImage('费用摘要', '暂无实景图', 'summary'), caption:'暂无实景图'}]}],
    infoList:[
      {icon:'🛣️', label:'总里程', value:`${totalDist} km`, sub:`途经 ${cities.join('→')}`},
      {icon:'⛽', label:'油费', value:`约 ${fuelCost} 元`, sub:`${people}人分摊 ${Math.round(fuelCost/people)}元/人`},
      {icon:'🚧', label:'过路费', value:`约 ${tollCost} 元`, sub:`${people}人分摊 ${Math.round(tollCost/people)}元/人`},
      {icon:'🎫', label:'景点票价', value:`约 ${poiCost} 元/人`, sub:'各站门票合计'},
      {icon:'💰', label:'人均总费用', value:`约 ${Math.round(totalPerPerson)} 元`, sub: budget ? (budgetOk?`✅ 预算${budget}元内`:`⚠️ 超出${Math.round(totalPerPerson-budget)}元`):''},
    ],
    tags:['费用汇总','路线总览'],
  });

  // 地图：清旧 + 画新路线
  map.eachLayer(l => { if (l instanceof L.Polyline) map.removeLayer(l); });
  L.polyline(NODES.map(n=>n.coords), {color:'#4A90D9', weight:3.5, opacity:0.7, dashArray:'0'}).addTo(map);
  NODES.forEach(node => {
    const mkr = makeMarker(node, false);
    mkr.on('click', ()=>focusNode(node.id, true));
    markers[node.id] = {marker:mkr, node, domEl:null};
  });

  addNearbyMarkers(allNearby, cities);
  fitMapToNodes(true);

  // 完成提示
  const stepsEl = document.getElementById('plan-steps');
  if (stepsEl) stepsEl.innerHTML +=
    `<div style="color:#16A34A;font-weight:700;margin-top:8px">
      ✅ 路线规划完成！${cities.join('→')} · 全程${totalDist}km · ${NODES.length-1}个节点
     </div>`;
  setTimeout(() => {
    document.getElementById('planning-status')?.remove();
    renderTimeline();
    renderHomeTripState();
  }, 900);
}

// ── 工具函数 ──
function haversine([lat1,lng1], [lat2,lng2]) {
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function calcTotalDist(cities) {
  // 过滤出在 CITY_DB 中的城市，跳过途经但未收录的城市
  const known = cities.filter(c => CITY_DB[c]);
  if (known.length < 2) {
    // 找不到两个已知城市时，用第一个和最后一个估算直线距离
    const first = CITY_DB[cities[0]]?.center;
    const last  = CITY_DB[cities[cities.length-1]]?.center;
    if (first && last) return Math.round(haversine(first, last) * 1.35); // 系数补偿实际路程
    return 0;
  }
  let dist = 0;
  for (let i = 1; i < known.length; i++) {
    dist += haversine(CITY_DB[known[i-1]].center, CITY_DB[known[i]].center);
  }
  return Math.round(dist * 1.35); // 路程系数：实际行驶距离 ≈ 直线距离 × 1.35
}
function formatTime(h) {
  const total = ((h % 24) + 24) % 24;
  const hh = Math.floor(total).toString().padStart(2,'0');
  const mm = Math.round((total%1)*60).toString().padStart(2,'0');
  return `${hh}:${mm}`;
}

function isDestinationDiscoveryQuery(text) {

}

function isPlanStarterQuery(text) {
  const value = String(text || '').trim();
  if (!/规划行程|制定行程|做行程|安排行程/.test(value)) return false;

function extractOriginHintForDiscover(text) {
  const value = String(text || '');
  const route = parseRouteInput(value);
  const fromRoute = findCity(route.origin);
  if (fromRoute) return fromRoute;
  const match = value.match(/(?:我在|从|出发地|当前位置|现在在)\s*([\u4e00-\u9fa5]{2,6})/);
  if (match) return findCity(match[1]) || match[1].replace(/[市省区县]$/g, '');
  return '';
}

async function fetchDestinationDiscover(text) {
  const month = new Date().getMonth() + 1;
  const origin = extractOriginHintForDiscover(text);
  const url = `${TRIPADVISOR_PROXY_BASE}/api/destination/discover?` +
    `month=${month}&origin=${encodeURIComponent(origin)}&limit=6`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 70000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !data.ok) {
      throw new Error((data && data.error) || `HTTP ${res.status}`);
    }
    return data;
  } finally {
    clearTimeout(timer);
  }
}

async function renderDestinationDiscover(text) {
  try {
    const data = await fetchDestinationDiscover(text);
    const month = data.month || (new Date().getMonth() + 1);
    const cards = (data.items || []).map((item, index) => {
      const meta = [
        item.rating ? `${escapeHTML(item.rating)}分` : '',
        item.review_count ? `${escapeHTML(item.review_count)}条评价` : '',
        item.top_poi ? `热门：${escapeHTML(item.top_poi)}` : '',
      ].filter(Boolean).join('｜') || '已联网筛选当季口碑';
      const source = item.source_title ? `来源：${escapeHTML(item.source_title)}` : '来源：实时搜索 + TripAdvisor/RapidAPI';
      return `
        <div class="discover-card">
          <img class="discover-img" src="${escapeHTML(item.image_url)}" alt="${escapeHTML(item.city)}" onerror="handlePlaceImageError(this, '${escapeHTML(item.city)}', '${escapeHTML(item.city)}')">
          <div class="discover-main">
            <div class="discover-topline">
              <div class="discover-city">${index + 1}. ${escapeHTML(item.city)}</div>
              <div class="discover-badge">${escapeHTML(item.fit || '当季推荐')}</div>
            </div>
            <div class="discover-theme">${escapeHTML(item.title || item.season || '当季旅行目的地')}</div>
            <div class="discover-reason">${escapeHTML(item.reason || '')}</div>
            <div class="discover-meta">${meta}</div>
            <div class="discover-source">${source}</div>
            <div class="discover-actions">
              <div class="discover-score">匹配度 ${Math.round(item.score || 80)}</div>
              <button class="discover-btn" onclick="event.stopPropagation();quickAsk('去${escapeHTML(item.city)}玩2天')">生成方案</button>
            </div>
          </div>
        </div>`;
    }).join('');
    const sourceList = (data.search_results || []).slice(0, 2).map(r => escapeHTML(r.title)).filter(Boolean).join('、');
    const html = `
      <div class="discover-result">
        <div class="discover-head">
          <div class="discover-title">${month}月最适合出发的目的地</div>
          <div class="discover-sub">已按当前月份自动筛选：${escapeHTML(data.focus || '季节舒适度、景观窗口、平台口碑')}。${data.origin ? `出发地参考：${escapeHTML(data.origin)}。` : ''}${sourceList ? `参考检索：${sourceList}` : ''}</div>
        </div>
        ${cards || '<div class="discover-sub">没有拿到可用目的地结果，请稍后重试。</div>'}
      </div>`;
    swapThinkingToPlan(html);
  } catch (err) {
    const message = err && err.name === 'AbortError'
      ? '联网检索超过 70 秒，本次请求已超时。请稍后再试，或检查本地代理和网络。'
      : `没有从本地联网代理拿到数据：${escapeHTML(err.message || err)}。请确认 127.0.0.1:8787 的代理服务正在运行。`;
    swapThinkingToPlan(`
      <div class="discover-result">
        <div class="discover-head">
          <div class="discover-title">实时目的地检索失败</div>
          <div class="discover-sub">${message}</div>
        </div>
      </div>`);
  }
}

function handleSend() {
  const v = document.getElementById('ai-input').value.trim();
  if (!v) return;
  const fromPlanner = window.__PLANNER_REQUEST_ACTIVE === true;
  document.getElementById('ai-input').value = '';
  syncInputState();
  rememberConversation(v);

  if (fromPlanner) {
    preparePlannerConversation();
    switchTab('planner');
    keepPlannerNavActive();
    resetPlannerConversation();
  } else {
    // 切到对话标签，展开抽屉
    switchTab('chat');
    snap(SNAP.max);
  }

  // 显示用户气泡
  addUserBubble(v);

  if (fromPlanner) {
    handlePlannerConversation(v);
    return;
  }

  if (isDestinationDiscoveryQuery(v)) {
    const month = new Date().getMonth() + 1;
    const origin = extractOriginHintForDiscover(v);
    const steps = [
      `正在识别当前月份：${month}月…`,
      '🌐 正在联网检索当季旅行目的地攻略…',
      '🧊 正在按天气舒适度、景观窗口和错峰程度筛选…',
      '⭐ 正在补充 TripAdvisor/RapidAPI 评分与评价数据…',
      origin ? `📍 正在结合出发地：${origin}` : '🧭 正在生成适合本月出发的推荐…',
    ];
    addThinkingBubble(steps);
    setTimeout(() => renderDestinationDiscover(v), thinkDelay(steps));
    return;
  }

  if (isPlanStarterQuery(v)) {
    renderPreferenceStarter();
    return;
  }

  // 天气指令
  if (['天气变差','下雨','雨天','坏天气','变天'].some(k=>v.includes(k))) {
    addAIBubble(`
      <div class="ai-section">
        <div class="ai-section-title">🌧️ 雨天方案已启用</div>
        <div class="ai-item">户外景点已替换为室内备选方案</div>
        <div class="ai-item">地图标记颜色已同步更新</div>
      </div>`);
    return;
  }
  if (['天气好转','放晴','晴天'].some(k=>v.includes(k))) {
    addAIBubble('☀️ 天气好转！已恢复晴天行程方案。');
    return;
  }

  // 路线规划模式
  const requestedDays = parseTripDays(v);
  const { origin, dest, people, budget } = parseRouteInput(v);
  const originCity = findCity(origin);
  const destCity   = findCity(dest);

  // ユーザー入力の要点を識別
  const intent = parseIntent(v);
  if (intent.hotelBudget) userHotelBudget = intent.hotelBudget;

  if (originCity && destCity && originCity !== destCity) {
    const steps = buildThinkSteps(destCity, intent);
    addThinkingBubble(steps);
    setTimeout(() => renderRoutePlanOptions(originCity, destCity, people, budget, requestedDays, intent), thinkDelay(steps));
    return;
  }

  // 单城市模式：只有纯续写/调整时才复用上一次城市，避免“新疆”未识别时串到旧的重庆。
  const detectedCity = detectCity(v);
  const hasExplicitDestinationCue = /去|到|游|玩|旅行|旅游|攻略|行程|路线|规划/.test(v);
  const city = detectedCity || (!hasExplicitDestinationCue && requestedDays > 1 ? lastPlannedCity : null);

  if (city && !intent.lodging && shouldShowSpotSelector(city, intent)) {
    createMorphRouteCard(city, requestedDays, intent);
    return;
  }

  if (city && CITY_DB[city] && isHybridPOIQuery(v)) {
    const keyword = keywordFromUserText(v, city);
    const steps = [
      '正在识别城市与游玩偏好…',
      `🎯 已锁定城市：${city}`,
      `🔎 调用 Search_POI_Database 查询：${keyword}`,
      '🌐 正在检索实时地点资料与公开实景图…',
      '🧩 正在组装图文说明和交互卡片…',
    ];
    addThinkingBubble(steps);
    setTimeout(() => renderHybridPOIRecommendation(city, keyword, intent), thinkDelay(steps));
    return;
  }

  // 住宿（住哪）需求：酒店推荐に分岐
  if (intent.lodging && city) {
    lastPlannedCity = city;
    const steps = buildThinkSteps(city, intent);
    addThinkingBubble(steps);
    setTimeout(() => renderHotelRecommendation(city, intent), thinkDelay(steps));
    return;
  }

  if (city && CITY_DB[city]) {
    const steps = buildThinkSteps(city, intent);
    addThinkingBubble(steps);
    setTimeout(() => renderPlanOptions(city, requestedDays, intent), thinkDelay(steps));
    return;
  }

  // 未识别
  addAIBubble(`
    抱歉，暂时没有理解您的需求 🤔<br><br>
    <div class="ai-section">
      <div class="ai-section-title">💡 试试这些格式：</div>
      <div class="ai-item">🏙️ 单城市：<b>去成都</b>、<b>重庆两天</b>、<b>两天</b></div>
      <div class="ai-item">🛣️ 路线：<b>从西安到成都，3人，预算1500元</b></div>
      <div class="ai-item">🌧️ 天气：<b>天气变差</b>（切换室内方案）</div>
    </div>
    支持城市：${Object.keys(CITY_DB).join('、')}
  `);
}

function placeImageTarget(place) {
  const name = (place && place.name) || '';
  if (PLACE_IMAGE_TARGETS[name]) return { ...place, ...PLACE_IMAGE_TARGETS[name] };
  if (/磁器口/.test(name)) return { ...place, name:'磁器口古镇', kw:'ciqikou,chongqing,oldtown' };
  if (/解放碑/.test(name)) return { ...place, name:'解放碑步行街', kw:'jiefangbei,chongqing' };
  return place;
}

function isGenericPhotoKw(kw) {
  return /(?:^|,)food(?:,|$)|street|travel|landmark|china,city|city,night/.test(String(kw || ''));
}

function spotKw(place, city) {
  const target = placeImageTarget(place || {});
  const name = (target && target.name) || '';
  for (const k of Object.keys(LANDMARK_KW).sort((a, b) => b.length - a.length)) {
    if (name.includes(k)) return LANDMARK_KW[k];
  }
  if (target && target.kw && !isGenericPhotoKw(target.kw)) return target.kw;
  return `${cityKw(city)},china,landmark`;
}

// 根据用户原话为旅行方案封面补充图片意图
const IMAGE_CUE_RULES = [
  { re:/美食|吃|小吃|火锅|烧烤|餐|宵夜|早茶|面|米线|泡馍/, kw:'food,street,restaurant', node:/美食|餐|面|火锅|小吃|早茶|泡馍|米线|菜|🍜|🥣|🌶️|🍵/ },

  { re:/亲子|带娃|带孩子|孩子|儿童|一家|遛娃|家庭/, kw:'family,park,museum', node:/亲子|熊猫|动物|公园|博物|乐园|体验|🐼|🎭|🌿/ },
  { re:/情侣|恋人|蜜月|约会|浪漫|拍照|出片/, kw:'romantic,viewpoint,street,cafe', node:/夜景|观景|湖|街|咖啡|文艺|花|🌃|🌸|☕/ },
  { re:/小众|艺术|文艺|涂鸦|咖啡|网红|文创/, kw:'art,district,cafe,street', node:/艺术|文艺|咖啡|街区|创意|网红|涂鸦|☕|🎨/ },
];

function nodeSearchText(node) {
  return `${node?.name || ''}${node?.tag || ''}${node?.desc || ''}${node?.icon || ''}`;
}

function imageCueKeywords(city, themeCat, audience, cover, intent) {
  const source = `${intent?.rawText || ''}${themeCat || ''}${audience || ''}`;
  const rule = IMAGE_CUE_RULES.find(r => r.re.test(themeCat || ''))
    || IMAGE_CUE_RULES.find(r => r.re.test(source));
  if (!rule) return '';
  if (city === '成都' && /亲子|带娃|孩子|熊猫/.test(source)) return 'giant,panda,chengdu,park';
  return `${cityKw(city)},${rule.kw}`;
}

function coverScoreByText(node, theme, intent) {
  const text = intent?.rawText || '';
  const hay = nodeSearchText(node);
  let score = 0;
  if (text && node?.name && text.includes(node.name.split(/[·•・,，]/)[0])) score += 24;
  if (theme?.match?.(node)) score += 20;
  IMAGE_CUE_RULES.forEach(rule => {
    if (rule.re.test(text) && rule.node.test(hay)) score += 16;
  });
  if (/亲子|带娃|孩子|家庭/.test(text) && /熊猫|公园|博物|乐园|体验/.test(hay)) score += 10;
  return score;
}

function coverIdentities(node) {
  const name = node?.name || '';
  return uniquePhotos([
    name,
    spotSearchTerm(node),
    ...name.split(/[·•・,，/／｜|（）()]/).map(s => s.trim()).filter(Boolean),
  ]);
}

function markCoverUsed(usedCovers, node) {
  if (!usedCovers || !node) return;
  coverIdentities(node).forEach(id => usedCovers.add(id));
}

function isCoverFresh(usedCovers, node) {
  if (!usedCovers || !node) return true;
  return !coverIdentities(node).some(id => usedCovers.has(id));
}

function pickPlanCover(picks, city, theme, intent, usedCovers) {
  const candidates = picks.filter(Boolean);
  const allRanked = candidates
    .map(p => ({ node:p, score:coverScoreByText(p, theme, intent) }))
    .sort((a, b) => b.score - a.score);
  if (usedCovers) {
    const freshRanked = allRanked.filter(x => isCoverFresh(usedCovers, x.node));
    if (freshRanked[0]?.score > 0) return freshRanked[0].node;
    if (freshRanked[0]) return freshRanked[0].node;
  }
  if (allRanked[0]?.score > 0) return allRanked[0].node;
  const fresh = candidates.filter(p => isCoverFresh(usedCovers, p));
  const pool = fresh.length ? fresh : candidates;
  const ranked = pool
    .map(p => ({ node:p, score:coverScoreByText(p, theme, intent) }))
    .sort((a, b) => b.score - a.score);
  return ranked[0]?.node || candidates[0];
}

function planCoverKeywords(cover, city, themeCat, audience, intent) {
  const cue = imageCueKeywords(city, themeCat, audience, cover, intent);
  const base = spotKw(cover, city);
  return cue ? `${base},${cue}` : base;
}

const SPOT_PHOTO_CACHE = {};
function isBadCoverUrl(url) {
  const text = decodeURIComponent(String(url || '')).toLowerCase();
  return !text
    || /\.pdf($|\?)|\/pdf\//i.test(text)
    || /\.(svg|gif)($|\?)/i.test(text)
    || /hanbin,\s*ankang,\s*shaanxi,\s*china\s*-\s*panoramio\s*-\s*monicker|\/cat[\W_]|black[_-]?cat|gato|猫|djvu|webm|montage|collage|cadal|page\d|stamp|seal|logo|icon|map|diagram|scan|manuscript|document|poster|ticket|calligraphy|coin|banknote|plate|signboard|station|platform|subway|metro/.test(text);
}

async function fetchSpotPhotos(term, limit = 18) {
  if (!term) return [];
  if (SPOT_PHOTO_CACHE[term]) return SPOT_PHOTO_CACHE[term];
  const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search` +
    `&gsrsearch=${encodeURIComponent(term)}&gsrnamespace=6&gsrlimit=${limit}` +
    `&prop=imageinfo&iiprop=url&iiurlwidth=900&format=json&origin=*`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    const pages = (data.query && data.query.pages) || {};
    const urls = Object.values(pages)
      .sort((a, b) => (a.index || 0) - (b.index || 0))
      .map(p => p.imageinfo && p.imageinfo[0] && p.imageinfo[0].thumburl)
      .filter(u => u && /\.(jpe?g|png)/i.test(u) && !isBadCoverUrl(u));
    const uniq = [...new Set(urls)];
    SPOT_PHOTO_CACHE[term] = uniq;
    return uniq;
  } catch (e) { return []; }
}

function uniquePhotos(urls) {
  return [...new Set((urls || []).filter(Boolean))];
}

function precisePlaceTerms(place, city, includeCityFallback = true) {
  const cn = spotSearchTerm(place);
  const en = spotKw(place, city).replace(/,/g, ' ');
  return uniquePhotos([
    cn && city ? `${cn} ${city}` : cn,
    cn,
    en && city ? `${en} ${city}` : en,
    includeCityFallback ? city : '',
  ]);
}

async function searchPlacePhotos(place, city, limit = 12, options = {}) {
  const terms = precisePlaceTerms(place, city, options.includeCityFallback !== false);
  let urls = [];
  for (const term of terms) {
    const found = await fetchSpotPhotos(term, limit);
    urls = uniquePhotos([...urls, ...found]);
    if (urls.length >= Math.min(4, limit)) break;
  }
  return urls.slice(0, limit);
}

// 景点の实景ギャラリー：景点名で取得し、少なければ都市名の实景で補完（重複なし）
async function getRealGallery(place, city, options = {}) {
  const includeCityFallback = options.includeCityFallback !== false;
  let urls = await searchPlacePhotos(place, city, 20, { includeCityFallback });
  if (urls.length < 10 && city && includeCityFallback) {
    const extra = await fetchSpotPhotos(city, 20);
    urls = uniquePhotos([...urls, ...extra]);
  }
  return urls.slice(0, 20);
}

function planCoverCandidates(plan, index = 0) {
  const place = plan.coverPlace || { name: plan.coverTerm, kw: plan.coverKw };
  return uniquePhotos([
    curatedPlanCover(place, plan.city, plan),
  ]).filter(u => !isBadCoverUrl(u));
}

function shouldUseWikimediaPlanCover(plan) {
  return !['安康'].includes(plan.city);
}

async function resolvePlanCover(plan, used, index = 0) {
  const place = plan.coverPlace || { name: plan.coverTerm, kw: plan.coverKw };
  const curated = curatedPlanCover(place, plan.city, plan);
  if (curated && !used.has(curated) && !isBadCoverUrl(curated)) return curated;

  if (shouldUseWikimediaPlanCover(plan)) {
    const realPhotos = (await searchPlacePhotos(place, plan.city, 12, { includeCityFallback: false }))
      .filter(u => !isBadCoverUrl(u));
    const realCover = realPhotos.find(u => !used.has(u));
    if (realCover) return realCover;
  }

  const candidates = planCoverCandidates(plan, index);
  const candidate = candidates.find(u => !used.has(u));
  return candidate || fallbackPlanCoverUrl(plan);
}

async function preparePlanCovers(plans) {
  const used = new Set();
  for (const [i, plan] of (plans || []).entries()) {
    const url = await resolvePlanCover(plan, used, i);
    used.add(url);
    plan.coverUrl = url;
  }
}
