    const query = target.name || place.name;
    if (!query) return;
    const cacheKey = `${city}:${query}`;
    let hit = TRIPADVISOR_PLACE_CACHE[cacheKey];
    if (!hit) {
      const items = await fetchTripAdvisorPOIs(city, query, 1);
      hit = items && items[0];
      TRIPADVISOR_PLACE_CACHE[cacheKey] = hit || null;
    }
    const source = hit && hit.source_node;
    const apiPhotos = source?.photoCats?.[0]?.photos || [];
    if (apiPhotos.length) {
      place.photoCats[0].photos = apiPhotos.map((p, i) => ({
        url: p.url,
        caption: `${place.name} · TripAdvisor 实景 ${i + 1}`,
      }));
    }
    if (hit?.content_id) place.content_id = hit.content_id;
    if (hit?.content_type) place.content_type = hit.content_type;
    if (hit?.rating) place.rating = parseFloat(hit.rating) || place.rating;
    const reviewCount = parseInt(String(hit?.heat || '').replace(/[^\d]/g, ''), 10);
    if (reviewCount) place.reviewCount = reviewCount;
  }));
}

function keywordFromUserText(text, city) {
  return (text || '')
    .replace(city || '', '')
    .replace(/推荐|景点|打卡点|打卡|去哪玩|好玩|榜单|排行|附近|一下|给我|帮我|看看/g, '')
    .replace(/\s+/g, '')
    .trim() || '经典打卡';
}

function poiMatchesKeyword(poi, keyword) {
  const hay = nodeSearchText(poi);
  if (!keyword || keyword === '经典打卡') return true;
  if (/网红|拍照|出片/.test(keyword)) return /网红|夜景|夜游|古街|街区|观景|灯|🌃|🏮/.test(hay);
  if (/历史|人文|古迹|博物|文化/.test(keyword)) return /历史|人文|古迹|博物|文化|寺|庙|塔|陵|遗址|🏛️|🏯/.test(hay);
  if (/自然|山水|风景|户外|公园/.test(keyword)) return /自然|山|湖|河|海|公园|景区|峡谷|🌊|⛰️|🌿/.test(hay);
  if (/美食|吃|小吃|火锅|夜宵/.test(keyword)) return /美食|餐|面|火锅|小吃|街|🌶️|🍜|🥣/.test(hay);
  if (/亲子|带娃|儿童|家庭/.test(keyword)) return /熊猫|公园|博物|乐园|体验|动物|🐼|🎭/.test(hay);
  return hay.includes(keyword);
}

function priceFromPoi(poi) {
  const desc = poi.desc || '';
  if (/免费/.test(desc)) return '免费';
  const ticket = desc.match(/(?:票价|门票)(\d+(?:\.\d+)?)元/);
  if (ticket) return `¥${ticket[1]}起`;
  const per = desc.match(/人均(\d+(?:\.\d+)?)元/);
  if (per) return `人均 ¥${per[1]}`;
  return '现场确认';
}

const TRIPADVISOR_PROXY_BASE = (
  localStorage.getItem('tripadvisorProxyBase') ||
  (location.protocol === 'file:' ? 'http://127.0.0.1:8787' : location.origin)
).replace(/\/$/, '');

function tripAdvisorApiBases() {
  const bases = [TRIPADVISOR_PROXY_BASE];
  if (location.protocol !== 'file:') bases.push(location.origin.replace(/\/$/, ''));
  bases.push('http://127.0.0.1:8787');
  return [...new Set(bases.filter(Boolean))];
}

function tripAdvisorApiUrl(base, endpoint, params = {}) {
  const root = String(base || '').replace(/\/$/, '');
  const path = root.endsWith('/api/tripadvisor')
    ? `${root}/${endpoint}`
    : `${root}/api/tripadvisor/${endpoint}`;
  const url = new URL(path);
  Object.entries(params).forEach(([key, value]) => {
    if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
  });
  return url.toString();
}

function amapApiUrl(base, params = {}) {
  const root = String(base || '').replace(/\/$/, '');
  const path = root.endsWith('/api/amap')
    ? `${root}/search`
    : `${root}/api/amap/search`;
  const url = new URL(path);
  Object.entries(params).forEach(([key, value]) => {
    if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
  });
  return url.toString();
}

function rapidApiCategoryFromKeyword(keyword) {
  if (/酒店|住宿|民宿|宾馆|客栈/.test(keyword || '')) return 'hotels';
  if (/美食|餐厅|吃|小吃|火锅|早茶|咖啡|饭店/.test(keyword || '')) return 'restaurants';
  return 'attractions';
}

function tripAdvisorHeat(item, index) {
  const count = parseInt(String(item.review_count || '').replace(/[^\d]/g, ''), 10);
  if (count) {
    if (count >= 10000) return `${(count / 10000).toFixed(1)}万+`;
    return `${count}+`;
  }
  return '热度待同步';
}

function interestLabel(heat) {
  const text = String(heat || '').trim();
  if (!text || text === '热度待同步') return '热度待同步';
  if (/感兴趣$/.test(text)) return text;
  if (/人$/.test(text)) return `${text}感兴趣`;
  return `${text}人感兴趣`;
}

function rankLineLabel(rank, heat) {
  const rankText = String(rank || '').trim();
  if (!rankText) return interestLabel(heat);
  if (/感兴趣|热度待同步/.test(rankText)) return rankText;
  const heatText = interestLabel(heat);
  return heatText === '热度待同步' ? `${rankText} | 热度待同步` : `${rankText} | ${heatText}`;
}

async function fetchTripAdvisorPOIs(city, keyword, limit = 4) {
  const category = rapidApiCategoryFromKeyword(keyword);
  const params = {
    city,
    keyword: keyword || '景点',
    category,
    limit,
  };
  for (const base of tripAdvisorApiBases()) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const res = await fetch(tripAdvisorApiUrl(base, 'search', params), { signal: ctrl.signal });
      if (!res.ok) continue;
      const data = await res.json();
      if (!data.ok || !Array.isArray(data.items)) continue;
      return data.items
        .filter(item => item && item.name)
        .slice(0, limit)
        .map((item, i) => {
          const rating = item.rating || '';
          const reviews = item.review_count ? `${item.review_count}条点评` : 'TripAdvisor 数据';
          const rawImages = uniquePhotos([item.image_url, ...(item.images || [])]).filter(u => !isSyntheticImageUrl(u) && !isBadCoverUrl(u));
          const img = rawImages[0] || placeholderImage(item.name, 'TripAdvisor 实景图待同步');
          const node = {
            name: item.name,
            desc: item.category || item.ranking || reviews,
            city,
            content_id: item.content_id || item.id || '',
            content_type: item.content_type || category.replace(/s$/, ''),
            kw: `${cityKw(city)},${item.name},tripadvisor`,
            tag: category === 'hotels' ? '酒店' : category === 'restaurants' ? '美食' : '景点',
            coords: item.latitude && item.longitude ? [parseFloat(item.latitude), parseFloat(item.longitude)] : (CITY_DB[city]?.center || [0, 0]),
            rating: rating || null,
            reviewCount: parseInt(String(item.review_count || '').replace(/[^\d]/g, ''), 10) || null,
            photoCats: [{ label:'全部', photos:(rawImages.length ? rawImages : [img]).map((url, idx) => ({ url, caption:`${item.name} · TripAdvisor ${idx + 1}` })) }],
          };
          return {
            poi_id: `tripadvisor_${item.id || i}`,
            content_id: item.content_id || item.id || '',
            content_type: item.content_type || category.replace(/s$/, ''),
            poi_name: item.name,
            card_title: item.name,
            style_title: category === 'hotels' ? 'TripAdvisor 酒店推荐' : category === 'restaurants' ? 'TripAdvisor 美食推荐' : 'TripAdvisor 热门地点',
            highlight: item.ranking || item.category || `${rating}分，${reviews}`,
            address: item.address || `${city} · ${item.name}`,
            open_time: '以 TripAdvisor/商家实时信息为准',
            suggest_time: category === 'restaurants' ? '1-2小时' : '2-3小时',
            price: item.price || '查看',
            rank: item.ranking || `${city}TripAdvisor推荐第${i + 1}名`,
            heat: tripAdvisorHeat(item, i),
            rating,
            district: item.address || `${city} · TripAdvisor`,
            card_rank: item.ranking || `${city}TripAdvisor推荐 · 第${i + 1}名`,
            action_text: item.url ? '查看' : '详情',
            img_url: img,
            source_url: item.url,
            source_node: node,
            realtime_provider: data.provider_host || 'TripAdvisor/RapidAPI',
          };
        });
    } catch (e) {
      continue;
    } finally {
      clearTimeout(timer);
    }
  }
  return [];
}

async function Search_POI_Database(city, keyword) {
  const data = CITY_DB[city];
  if (!data) return [];
  const curated = curatedPOIData(city, keyword);
  if (curated) {
    return Promise.all(curated.map(async (p, i) => {
      const photos = await searchPlacePhotos({ name:p.poi_name, kw:p.kw }, city, 6);
      return {
        ...p,
        name: p.poi_name,
        img_url: photos[0] || placeholderImage(p.poi_name, '真实图片待同步'),
        source_node: { ...p, name: p.poi_name },
      };
    }));
  }
  const tripAdvisorPois = await fetchTripAdvisorPOIs(city, keyword, 4);
  if (tripAdvisorPois.length) return tripAdvisorPois;

  const micro = (typeof MICRO_POI_DB !== 'undefined' && MICRO_POI_DB[city]) || [];
  let pool = [...(data.nodes || []), ...(data.nearby || []), ...micro].filter(isAttraction);
  let picks = pool.filter(p => poiMatchesKeyword(p, keyword));
  picks = dedupeByName((picks.length ? picks : pool).slice(0, 8)).slice(0, 4);
  const hydrated = await Promise.all(picks.map(async (p, i) => {
    const photos = await searchPlacePhotos(p, city, 6);
    const price = priceFromPoi(p);
    const rankCat = rankCategory({ ...p, city });
    return {
      poi_id: `${city}_${i + 1}_${(p.name || '').replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '')}`,
      poi_name: p.name,
      highlight: (p.desc || '本地热门推荐').replace(/·/g, '，'),
      address: `${city} · ${p.name}`,
      open_time: /夜|酒吧|夜市|不夜城/.test(nodeSearchText(p)) ? '建议傍晚至夜间前往' : '以景区当日公示为准',
      suggest_time: /大型|景区|博物|公园|山|湖/.test(nodeSearchText(p)) ? '2-3小时' : '1-2小时',
      price,
      rank: `${city}${rankCat}榜第${i + 1}名`,
      heat: p.reviewCount ? `${p.reviewCount}+` : '热度待同步',
      img_url: photos[0] || placeholderImage(p.name, '真实图片待同步'),
      source_node: p,
    };
  }));
  return hydrated;
}

// 实景写真をカバー要素（img / 背景）に遅延適用（景点→都市の順でフォールバック）
async function hydrateRealCovers(root) {
  if (!root) return;
  const used = new Set();                  // 同一ビュー内で画像の重複を回避
  const els = root.querySelectorAll('[data-term]');
  for (const el of els) {
    if (el.classList.contains('plan-card') || el.dataset.coverLocked === 'true') continue;
    let photos = await fetchSpotPhotos(el.dataset.term, 10);
    if (photos.length < 3 && el.dataset.city) {
      const extra = await fetchSpotPhotos(el.dataset.city, 10);
      photos = [...new Set([...photos, ...extra])];
    }
    if (photos && photos.length) {
      const u = photos.find(p => !used.has(p)) || photos[0];
      used.add(u);
      if (el.tagName === 'IMG') el.src = u;
      else el.style.backgroundImage = `url('${u}')`;
    }
  }
}

function poiPreferenceScore(node, intent, theme = null) {
  const pref = effectivePreference(intent);
  const hay = nodeSearchText(node);
  let score = 50;
  if (theme?.match?.(node)) score += 14;
  (intent?.themePrefs || []).forEach(cat => {
    if (cat === theme?.cat) score += 16;
    if (cat === '自然风光' && POI_SCORE_RULES.find(r => r.key === 'nature').re.test(hay)) score += 10;
    if (cat === '人文历史' && POI_SCORE_RULES.find(r => r.key === 'history').re.test(hay)) score += 10;
    if (cat === '美食之旅' && POI_SCORE_RULES.find(r => r.key === 'food').re.test(hay)) score += 10;
    if (cat === '小众路线' && POI_SCORE_RULES.find(r => r.key === 'niche').re.test(hay)) score += 10;
    if (cat === '夜色经典' && POI_SCORE_RULES.find(r => r.key === 'night').re.test(hay)) score += 10;
  });
  POI_SCORE_RULES.forEach(rule => {
    if (rule.re.test(hay)) score += (pref.weights[rule.key] || 0) * 4;
  });
  POI_AVOID_RULES.forEach(rule => {
    if (pref.avoids[rule.key] && rule.re.test(hay)) score -= rule.penalty;
  });
  if (pref.pace === 'slow' && /大型|整天|爬|山|远|自驾/.test(hay)) score -= 8;
  if (pref.pace === 'fast' && /经典|地标|必去|打卡/.test(hay)) score += 8;
  if (intent?.audience === '亲子' && /公园|博物|体验|动物|乐园|轻松/.test(hay)) score += 10;
  if (intent?.audience === '情侣' && /夜景|观景|街区|文艺|咖啡|拍照/.test(hay)) score += 10;
  if (nodeMatchesSelectedSpot(node, intent?.selectedSpotIds || [])) score += 34;
  return Math.max(0, Math.min(100, score));
}

function buildCityPlans(city, days = 1, intent = null) {
  const data = CITY_DB[city];
  if (!data) return [];
  const micro = (typeof MICRO_POI_DB !== 'undefined' && MICRO_POI_DB[city]) || [];
  const pool = [...(data.nodes || []), ...(data.nearby || []), ...micro].filter(isAttraction);
  const target = Math.max(3, (days || 1) * 3);   // 每天 上午/下午/晚上 = 3 行程
  const plans = [];
  const usedCovers = new Set();
  PLAN_THEMES.forEach((theme, ti) => {
    let picks = pool.filter(theme.match);
    picks = picks.concat(pool.filter(n => !picks.includes(n)));
    picks = dedupeByName(picks);
    picks = sortNodesForPreference(picks, intent, theme);
    if (picks.length < 2) return;
    // 天数ぶん（3×days）になるよう补充して、各日に上午/下午/晚上を確保
    if (picks.length < target) picks = picks.concat(makeFillerSpots(city, target - picks.length, picks.length));
    picks = picks.slice(0, target);
    // カバーは方案ごとに異なる景点を優先（画像の重複回避）
    const cover = pickPlanCover(picks, city, theme, intent, usedCovers);
    markCoverUsed(usedCovers, cover);
    const id = `plan_${++__planSeq}`;
    const routeLock = picks.reduce((s, p, k) => s + ((p.name || '').length) * (k + 3), ti * 13);
    const audience = intent?.audience || PLAN_AUDIENCE[ti % PLAN_AUDIENCE.length];
    const plan = {
      id, city, days,
      themeTitle: themeTitleFor(city, theme.cat, theme.title),
      themeCat: theme.cat,
      audience,
      coverKw: planCoverKeywords(cover, city, theme.cat, audience, intent),
      coverTerm: spotSearchTerm(cover),
      coverPlace: cover,
      lock: routeLock,
      nodes: picks,
    };
    attachPlanFit(plan, intent);
    window.__PLANS[id] = plan;
    plans.push(plan);
  });
  return plans.slice(0, 6);
}

function dedupeByName(arr) {

// ユーザー嗜好に合わせて方案を並べ替え・同行者反映
function applyIntentToPlans(plans, intent) {
  if (!intent) return plans;
  if (intent.audience) plans.forEach(p => p.audience = intent.audience);
  plans.forEach(p => attachPlanFit(p, intent));
  if (intent.themePrefs && intent.themePrefs.length) {
    plans.forEach(p => p._match = intent.themePrefs.includes(p.themeCat) ? 1 : 0);
  }
  plans.sort((a, b) => (b.fit?.score || 0) - (a.fit?.score || 0) || (b._match || 0) - (a._match || 0));
  return plans;
}
function intentFocusText(intent) {
  if (!intent) return '';
  const bits = [...(intent.themePrefs || []), intent.audience].filter(Boolean);
  return bits.length ? `已根据你的偏好（${bits.join('、')}）优先排序，` : '';
}

function lngLatFromSpot(spot) {
  if (!spot) return null;
  const lng = Number(spot.lng);
  const lat = Number(spot.lat);
  if (Number.isFinite(lng) && Number.isFinite(lat)) return [lng, lat];
  if (typeof spot.location === 'string' && spot.location.includes(',')) {
    const [rawLng, rawLat] = spot.location.split(',').map(Number);
    if (Number.isFinite(rawLng) && Number.isFinite(rawLat)) return [rawLng, rawLat];
  }
  if (Array.isArray(spot.coords) && spot.coords.length >= 2) {
    const a = Number(spot.coords[0]);
    const b = Number(spot.coords[1]);
    if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
    return Math.abs(a) <= 90 && Math.abs(b) > 90 ? [b, a] : [a, b];
  }
  return null;
}

function findGeoForRouteSpot(spot, plan) {
  const direct = spotLngLat(spot);
  if (direct) return direct;
  const candidates = allRouteGeoCandidates(plan);
  const id = String(spot?.id || '');
  const key = normalizeSpotKey(spot?.name || '');
  const hit = candidates.find(item => id && String(item.id || item.poi_id || item.content_id || '') === id)
    || candidates.find(item => normalizeSpotKey(item.name || item.poi_name || item.card_title || '') === key)
    || candidates.find(item => {
      const itemKey = normalizeSpotKey(item.name || item.poi_name || item.card_title || '');
      return itemKey && key && (itemKey.includes(key) || key.includes(itemKey));
    });
  return spotLngLat(hit);
}

function enrichRouteForMap(plan) {
  const seed = window.__INSTANT_ROUTE_STATE?.[plan.id]?.data
    || plan.routeData

  const route = normalizeAIItineraryData(seed, plan);
  const expectedDays = Math.max(1, Number(route.days || route.day_count || plan?.days || route.itinerary?.length || 1));
  route.days = expectedDays;
  route.day_count = expectedDays;
  route.itinerary = (route.itinerary || []).map((day, dayIndex) => ({
    ...day,
    day: routeDayNumber(day, dayIndex),
    spots: (day.spots || []).map((spot, spotIndex) => {
      const geo = findGeoForRouteSpot(spot, plan);
      const candidate = findRouteSpotCandidate(spot, plan);

      const img = routeSpotPhotoUrl(spot, plan, candidate);

        img_url: spot.img_url || spot.img || spot.image_url || img,

function distanceKmLngLat(a, b) {
  if (!a || !b) return 0;
  const rad = n => n * Math.PI / 180;
  const lng1 = Number(a[0]); const lat1 = Number(a[1]);
  const lng2 = Number(b[0]); const lat2 = Number(b[1]);
  const dLat = rad(lat2 - lat1);
  const dLng = rad(lng2 - lng1);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

function fallbackLegMetrics(stops) {
  const metrics = ['起点'];
  for (let i = 1; i < stops.length; i++) {
    const km = distanceKmLngLat([stops[i - 1].lng, stops[i - 1].lat], [stops[i].lng, stops[i].lat]);
    const mins = Math.max(6, Math.round(km / 24 * 60));
    metrics.push(`距上一站约${km.toFixed(1)}km · 驾车约${mins}min`);
  }
  return metrics;
}

function routeResultLegMetrics(result, stops) {
  const route = result?.routes?.[0] || {};
  const totalSeconds = Number(route.time);
  const totalMeters = Number(route.distance);
  if (!Number.isFinite(totalSeconds) || !Number.isFinite(totalMeters) || stops.length < 2) {
    return fallbackLegMetrics(stops);
  }
  const legCount = Math.max(1, stops.length - 1);
  const avgMin = Math.max(4, Math.round(totalSeconds / legCount / 60));
  const avgKm = Math.max(0.2, totalMeters / legCount / 1000);
  return ['起点', ...Array.from({ length: legCount }, () => `距上一站约${avgKm.toFixed(1)}km · 驾车约${avgMin}min`)];
}

function addMapRoutePins(stops) {
  const state = window.__MAP_ROUTE_VIEW;
  if (!state?.map || !state?.AMap) return;
  state.markers.forEach(marker => marker.setMap(null));
  state.markers = stops.map((spot, index) => new state.AMap.Marker({
    position: [Number(spot.lng), Number(spot.lat)],
    content: `<div class="map-route-pin">${index + 1}</div>`,
    anchor: 'center',
    offset: new state.AMap.Pixel(0, 0),
  }));
  state.map.add(state.markers);
}

function renderRealRoute(dayNumber) {
  const state = window.__MAP_ROUTE_VIEW;
  if (!state?.map || !state?.driving) return;
  const day = routeDayByNumber(state.routeData, dayNumber);
  const stops = mapRouteValidStops(day);
  if (state.driving?.clear) state.driving.clear();
  if (state.map?.clearMap) state.map.clearMap();
  state.markers = [];
  state.dayNumber = Number(dayNumber) || Number(day.day) || 1;
  setMapRouteError('');
  if (stops.length < 2) {
    addMapRoutePins(stops);
    if (stops[0]) state.map.panTo([Number(stops[0].lng), Number(stops[0].lat)]);
    setMapRouteError('当前路线缺少可用于驾车算路的经纬度，已保留时间轴供查看。');
    return;
  }
  addMapRoutePins(stops);
  const origin = [Number(stops[0].lng), Number(stops[0].lat)];
  const destination = [Number(stops[stops.length - 1].lng), Number(stops[stops.length - 1].lat)];
  const waypoints = stops.slice(1, -1).map(spot => [Number(spot.lng), Number(spot.lat)]);
  state.driving.search(origin, destination, { waypoints }, function(status, result) {
    const loading = document.getElementById('map-route-loading');
    if (loading) loading.style.display = 'none';
    if (status === 'complete') {
      state.trafficByDay[state.dayNumber] = routeResultLegMetrics(result, stops);
      renderMapRouteTimeline();
      requestAnimationFrame(() => state.map.setFitView(state.markers, false, [58, 34, 44, 34]));
      return;
    }
    state.trafficByDay[state.dayNumber] = fallbackLegMetrics(stops);
    renderMapRouteTimeline();
    requestAnimationFrame(() => state.map.setFitView(state.markers, false, [58, 34, 44, 34]));
    setMapRouteError('高德路径规划暂时不可用，已使用景点经纬度连线视图兜底。');
  });
}

function setMapRouteDay(dayNumber) {
  const state = window.__MAP_ROUTE_VIEW;
  if (!state) return;
  state.dayNumber = Number(dayNumber) || 1;
  document.querySelectorAll('.map-route-day-tab').forEach(btn => {
    btn.classList.toggle('is-active', btn.textContent.trim() === `Day ${state.dayNumber}`);

  renderMapRouteTimeline();

}

function focusMapRouteSpot(index) {
  const state = window.__MAP_ROUTE_VIEW;
  if (!state?.map) return;
  const day = routeDayByNumber(state.routeData, state.dayNumber);
  const spot = (day.spots || [])[index];
  if (!spot || !Number.isFinite(Number(spot.lng)) || !Number.isFinite(Number(spot.lat))) return;
  state.map.panTo([Number(spot.lng), Number(spot.lat)]);
}

function moveMapRouteSpot(dayNumber, index, direction) {
  const state = window.__MAP_ROUTE_VIEW;
  if (!state) return;
  const day = routeDayByNumber(state.routeData, dayNumber);
  const next = index + direction;
  if (!day?.spots || next < 0 || next >= day.spots.length) return;
  state.movingIndex = index;
  renderMapRouteTimeline();
  setTimeout(() => {
    const temp = day.spots[index];
    day.spots[index] = day.spots[next];
    day.spots[next] = temp;
    state.movingIndex = next;
    state.trafficByDay[dayNumber] = null;
    if (window.__INSTANT_ROUTE_STATE?.[state.planId]) {
      window.__INSTANT_ROUTE_STATE[state.planId].data = cloneRouteData(state.routeData);
    }
    renderMapRouteTimeline();
    renderRealRoute(dayNumber);
    setTimeout(() => {
      state.movingIndex = null;
      renderMapRouteTimeline();
    }, 220);
  }, 200);
}

function closeMapRouteView() {
  const state = window.__MAP_ROUTE_VIEW;
  if (state?.driving?.clear) state.driving.clear();
  if (state?.map?.destroy) state.map.destroy();
  document.getElementById('map-route-view')?.remove();

function inlineRouteProjectedStops(stops) {
  const valid = stops
    .map((spot, index) => {
      const coord = spotLngLat(spot);
      return coord ? { spot, index, lng: coord[0], lat: coord[1] } : null;
    })
    .filter(Boolean);
  if (!valid.length) return { points: [], missing: stops.length };
  const viewport = inlineRouteMapViewport(valid);
  const centerPx = inlineMercatorProject(viewport.center[0], viewport.center[1], viewport.zoom);
  const points = valid.map(item => {
    const px = inlineMercatorProject(item.lng, item.lat, viewport.zoom);
    const x = ((px.x - centerPx.x) + viewport.width / 2) / viewport.width * 100;
    const y = ((px.y - centerPx.y) + viewport.height / 2) / viewport.height * 100;
    return {
      ...item,
      x: inlineMapClamp(x, 3.5, 96.5),
      y: inlineMapClamp(y, 4.5, 95.5),
      viewport,
    };
  });
  return { points, missing: stops.length - points.length };
}

function inlineMapClamp(value, min, max) {
  return Math.max(min, Math.min(max, value));

function inlineMercatorProject(lng, lat, zoom) {
  const sin = Math.sin((Math.max(-85.05112878, Math.min(85.05112878, Number(lat))) * Math.PI) / 180);
  const scale = 256 * Math.pow(2, zoom);
  return {
    x: ((Number(lng) + 180) / 360) * scale,
    y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * scale,
  };
}

function inlineMercatorUnproject(x, y, zoom) {
  const scale = 256 * Math.pow(2, zoom);
  const lng = (x / scale) * 360 - 180;
  const n = Math.PI - (2 * Math.PI * y) / scale;
  const lat = (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  return [lng, lat];
}

function inlineRouteMapViewport(valid) {
  const width = 750;
  const height = 430;
  const padding = 86;
  let chosenZoom = 13;
  let chosenBounds = null;
  for (let zoom = 17; zoom >= 4; zoom--) {
    const projected = valid.map(item => inlineMercatorProject(item.lng, item.lat, zoom));
    const minX = Math.min(...projected.map(item => item.x));
    const maxX = Math.max(...projected.map(item => item.x));
    const minY = Math.min(...projected.map(item => item.y));
    const maxY = Math.max(...projected.map(item => item.y));
    const fits = (maxX - minX) <= width - padding * 2 && (maxY - minY) <= height - padding * 2;
    if (fits || zoom === 4) {
      chosenZoom = zoom;
      chosenBounds = { minX, maxX, minY, maxY };
      break;
    }
  }
  const centerPx = {
    x: (chosenBounds.minX + chosenBounds.maxX) / 2,
    y: (chosenBounds.minY + chosenBounds.maxY) / 2,
  };
  const center = inlineMercatorUnproject(centerPx.x, centerPx.y, chosenZoom);
  return { width, height, zoom: chosenZoom, center };
}

function inlineRoundedPolylinePath(points, radius = 3.2) {
  if (!points.length) return '';
  if (points.length === 1) return `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
  const d = [`M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`];
  for (let i = 1; i < points.length - 1; i++) {
    const prev = points[i - 1];
    const current = points[i];
    const next = points[i + 1];
    const v1 = { x: current.x - prev.x, y: current.y - prev.y };
    const v2 = { x: next.x - current.x, y: next.y - current.y };
    const len1 = Math.max(0.01, Math.hypot(v1.x, v1.y));
    const len2 = Math.max(0.01, Math.hypot(v2.x, v2.y));
    const r = Math.min(radius, len1 / 2, len2 / 2);
    const before = { x: current.x - (v1.x / len1) * r, y: current.y - (v1.y / len1) * r };
    const after = { x: current.x + (v2.x / len2) * r, y: current.y + (v2.y / len2) * r };
    d.push(`L ${before.x.toFixed(2)} ${before.y.toFixed(2)}`);
    d.push(`Q ${current.x.toFixed(2)} ${current.y.toFixed(2)} ${after.x.toFixed(2)} ${after.y.toFixed(2)}`);
  }
  const last = points[points.length - 1];
  d.push(`L ${last.x.toFixed(2)} ${last.y.toFixed(2)}`);
  return d.join(' ');
}

function inlinePolylinePointAt(points, ratio = 0.5) {
  if (!points.length) return { x: 50, y: 50 };
  if (points.length === 1) return points[0];
  const lengths = points.slice(0, -1).map((point, index) => {
    const next = points[index + 1];
    return Math.hypot(next.x - point.x, next.y - point.y);
  });
  const total = lengths.reduce((sum, len) => sum + len, 0) || 1;
  let target = total * ratio;
  for (let i = 0; i < lengths.length; i++) {
    if (target <= lengths[i]) {
      const t = lengths[i] ? target / lengths[i] : 0;
      return {
        x: points[i].x + (points[i + 1].x - points[i].x) * t,
        y: points[i].y + (points[i + 1].y - points[i].y) * t,
      };
    }
    target -= lengths[i];
  }
  return points[points.length - 1];
}

function inlineRouteMarkerLayouts(points) {

  const baseOffsets = [
    [9, -6], [-9, 6], [9, 7], [-9, -7],
    [0, 10], [0, -10], [13, 0], [-13, 0],
    [15, 9], [-15, 9], [15, -9], [-15, -9],
  ];
  return points.map((point, index) => {
    const name = String(point.spot?.name || `第${index + 1}站`);
    const labelW = inlineMapClamp(11 + Math.min(7, Array.from(name).length) * 1.25, 14, 24);
    const labelH = 4.6;
    const offsetIndex = index % baseOffsets.length;
    const orderedOffsets = [...baseOffsets.slice(offsetIndex), ...baseOffsets.slice(0, offsetIndex)];
    let chosen = null;
    for (const [dx, dy] of orderedOffsets) {
      const x = inlineMapClamp(point.x + dx, 2 + labelW / 2, 98 - labelW / 2);
      const y = inlineMapClamp(point.y + dy, 7, 91);
      const box = {
        left: x - labelW / 2 - 1.2,
        right: x + labelW / 2 + 1.2,
        top: y - labelH / 2 - 1,
        bottom: y + labelH / 2 + 5.6,
      };
      const overlaps = boxes.some(item =>
        !(box.right < item.left || box.left > item.right || box.bottom < item.top || box.top > item.bottom)
      );
      if (!overlaps) {
        chosen = { x, y, dx, dy, box };
        break;
      }
    }
    if (!chosen) {
      const dx = index % 2 ? -13 : 13;
      const dy = 12 + index * 3.5;
      const x = inlineMapClamp(point.x + dx, 2 + labelW / 2, 98 - labelW / 2);
      const y = inlineMapClamp(point.y + dy, 8, 92);
      chosen = {
        x,
        y,
        dx,
        dy,
        box: {
          left: x - labelW / 2 - 1.2,
          right: x + labelW / 2 + 1.2,
          top: y - labelH / 2 - 1,
          bottom: y + labelH / 2 + 5.6,
        },
      };
    }
    boxes.push(chosen.box);
    const iconY = chosen.dy >= 0
      ? inlineMapClamp(chosen.y + 5.8, 10, 94)
      : inlineMapClamp(chosen.y - 5.8, 6, 90);
    return {
      point,
      name,
      colorClass: index === 0
        ? 'is-anchor is-green'
        : index % 3 === 1
          ? 'is-brown'
          : index % 3 === 2
            ? 'is-navy'
            : 'is-green',
      label: { x: chosen.x, y: chosen.y, width: labelW },
      icon: { x: chosen.x, y: iconY },
    };
  });
}

function inlineRoutePosterHTML(plan, route, dayNumber, options = {}) {
  const day = routeDayByNumber(route, dayNumber);
  const city = routeCityLabel(plan, route);
  const routeKey = inlineRoutePosterKey(plan, options.routeKey);
  const activeDay = Number(dayNumber) || 1;
  const stops = posterStopsForDay(day).map((spot, index) => {
    const candidate = findRouteSpotCandidate(spot, plan);
    return {
      ...spot,
      img_url: routeSpotPhotoUrl(spot, plan, candidate),
      lng: spot.lng ?? lngLatFromSpot(candidate)?.[0],
      lat: spot.lat ?? lngLatFromSpot(candidate)?.[1],
      location: spot.location || candidate?.location,
    };
  });
  const projected = inlineRouteProjectedStops(stops);
  const routePoints = projected.points;
  const points = inlineRoutePosterPoints(routePoints);
  const dayTabs = inlineRouteDaysHTML(route, activeDay, routeKey);
  const empty = !points.length
    ? `<div class="cartoon-inline-empty">这些景点缺少可用经纬度，暂时不能生成真实连线。</div>`
    : points.length < 2
      ? `<div class="cartoon-inline-empty is-single">已标出已选地点，添加更多地点后可生成路线连线。</div>`
      : '';
  const note = projected.missing
    ? `已按真实坐标标出 ${points.length} 个可定位景点`
    : `按真实经纬度标出 ${points.length} 个景点`;
  const mapId = `cartoon-leaflet-${Date.now().toString(36)}-${(window.__INLINE_LEAFLET_SEQ = (window.__INLINE_LEAFLET_SEQ || 0) + 1)}`;
  const isHomeRoute = plan?.id === 'home-current-route';
  const isPlannerRoute = Boolean(!isHomeRoute && plan?.id && window.__PLANS?.[plan.id]);
  const homeRouteAttrs = isHomeRoute
    ? ' role="button" tabindex="0" aria-label="查看地图" onclick="openHomeRouteMapSheet()" onkeydown="handleHomeMapKey(event)"'
    : '';
  const plannerRouteAttrs = isPlannerRoute
    ? ` role="button" tabindex="0" aria-label="查看${escapeHTML(city || '路线')}地图" onclick="event.stopPropagation();openInlinePlanRouteMapSheet('${homeJsString(plan.id)}', ${Number(dayNumber) || 1})" onkeydown="handleInlinePlanRouteMapKey(event, '${homeJsString(plan.id)}', ${Number(dayNumber) || 1})"`
    : '';
  window.__INLINE_LEAFLET_ROUTES[mapId] = points.map((point, index) => ({
    name: point.spot?.name || `第${index + 1}站`,
    lng: Number(point.lng),
    lat: Number(point.lat),
  })).filter(point => Number.isFinite(point.lng) && Number.isFinite(point.lat));
  window.__INLINE_ROUTE_POSTERS[routeKey] = {
    plan,
    routeData: route,
    dayNumber: activeDay,
    options:{ ...options, routeKey },
  };
  return `
    <div class="cartoon-inline-map has-leaflet ${isHomeRoute ? 'home-route-map' : ''} ${isPlannerRoute ? 'plan-route-map' : ''}" data-inline-route-key="${escapeHTML(routeKey)}" data-inline-route-day="${activeDay}"${homeRouteAttrs || plannerRouteAttrs}>
      <div id="${escapeHTML(mapId)}" class="cartoon-leaflet-map" aria-label="${escapeHTML(city || '路线')}真实地点地图"></div>
      ${empty}
      ${dayTabs ? `<div class="cartoon-inline-foot"><div class="cartoon-inline-note">${escapeHTML(note)}</div><div class="cartoon-inline-days">${dayTabs}</div></div>` : ''}
    </div>`;
}

function setInlineRouteDay(routeKey, dayNumber) {
  const key = String(routeKey || '');
  const state = window.__INLINE_ROUTE_POSTERS?.[key];
  if (!state?.routeData) return;
  const nextDay = Number(dayNumber) || 1;
  state.dayNumber = nextDay;
  const current = [...document.querySelectorAll('.cartoon-inline-map[data-inline-route-key]')]
    .find(el => el.dataset.inlineRouteKey === key);
  if (!current) return;
  current.querySelectorAll('.cartoon-leaflet-map').forEach(mapEl => {
    if (mapEl.__leafletResizeObserver?.disconnect) mapEl.__leafletResizeObserver.disconnect();
    if (mapEl.__leafletMap?.remove) mapEl.__leafletMap.remove();
  });
  const wrap = document.createElement('div');
  wrap.innerHTML = inlineRoutePosterHTML(state.plan, state.routeData, nextDay, state.options || { routeKey:key }).trim();
  const next = wrap.firstElementChild;
  if (!next) return;
  current.replaceWith(next);
  requestAnimationFrame(() => initInlineLeafletRouteMap(next));
}

function inlineLeafletMarkerLayouts(points = []) {
  const offsetPattern = [
    [0, 0],
    [18, -15],
    [-18, -15],
    [20, 14],
    [-20, 14],
    [0, 24],
  ];
  const clusters = [];
  return points.map(point => {
    const lng = Number(point.lng);
    const lat = Number(point.lat);
    let cluster = clusters.find(item =>
      Number.isFinite(lng) && Number.isFinite(lat) &&
      distanceKmLngLat([lng, lat], [item.lng, item.lat]) < 1.2
    );
    if (!cluster) {
      cluster = { lng, lat, count:0 };
      clusters.push(cluster);
    }
    const offset = offsetPattern[cluster.count % offsetPattern.length];
    cluster.count += 1;
    return { dx:offset[0], dy:offset[1] };
  });
}

function initInlineLeafletRouteMap(root = document) {
  const scope = root || document;
  const maps = scope.querySelectorAll?.('.cartoon-leaflet-map') || [];
  maps.forEach(el => {
    if (el.dataset.ready === '1') return;
    const points = (window.__INLINE_LEAFLET_ROUTES && window.__INLINE_LEAFLET_ROUTES[el.id]) || [];
    if (!points.length) return;
    if (!window.L) {
      el.insertAdjacentHTML('afterend', '<div class="cartoon-inline-empty">真实地图组件暂时未加载，请稍后重试。</div>');
      return;
    }
    el.dataset.ready = '1';
    const latLngs = points
      .map(point => [Number(point.lat), Number(point.lng)])
      .filter(([lat, lng]) => Number.isFinite(lat) && Number.isFinite(lng));
    if (!latLngs.length) return;
    const interactiveMap = Boolean(el.closest('.home-map-sheet-body'));
    const map = L.map(el, {
      zoomControl:interactiveMap,
      attributionControl:false,
      dragging:interactiveMap,
      scrollWheelZoom:interactiveMap,
      doubleClickZoom:interactiveMap,
      boxZoom:interactiveMap,
      keyboard:interactiveMap,
      tap:interactiveMap,
    });
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
      subdomains:['1', '2', '3', '4'],
      maxZoom:19,
    }).addTo(map);
    if (latLngs.length > 1) {
      L.polyline(latLngs, {
        color:'#2F8F75',
        weight:4,
        opacity:0.78,
        dashArray:'7 8',
        lineCap:'round',
        lineJoin:'round',
      }).addTo(map);
    }
    const markerLayouts = inlineLeafletMarkerLayouts(points);
    points.forEach((point, index) => {
      const layout = markerLayouts[index] || { dx:0, dy:0 };
      const icon = L.divIcon({
        className:'cartoon-leaflet-div-icon',
        html:`
          <div class="cartoon-leaflet-marker-wrap ${index === 0 ? 'is-start' : ''}" style="--marker-dx:${layout.dx}px;--marker-dy:${layout.dy}px">
            <div class="cartoon-leaflet-dot">${index + 1}</div>
            <div class="cartoon-leaflet-label">${escapeHTML(point.name || `第${index + 1}站`)}</div>
          </div>`,
        iconSize:[120, 34],
        iconAnchor:[13, 16],
      });
      L.marker([Number(point.lat), Number(point.lng)], {
        icon,
        interactive:false,
        keyboard:false,
        zIndexOffset:index * 20,
      }).addTo(map);
    });
    const fitMap = () => {
      if (!el.isConnected) return;
      map.invalidateSize(false);
      if (latLngs.length === 1) {
        map.setView(latLngs[0], 15, { animate:false });
      } else {
        map.fitBounds(L.latLngBounds(latLngs), {
          paddingTopLeft:[94, 72],
          paddingBottomRight:[112, 82],
          maxZoom:14,
          animate:false,
        });
      }
    };
    fitMap();
    requestAnimationFrame(fitMap);
    setTimeout(fitMap, 120);
    setTimeout(fitMap, 360);
    if (window.ResizeObserver) {
      const observer = new ResizeObserver(fitMap);
      observer.observe(el);
      el.__leafletResizeObserver = observer;
    }
    el.__leafletMap = map;
  });
}

function canvasRoundRectPath(ctx, x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + width - r, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + r);
  ctx.lineTo(x + width, y + height - r);
  ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
  ctx.lineTo(x + r, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function fillCanvasRoundRect(ctx, x, y, width, height, radius, fillStyle) {
  canvasRoundRectPath(ctx, x, y, width, height, radius);
  ctx.fillStyle = fillStyle;
  ctx.fill();
}

function strokeCanvasRoundRect(ctx, x, y, width, height, radius, strokeStyle, lineWidth = 1) {
  canvasRoundRectPath(ctx, x, y, width, height, radius);
  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth = lineWidth;
  ctx.stroke();
}

function truncateCanvasText(ctx, text, maxWidth) {
  const source = String(text || '');
  if (ctx.measureText(source).width <= maxWidth) return source;
  let out = source;
  while (out.length > 1 && ctx.measureText(`${out}…`).width > maxWidth) out = out.slice(0, -1);
  return `${out}…`;
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 2) {
  const chars = Array.from(String(text || ''));
  const lines = [];
  let line = '';
  chars.forEach(char => {
    const test = line + char;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = char;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  const finalLines = lines.slice(0, maxLines);
  if (lines.length > maxLines) {
    finalLines[maxLines - 1] = truncateCanvasText(ctx, finalLines[maxLines - 1], maxWidth - 12);
  }
  finalLines.forEach((item, index) => ctx.fillText(item, x, y + index * lineHeight));
}

function routeCoordOverrideForSpot(spot) {
  const key = normalizeSpotKey(spot?.name || spot?.poi_name || spot?.card_title || '');
  if (!key) return null;
  const hit = ROUTE_COORD_OVERRIDES.find(item =>
    item.keys.some(name => {
      const itemKey = normalizeSpotKey(name);
      return itemKey && (key === itemKey || key.includes(itemKey) || (key.length >= 3 && itemKey.includes(key)));
    })
  );
  return hit ? hit.coord : null;
}

function spotLngLat(spot) {
  return routeCoordOverrideForSpot(spot) || lngLatFromSpot(spot);
}

function posterSegmentDistance(stops, index) {
  const a = spotLngLat(stops[index]);
  const b = spotLngLat(stops[index + 1]);
  if (a && b) {
    const km = distanceKmLngLat(a, b);
    return `${km >= 10 ? km.toFixed(0) : km.toFixed(1)}km`;
  }
  const km = 2.8 + index * 2.7 + String(stops[index]?.name || '').length * 0.32;
  return `${km.toFixed(1)}km`;
}

function quadraticPoint(a, cp, b, t) {
  const mt = 1 - t;
  return [
    mt * mt * a[0] + 2 * mt * t * cp[0] + t * t * b[0],
    mt * mt * a[1] + 2 * mt * t * cp[1] + t * t * b[1],
  ];
}

function posterSegmentControl(a, b, index) {
  const dx = b[0] - a[0];
  const dy = b[1] - a[1];
  const len = Math.max(1, Math.hypot(dx, dy));
  const normal = [-dy / len, dx / len];
  const bend = Math.min(118, len * 0.24) * (index % 2 === 0 ? -1 : 1);
  return [(a[0] + b[0]) / 2 + normal[0] * bend, (a[1] + b[1]) / 2 + normal[1] * bend];
}

function drawInlineLandmarkIcons(root) {
  const canvases = (root || document).querySelectorAll('.cartoon-landmark-icon');
  canvases.forEach(canvas => {
    const ratio = Math.min(2, window.devicePixelRatio || 1);
    const compact = canvas.classList.contains('cartoon-map-floating-icon');
    const width = compact ? 40 : 66;
    const height = compact ? 34 : 56;
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, width, height);
    const spot = {
      name: canvas.dataset.name || '',
      category: canvas.dataset.category || '',
      sub_name: canvas.dataset.sub || '',
    };
    drawSpotIllustration(ctx, spot, width / 2, compact ? 15 : 24, compact ? 0.28 : 0.42);
  });
}

function drawPosterStop(ctx, stop, index, point, width, height) {
  const [x, y] = point;
  const markerColors = ['#2F7D45', '#A97821', '#8B4A1E', '#2D7890', '#8A6230', '#5D6B3C'];
  const color = markerColors[index % markerColors.length];
  const configs = [
    { lx: 0, ly: 78, align: 'center', ix: 0, iy: 172 },
    { lx: 166, ly: -10, align: 'left', ix: 218, iy: 88 },
    { lx: -154, ly: 88, align: 'center', ix: -110, iy: 174 },
    { lx: -166, ly: -74, align: 'center', ix: -112, iy: 12 },
    { lx: 132, ly: 82, align: 'center', ix: 118, iy: 172 },
    { lx: -108, ly: 82, align: 'center', ix: -98, iy: 172 },
  ];
  const cfg = configs[index] || configs[0];

  ctx.save();
  ctx.shadowColor = 'rgba(76,57,25,0.20)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 6;
  ctx.beginPath();
  ctx.arc(x, y, 35, 0, Math.PI * 2);
  ctx.fillStyle = '#FFFFFF';
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(x, y, 27, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '950 33px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(index + 1), x, y + 2);
  ctx.restore();

  ctx.save();
  ctx.font = '950 30px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
  const label = truncateCanvasText(ctx, stop.name || `第${index + 1}站`, 220);
  const w = Math.max(128, Math.min(280, ctx.measureText(label).width + 42));
  let labelX = x + cfg.lx;
  if (cfg.align === 'center') labelX -= w / 2;
  if (cfg.align === 'right') labelX -= w;
  labelX = Math.max(36, Math.min(width - w - 36, labelX));
  const labelY = Math.max(250, Math.min(height - 280, y + cfg.ly));
  fillCanvasRoundRect(ctx, labelX, labelY, w, 58, 29, 'rgba(255,255,246,0.90)');
  strokeCanvasRoundRect(ctx, labelX, labelY, w, 58, 29, color, 3);
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(label, labelX + 21, labelY + 39);
  const iconX = Math.max(74, Math.min(width - 74, x + cfg.ix));
  const iconY = Math.max(322, Math.min(height - 126, y + cfg.iy));
  drawSpotIllustration(ctx, stop, iconX, iconY, 0.86);
  ctx.restore();
}

function drawCartoonRoutePoster() {
  const state = window.__CARTOON_ROUTE_VIEW;
  const canvas = document.getElementById('cartoon-route-canvas');
  if (!state || !canvas) return;
  const ratio = Math.min(2, window.devicePixelRatio || 1);
  const width = 1080;
  const height = 1440;
  canvas.width = width * ratio;
  canvas.height = height * ratio;
  canvas.style.aspectRatio = `${width}/${height}`;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const { plan, routeData, dayNumber } = state;
  const day = routeDayByNumber(routeData, dayNumber);
  const stops = posterStopsForDay(day);
  const city = routeCityLabel(plan, routeData);
  const title = routeData.title || planDisplayTitle(plan);

  drawPosterMapBase(ctx, city, width, height);

  ctx.save();
  ctx.fillStyle = '#6FA66D';
  ctx.font = 'italic 950 80px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
  ctx.textBaseline = 'alphabetic';
  wrapCanvasText(ctx, posterThemeTitle({ title }, city), 58, 118, 790, 88, 2);
  ctx.font = '850 26px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
  ctx.fillStyle = 'rgba(99,122,77,0.78)';
  ctx.fillText(`${city} Day ${Number(day.day) || 1} · ${stops.length || 0} 个地点`, 64, 250);
  fillCanvasRoundRect(ctx, width - 260, 62, 198, 50, 25, 'rgba(255,255,246,0.82)');
  ctx.fillStyle = '#5F8E5C';
  ctx.font = '900 24px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
  ctx.fillText(`${routeData.match_rate || '智能'}匹配`, width - 226, 96);
  ctx.restore();

  const routePoints = posterRoutePoints(Math.max(1, stops.length), width, height).slice(0, stops.length);
  drawPosterRoute(ctx, stops, routePoints);
  stops.forEach((spot, index) => drawPosterStop(ctx, spot, index, routePoints[index], width, height));

  if (!stops.length) {
    ctx.save();
    fillCanvasRoundRect(ctx, 210, 620, 660, 130, 38, 'rgba(255,255,246,0.9)');
    ctx.fillStyle = '#6A7A56';
    ctx.font = '900 34px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无可绘制路线', width / 2, 696);
    ctx.restore();
  }

  ctx.save();
  fillCanvasRoundRect(ctx, 64, height - 126, 388, 54, 27, 'rgba(255,255,246,0.74)');
  ctx.fillStyle = '#6A7A56';
  ctx.font = '850 23px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
  ctx.fillText('点击保存，生成可分享路线图', 94, height - 91);
  ctx.restore();
}

function hotelPriceFromDesc(desc) {
  const m = String(desc || '').match(/约(\d+(?:\.\d+)?)元\/晚|(\d+(?:\.\d+)?)元\/晚|约(\d+(?:\.\d+)?)元|(\d+(?:\.\d+)?)元/);
  return m ? Math.round(parseFloat(m[1] || m[2] || m[3] || m[4])) : null;
}

function pickHotelSource(city, budget = null) {
  const hotels = HOTEL_DB[city] || [];
  if (hotels.length) {
    if (budget) {
      return hotels
        .map(h => ({ h, price: hotelPriceFromDesc(h.desc) || budget }))
        .sort((a, b) => Math.abs(a.price - budget) - Math.abs(b.price - budget))[0].h;
    }
    return hotels.find(h => /经济|舒适|精品|全季|汉庭|如家/.test(`${h.name}${h.desc}`)) || hotels[0];
  }
  const brand = GENERIC_HOTELS[0];
  return { name:`${brand.name}·${city}${HOTEL_LANDMARKS[city] || '市中心'}店`, desc:`${brand.tier}·近${HOTEL_LANDMARKS[city] || '市中心'}`, icon:brand.icon };

function inferStayArea(city, places = []) {
  const defaults = { area:`${city}${HOTEL_LANDMARKS[city] || '市中心'}`, landmark:HOTEL_LANDMARKS[city] || '市中心', district:'市中心' };
  const rules = HOTEL_STAY_AREAS[city] || [];
  if (!rules.length) return defaults;
  const names = (places || []).map(p => `${p.name || ''}${p.desc || ''}${p.tag || ''}`).join(' ');
  const scored = rules
    .map(rule => ({ ...rule, score:(names.match(rule.re) || []).length }))
    .sort((a, b) => b.score - a.score);
  const hit = scored[0];
  return hit && hit.score > 0 ? hit : { ...rules[0], score:0 };
}

const HOTEL_CN_NAME_MAP = [
  { re:/Iseya.*Jiefangbei.*Raffles|Panoramic Hotel.*Jiefangbei/i, name:'重庆解放碑来福士广场全景酒店' },
  { re:/Glenview|Chongqing Jiefangbei/i, name:'重庆解放碑格兰维酒店' },
  { re:/Hongyadong|Hongya Cave/i, name:'重庆洪崖洞江景酒店' },
];

function localizedHotelName(source, city, stay, budget = null) {
  const raw = String(source?.name || '').replace(/^\d+\.\s*/, '').trim();
  if (/[\u4e00-\u9fff]/.test(raw)) return raw.includes('·') ? raw : `${raw}·${city}${stay.landmark}店`;
  const mapped = HOTEL_CN_NAME_MAP.find(item => item.re.test(raw));
  if (mapped) return mapped.name;
  const brands = budget && budget <= 260
    ? ['汉庭酒店', '如家酒店', '锦江之星']
    : ['全季酒店', '亚朵酒店', '维也纳酒店'];
  const brand = brands[stableHash(`${city}${stay.area}${raw}`) % brands.length];
  return `${brand}·${city}${stay.landmark}店`;
}

function hotelTierLabel(source, apiHotel, budget = null) {
  if (budget && budget <= 260) return '经济型';
  const text = `${source?.name || ''}${source?.desc || ''}`;
  if (/五星|高档|豪华|亚朵|格兰维|全景/.test(text)) return '高档型';
  if (/经济|汉庭|如家|锦江/.test(text)) return '经济型';
  return apiHotel ? '行程优选' : '舒适型';
}

window.__POI_NEARBY = {};

function nearbyCandidatePool(place) {
  const city = place.city || destCity || '';
  const base = [
    ...(CITY_DB[city]?.nodes || []),
    ...(CITY_DB[city]?.nearby || []),
    ...(MICRO_POI_DB[city] || []),
  ];
  const seen = new Set();
  return base
    .filter(isAttraction)
    .filter(p => {
      const name = p.name || '';
      if (!name || name === place.name || name === place.fullName) return false;
      if (seen.has(name)) return false;
      seen.add(name);
      return true;
    })
    .map((p, i) => {
      const dist = Array.isArray(place.coords) && Array.isArray(p.coords)
        ? haversine(place.coords, p.coords)
        : 999 + i;
      return { ...p, cityName: city, city, dist };
    })
    .sort((a, b) => a.dist - b.dist);
}

function renderNearbyContent(place) {
  const city = place.city || destCity || '';
  const items = nearbyCandidatePool(place).slice(0, 5);
  if (!items.length) {
    return `<div class="poi-nearby-panel"><div class="poi-nearby-summary">暂未找到 ${escapeHTML(place.name)} 附近可展示的游玩地点。</div></div>`;
  }
  return `
    <div class="poi-nearby-panel">
      <div class="poi-nearby-summary">根据 ${escapeHTML(place.name)} 的位置，优先展示附近可顺路游玩的地点。</div>
      ${items.map((p, i) => {
        const key = `nearby_${stableHash(`${place.name || ''}_${p.name || ''}_${i}`)}`;
        window.__POI_NEARBY[key] = p;
        const distance = p.dist < 1 ? `${Math.round(p.dist * 1000)}m` : `${p.dist.toFixed(1)}km`;
        return `
          <div class="poi-nearby-card" onclick="openNearbySuggestion('${key}')">
            <div class="poi-nearby-icon" style="background:${p.color || '#7B61FF'}">${p.icon || '📍'}</div>
            <div class="poi-nearby-main">
              <div class="poi-nearby-name">${escapeHTML(p.name)}</div>
              <div class="poi-nearby-desc">${escapeHTML(p.desc || `${city}附近游玩地点`)}</div>
            </div>
            <div class="poi-nearby-meta">${distance}</div>
          </div>`;
      }).join('')}
    </div>`;
}

async function switchPoiProductTab(which) {
  const place = currentNode;
  if (!place) return;
  document.querySelectorAll('#poi-product .poi-subtab').forEach(tab =>
    tab.classList.toggle('active', tab.dataset.tab === which));
  const body = document.getElementById('poi-product-body');
  if (!body) return;
  const shouldFetchReviews = which === 'reviews' && (
    !place.tripadvisor_reviews ||
    (!place.tripadvisor_reviews.reviews?.length && knownTripAdvisorContent(place))
  );
  if (shouldFetchReviews) {
    body.innerHTML = renderReviewCards(place);
    const data = await fetchTripAdvisorReviews(place, 8);
    if (currentNode === place) {
      place.tripadvisor_reviews = data || { reviews: [], media: [], summary: null };
      body.innerHTML = renderReviewCards(place);
    }
    body.scrollIntoView({ block: 'nearest' });
    return;
  }
  body.innerHTML = which === 'reviews'
    ? renderReviewCards(place)
    : which === 'nearby'
      ? renderNearbyContent(place)
      : renderBookingContent(place);
  body.scrollIntoView({ block: 'nearest' });
}

// MockAPI —— 统一数据层（预留真实接口）

const MockAPI = {
  // TODO: 接入航司/GDS 实时报价。入参 origin/dest 城市名，返回机票列表
  getFlights(origin, dest, people = 1) {
    const airlines = [
      { name:'国航 CA',  emoji:'✈️', base:680 },
      { name:'东航 MU',  emoji:'🛫', base:540 },
      { name:'南航 CZ',  emoji:'🛬', base:610 },
    ];
    return airlines.map((a, i) => {
      const seed = stableHash(`${origin}-${dest}-${a.name}`);
      const price = Math.round(a.base + (seed % 260));
      const dep = 7 + i*4;
      return {
        airline:a.name, emoji:a.emoji,
        route:`${origin} → ${dest}`,
        time:`${String(dep).padStart(2,'0')}:${i%2?'30':'05'} 起飞`,
        price, seats: 2 + (seed % 8),
        discount: i===1 ? '限时立减¥120' : '',
      };
    }).sort((x,y)=>x.price-y.price);
  },

  // TODO: 接入酒店供应链实时价格/库存。budgetLevel 影响档次
  getHotels(city, budgetLevel = 'mid') {
    const pool = (typeof HOTEL_DB !== 'undefined' && HOTEL_DB[city]) ? HOTEL_DB[city] : [
      { name:`${city}城市精选酒店`, icon:'🏨', desc:'近地铁·含早' },
      { name:`${city}经济连锁`,     icon:'🏩', desc:'高性价比' },
    ];
    const factor = budgetLevel === 'low' ? 0.7 : budgetLevel === 'high' ? 1.6 : 1;
    return pool.slice(0,3).map((h, i) => {
      const m = (h.desc||'').match(/约([\d,]+)元/);
      const base = m ? parseInt(m[1].replace(',','')) : [220,480,900][i]||300;
      const seed = stableHash(`${city}-${h.name || i}-${budgetLevel}`);
      return {
        name:h.name, icon:h.icon||'🏨', desc:h.desc||'优选住宿',
        price: Math.round(base * factor),
        rating: (4.2 + (seed % 7) / 10).toFixed(1),
        rooms: 1 + (seed % 6),
      };
    }).sort((x,y)=>x.price-y.price);
  },

  // TODO: 接入出行平台目的地热度大数据。返回三大指数(0-100)
  getHeatIndex(city) {
    const seed = [...city].reduce((s,c)=>s+c.charCodeAt(0),0);
    const r = (off) => 30 + ((seed*7+off*13)%70);
    const fewer = r(1), cool = r(2), value = r(3);
    const lvl = v => v>=70?'高':v>=45?'中':'低';
    return {
      crowd:   { val: 100-fewer, label:'客流热度', emoji:'🔥', tip:lvl(100-fewer) },
      fewer:   { val: fewer,     label:'人少指数', emoji:'🧘', tip:lvl(fewer) },
      cool:    { val: cool,      label:'清凉指数', emoji:'❄️', tip:lvl(cool) },
      value:   { val: value,     label:'性价比',   emoji:'💎', tip:lvl(value) },
    };
  },

};

function homeActiveRoutePlan() {
  const id = window.__HOME_ACTIVE_PLAN_ID;
  if (id && window.__PLANS?.[id]) return window.__PLANS[id];
  const latestRoute = routeData || window.__ROUTE_DATA;
  if (!latestRoute?.itinerary?.length) return null;
  const city = normalizeHomeCityName(
    itineraryRouteCity(latestRoute, currentPlan)
    || currentPlan?.city
    || lastPlannedCity
    || homeSelectedCity
    || HOME_DEFAULT_CITY
  );
  const normalizedRoute = normalizeAIItineraryData(latestRoute, {
    city,
    themeTitle: '我的旅行规划',
    startDate: latestRoute.start_date || latestRoute.startDate || currentPlan?.startDate || dateOnlyISO(),
  });
  return {
    id: 'home-latest-route',
    city,
    days: Math.max(1, Number(normalizedRoute.days || normalizedRoute.day_count || latestRoute.days || latestRoute.day_count || currentPlan?.days || normalizedRoute.itinerary.length || 1)),
    themeTitle: '我的旅行规划',
    startDate: normalizedRoute.start_date || currentPlan?.startDate || dateOnlyISO(),
    travelDate: normalizedRoute.start_date || currentPlan?.startDate || dateOnlyISO(),
    routeData: normalizedRoute,
    nodes: flattenInstantItinerary(normalizedRoute),
  };
}

function homeActiveRouteData() {
  const plan = homeActiveRoutePlan();
  if (!plan?.routeData) return null;
  return enrichRouteForMap(plan);
}

function homeHasItinerary() {
  const activeRoute = homeActiveRouteData();
  const activeRouteStops = activeRoute ? flattenInstantItinerary(activeRoute) : [];
  return Boolean(activeRouteStops.length || (
    currentPlan?.type
    && Array.isArray(NODES)
    && NODES.some(node => node?.type !== 'summary' && Array.isArray(node?.coords))
  ));
}

function homeTripNodes() {
  const activeRoute = homeActiveRouteData();
  if (activeRoute) {
    return flattenInstantItinerary(activeRoute).slice(0, 6);
  }
  if (!homeHasItinerary()) return [];
  return NODES
    .filter(node => node?.type !== 'summary' && Array.isArray(node?.coords))
    .slice(0, 6);
}

function homeTripCity() {
  const plan = homeActiveRoutePlan();

    itineraryRouteCity(plan?.routeData || routeData || window.__ROUTE_DATA, plan || currentPlan)

  );
}

function homeScenicCover(city = homeSelectedCity) {

function homeTripDayCount() {
  const plan = homeActiveRoutePlan();
  const activeRoute = homeActiveRouteData();
  if (activeRoute?.itinerary?.length) {
    const routeDayNumbers = (activeRoute.itinerary || [])
      .map((day, index) => Number(day.day) || index + 1)
      .filter(Number.isFinite);
    const declaredDays = [
      activeRoute.days,
      activeRoute.day_count,
      activeRoute.dayCount,
      plan?.days,
      currentPlan?.days,
    ].map(Number).filter(value => Number.isFinite(value) && value > 0);
    return Math.max(1, activeRoute.itinerary.length, ...routeDayNumbers, ...declaredDays);
  }
  if (currentPlan?.type && Array.isArray(NODES)) {
    const days = new Set(
      NODES
        .filter(node => node?.type !== 'summary')
        .map(node => Number(node.day || node.dayIndex || 1))
        .filter(Boolean)
    );
    return Math.max(1, Number(currentPlan?.days) || 0, days.size || 1);
  }
  return 1;
}

function homePlannedStartDateISO() {
  const plan = homeActiveRoutePlan();

    || currentPlan?.travelDate
    || dateOnlyISO();
}

function homeHeroDateRange(dayCountOverride = null) {
  const override = Number(dayCountOverride);
  const dayCount = Number.isFinite(override) && override > 0 ? override : homeTripDayCount();
  const startISO = homePlannedStartDateISO();
  const start = shortDateFromISO(startISO);
  const endOffset = Math.max(1, dayCount);
  const end = shortDateFromISO(addDaysToISO(startISO, Math.max(0, endOffset)));
  return `${start} - ${end}`;
}

function homeHeroCardDateRange(day, index = 0) {

}

function homeHeroCoverScore(spot, city) {
  const text = `${spot?.name || ''}${spot?.tag || ''}${spot?.category || ''}${spot?.desc || ''}${spot?.sub_name || ''}`;
  const image = spot?.img || spot?.img_url || spot?.image_url || spot?.photo_url || curatedPlaceImage(spot, city);
  let score = image && !isSyntheticImageUrl(image) && !isBadCoverUrl(image) ? 28 : 0;
  if (/公园|海|湾|湖|山|岛|塔|楼|城|墙|寺|庙|馆|宫|园|世界|夜景|灯光|古|街区|风景|景区|地标|自然|文化|艺术|博物|遗址/.test(text)) score += 32;
  if (/深圳/.test(city || '') && /海上世界|莲花山|深圳湾|欢乐港湾|世界之窗|大梅沙|梧桐山|当代艺术|城市规划/.test(text)) score += 34;
  if (/站|地铁|机场|车站|高铁|交通|公交|停车|酒店|住宿|商场|市场|电子|餐饮|美食|早餐|午餐|晚餐|小吃|食街|夜宵|过早|店|饭|面|粉|菜/.test(text)) score -= 38;
  if (/站/.test(spot?.name || '') && !/遗址|景区|公园|街|世界/.test(text)) score -= 44;
  return score;
}

function homeHeroCoverSpot(spots = [], city) {
  const pool = (spots || []).filter(spot => spot && spot.type !== 'drive' && spot.name);
  if (!pool.length) return null;
  return pool
    .map((spot, index) => ({ spot, score: homeHeroCoverScore(spot, city) - index * 0.5 }))
    .sort((a, b) => b.score - a.score)[0]?.spot || pool[0];
}

function homeHeroSpotImage(spot, city) {

function homeHeroRouteDays() {
  if (!homeHasItinerary()) return [];
  const route = homeActiveRouteData();
  const city = homeTripCity();
  const startISO = homePlannedStartDateISO();
  if (route?.itinerary?.length) {
    const days = route.itinerary.map((day, index) => {
      const dayNumber = routeDayNumber(day, index);
      const spots = (day.spots || [])
        .filter(spot => spot && spot.type !== 'drive');
      return {
        dayNumber,
        dateISO: addDaysToISO(startISO, Math.max(0, dayNumber - 1)),
        city,
        spots,
        coverSpot: homeHeroCoverSpot(spots, city),
      };
    }).filter(day => day.spots.length);
    if (days.length) {
      return days.sort((a, b) => a.dayNumber - b.dayNumber);
    }
  }
  const grouped = new Map();
  const nodes = (Array.isArray(NODES) ? NODES : [])
    .filter(node => node && node.type !== 'summary' && node.type !== 'drive');
  nodes.forEach(node => {
    const dayNumber = Math.max(1, Number(node.day || node.dayIndex || 1) || 1);
    if (!grouped.has(dayNumber)) grouped.set(dayNumber, []);
    grouped.get(dayNumber).push(node);
  });
  return Array.from(grouped.entries())
    .sort((a, b) => a[0] - b[0])
    .map(([dayNumber, spots]) => ({
      dayNumber,
      dateISO: addDaysToISO(startISO, Math.max(0, dayNumber - 1)),
      city,
      spots,
      coverSpot: homeHeroCoverSpot(spots, city),
    }));
}

async function resolveHomeCityHeroImage(city) {
  const key = normalizeHomeCityName(city || HOME_DEFAULT_CITY);
  if (HOME_CITY_HERO_CACHE[key]) return HOME_CITY_HERO_CACHE[key];
  const extra = HOME_CITY_EXTRAS[key];
  if (extra?.heroImage && !isSyntheticImageUrl(extra.heroImage) && !isBadCoverUrl(extra.heroImage)) {
    HOME_CITY_HERO_CACHE[key] = extra.heroImage;
    return extra.heroImage;
  }
  const terms = HOME_CITY_HERO_TERMS[key] || [`${key} 地标`];
  for (const term of terms) {
    const photos = await fetchSpotPhotos(term, 12);
    const hit = photos.find(url => url && !isBadCoverUrl(url));
    if (hit) {
      HOME_CITY_HERO_CACHE[key] = hit;
      return hit;
    }
  }
  return '';
}

function parsePlannerTripDays(text, city) {
  const value = String(text || '');
  const CN_NUM = {'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  const match = value.match(/([一两二三四五六七八九十\d]+)\s*[天日]/);
  if (match) {
    const raw = match[1];
    return Math.max(1, Math.min(12, CN_NUM[raw] || parseInt(raw, 10) || 1));
  }
  if (city === '新疆') return 8;
  if (/周末|短途|当天|一日|一天/.test(value)) return 1;
  return 1;
}

    card.classList.add('is-disabled');

function choosePlannerRouteOption(flowId, choiceId) {
  const flow = window.__PLANNER_FLOWS?.[flowId];
  if (!flow || flow.locked) return;
  const choice = flow.choices.find(item => item.id === choiceId);
  if (!choice) return;
  flow.locked = true;
  markPlannerChoiceSelected(flowId, choiceId);
  switchTab('planner');
  keepPlannerNavActive();
  addUserBubble(choice.title);
  const nextIntent = parseIntent(`${flow.rawText || ''} ${flow.city} ${choice.query || choice.title}`);
  nextIntent.routeVariant = choice.routeVariant || 'base';
  nextIntent.plannerChoice = choice.title;
  nextIntent.days = flow.days;
  setTimeout(() => createMorphRouteCard(flow.city, flow.days, nextIntent), 260);
}

function normalizeHomeCityName(city) {
  return String(city || '')
    .replace(/\s+/g, '')
    .replace(/^中国/, '')
    .replace(/市$/, '')
    .trim();
}

function homeCityDataKey(city = homeSelectedCity) {
  const name = normalizeHomeCityName(city);
  return HOME_CITY_DATA_ALIASES[name] || name;
}

function getHomeCityData(city = homeSelectedCity) {
  const name = normalizeHomeCityName(city);
  const key = homeCityDataKey(name);
  return HOME_CITY_EXTRAS[name] || HOME_CITY_EXTRAS[key] || CITY_DB[key] || { center: getHomeCityCenter(name), nodes: [], nearby: [] };
}

function getHomeCityCenter(city = homeSelectedCity) {
  const name = normalizeHomeCityName(city);
  const key = homeCityDataKey(name);
  return HOME_CITY_EXTRAS[name]?.center
    || HOME_CITY_EXTRAS[key]?.center
    || CITY_DB[key]?.center
    || HOME_CITY_CENTERS[name]
    || HOME_CITY_CENTERS[key]
    || HOME_CITY_EXTRAS[HOME_DEFAULT_CITY].center;
}

function homeRandomIndex(max) {
  if (!max) return 0;
  try {
    const values = new Uint32Array(1);
    crypto.getRandomValues(values);
    return values[0] % max;
  } catch (error) {
    return Math.floor(Math.random() * max);
  }
}

function pickHomeEmptyInspirationCity() {
  const pool = HOME_EMPTY_INSPIRATION_CITIES
    .filter(homeHasKnownCity)
    .filter((city, index, list) => city && list.indexOf(city) === index);
  if (!pool.length) return HOME_DEFAULT_CITY;
  const storageKey = 'ai_wanderer_empty_home_city';
  let index = homeRandomIndex(pool.length);
  try {
    const lastCity = localStorage.getItem(storageKey);
    if (pool.length > 1 && pool[index] === lastCity) {
      index = (index + 1 + homeRandomIndex(pool.length - 1)) % pool.length;
    }
    localStorage.setItem(storageKey, pool[index]);
  } catch (error) {
    // Ignore private mode/local file storage failures.
  }
  return pool[index];
}

function homeEmptyCity() {
  if (!homeEmptyInspirationCity) {
    homeEmptyInspirationCity = pickHomeEmptyInspirationCity();
  }
  return homeEmptyInspirationCity;
}

function homeEmptyRouteSet(city = homeSelectedCity) {

}

function homeHasKnownCity(city) {
  const name = normalizeHomeCityName(city);
  const key = homeCityDataKey(name);
  return Boolean(HOME_CITY_CENTERS[name] || HOME_CITY_CENTERS[key] || HOME_CITY_EXTRAS[name] || HOME_CITY_EXTRAS[key] || CITY_DB[key]);
}

function cleanHomeResolvedCityName(value) {
  return String(value || '')
    .replace(/^(中国|中华人民共和国)/, '')
    .replace(/(特别行政区|自治州|地区|盟|市|区|县)$/g, '')
    .replace(/\s+/g, '')
    .trim();
}

function homeKnownCityCenters() {
  const aliasDisplayByKey = Object.fromEntries(
    Object.entries(HOME_CITY_DATA_ALIASES).map(([display, key]) => [key, display])
  );
  const entries = [
    ...Object.entries(HOME_CITY_CENTERS),
    ...Object.entries(HOME_CITY_EXTRAS).map(([city, data]) => [city, data.center]),
    ...Object.entries(CITY_DB || {}).map(([city, data]) => [aliasDisplayByKey[city] || city, data.center]),
  ].filter(([, coords]) => Array.isArray(coords));
  const seen = new Set();
  return entries.filter(([city]) => {
    const name = normalizeHomeCityName(city);
    if (!name || seen.has(name)) return false;
    seen.add(name);
    return true;
  }).map(([city, coords]) => [normalizeHomeCityName(city), coords]);
}

function nearestHomeCityByCoords(coords) {
  const ranked = homeKnownCityCenters()
    .map(([city, center]) => ({ city, dist: haversine(coords, center) }))
    .sort((a, b) => a.dist - b.dist);
  const hit = ranked[0];
  return hit && hit.dist <= 160 ? hit.city : '';
}

async function reverseHomeCityByCoords(coords) {
  const key = coords.map(v => Number(v).toFixed(3)).join(',');
  if (HOME_REVERSE_GEOCODE_CACHE[key]) return HOME_REVERSE_GEOCODE_CACHE[key];
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 4500);
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=zh-CN&lat=${encodeURIComponent(coords[0])}&lon=${encodeURIComponent(coords[1])}`;
    const res = await fetch(url, { signal: ctrl.signal });
    const data = await res.json().catch(() => null);
    const address = data?.address || {};
    const localKnown = [address.district, address.county]
      .map(cleanHomeResolvedCityName)
      .find(homeHasKnownCity);
    const city = localKnown || cleanHomeResolvedCityName(address.city || address.town || address.municipality || address.county || address.district || address.state);
    if (city) HOME_REVERSE_GEOCODE_CACHE[key] = city;
    return city;
  } catch (error) {
    return '';
  } finally {
    clearTimeout(timer);
  }
}

async function updateHomeCityFromLiveCoords(coords) {
  const token = ++homeLocationCityResolveToken;
  const fallback = nearestHomeCityByCoords(coords);
  if (fallback && fallback !== homeLastResolvedLocationCity) {
    homeLastResolvedLocationCity = fallback;
    applyHomeCity(fallback, { closePicker: false, mapToCity: false });
  }
  const resolved = await reverseHomeCityByCoords(coords);
  if (token !== homeLocationCityResolveToken) return;
  const city = resolved || fallback;
  if (!city || city === homeLastResolvedLocationCity) return;
  homeLastResolvedLocationCity = city;
  applyHomeCity(city, { closePicker: false, mapToCity: false });
}

  return HOME_PROVINCIAL_CAPITALS

}

function homeSearchableCities() {
  const fromDb = Object.keys(CITY_DB || {}).map(city => city === '新疆' ? '乌鲁木齐' : city);
  return [
    ...HOME_PROVINCIAL_CAPITALS,
    HOME_DEFAULT_CITY,
    ...fromDb,
    ...Object.keys(HOME_CITY_CENTERS),
  ].filter((city, index, list) => city && list.indexOf(city) === index);
}

function homeCitySearchTokens(city) {
  const key = homeCityDataKey(city);
  const aliases = Object.entries(HOME_CITY_DATA_ALIASES)
    .filter(([, dataKey]) => dataKey === key)
    .map(([alias]) => alias);
  return [city, key, ...aliases, ...(CITY_KEYWORDS[city] || []), ...(CITY_KEYWORDS[key] || [])]
    .filter(Boolean)
    .join(' ');
}

function homeCityResults(query = '') {
  const q = normalizeHomeCityName(query);
  if (!q) return homeAvailableCities();
  const matches = homeSearchableCities()
    .filter(city => homeCitySearchTokens(city).includes(q))
    .slice(0, 12);
  if (q.length >= 2 && !matches.includes(q)) matches.unshift(q);
  return matches;
}

function homeAllCitySpots(city = homeSelectedCity) {
  const data = getHomeCityData(city);
  const key = homeCityDataKey(city);
  const cleanCity = normalizeHomeCityName(city);
  const micro = [
    ...((typeof MICRO_POI_DB !== 'undefined' && MICRO_POI_DB[city]) || []),
    ...((typeof MICRO_POI_DB !== 'undefined' && MICRO_POI_DB[key]) || []),
  ];
  const selectable = typeof getSelectableSpots === 'function' ? getSelectableSpots(cleanCity) : [];
  return uniqueHomeSpots([...(data?.nodes || []), ...(data?.nearby || []), ...micro, ...selectable]
    .filter(Boolean)
    .map(spot => ({ ...spot, city: cleanCity })));
}

function isHomeFoodSpot(spot) {
  const rawCategory = String(spot?.category || spot?.source_node?.category || '').trim();
  if (rawCategory === 'food' || normalizeSpotCategory(spot?.category, spot) === 'food') return true;
  const text = `${spot?.name || ''}${spot?.desc || ''}${spot?.tag || ''}${spot?.icon || ''}`;
  return /美食街|食街|好吃街|小吃街|餐饮区|夜市|早茶|茶餐厅|茶楼|酒楼|酒家|饭店|饭馆|餐厅|餐馆|菜馆|面馆|粉店|火锅|烧烤|烤肉|点心|夜宵|早餐|过早|抄手|泡馍|灌汤包|馒头店/.test(text);
}

function uniqueHomeSpots(spots) {
  const seen = new Set();
  return (spots || []).filter(spot => {
    const name = String(spot?.name || '').trim();
    const key = homeSpotUniqueKey(name);
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function homeSpotUniqueKey(name) {
  let key = String(name || '')
    .replace(/[·\s\-—_/]/g, '')
    .replace(/美食街|小吃街|步行街|风味馆|本地|老字号|热门|精选|当前城市/g, '')
    .trim();
  if (/永兴坊/.test(key)) return '永兴坊';
  if (/回民街/.test(key)) return '回民街';
  if (/华盖路/.test(key)) return '华盖路';
  if (/宽窄巷子/.test(key)) return '宽窄巷子';
  if (/户部巷/.test(key)) return '户部巷';
  if (/八卦一路/.test(key)) return '八卦一路';
  if (/老孙家/.test(key)) return '老孙家';
  if (/贾三/.test(key)) return '贾三';
  return key || String(name || '').trim();
}
