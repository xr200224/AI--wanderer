<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Wanderer · 智能旅行伴侣</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root {
  --brand-1:#7B61FF; --brand-2:#5B8DEF;          /* 通义 主グラデ */
  --brand-grad: linear-gradient(135deg,#7B61FF,#5B8DEF);
  --accent-warm:#FF7A3D;                          /* 出行平台 サブアクセント */
  --accent-warm-grad: linear-gradient(135deg,#FF8A3D,#FF6A2C);
  --ink:#1A1A1A; --ink-2:#4B5563; --ink-3:#9CA3AF;
  --bg:#FFFFFF; --surface:#fff; --line:#EEF0F4;
  --radius:18px; --radius-lg:22px;
  --shadow-soft:0 4px 20px rgba(80,70,160,0.08);
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; margin: 0; padding: 0; overflow: hidden;
  font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg);
}

/* ── 地图（内嵌在行程方案内，非全屏背景） ── */
#map-wrap {
  position: relative; width: 100%; height: 220px;
  border-radius: 16px; overflow: hidden; margin: 4px 0 14px;
  box-shadow: 0 2px 14px rgba(0,0,0,0.10); background: #e8eef3;
}
#map { position: absolute; inset: 0; z-index: 0; }
.leaflet-control-attribution { display: none !important; }
.leaflet-control-zoom { margin: 12px !important; }
.leaflet-control-zoom a {
  width: 36px !important; height: 36px !important; line-height: 36px !important;
  border-radius: 10px !important; border: none !important;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15) !important;
  background: rgba(255,255,255,0.95) !important;
  backdrop-filter: blur(8px) !important; color: #333 !important; font-size: 18px !important;
}

/* ── 顶部搜索栏 ── */
#topbar {
  display: none;
}
#search-bar {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.93); backdrop-filter: blur(16px);
  border-radius: 16px; padding: 10px 14px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.15); pointer-events: all;
}

/* ── 主界面容器（对话优先，全屏） ── */
#sheet {
  position: fixed; inset: 0; z-index: 30;
  background:
    radial-gradient(ellipse 70% 26% at 6% 105%, rgba(255, 216, 104, 0.28), rgba(255, 216, 104, 0.10) 34%, transparent 70%),
    radial-gradient(ellipse 74% 30% at 92% 106%, rgba(123, 97, 255, 0.18), rgba(123, 97, 255, 0.07) 38%, transparent 72%),
    radial-gradient(ellipse 54% 22% at 52% 112%, rgba(91, 141, 239, 0.10), transparent 70%),
    linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 74%, #FFFEFB 88%, #FBFAFF 100%);
  display: flex; flex-direction: column;
}
/* 顶部品牌条 */
#brand-bar {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: max(20px, env(safe-area-inset-top)) 22px 0;
  background: transparent; border-bottom: none;
}
.top-icon-btn {
  width: 34px; height: 34px; border: none; background: transparent; color: #111318;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; border-radius: 10px;
}
.top-icon-btn:active { background: rgba(17,24,39,0.06); transform: scale(0.96); }
.top-svg {
  display:block; overflow:visible;
  fill:none; stroke:#111318; stroke-linecap:round; stroke-linejoin:round;
}
.menu-svg { width:25px; height:25px; stroke-width:2.7; }
.new-chat-svg { width:27px; height:27px; stroke-width:2.45; transform: translate(1px, 0); }
/* 隐藏旧抽屉把手 */
#handle-zone { display: none; }
#handle-bar, #handle-label { display: none; }
#sheet-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* ── 视图切换 tab ── */
#view-tabs {
  display: none;
}
.view-tab {
  padding: 9px 16px; font-size: 13px; font-weight: 600;
  color: #9CA3AF; cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .18s; white-space: nowrap; user-select: none;
}
.view-tab.active { color: var(--brand-1); border-bottom-color: var(--brand-1); }

/* ── 聊天消息区 ── */
#chat-panel {
  flex: 1; overflow-y: auto; padding: 8px 28px 10px;
  -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px;
}
#chat-panel::-webkit-scrollbar { display: none; }

/* 用户气泡 */
.bubble-user {
  align-self: flex-end; max-width: 82%;
  background: #ECE9FF; color: #20222A;
  border-radius: 18px 18px 6px 18px;
  padding: 12px 16px; font-size: 15px; line-height: 1.5;
  box-shadow: 0 10px 26px rgba(123,97,255,0.12);
}
/* AI 气泡 */
.bubble-ai {
  align-self: flex-start; max-width: 92%;
  background: var(--surface); color: var(--ink);
  border-radius: 4px var(--radius) var(--radius) var(--radius);
  padding: 13px 15px; font-size: 13.5px; line-height: 1.65;
  box-shadow: var(--shadow-soft);
  border: 1px solid var(--line);
}
.bubble-ai-header {
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 9px; padding-bottom: 8px;
  border-bottom: 1px solid #F5F5F5;
}
.bubble-ai-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand-grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(123,97,255,0.28);
}
.bubble-ai-name { font-size: 12px; font-weight: 700; color: var(--brand-1); }
.home-hero {
  margin-top: clamp(34px, 8vh, 72px);
  padding: 0 0 18px;
}
.home-title {
  color:#252936; font-size: 25.5px; line-height: 1.34; font-weight: 760;
  letter-spacing: 0; margin-bottom: 22px;
}
.home-actions { display:flex; flex-direction:column; align-items:flex-start; gap:13px; }
.home-action-pill {
  border: none; background: rgba(255,255,255,0.82); color:#20222A;
  border-radius: 20px; padding: 14px 24px; font-size: 17px; font-weight: 700;
  box-shadow: 0 14px 34px rgba(17,24,39,0.07); backdrop-filter: blur(18px);
  cursor:pointer; max-width:100%; text-align:left;
}
.home-action-pill:active { transform: scale(0.98); background:#fff; }
.home-spark { color:#7B4B43; margin-right:10px; font-size:14px; }
.bubble-ai.itinerary-answer {
  max-width: 94%;
  background: linear-gradient(150deg, #7B61FF 0%, #5B8DEF 100%);
  color: #fff;
  border: none;
  border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
  padding: 20px 24px;
  font-size: 15px;
  line-height: 1.55;
  box-shadow: 0 12px 30px rgba(91,141,239,0.28);
}
.bubble-ai.itinerary-answer .bubble-ai-header { display: none; }
.assistant-plain {
  align-self: stretch; color:#171923; font-size: 17px; line-height: 1.75;
  font-weight: 500; padding: 10px 4px 4px; letter-spacing: 0;
}
.itinerary-intro {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 22px;
}
.itinerary-day { margin-top: 24px; }
.itinerary-day:first-of-type { margin-top: 0; }
.itinerary-day-title {
  font-size: 16px;
  font-weight: 850;
  margin-bottom: 16px;
}
.itinerary-line {
  margin: 7px 0;
  font-size: 15px;
  font-weight: 780;
  color: rgba(255,255,255,0.96);
}
.itinerary-line .time {
  display: inline-block;
  min-width: 46px;
  font-variant-numeric: tabular-nums;
}
.itinerary-total {
  margin-top: 28px;
  font-size: 16px;
  font-weight: 850;
}
.itinerary-note {
  margin-top: 26px;
  font-size: 15px;
  font-weight: 760;
  color: rgba(255,255,255,0.94);
}
.itinerary-hotels {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.22);
}
.itinerary-hotels-title {
  font-size: 15px;
  font-weight: 850;
  margin-bottom: 10px;
}
.bubble-ai.itinerary-answer .ai-place-link {
  color: #E0F2FE;
  text-decoration-color: rgba(224,242,254,0.78);
}
.bubble-ai.itinerary-answer .ai-place-link:active { color: #fff; }
/* AI 气泡内的结构化段落 */
.ai-section { margin: 8px 0; }
.ai-section-title {
  font-size: 13px; font-weight: 700; color: #1A1A1A;
  margin-bottom: 5px; display: flex; align-items: center; gap: 5px;
}
.ai-item {
  font-size: 13px; color: #4B5563; padding: 3px 0 3px 14px;
  border-left: 2px solid #E5E7EB; margin: 3px 0; line-height: 1.5;
}
.ai-item b { color: #1A1A1A; }
.ai-place-link {
  color: var(--brand-1);
  font-weight: 800;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
  cursor: pointer;
}
.ai-place-link:active { color: #5B8DEF; }
.ai-highlight {
  display: inline-block; background: #F1EDFF; color: var(--brand-1);
  border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 600;
}
.ai-tag-ok   { background: #DCFCE7; color: #16A34A; }
.ai-tag-warn { background: #FEF2F2; color: #DC2626; }
/* 思考中动画 */
.bubble-thinking {
  display: flex; gap: 5px; align-items: center; padding: 4px 2px;
}
.bubble-thinking span {
  width: 7px; height: 7px; border-radius: 50%; background: #9CA3AF;
  animation: blink 1.2s infinite;
}
.bubble-thinking span:nth-child(2) { animation-delay: .2s; }
.bubble-thinking span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

/* ── 旅行方案：枠なしプレーン応答 + カードグリッド ── */
.plan-response { align-self: stretch; max-width: 100%; padding: 2px 2px 4px; }
.ai-thinking-line { display: flex; align-items: center; gap: 9px; padding: 8px 2px; font-size: 14px; color: #6B7280; font-weight: 500; }
.ai-think-spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #E4DBFF; border-top-color: var(--brand-1); animation: aiSpin .8s linear infinite; flex-shrink: 0; }
@keyframes aiSpin { to { transform: rotate(360deg); } }
.plan-intro {
  font-size: 16px; line-height: 1.7; color: var(--ink); font-weight: 500;
  margin: 2px 0 18px;
}
.plan-pick-title { font-size: 17px; font-weight: 800; color: var(--ink); margin: 0 0 14px; }
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.plan-card {
  position: relative; border-radius: 16px; overflow: hidden;
  aspect-ratio: 1 / 1; min-height: 0; cursor: pointer;
  background-size: cover; background-position: center; background-color: #d8dbe2;
  box-shadow: var(--shadow-soft);
  transition: transform .18s;
}
.plan-card:active { transform: scale(0.97); }
.plan-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.04) 38%, rgba(0,0,0,0.30) 100%);
}
.plan-card-body { position: relative; z-index: 1; padding: 11px 11px 0; }
.plan-card-title {
  font-size: 14.5px; font-weight: 850; line-height: 1.25; color: #fff;
  text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.plan-card-title .city { color: #FFD54A; }
.plan-card-cat {
  font-size: 11px; font-weight: 650; color: rgba(255,255,255,0.94);
  margin-top: 5px; text-shadow: 0 1px 5px rgba(0,0,0,0.4);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.plan-card-btn {
  position: absolute; z-index: 1; left: 11px; right: 11px; bottom: 10px;
  background: rgba(255,255,255,0.26); backdrop-filter: blur(6px);
  color: #fff; font-size: 12.5px; font-weight: 750; text-align: center;
  padding: 7px 10px; border-radius: 11px;
  border: 1px solid rgba(255,255,255,0.3);
}
.plan-card:active .plan-card-btn { background: rgba(255,255,255,0.38); }
@media (max-width: 380px) {
  .plan-grid { gap: 9px; }
  .plan-card { border-radius: 14px; }
  .plan-card-body { padding: 10px 10px 0; }
  .plan-card-title { font-size: 13.5px; line-height: 1.22; }
  .plan-card-cat { font-size: 10.5px; margin-top: 4px; }
  .plan-card-btn { left: 10px; right: 10px; bottom: 9px; font-size: 12px; padding: 6px 8px; border-radius: 10px; }
}

/* ── 图文混合推荐：飞猪式长文 + OTA卡 ── */
.mixed-poi-result {
  color: #191B23; font-size: 15px; line-height: 1.65; letter-spacing: 0;
  padding: 2px 0 18px;
}
.mixed-poi-section {
  margin: 0 0 16px; padding: 16px 14px 14px;
  background: rgba(255,255,255,0.72); border: 1px solid #EEF0F4;
  border-radius: 18px; box-shadow: 0 8px 24px rgba(17,24,39,0.05);
}
.mixed-poi-kicker {
  font-size: 20px; font-weight: 850; line-height: 1.3;
  margin: 0 0 12px; color: #171923;
  overflow-wrap: anywhere;
}
.mixed-poi-link {
  display: inline-flex; align-items: center; gap: 7px;
  color: #6970E8; font-size: 20px; font-weight: 850;
  margin: 0 0 12px; cursor: pointer; max-width: 100%;
  overflow-wrap: anywhere;
}
.mixed-poi-pin { color: #F05B4F; font-size: 18px; line-height: 1; flex-shrink:0; }
.mixed-poi-rank-line { font-size: 15px; color: #20222A; line-height: 1.55; margin-bottom: 12px; overflow-wrap:anywhere; }
.mixed-poi-bullets { margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.62; color: #20222A; }
.mixed-poi-bullets li { margin: 4px 0; padding-left: 0; }
.mixed-poi-bullets b { font-weight: 850; }
.mixed-poi-card {
  position: relative; display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 12px;
  align-items: stretch; min-height: 128px; margin-top: 14px;
  background: rgba(255,255,255,0.92); border: 1px solid rgba(239,240,244,0.92);
  border-radius: 16px; padding: 10px;
  box-shadow: 0 10px 26px rgba(17,24,39,0.07); cursor: pointer;
}
.mixed-poi-card:active { transform: scale(0.988); }
.mixed-poi-img-wrap { position: relative; width: 92px; height: 112px; align-self: center; }
.mixed-poi-img {
  width: 92px; height: 112px; border-radius: 12px; object-fit: cover;
  background: #EEF0F4; display: block;
}
.mixed-poi-main { min-width: 0; align-self: start; padding-top: 1px; padding-right: 2px; }
.mixed-poi-title {
  font-size: 17px; font-weight: 900; color: #151721; line-height: 1.25; margin-bottom: 7px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.mixed-poi-meta {
  font-size: 13px; color: #6B7280; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.mixed-poi-score { color: #6970E8; font-size: 14px; font-weight: 850; }
.mixed-poi-rank-card {
  font-size: 12.5px; color: #6B7280; line-height: 1.45; margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.mixed-poi-side {
  grid-column: 2; align-self: end; display: flex; align-items: flex-end; justify-content: space-between;
  gap: 8px; min-width: 0; margin-top: 8px;
}
.mixed-poi-price { color: #171923; font-size: 12px; white-space: nowrap; }
.mixed-poi-price b { font-size: 22px; font-weight: 950; letter-spacing: 0; }
.mixed-poi-discount { display:none; }
.mixed-poi-btn {
  border: none; background: #ECE8FF; color: #7271E8; font-size: 14px;
  font-weight: 850; padding: 8px 13px; border-radius: 12px; cursor: pointer; flex-shrink:0;
}
.mixed-poi-json { display: none; }
.discover-result { display:flex; flex-direction:column; gap:12px; padding: 2px 0 8px; }
.discover-head { padding: 4px 2px 2px; }
.discover-title { font-size: 20px; font-weight: 900; color:#171923; line-height:1.3; }
.discover-sub { margin-top:6px; font-size: 13px; line-height:1.55; color:#6B7280; }
.discover-card {
  display:grid; grid-template-columns: 112px minmax(0,1fr); gap:12px; align-items:stretch;
  background: rgba(255,255,255,0.9); border:1px solid rgba(229,231,235,0.9);
  border-radius:18px; padding:10px; box-shadow:0 14px 34px rgba(17,24,39,0.07);
}
.discover-img { width:112px; height:126px; object-fit:cover; border-radius:14px; background:#E9EEF5; display:block; }
.discover-main { min-width:0; display:flex; flex-direction:column; gap:6px; }
.discover-topline { display:flex; align-items:center; gap:7px; min-width:0; }
.discover-city { font-size:18px; font-weight:900; color:#171923; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.discover-badge { flex-shrink:0; background:#F0ECFF; color:#6B5CFF; font-size:11px; font-weight:800; padding:3px 7px; border-radius:99px; }
.discover-theme { font-size:14px; font-weight:800; color:#374151; line-height:1.35; }
.discover-reason { font-size:12.5px; color:#6B7280; line-height:1.5; }
.discover-meta { font-size:12px; color:#8A94A6; line-height:1.45; }
.discover-source { font-size:11.5px; color:#9CA3AF; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.discover-actions { margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.discover-score { color:#6B5CFF; font-size:13px; font-weight:900; }
.discover-btn { border:none; background:var(--brand-grad); color:#fff; font-size:13px; font-weight:850; padding:8px 12px; border-radius:12px; cursor:pointer; }
@media (max-width: 430px) {
  .mixed-poi-section { margin-left: -2px; margin-right: -2px; padding: 14px 12px; border-radius: 16px; }
  .mixed-poi-kicker { font-size: 19px; }
  .mixed-poi-link { font-size: 19px; }
  .mixed-poi-rank-line, .mixed-poi-bullets { font-size: 14.5px; line-height:1.58; }
  .mixed-poi-card { grid-template-columns: 86px minmax(0,1fr); gap: 11px; padding: 10px; }
  .mixed-poi-img-wrap, .mixed-poi-img { width: 86px; height: 108px; }
  .mixed-poi-title { font-size: 16px; }
  .mixed-poi-meta { font-size: 12.5px; }
  .mixed-poi-score { font-size: 13.5px; }
  .mixed-poi-price b { font-size: 20px; }
  .mixed-poi-btn { font-size: 13.5px; padding: 8px 12px; }
  .discover-card { grid-template-columns: 96px minmax(0,1fr); gap:10px; padding:9px; border-radius:16px; }
  .discover-img { width:96px; height:118px; border-radius:13px; }
  .discover-title { font-size:18px; }
  .discover-city { font-size:16px; }
  .discover-theme { font-size:13px; }
}

/* ── チャット内インライン地図 ── */
.chat-map-bubble {
  align-self: stretch; max-width: 100%;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow-soft);
}
.chat-map-title { font-size: 14px; font-weight: 800; color: var(--ink); margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
.chat-map-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 9px; text-align: center; }
.leaflet-tooltip.poi-name-tip {
  background: var(--brand-1); color: #fff; border: none; font-weight: 700; font-size: 12px;
  border-radius: 8px; padding: 4px 9px; box-shadow: 0 3px 10px rgba(123,97,255,0.4);
}
.leaflet-tooltip.poi-name-tip::before { border-top-color: var(--brand-1); }

/* ── 时间轴面板 ── */
#timeline-panel {
  flex: 1; overflow-y: auto; padding: 4px 14px 24px;
  -webkit-overflow-scrolling: touch;
}
#timeline-panel::-webkit-scrollbar { display: none; }
#timeline-header {
  flex-shrink: 0; padding: 6px 14px 6px;
  display: flex; align-items: center; justify-content: space-between;
}
#timeline { padding: 0; }

/* ── 输入栏 ── */
#ai-input-wrap {
  padding: 0 18px max(28px, env(safe-area-inset-bottom)); flex-shrink: 0;
}
#ai-input-inner {
  min-height: 50px; display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.92); border-radius: 22px; padding: 6px 13px 6px 18px;
  border: 1.4px solid rgba(92,73,154,0.88); transition: all .2s;
  box-shadow: 0 14px 34px rgba(80,70,160,0.10); backdrop-filter: blur(18px);
}
#ai-input-inner:focus-within { border-color: var(--brand-1); background: #fff; box-shadow: 0 4px 18px rgba(123,97,255,0.16); }
#ai-input { flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: #1A1A1A; min-width:0; }
#ai-input::placeholder { color: #C0C0C0; }
#mic-btn {
  width:28px; height:28px; border:none; border-radius:50%; background:transparent;
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  cursor:pointer; padding:0; color:#171923; transition:background .18s, color .18s, transform .18s;
}
#mic-btn svg { width:20px; height:20px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; display:block; }
#mic-btn:active { background:rgba(17,24,39,0.06); transform:scale(0.95); }
#mic-btn.recording { color:#6B5CFF; background:#F0ECFF; animation:micPulse 1s infinite; }
#send-btn {
  width:34px; height:34px; border:none; border-radius:50%; background:var(--brand-grad);
  display:none; align-items:center; justify-content:center; color:#fff; font-size:18px;
  font-weight:800; box-shadow:0 10px 22px rgba(91,104,239,0.24); cursor:pointer; flex-shrink:0;
}
#ai-input-inner.has-text #send-btn { display:flex; }
#send-btn:active { transform: scale(0.96); }
.bottom-nav-lite {
  display:none;
}
.bottom-mini-btn {
  width:34px; height:34px; border:none; border-radius:50%; background:rgba(255,255,255,0.75);
  color:#30323A; box-shadow:0 8px 20px rgba(17,24,39,0.07);
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px;
}
.account-avatar {
  background: linear-gradient(135deg,#7B61FF,#5B8DEF); color:#fff; font-size:15px; font-weight:900;
}

/* ── 时间轴节点 ── */
.node-item { position: relative; display: flex; gap: 10px; padding-bottom: 4px; }
.node-item::before {
  content: ''; position: absolute; left: 16px; top: 36px; bottom: 0; width: 2px;
  background: repeating-linear-gradient(to bottom, #E5E7EB 0, #E5E7EB 5px, transparent 5px, transparent 11px);
}
.node-item:last-child::before { display: none; }
.node-icon-wrap {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; margin-top: 4px; position: relative; z-index: 1;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.node-card {
  flex: 1; border-radius: 16px; padding: 10px 12px; margin-bottom: 8px;
  cursor: pointer; border: 1.5px solid transparent; overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow-soft);
  transition: all .2s cubic-bezier(0.34,1.56,0.64,1);
  -webkit-user-select: none; user-select: none;
}
.node-card:active { transform: scale(0.97); }
.node-card.active {
  border-color: var(--accent); background: #fff;
  box-shadow: 0 4px 18px rgba(0,0,0,0.09), 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
}
/* 缩略图在卡片内 */
.card-thumb-row {
  display: flex; gap: 5px; margin-top: 8px; height: 64px;
}
.card-thumb-img {
  flex: 1; border-radius: 8px; object-fit: cover;
  background: #eee; min-width: 0;
  transition: opacity .3s;
}
.card-thumb-img:nth-child(1) { flex: 2; }   /* 首图更宽 */
.node-time  { font-size: 11px; color: #9CA3AF; font-weight: 500; margin-bottom: 2px; }
.node-name  { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 2px; line-height: 1.3; }
.node-desc  { font-size: 11px; color: #6B7280; line-height: 1.4; }
.node-tag   { display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }

/* ── Marker ── */
.custom-marker {
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.85);
  box-shadow: 0 3px 12px rgba(0,0,0,0.25); font-size: 16px;
}
.custom-marker.pulse { animation: mPulse 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes mPulse { 0%{transform:scale(1)} 55%{transform:scale(1.55)} 100%{transform:scale(1.2)} }

/* ── 定位按钮（浮在内嵌地图右下角） ── */
#locate-btn {
  position: absolute; right: 10px; bottom: 10px; z-index: 20; width: 38px; height: 38px;
  border-radius: 11px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
  border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; transition: transform .15s;
}
#locate-btn:active { transform: scale(0.92); }

/* ── 「我的位置」脉冲动画 ── */
@keyframes userPulse {
  0%   { transform: scale(0.6); opacity: 0.7; }
  70%  { transform: scale(1.6); opacity: 0; }
  100% { transform: scale(1.6); opacity: 0; }
}

/* ══════════════════════════════════════════
   POI 详情卡  ── 高德风格重设计
══════════════════════════════════════════ */
#poi-backdrop {
  position: fixed; inset: 0; z-index: 45;
  background: rgba(0,0,0,0); pointer-events: none; transition: background .32s;
}
#poi-backdrop.active { background: rgba(0,0,0,0.32); pointer-events: all; }

#poi-card {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: #fff;
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -6px 36px rgba(0,0,0,0.2);
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
  max-height: 92vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
#poi-card.open { transform: translateY(0); }

/* 顶部标题栏 */
#poi-top-bar {
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  position: relative; height: 52px; border-bottom: 1px solid #F0F0F0;
}
#poi-top-title {
  font-size: 17px; font-weight: 800; color: var(--ink);
  max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#poi-close {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px; border-radius: 50%;
  background: #F3F4F6; border: none; color: #6B7280; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#poi-close:active { background: #E5E7EB; }

/* 可滚动主体 */
#poi-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: 24px;
}
#poi-scroll::-webkit-scrollbar { display: none; }

/* ── 英雄图 ── */
#poi-hero {
  position: relative; width: 100%; height: 300px; flex-shrink: 0; overflow: hidden;
}
#poi-hero-img { width: 100%; height: 100%; object-fit: cover; transition: opacity .28s ease; display: block; background:#e8eef3; }
#poi-img-counter {
  position: absolute; top: 14px; right: 14px; z-index: 5;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
  color: rgba(255,255,255,0.9); font-size: 12px; font-weight: 500;
  padding: 4px 10px; border-radius: 99px;
  display: flex; align-items: center; gap: 5px;
}
#poi-hero-hint {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5;
  font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,0.92);
  background: rgba(0,0,0,0.34); backdrop-filter: blur(6px);
  padding: 5px 14px; border-radius: 99px; white-space: nowrap; pointer-events: none;
}

/* 相册缩略图 */
#poi-album-row {
  display: flex; gap: 7px; padding: 12px 16px; overflow-x: auto; background:#fff;
  -webkit-overflow-scrolling: touch;
}
#poi-album-row::-webkit-scrollbar { display: none; }
.poi-thumb {
  flex-shrink: 0; width: 96px; height: 72px; border-radius: 10px;
  object-fit: cover; cursor: pointer; background: #eee;
  border: 2.5px solid transparent; transition: all .18s;
}
.poi-thumb.active { border-color: var(--brand-1); }
.img-fail { opacity: 0.25; }

/* ── 主体信息（OTA风格）── */
#poi-body2 { padding: 16px; }
.poi-loc-chip {
  display: inline-flex; align-items: center; gap: 3px;
  background: #F3F4F6; color: #4B5563; font-size: 12px; font-weight: 600;
  padding: 4px 10px; border-radius: 99px;
}
#poi-name2 { font-size: 24px; font-weight: 850; color: var(--ink); margin: 12px 0 10px; line-height: 1.2; }
#poi-rating2 { display: flex; align-items: center; gap: 4px; margin-bottom: 16px; }
.poi-score { font-size: 18px; font-weight: 850; color: var(--brand-1); }
.poi-score-tag {
  background: var(--brand-1); color: #fff; font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 6px; margin-left: 3px;
}
.poi-review { font-size: 13px; color: #6B7280; }
.poi-arrow { color: #9CA3AF; font-size: 14px; }
.poi-rating-click { display:inline-flex; align-items:center; gap:4px; cursor:pointer; border-radius:10px; padding:4px 6px; margin-left:-6px; transition:background .16s; }
.poi-rating-click:active { background:#F3F4F6; }

/* 状态行 */
#poi-status-row {
  display: flex; align-items: center; gap: 10px;
  background: #F7F8FA; border-radius: 14px; padding: 13px 14px; margin-bottom: 12px;
}
.poi-status-item { flex: 1; min-width: 0; }
.poi-status-k { font-size: 15px; font-weight: 800; color: var(--ink); }
.poi-status-k.open { color: var(--brand-1); }
.poi-status-v { font-size: 11.5px; color: #9CA3AF; margin-top: 3px; }
.poi-status-detail { font-size: 13px; color: #6B7280; flex-shrink: 0; align-self: center; cursor: pointer; }

/* 地址行 */
#poi-addr-row {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid #F0F0F0; border-radius: 14px; padding: 13px 14px; margin-bottom: 16px;
}
.poi-addr-main { flex: 1; min-width: 0; }
.poi-addr-line { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.4;
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
.poi-addr-sub { font-size: 11.5px; color: #9CA3AF; margin-top: 4px; }
.poi-addr-acts { display: flex; gap: 16px; flex-shrink: 0; }
.poi-addr-act { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 17px; color: var(--brand-1); cursor: pointer; }
.poi-addr-act span { font-size: 11px; color: #6B7280; }

/* サブタブ */
.poi-subtabs { display: flex; gap: 22px; border-bottom: 1px solid #F0F0F0; margin-bottom: 14px; }
.poi-subtab { font-size: 15px; font-weight: 700; color: #9CA3AF; padding-bottom: 10px; cursor: pointer; position: relative; }
.poi-subtab.active { color: var(--ink); }
.poi-subtab.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; border-radius:99px; background:var(--brand-1); }

/* 超值特惠 商品カード */
.poi-prod-card { border: 1.5px solid #FF7A3D; border-radius: 14px; overflow: hidden; }
.poi-prod-tabs { display: flex; background: #FFF3EC; }
.poi-prod-tab { font-size: 13px; font-weight: 800; color: #B45309; padding: 9px 16px; }
.poi-prod-tab.active { background: #FF7A3D; color: #fff; border-radius: 0 12px 0 0; }
.poi-prod-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; }
.poi-prod-info { flex: 1; min-width: 0; }
.poi-prod-name { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.45; }
.poi-prod-flag { background:#DC2626; color:#fff; font-size:10px; font-weight:700; padding:1px 5px; border-radius:4px; margin-right:5px; }
.poi-prod-sold { font-size: 11px; color: #9CA3AF; margin-top: 5px; }
.poi-prod-right { flex-shrink: 0; text-align: right; }
.poi-prod-old { font-size: 11px; color: #9CA3AF; text-decoration: line-through; }
.poi-prod-price { font-size: 17px; font-weight: 850; color: #FF5A1F; }
.poi-prod-price small { font-size: 11px; font-weight: 600; }
.poi-prod-book {
  margin-top: 4px; background: var(--accent-warm-grad); color: #fff; border: none;
  font-size: 14px; font-weight: 800; padding: 7px 20px; border-radius: 10px; cursor: pointer;
}
.poi-prod-newcomer { background:#FFF3EC; color:#DC2626; font-size:11.5px; font-weight:600; padding:7px 14px; }
.poi-review-panel { display:flex; flex-direction:column; gap:12px; }
.poi-review-summary {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:#F8F7FF; border-radius:14px; padding:12px 14px;
}
.poi-review-score-big { font-size:24px; font-weight:900; color:var(--brand-1); }
.poi-review-summary-text { flex:1; min-width:0; font-size:12.5px; color:#6B7280; line-height:1.5; }
.poi-review-card {
  border:1px solid #ECEEF3; border-radius:16px; background:#fff; padding:13px 14px;
  box-shadow:0 8px 22px rgba(17,24,39,0.05);
}
.poi-review-card.with-photo { border-color:#E4E0FF; }
.poi-review-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
.poi-review-avatar {
  width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  background:var(--brand-grad); color:#fff; font-size:13px; font-weight:900; margin-right:8px;
}
.poi-review-user-wrap { display:flex; align-items:center; min-width:0; }
.poi-review-user { font-size:14px; font-weight:850; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.poi-review-score-mini { font-size:13px; font-weight:850; color:var(--brand-1); white-space:nowrap; }
.poi-review-photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:9px 0 10px; }
.poi-review-photo-grid img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; background:#EEF2F7; }
.poi-review-text { font-size:13.5px; line-height:1.65; color:#374151; }
.poi-review-tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
.poi-review-tag { font-size:11.5px; font-weight:700; color:#6B7280; background:#F3F4F6; border-radius:999px; padding:4px 8px; }
.poi-nearby-panel { display:flex; flex-direction:column; gap:10px; }
.poi-nearby-summary { border:1px solid #ECEEF3; border-radius:14px; padding:12px 14px; background:#F8FAFC; color:#4B5563; font-size:13px; line-height:1.55; }
.poi-nearby-card {
  display:flex; gap:11px; align-items:center; border:1px solid #ECEEF3; border-radius:16px;
  background:#fff; padding:11px 12px; cursor:pointer; box-shadow:0 8px 22px rgba(17,24,39,0.04);
}
.poi-nearby-icon {
  width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:19px; font-weight:900; flex-shrink:0;
}
.poi-nearby-main { flex:1; min-width:0; }
.poi-nearby-name { font-size:14px; font-weight:850; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.poi-nearby-desc { font-size:12.5px; color:#6B7280; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.poi-nearby-meta { font-size:12px; color:var(--brand-1); font-weight:800; white-space:nowrap; }

/* ══ 详细方案：路线概览 + 推荐去处 + 酒店推荐 ══ */
.detail-title { font-size: 26px; font-weight: 850; color: var(--ink); line-height: 1.25; margin: 6px 0 20px; }
.detail-sub { font-size: 19px; font-weight: 800; color: var(--ink); margin: 4px 0 12px; }
.ov-table { border: 1px solid #ECECEC; border-radius: 14px; overflow: hidden; margin-bottom: 22px; box-shadow: var(--shadow-soft); }
.ov-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; font-size: 15px; font-weight: 800; color: var(--ink); }
.ov-tools { display: flex; gap: 16px; font-size: 13px; font-weight: 600; color: #6B7280; }
.ov-tools span { cursor: pointer; }
.ov-row { display: flex; border-top: 1px solid #F0F0F0; }
.ov-row-head { background: #FAFAFB; }
.ov-row-head .ov-day, .ov-row-head .ov-hl { font-weight: 800; color: var(--ink); }
.ov-day { width: 84px; flex-shrink: 0; padding: 14px 16px; font-size: 14px; font-weight: 700; color: var(--ink); border-right: 1px solid #F0F0F0; }
.ov-hl { flex: 1; padding: 14px 16px; font-size: 14px; color: #374151; line-height: 1.55; }

.rec-section { margin-top: 4px; }
.rec-day-title { font-size: 20px; font-weight: 850; color: var(--ink); margin: 18px 0 14px; }
.rec-slot { font-size: 15px; font-weight: 700; color: #4B5563; margin: 14px 0 10px; }
.rec-name { font-size: 17px; font-weight: 800; color: var(--brand-1); margin-bottom: 12px; cursor: pointer; }
.rec-photo {
  width: 100%; height: 200px; object-fit: cover; border-radius: 16px;
  background: #e8eef3; cursor: pointer; display: block; box-shadow: var(--shadow-soft);
}
.rec-photo.img-fail { opacity: 1; background:#e8eef3; }
.rec-rank { font-size: 15px; font-weight: 700; color: var(--ink); margin: 12px 0 8px; }
.rec-reason { font-size: 15px; color: #374151; line-height: 1.65; margin-bottom: 6px; }

/* 酒店推荐カード */
.hotel-rec-head { font-size: 18px; font-weight: 850; color: var(--ink); margin: 26px 0 14px; }
.lodging-area { font-size: 19px; font-weight: 850; color: var(--ink); margin: 8px 0 16px; }
.lodging-hotel-name { font-size: 17px; font-weight: 800; color: var(--ink); margin: 20px 0 8px; }
.lodging-reason { font-size: 14px; color: #4B5563; line-height: 1.6; margin-bottom: 13px; }
.hotel-rec-card { display: flex; gap: 13px; cursor: pointer; margin-bottom: 18px; align-items: flex-start; }
.hotel-rec-reason { font-size: 12.5px; color: #6B7280; line-height: 1.55; margin-top: 9px; }
.hotel-rec-img { width: 116px; height: 116px; border-radius: 14px; object-fit: cover; background:#e8eef3; flex-shrink: 0; }
.hotel-rec-main { flex: 1; min-width: 0; }
.hotel-rec-name { font-size: 16px; font-weight: 800; color: var(--ink); line-height: 1.3;
  display:flex; align-items:center; gap:8px; }
.hotel-rec-name { display:block; }
.hotel-rec-badge { display:inline-block; background:#F3F4F6; color:#6B7280; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; margin-left:6px; vertical-align:middle; }
.hotel-rec-rate { font-size: 13px; color: #6B7280; margin-top: 8px; }
.hotel-rec-rate b { color: var(--brand-1); font-size: 15px; }
.hotel-rec-rank { color: #9CA3AF; }
.hotel-rec-dist { font-size: 12px; color: #9CA3AF; margin-top: 6px; }
.hotel-rec-price-row { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 10px; }
.hotel-rec-price-box { line-height: 1.1; }
.hotel-rec-price { font-size: 20px; font-weight: 850; color: var(--ink); }
.hotel-rec-qi { font-size: 12px; color: #6B7280; margin-left: 2px; }
.hotel-rec-cut { font-size: 11px; color: #FF5A1F; margin-top: 3px; }
.hotel-rec-btn { background: var(--brand-grad); color: #fff; border: none; font-size: 14px; font-weight: 800; padding: 9px 22px; border-radius: 12px; cursor: pointer; }

/* ══ 酒店预订画面 ══ */
#hotel-booking {
  position: fixed; inset: 0; z-index: 120; background: #F5F6FA;
  transform: translateX(100%); transition: transform .35s cubic-bezier(0.32,0.72,0,1);
  display: flex; flex-direction: column;
}
#hotel-booking.open { transform: translateX(0); }
#hb-bar { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #fff; border-bottom: 1px solid #F0F0F0; }
#hb-close, #hb-share { width: 34px; height: 34px; border: none; background: #F3F4F6; border-radius: 50%; font-size: 18px; color: #374151; cursor: pointer; }
#hb-title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; color: var(--ink); }
#hb-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#hb-scroll::-webkit-scrollbar { display: none; }
#hb-img { width: 100%; height: 220px; object-fit: cover; background:#e8eef3; display: block; }
#hb-info { background: #fff; padding: 16px; margin-bottom: 10px; }
#hb-name { font-size: 20px; font-weight: 850; color: var(--ink); line-height: 1.3; }
#hb-meta { font-size: 13px; color: #6B7280; margin-top: 9px; }
#hb-meta b { color: var(--brand-1); font-size: 15px; }
.hb-badge { display:inline-block; background:#F3F4F6; color:#6B7280; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; margin-right:8px; }
#hb-addr { font-size: 12.5px; color: #6B7280; margin-top: 12px; }
.hb-map { color: var(--brand-1); font-weight: 600; cursor: pointer; }

.hb-room-main { flex: 1; min-width: 0; }
.hb-room-name { font-size: 15px; font-weight: 800; color: var(--ink); }

#hb-footer { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px env(safe-area-inset-bottom, 14px); background: #fff; border-top: 1px solid #F0F0F0; }
#hb-foot-price { font-size: 13px; color: #6B7280; font-weight: 600; }
#hb-foot-btn { flex-shrink: 0; background: var(--brand-grad); color: #fff; border: none; font-size: 16px; font-weight: 800; padding: 13px 40px; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(123,97,255,0.32); }

/* ── 全屏图片浏览 ── */
#photo-viewer {
  position: fixed; inset: 0; z-index: 100;
  background: #000;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
}
#photo-viewer.open { display: flex; }
#viewer-img {
  max-width: 100%; max-height: 80vh; object-fit: contain;
  transition: opacity .2s;
}
#viewer-close {
  position: absolute; top: 16px; right: 16px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.15); border: none;
  color: #fff; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#viewer-counter {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.8); font-size: 14px;
}
#viewer-prev, #viewer-next {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.12); border: none; color: #fff;
  font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
#viewer-prev { left: 14px; }
#viewer-next { right: 14px; }
#viewer-caption {
  position: absolute; bottom: 40px; left: 0; right: 0;
  text-align: center; color: rgba(255,255,255,0.75); font-size: 13px; padding: 0 20px;
}

/* ── Toast ── */
#toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.72); color: #fff; backdrop-filter: blur(8px);
  padding: 10px 20px; border-radius: 22px; font-size: 13px;
  z-index: 9999; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
}

   出行平台「问一问」功能模块样式
══════════════════════════════════════════ */

/* —— 推荐 chips —— */
#suggest-chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.chip {
  font-size:12px; font-weight:600; color:var(--brand-1); background:#F1EDFF;
  border:1px solid #E4DBFF; border-radius:99px; padding:6px 12px; cursor:pointer;
  transition:all .15s; user-select:none;
}
.chip:active { transform:scale(0.95); background:#E4DBFF; }
.home-actions .chip {
  display:inline-flex; align-items:center; width:fit-content; max-width:100%;
  background: rgba(255,255,255,0.86); color:#20222A; border: none;
  border-radius: 17px; padding: 11px 19px; font-size: 15.5px; font-weight: 650;
  box-shadow: 0 14px 34px rgba(17,24,39,0.07); backdrop-filter: blur(18px);
}
.home-actions .chip::before {

}
.home-actions .chip:active { background:#fff; transform: scale(0.98); }

#recent-backdrop {
  position:fixed; inset:0; z-index:280; background:rgba(17,24,39,0.16);
  opacity:0; pointer-events:none; transition:opacity .24s; backdrop-filter: blur(2px);
}
#recent-backdrop.open { opacity:1; pointer-events:all; }
#recent-drawer {
  position:fixed; left:0; top:0; bottom:0; width:min(82vw, 320px); z-index:281;
  background:rgba(255,255,255,0.96); box-shadow:24px 0 60px rgba(17,24,39,0.16);
  transform:translateX(-102%); transition:transform .28s cubic-bezier(.2,.75,.2,1);

.recent-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
.recent-title { font-size:22px; font-weight:900; color:#171923; }
.recent-sub { font-size:12px; color:#9CA3AF; margin-top:4px; }
.recent-close {
  width:34px; height:34px; border:none; border-radius:50%; background:#F3F4F6;
  color:#4B5563; font-size:22px; cursor:pointer;
}
#recent-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.recent-item {
  border:none; border-radius:16px; padding:13px 14px; text-align:left; cursor:pointer;
  background:#F8FAFC; color:#1F2937;
}
.recent-item:active { transform: scale(0.99); background:#F2F6FC; }
.recent-item-title { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.recent-item-meta { font-size:11.5px; color:#9CA3AF; margin-top:5px; }
.recent-empty { color:#9CA3AF; font-size:13px; line-height:1.6; padding:14px 4px; }
.recent-new-btn {

}
.recent-menu {
  position:fixed; z-index:9999; min-width:116px; padding:6px;
  border-radius:12px; background:#fff; box-shadow:0 14px 36px rgba(17,24,39,0.18);
  border:1px solid rgba(229,231,235,0.9); display:none;
}
.recent-menu.open { display:block; }
.recent-menu button {
  width:100%; border:none; background:transparent; color:#EF4444;
  font-size:13px; font-weight:800; padding:9px 12px; border-radius:9px; text-align:left; cursor:pointer;
}
.recent-menu button:active, .recent-menu button:hover { background:#FEF2F2; }

/* —— 多智能体步骤 —— */
.agent-step { display:flex; align-items:center; gap:9px; padding:6px 0; opacity:0; transform:translateY(4px); transition:all .35s; }
.agent-step.show { opacity:1; transform:none; }
.agent-ava {

}
.agent-text { font-size:12.5px; color:#374151; }
.agent-text b { color:#1A1A1A; }
.agent-done { margin-left:auto; color:#16A34A; font-size:13px; }

/* —— 客流热力指数 —— */
#heat-panel:empty, #budget-panel:empty, #product-panel:empty { display:none; }
.heat-box {
  background:#fff; border:1px solid #F0F0F0; border-radius:14px; padding:12px 14px; margin:2px 0 12px;
  box-shadow:0 1px 6px rgba(0,0,0,0.05);
}
.heat-title { font-size:12.5px; font-weight:700; color:#1A1A1A; margin-bottom:9px; display:flex; align-items:center; gap:5px; }

.heat-item { flex:1; text-align:center; background:#F8FAFC; border-radius:10px; padding:8px 4px; }
.heat-emoji { font-size:17px; }
.heat-val { font-size:15px; font-weight:800; margin-top:2px; }
.heat-label { font-size:10px; color:#9CA3AF; margin-top:1px; }

/* —— 预算滑块 —— */
.budget-box {

.budget-slider::-webkit-slider-thumb {

}
.budget-status { font-size:11.5px; margin-top:8px; font-weight:600; }
.budget-status.ok { color:#16A34A; }
.budget-status.warn { color:#DC2626; }

/* —— 商品卡（机票/酒店） —— */

.prod-card {

}

.prod-main { flex:1; min-width:0; }
.prod-name { font-size:13px; font-weight:700; color:#1A1A1A; }
.prod-sub { font-size:11px; color:#9CA3AF; margin-top:2px; }
.prod-stock { font-size:10px; color:#EA580C; margin-top:2px; font-weight:600; }
.prod-right { text-align:right; flex-shrink:0; }
.prod-price { font-size:15px; font-weight:850; color:#FF5A5F; }
.prod-price small { font-size:10px; font-weight:600; color:#9CA3AF; }
.prod-book {

}
.prod-book:active { transform:scale(0.95); }

/* —— 添加停留点按钮 —— */
#add-stop-btn {
  width:100%; margin:6px 0 10px; padding:11px; border:1.5px dashed #C9BEF0; background:#FAF8FF;
  color:var(--brand-1); font-size:13px; font-weight:700; border-radius:12px; cursor:pointer;
}
#add-stop-btn:active { transform:scale(0.98); }

/* —— 添加停留点 / 手绘攻略 弹层 —— */
.modal-backdrop {
  position:fixed; inset:0; z-index:260; background:rgba(0,0,0,0.4);
  display:flex; align-items:center; justify-content:center; padding:22px;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.modal-backdrop.open { opacity:1; pointer-events:all; }
.modal-card {
  width:100%; max-width:360px; max-height:80vh; overflow-y:auto; background:#fff;
  border-radius:20px; padding:18px; box-shadow:0 12px 50px rgba(0,0,0,0.3);
  transform:translateY(20px) scale(0.97); transition:transform .3s;
}
.modal-backdrop.open .modal-card { transform:none; }
.modal-card::-webkit-scrollbar { display:none; }
.modal-title { font-size:16px; font-weight:800; color:#1A1A1A; margin-bottom:4px; }
.modal-sub { font-size:12px; color:#9CA3AF; margin-bottom:14px; }
.modal-poi {
  display:flex; align-items:center; gap:10px; padding:10px; border:1px solid #F0F0F0;
  border-radius:12px; margin-bottom:8px; cursor:pointer;
}
.modal-poi:active { background:#F8FAFC; }
.modal-close {
  width:100%; margin-top:6px; padding:11px; border:none; background:#F3F4F6; color:#374151;
  font-size:13px; font-weight:700; border-radius:12px; cursor:pointer;
}
.review-list { display:flex; flex-direction:column; gap:12px; }
.review-item { border:1px solid #EEF0F4; border-radius:14px; padding:13px 14px; background:#fff; }
.review-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px; }
.review-user { font-size:14px; font-weight:850; color:var(--ink); }
.review-score { font-size:13px; font-weight:850; color:var(--brand-1); white-space:nowrap; }
.review-text { font-size:13.5px; line-height:1.65; color:#374151; }
.review-tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
.review-tag { font-size:11.5px; font-weight:700; color:#6B7280; background:#F3F4F6; border-radius:999px; padding:4px 8px; }

/* —— 手绘攻略海报 —— */
#poster {
  background:linear-gradient(160deg,#7B61FF 0%,#5B8DEF 100%); color:#fff;

}
#poster .p-emoji { font-size:40px; }

#poster .p-line { font-size:12px; opacity:0.95; margin:3px 0; }
#poster .p-foot { font-size:11px; opacity:0.8; margin-top:14px; }
#poster .p-qr { display:inline-block; background:#fff; color:#7B61FF; font-size:22px; padding:8px; border-radius:10px; margin-top:10px; }

/* —— 麦克风录音态 —— */
@keyframes micPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
</style>

function detectCity(text) {
  for (const [city, kws] of Object.entries(CITY_KEYWORDS)) {
    if (kws.some(k => text.includes(k))) return city;
  }
  return null;
}

// 放置 / 更新「我的位置」标记
function setUserLocation(coords, recenter = true) {
  if (userMarker) map.removeLayer(userMarker);
  const icon = L.divIcon({
    className: '',
    html: `<div style="position:relative;width:22px;height:22px">
      <div style="position:absolute;inset:0;border-radius:50%;background:#7B61FF;
           border:3px solid #fff;box-shadow:0 2px 8px rgba(123,97,255,0.6);z-index:2"></div>
      <div style="position:absolute;inset:-9px;border-radius:50%;background:rgba(74,144,217,0.25);
           animation:userPulse 2s ease-out infinite;z-index:1"></div>
    </div>`,
    iconSize: [22, 22], iconAnchor: [11, 11],
  });
  userMarker = L.marker(coords, { icon, zIndexOffset: 1000 })
    .addTo(map)
    .bindPopup('<b style="font-size:13px">📍 我的位置</b>', { maxWidth: 160 });
  if (recenter) map.setView(coords, 13);
}

// 浏览器定位（失败则用默认位置），并加载附近 POI
function initUserLocationAndNearby() {
  const loadNearby = (coords) => {
    setUserLocation(coords, true);
    // 取最近城市的 nearby 作为附近 POI（默认安康）
    addNearbyMarkers(CITY_DB['安康'].nearby, '安康');
  };
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => loadNearby([pos.coords.latitude, pos.coords.longitude]),
      ()  => loadNearby(DEFAULT_LOCATION),
      { enableHighAccuracy: true, timeout: 6000 }
    );
  } else {
    loadNearby(DEFAULT_LOCATION);
  }
}

function normalizeCityContext(cityContext) {
  if (!cityContext) return [];
  const list = Array.isArray(cityContext) ? cityContext : [cityContext];
  return [...new Set(list.filter(city => CITY_DB[city] || HOTEL_DB[city] || MICRO_POI_DB[city]))];
}

function defaultPoiTier(index) {
  if (index < 2) return 1;
  if (index < 5) return 2;
  return 3;
}

function getRecommendedHotels(cities, limit = 1) {
  return normalizeCityContext(cities)
    .flatMap(cityName => (HOTEL_DB[cityName] || []).slice(0, 1).map(hotel => ({
      ...hotel,
      cityName,
      kind: 'hotel',
    })))
    .slice(0, limit);
}

function makeHotelNode(poi) {
  const price = poi.desc.match(/约[\d,]+元\/晚/)?.[0] || '请咨询';
  const rating = poi.rating ?? parseFloat((4.2 + Math.random()*0.6).toFixed(1));
  const lock = stableHash(`${poi.cityName || ''}${poi.name}hotel`);
  return {
    name: poi.name, fullName: poi.name, icon: poi.icon, color: poi.color,
    time: '推荐住宿', tag: '酒店', tagBg:'#EFF6FF', tagColor:'#0EA5E9',
    rating,
    reviewCount: poi.reviewCount || Math.floor(200+Math.random()*800),
    fullDesc: `${poi.desc}。这是本次行程${poi.cityName ? `在${poi.cityName}` : '沿途'}推荐的住宿选择，适合自驾停靠，建议提前预订。`,
    coords: poi.coords,
    photoCats:[{label:'全部',photos:[
      {url:`https://loremflickr.com/800/520/hotel,room,${cityKw(poi.cityName)}/all?lock=${lock % 900}`, caption:'酒店客房'},
      {url:`https://loremflickr.com/800/520/hotel,lobby,${cityKw(poi.cityName)}/all?lock=${(lock + 37) % 900}`, caption:'酒店环境'},
    ]}],
    infoList:[
      {icon:'💰', label:'参考价格', value:price, sub:'节假日价格上浮'},
      {icon:'📍', label:'位置', value:poi.cityName ? `${poi.cityName} · ${poi.name}` : poi.name, sub:''},
      {icon:'📞', label:'预订', value:'携程/美团可订', sub:'提前3天更稳妥'},
    ],
    tags:['推荐住宿','沿途酒店','可点击跳转'],
  };
}

function openHotelPOI(poi) {
  currentNode = makeHotelNode(poi);
  currentCatIdx = 0;
  currentPhotoIdx = 0;
  openPOI(currentNode);
}

function focusHotelByName(name) {
  const hit = hotelMarkerIndex[name];
  if (!hit) return;
  collapseSheet();
  map.flyTo(hit.poi.coords, 14, { animate: true, duration: 1.1, easeLinearity: 0.25 });
  setTimeout(() => openHotelPOI(hit.poi), 900);
}

function makeNearbyNode(poi) {
  const cost = poi.desc.includes('免费') ? '免费' : (poi.desc.match(/(?:票价|约)(\d+)元/)?.[0] || '请现场确认');

function addNearbyMarkers(pois, cityContext = null) {
  clearNearbyMarkers();

  // 合并酒店 + 微 POI。路线传入城市列表时，会自动叠加沿途酒店。
  const cityNames = normalizeCityContext(cityContext);
  const hotels = cityNames.flatMap(cityName =>
    (HOTEL_DB[cityName] || []).map((hotel, index) => ({
      ...hotel,
      cityName,
      kind: 'hotel',
      tier: index === 0 ? 2 : 3,
    }))
  );
  const micros = cityNames.flatMap(cityName =>
    (MICRO_POI_DB[cityName] || []).map(poi => ({
      ...poi,
      cityName,
      kind: 'micro',
      tier: 3,
    }))
  );
  const allPois = [
    ...pois.map((p, index) => ({...p, tier: p.tier || defaultPoiTier(index), kind: p.kind || 'poi'})),
    ...hotels,
    ...micros,
  ];

  allPois.forEach(poi => {
    const tier  = poi.tier || 1;
    const sz    = tier === 3 ? 28 : tier === 2 ? 30 : 32;
    const isHotel = poi.icon === '🏨' || poi.icon === '🏩' || poi.icon === '🏡';

    const icon = L.divIcon({
      className: '',
      html: `<div style="
        width:${sz}px;height:${sz}px;
        border-radius:${isHotel ? '8px' : '50%'};
        background:${poi.color};
        border:2px solid rgba(255,255,255,0.9);
        display:flex;align-items:center;justify-content:center;
        font-size:${sz-16}px;
        box-shadow:0 2px 8px rgba(0,0,0,0.2);
        opacity:0;transition:opacity .4s,transform .35s;transform:scale(0.5);
      " class="nearby-dot" data-tier="${tier}">${poi.icon}</div>`,
      iconSize: [sz, sz], iconAnchor: [sz/2, sz/2],
    });
    const mkr = L.marker(poi.coords, { icon })
      .addTo(map)
      .bindPopup(`
        <div style="font-family:-apple-system,sans-serif;min-width:150px">
          <b style="font-size:13px">${poi.icon} ${poi.name}</b><br>
          <span style="font-size:11px;color:#888">${poi.desc}</span>
          ${isHotel ? `<br><span style="font-size:11px;color:#0EA5E9;font-weight:600">🏨 点击查看详情</span>` : ''}
        </div>
      `, { maxWidth: 220 });

    // 酒店点击跳转到 POI 卡
    if (isHotel) {
      mkr.on('click', () => {
        openHotelPOI(poi);
      });
      hotelMarkerIndex[poi.name] = { marker: mkr, poi };
    } else {
      mkr.on('click', () => {
        openNearbyPOI(poi);
      });
      nearbyPoiIndex[poi.name] = { marker: mkr, poi };
    }

    nearbyMarkers.push({ marker: mkr, tier, poi });
  });

  updateNearbyVisibility();
}

function clearNearbyMarkers() {
  nearbyMarkers.forEach(({marker}) => map.removeLayer(marker));
  nearbyMarkers = [];
  hotelMarkerIndex = {};
  nearbyPoiIndex = {};
}

function updateNearbyVisibility() {
  const zoom = map.getZoom();
  nearbyMarkers.forEach(({marker, tier}) => {
    // tier-1: zoom≥9  tier-2: zoom≥11  tier-3(酒店/餐厅): zoom≥13
    const threshold = tier === 3 ? 13 : tier === 2 ? 11 : 9;
    const visible = zoom >= threshold;
    const el = marker.getElement()?.querySelector('.nearby-dot');
    if (el) {
      el.style.opacity = visible ? '1' : '0';
      el.style.transform = visible ? 'scale(1)' : 'scale(0.5)';
      el.style.pointerEvents = visible ? 'auto' : 'none';
    }
  });
}

// 缩放时动态显隐周边 POI

function makeMarker(node, active) {
  const sz = active ? 50 : 40;
  const ring = active ? `box-shadow:0 0 0 5px ${node.color}30,0 3px 14px rgba(0,0,0,0.2)` : 'box-shadow:0 3px 12px rgba(0,0,0,0.22)';
  return L.marker(node.coords, {
    icon: L.divIcon({
      className: '',
      html: `<div class="custom-marker${active?' pulse':''}"
                  style="width:${sz}px;height:${sz}px;background:${node.color};font-size:${active?20:16}px;${ring}">
               ${node.icon}</div>`,
      iconSize: [sz, sz], iconAnchor: [sz/2, sz/2],
    })
  }).addTo(map);
}

let currentId = null;

function focusNode(id, openCard) {
  const tgt = markers[id];
  if (!tgt) return;

  if (currentId !== null) {
    const prev = markers[currentId];
    if (prev.domEl) prev.domEl.classList.remove('active');
    prev.marker.remove();
    prev.marker = makeMarker(prev.node, false);
    prev.marker.on('click', () => focusNode(prev.node.id, true));
  }

  currentId = id;
  if (tgt.domEl) {
    tgt.domEl.classList.add('active');
    tgt.domEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  tgt.marker.remove();
  tgt.marker = makeMarker(tgt.node, true);
  tgt.marker.on('click', () => focusNode(id, true));

  collapseSheet();
  setTimeout(() => {
    map.flyTo(tgt.node.coords, 14, { animate: true, duration: 1.1, easeLinearity: 0.25 });
    if (openCard) setTimeout(() => openPOI(tgt.node), 1200);
  }, 160);
}

function mapIsVisible() {
  const p = document.getElementById('timeline-panel');

function fitMapToNodes(animate = true) {
  if (!mapIsVisible() || NODES.length === 0) return;
  try {
    map.invalidateSize();
    map.flyToBounds(NODES.map(n => L.latLng(n.coords)), { padding:[40,50], duration: animate ? 1 : 0 });
  } catch (e) { /* 隐藏或尺寸为0时忽略 */ }
}

function resetView() {
  if (currentId !== null) {
    const prev = markers[currentId];
    if (prev.domEl) prev.domEl.classList.remove('active');
    prev.marker.remove();
    prev.marker = makeMarker(prev.node, false);
    prev.marker.on('click', () => focusNode(prev.node.id, true));
    currentId = null;
  }
  closePOI();
  // 有行程节点则回到行程总览；否则（首页）回到「我的位置」
  if (NODES.length > 0) {
    fitMapToNodes(true);
  } else if (userMarker) {
    try { map.invalidateSize(); map.flyTo(userMarker.getLatLng(), 13, { duration: 1 }); } catch(e){}
  }
}

function readRecentConversations() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
  catch (e) { return []; }
}

function writeRecentConversations(list) {
  localStorage.setItem(RECENT_KEY, JSON.stringify((list || []).slice(0, 12)));
}

function snapshotCurrentConversation() {
  const panel = document.getElementById('chat-panel');
  if (!panel) return '';
  const clone = panel.cloneNode(true);
  clone.querySelector('#home-hero')?.remove();
  clone.querySelector('#bubble-thinking')?.remove();
  return clone.innerHTML.trim();
}

function saveConversationSnapshot() {
  const list = readRecentConversations();
  const idx = list.findIndex(item => item.id === activeConversationId);
  if (idx === -1) return;
  const snapshot = snapshotCurrentConversation();
  if (!snapshot) return;
  list[idx] = { ...list[idx], snapshot, time: Date.now() };
  writeRecentConversations(list);
}

function rememberConversation(text) {
  const title = String(text || '').trim();
  if (!title) return;
  const list = readRecentConversations().filter(item => item.id !== activeConversationId && item.title !== title);
  list.unshift({ id: activeConversationId, title, time: Date.now(), snapshot: snapshotCurrentConversation() });
  writeRecentConversations(list);
}

function formatRecentTime(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
  return `${Math.floor(diff / 86400000)}天前`;
}

function renderRecentConversations() {
  const list = readRecentConversations();
  const box = document.getElementById('recent-list');
  if (!box) return;
  box.innerHTML = list.length
    ? list.map(item => `
        <button class="recent-item"
          onclick="resumeConversationByIndex(${list.indexOf(item)})"
          oncontextmenu="showRecentDeleteMenu(event, ${list.indexOf(item)})"
          ontouchstart="startRecentLongPress(event, ${list.indexOf(item)})"
          ontouchend="cancelRecentLongPress()"
          ontouchmove="cancelRecentLongPress()">
          <div class="recent-item-title">${escapeHTML(item.title)}</div>
          <div class="recent-item-meta">${formatRecentTime(item.time)}</div>
        </button>`).join('')
    : `<div class="recent-empty">还没有最近对话。发送一个旅行需求后，这里会自动保存。</div>`;
}

  renderRecentConversations();

  document.getElementById('recent-drawer')?.classList.add('open');
}

function closeRecentConversations() {
  document.getElementById('recent-backdrop')?.classList.remove('open');
  document.getElementById('recent-drawer')?.classList.remove('open');

}

function startNewConversation() {
  activeConversationId = Date.now();
  closePOI();
  closeHotelBooking();
  switchTab('chat');
  clearInterval(thinkingTimer);
  renderWelcomeHome();
  showToast('已进入新对话');
}

function resumeConversation(text) {
  closeRecentConversations();
  startNewConversation();
  document.getElementById('ai-input').value = text;
  syncInputState();
  handleSend();
}

function resumeConversationByIndex(index) {
  const item = readRecentConversations()[index];
  if (!item) return;
  closeRecentConversations();
  closePOI();
  closeHotelBooking();
  switchTab('chat');
  activeConversationId = item.id || Date.now();
  const panel = document.getElementById('chat-panel');
  if (item.snapshot && panel) {
    panel.innerHTML = item.snapshot;
    panel.scrollTop = panel.scrollHeight;
    const list = readRecentConversations();
    const current = list.splice(index, 1)[0];
    current.time = Date.now();
    list.unshift(current);
    writeRecentConversations(list);
    return;
  }
  resumeConversation(item.title);
}

function showRecentDeleteMenu(event, index) {
  event.preventDefault();
  event.stopPropagation();
  recentMenuIndex = index;
  const menu = document.getElementById('recent-menu');
  if (!menu) return;
  const point = event.touches?.[0] || event.changedTouches?.[0] || event;
  const x = Math.min(point.clientX || 24, window.innerWidth - 132);
  const y = Math.min(point.clientY || 80, window.innerHeight - 56);
  menu.style.left = `${Math.max(10, x)}px`;
  menu.style.top = `${Math.max(10, y)}px`;
  menu.classList.add('open');
}

function closeRecentDeleteMenu() {
  document.getElementById('recent-menu')?.classList.remove('open');
  recentMenuIndex = null;
}

function deleteRecentFromMenu() {
  if (recentMenuIndex == null) return;
  const list = readRecentConversations();
  list.splice(recentMenuIndex, 1);
  writeRecentConversations(list);
  closeRecentDeleteMenu();
  renderRecentConversations();
}

function startRecentLongPress(event, index) {
  cancelRecentLongPress();

function cancelRecentLongPress() {

function aiHotelLink(hotel) {
  const encoded = encodeURIComponent(hotel.name);
  return `<span class="ai-place-link" role="button" tabindex="0"
    onclick="focusHotelByName(decodeURIComponent('${encoded}'))"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();focusHotelByName(decodeURIComponent('${encoded}'))}">${hotel.name}</span>`;
}

function findNodeByPlaceName(name) {
  return NODES.find(node =>
    node.name === name ||
    node.fullName === name ||
    name.includes(node.name) ||
    node.name.includes(name)
  );
}

function aiMaybePlaceLink(name) {
  const node = findNodeByPlaceName(name);
  if (node) return aiNodeLink(node, name);
  if (hotelMarkerIndex[name]) return aiHotelLink(hotelMarkerIndex[name].poi);
  if (nearbyPoiIndex[name]) {
    const encoded = encodeURIComponent(name);
    return `<span class="ai-place-link" role="button" tabindex="0"
      onclick="focusNearbyByName(decodeURIComponent('${encoded}'))"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();focusNearbyByName(decodeURIComponent('${encoded}'))}">${name}</span>`;
  }
  return name;
}

function parseTripDays(text) {
  const CN_NUM = {'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  const m = text.match(/([一两二三四五六七八九十\d]+)\s*[天日]/);
  if (!m) return 1;
  const raw = m[1];
  return Math.max(1, Math.min(7, CN_NUM[raw] || parseInt(raw) || 1));
}

function dayCountText(days) {
  const CN = ['','一天','两天','三天','四天','五天','六天','七天'];
  return CN[days] || `${days}天`;
}

function estimateCost(text) {
  if (!text) return 0;
  if (text.includes('免费')) return 0;
  const m = text.match(/(?:票价|人均|约|~¥)\s*(\d+)/);
  return m ? parseInt(m[1]) : 40;
}

function formatPlanCost(cost) {
  return cost === 0 ? '免费' : `~¥${cost}`;
}

function itineraryLine(time, action, place, cost) {
  const placeText = place ? aiMaybePlaceLink(place) : '';
  return `<div class="itinerary-line"><span class="time">${time}</span> - ${action}${placeText ? ` ${placeText}` : ''} (${formatPlanCost(cost)})</div>`;
}

function buildGenericCityDayPlan(city, cityData, days) {
  const nearby = cityData.nearby || [];
  const candidates = [
    ...(cityData.nodes || []).map(n => ({name:n.name, desc:n.desc})),
    ...nearby.map(n => ({name:n.name, desc:n.desc})),
  ];
  const dayPlans = [];
  let cursor = 0;
  for (let day = 0; day < days; day++) {
    const meal = getMealPlan(city, day);
    const first = candidates[cursor % candidates.length] || {name:`${city}城市漫步`, desc:'免费'};
    const second = candidates[(cursor + 1) % candidates.length] || first;
    const third = candidates[(cursor + 2) % candidates.length] || second;
    cursor += 3;
    dayPlans.push({
      title: `Day ${day + 1}: ${city}${day === 0 ? '文化探索' : day === 1 ? '自然与美食' : '深度漫游'}`,
      lines: [
        ['09:00', '早餐在', meal.breakfast[0], meal.breakfast[1]],
        ['10:30', first.desc?.includes('人均') ? '品尝' : '游览', first.name, estimateCost(first.desc)],
        ['12:30', '午餐在', meal.lunch[0], meal.lunch[1]],
        ['14:30', second.desc?.includes('人均') ? '品尝' : '游览', second.name, estimateCost(second.desc)],
        ['16:30', third.desc?.includes('人均') ? '品尝' : '参观', third.name, estimateCost(third.desc)],
        ['18:30', '晚餐在', meal.dinner[0], meal.dinner[1]],
      ],
    });
  }
  return dayPlans;
}

function renderItineraryDays(dayPlans) {
  return dayPlans.map(day => `
    <div class="itinerary-day">
      <div class="itinerary-day-title">${day.title}</div>
      ${day.lines.map(line => itineraryLine(...line)).join('')}
    </div>
  `).join('');
}

function sumDayPlans(dayPlans) {
  return dayPlans.reduce((sum, day) => sum + day.lines.reduce((daySum, line) => daySum + (line[3] || 0), 0), 0);
}

// 富文本路线规划气泡内容生成
function buildRouteBubbleHTML(originCity, destCity, cities, people, budget, nodes, days = 1) {
  const totalDist = calcTotalDist(cities);
  const fuelCost  = Math.round(totalDist * 0.07 * 8);
  const tollCost  = Math.round(totalDist * 0.05);
  const poiCost   = nodes.filter(n=>n.type!=='drive'&&n.type!=='summary')
    .reduce((s,n)=>{ const m=(n.desc||'').match(/票价(\d+)/); return s+(m?parseInt(m[1]):0); }, 0);
  const totalPer  = Math.round(fuelCost/people + tollCost/people + poiCost);
  const budgetOk  = !budget || totalPer <= budget;
  const tagClass  = budgetOk ? 'ai-tag-ok' : 'ai-tag-warn';
  const tagText   = budgetOk
    ? `✅ 人均约 ${totalPer}元，预算内`
    : `⚠️ 人均约 ${totalPer}元，超出 ${totalPer-(budget||0)}元`;

  const stops = nodes.filter(n=>n.type!=='drive'&&n.type!=='summary');
  const effectiveDays = Math.max(days || 1, Math.min(3, Math.ceil(stops.length / 2) || 1));
  const routeDayPlans = [];
  for (let day = 0; day < effectiveDays; day++) {
    const city = cities.filter(c => CITY_DB[c])[Math.min(day, cities.filter(c => CITY_DB[c]).length - 1)] || destCity;
    const meal = getMealPlan(city, day);
    const dayStops = stops.slice(day * 2, day * 2 + 2);
    const lines = [
      ['09:00', '早餐在', meal.breakfast[0], meal.breakfast[1]],
      ...dayStops.map((n, index) => [index === 0 ? '10:30' : '14:30', n.desc?.includes('人均') ? '品尝' : '游览', n.name, estimateCost(n.desc)]),
      ['18:30', '晚餐在', meal.dinner[0], meal.dinner[1]],
    ];
    routeDayPlans.push({
      title: `Day ${day + 1}: ${city}${day === 0 ? '出发探索' : '深度游玩'}`,
      lines,
    });
  }
  const hotelLines = getRecommendedHotels(cities, 1).map(h =>
    `<div class="itinerary-line">🏨 ${aiHotelLink(h)}（${h.cityName} · ${h.desc}）</div>`
  ).join('');
  const planCost = sumDayPlans(routeDayPlans);
  const grandTotal = Math.round(planCost + fuelCost/people + tollCost/people);

  return `
    <div class="itinerary-intro">感谢您的信息！以下是从 ${originCity} 到 ${destCity} 的${dayCountText(effectiveDays)}自驾行程安排：</div>
    ${renderItineraryDays(routeDayPlans)}
    <div class="itinerary-hotels">
      <div class="itinerary-hotels-title">沿途附近酒店推荐</div>
      ${hotelLines || '<div class="itinerary-line">地图放大后可查看沿途住宿点</div>'}
    </div>
    <div class="itinerary-total">总计: ¥${grandTotal} / 人</div>
    <div class="itinerary-note">
      全程约 ${totalDist} km，预计行驶 ${Math.round(totalDist/80)} 小时。价格为估算，实际费用可能会有所不同。您是否需要更多的细节或其他建议？
    </div>
  `;
}

      ],

// 路线解析：从文本中提取起点、终点、人数、预算
// ══════════════════════════════════════════
function parseRouteInput(text) {
  let origin = null, dest = null, people = 2, budget = null;

  const cleanPlaceText = s => (s || '')
    .replace(/^(我在|人在|目前在|现在在|从|自|由)/, '')
    .replace(/(出发|启程|出行|发车).*$/, '')
    .replace(/[，,。；;\s].*$/, '')
    .trim();

  // 起点 / 终点：「从X到Y」「X出发到Y」「我在X想去Y」「X→Y」
  const patterns = [
    /我(?:在|从)?(.{2,8})[，,\s]*(?:想|要|准备|计划)?(?:去|到|前往)(.{2,8})/,
    /(?:从|自|由)(.{2,8})(?:出发|启程|出行)?[，,\s]*(?:去|到|前往)(.{2,8})/,
    /(.{2,8})(?:出发|启程|出行)[，,\s]*(?:去|到|前往)(.{2,8})/,
    /(?:出发地|起点)[:：]?(.{2,8}).*?(?:目的地|终点)[:：]?(.{2,8})/,
    /从(.{2,5})[到去](.{2,5})/,
    /(.{2,5})出发[，,到去]?(.{2,5})/,
    /(.{2,5})[→-](.{2,5})/,
    /起点[:：]?(.{2,5})[，,\s]终点[:：]?(.{2,5})/,
  ];
  for (const p of patterns) {
    const m = text.match(p);
    if (m) { origin = cleanPlaceText(m[1]); dest = cleanPlaceText(m[2]); break; }
  }

  // 人数：「2人」「两人」「3个人」「共4人」
  const CN_NUM = {'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  const pm = text.match(/([一两二三四五六七八九十\d]+)[人个名]/);
  if (pm) {
    const raw = pm[1];
    people = CN_NUM[raw] ?? parseInt(raw) ?? 2;
  }

  // 预算：「预算2000」「总预算3000元」「人均500」「500元/人」
  const bm = text.match(/人均\s*(\d+)|(\d+)\s*元[\/每]人|预算\s*(\d+)|总(?:预算|费用)\s*(\d+)/);
  if (bm) {
    const raw = parseInt(bm[1]||bm[2]||bm[3]||bm[4]);
    // 判断是人均还是总预算
    budget = (bm[1]||bm[2]) ? raw : Math.round(raw / people);  // 统一转为人均
  }

  return { origin, dest, people, budget };
}

}

};

function getRoutePath(originCity, destCity) {
  const key1 = `${originCity}-${destCity}`;
  const key2 = `${destCity}-${originCity}`;
  if (ROUTE_PATHS[key1]) return ROUTE_PATHS[key1];
  if (ROUTE_PATHS[key2]) return [...ROUTE_PATHS[key2]].reverse();
  return [originCity, destCity];  // 直达
}
