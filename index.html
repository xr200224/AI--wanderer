function buildRouteTrip(cities, people, budget, originCity, destCity) {
  // 从每个途经城市挑 1-2 个节点组成行程
  NODES.length = 0;
  Object.values(markers).forEach(m => m.marker.remove());
  Object.keys(markers).forEach(k => delete markers[k]);
  clearNearbyMarkers();
  currentId = null;

  let hour = 8, nodeId = 1;
  const allNearby = [];

  cities.forEach((cityName, ci) => {
    const cityData = CITY_DB[cityName];
    if (!cityData) return;

    // 驾车节点（非起点）
    if (ci > 0) {
      const prevCity = cities[ci - 1];
      const prevData = CITY_DB[prevCity];
      const rawDist = prevData
        ? haversine(prevData.center, cityData.center)
        : 100;
      const dist = Math.round(rawDist * 1.35); // 实际路程系数
      const durationMin = Math.round(dist / 0.9);  // 约90km/h均速
      const driveHours = durationMin / 60;
      const timeStr = formatTime(hour) + ' → ' + formatTime(hour + driveHours);
      hour += driveHours + 0.3;  // 加休息

      NODES.push({
        id: nodeId++,
        time: timeStr,
        name: `${prevCity} → ${cityName}`,
        desc: `自驾约 ${dist}km · 预计 ${Math.round(durationMin/60)}h${durationMin%60}min`,
        icon: '🚗', color: '#4A90D9', type: 'drive',
        coords: cityData.center,
        tag: '自驾', tagBg: '#EFF6FF', tagColor: '#4A90D9',
        fullName: `${prevCity} → ${cityName} 自驾段`,
        rating: null, reviewCount: null,
        fullDesc: `全程约 ${dist} 公里，建议沿途适当休息，每2小时停车10分钟。`,
        photoCats:[{label:'全部',photos:[
          {url:`https://loremflickr.com/800/520/china,highway,road/all?lock=${nodeId*7}`, caption:'沿途公路风光'},
          {url:`https://loremflickr.com/800/520/china,road,trip/all?lock=${nodeId*7+1}`, caption:'自驾旅途'},
        ]}],
        infoList:[
          {icon:'🛣️', label:'距离', value:`约 ${dist} km`, sub:''},
          {icon:'⏱️', label:'预计耗时', value:`${Math.round(durationMin/60)}h${durationMin%60}min`, sub:'含服务区休息'},
          {icon:'⛽', label:'油费估算', value:`约 ${Math.round(dist*0.07*8)}元`, sub:`按7L/百km·8元/L`},
        ],
        tags:['自驾路段','高速公路'],
      });
    }

    // 该城市挑 1-2 个景点
    const picks = cityData.nodes.slice(0, ci === 0 || ci === cities.length-1 ? 2 : 1);
    picks.forEach(n => {
      const sig = nodeId * 13;
      NODES.push({
        ...n,
        id: nodeId++,
        time: formatTime(hour),
        fullName: n.name,
        rating: parseFloat((4.2 + Math.random()*0.7).toFixed(1)),
        reviewCount: Math.floor(300 + Math.random()*1200),
        fullDesc: n.desc + `。位于${cityName}，是此次自驾沿途的精选打卡地。`,
        photoCats:[{label:'全部',photos:[
          {url:`https://loremflickr.com/800/520/${n.kw}/all?lock=${sig}`,   caption:`${n.name}实景`},
          {url:`https://loremflickr.com/800/520/${n.kw}/all?lock=${sig+1}`, caption:`${n.name}周边`},
          {url:`https://loremflickr.com/800/520/${n.kw}/all?lock=${sig+2}`, caption:cityName+'风光'},
        ]}],
        infoList:[
          {icon:'📍', label:'所在城市', value:cityName, sub:''},
          {icon:'🎫', label:'门票', value:n.desc.includes('免费')?'免费':n.desc.match(/票价\d+元/)?.[0]||'请现场确认', sub:''},
          {icon:'⏰', label:'建议游览', value:'1.5–2 小时', sub:''},
        ],
        tags:[n.tag,'沿途打卡','AI精选'],
      });
      hour += 2.5;
    });

    // 收集周边 POI
    if (cityData.nearby) allNearby.push(...cityData.nearby);
  });

  // 费用摘要节点
  const totalDist = calcTotalDist(cities);
  const fuelCost = Math.round(totalDist * 0.07 * 8);
  const tollCost = Math.round(totalDist * 0.05);
  const poiCost  = NODES.filter(n => n.type !== 'drive').reduce((s, n) => {
    const m = (n.desc||'').match(/票价(\d+)/);
    return s + (m ? parseInt(m[1]) : 0);
  }, 0);
  const totalPerPerson = fuelCost/people + tollCost/people + poiCost;
  const budgetOk = !budget || totalPerPerson <= budget;

  NODES.push({
    id: nodeId++,
    time: '行程总计',
    name: '💰 费用摘要',
    desc: `全程 ${totalDist}km · ${people}人 · 人均约 ${Math.round(totalPerPerson)}元`,
    icon: '📊', color: '#16A34A', type: 'summary',
    coords: CITY_DB[destCity]?.center || NODES[NODES.length-1]?.coords,
    tag: budgetOk ? '✅ 预算内' : '⚠️ 超预算',
    tagBg: budgetOk ? '#DCFCE7' : '#FEF2F2',
    tagColor: budgetOk ? '#16A34A' : '#DC2626',
    fullName: '费用明细',
    rating: null, reviewCount: null,
    fullDesc: `全程 ${totalDist}km，油费约 ${fuelCost}元，过路费约 ${tollCost}元，景点票价合计 ${poiCost}元/人。\n${people}人同行人均约 ${Math.round(totalPerPerson)}元。${budget ? (budgetOk ? `✅ 在人均${budget}元预算内。` : `⚠️ 超出人均${budget}元预算 ${Math.round(totalPerPerson-budget)}元。`) : ''}`,
    photoCats:[{label:'全部',photos:[{url:`https://loremflickr.com/800/520/china,travel,trip/all?lock=999`, caption:'旅途回忆'}]}],
    infoList:[
      {icon:'🛣️', label:'总里程', value:`${totalDist} km`, sub:`途经 ${cities.join('→')}`},
      {icon:'⛽', label:'油费', value:`约 ${fuelCost} 元`, sub:`${people}人分摊 ${Math.round(fuelCost/people)}元/人`},
      {icon:'🚧', label:'过路费', value:`约 ${tollCost} 元`, sub:`${people}人分摊 ${Math.round(tollCost/people)}元/人`},
      {icon:'🎫', label:'景点票价', value:`约 ${poiCost} 元/人`, sub:'各站门票合计'},
      {icon:'💰', label:'人均总费用', value:`约 ${Math.round(totalPerPerson)} 元`, sub: budget ? (budgetOk?`✅ 预算${budget}元内`:`⚠️ 超出${Math.round(totalPerPerson-budget)}元`):''},
    ],
    tags:['费用汇总','路线总览'],
  });

  // 地图：清旧 + 画新路线
  map.eachLayer(l => { if (l instanceof L.Polyline) map.removeLayer(l); });
  L.polyline(NODES.map(n=>n.coords), {color:'#4A90D9', weight:3.5, opacity:0.7, dashArray:'0'}).addTo(map);
  NODES.forEach(node => {
    const mkr = makeMarker(node, false);
    mkr.on('click', ()=>focusNode(node.id, true));
    markers[node.id] = {marker:mkr, node, domEl:null};
  });

  addNearbyMarkers(allNearby, cities);
  fitMapToNodes(true);

  // 完成提示
  const stepsEl = document.getElementById('plan-steps');
  if (stepsEl) stepsEl.innerHTML +=
    `<div style="color:#16A34A;font-weight:700;margin-top:8px">
      ✅ 路线规划完成！${cities.join('→')} · 全程${totalDist}km · ${NODES.length-1}个节点
     </div>`;
  setTimeout(() => {
    document.getElementById('planning-status')?.remove();
    renderTimeline();
  }, 900);
}

// ── 工具函数 ──
function haversine([lat1,lng1], [lat2,lng2]) {
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function calcTotalDist(cities) {
  // 过滤出在 CITY_DB 中的城市，跳过途经但未收录的城市
  const known = cities.filter(c => CITY_DB[c]);
  if (known.length < 2) {
    // 找不到两个已知城市时，用第一个和最后一个估算直线距离
    const first = CITY_DB[cities[0]]?.center;
    const last  = CITY_DB[cities[cities.length-1]]?.center;
    if (first && last) return Math.round(haversine(first, last) * 1.35); // 系数补偿实际路程
    return 0;
  }
  let dist = 0;
  for (let i = 1; i < known.length; i++) {
    dist += haversine(CITY_DB[known[i-1]].center, CITY_DB[known[i]].center);
  }
  return Math.round(dist * 1.35); // 路程系数：实际行驶距离 ≈ 直线距离 × 1.35
}
function formatTime(h) {
  const total = ((h % 24) + 24) % 24;
  const hh = Math.floor(total).toString().padStart(2,'0');
  const mm = Math.round((total%1)*60).toString().padStart(2,'0');
  return `${hh}:${mm}`;
}

function isDestinationDiscoveryQuery(text) {
  return /发现目的地|目的地推荐|适合去哪|去哪里玩|去哪儿玩|去哪玩最合适|这个月去哪/.test(text || '');
}

function isPlanStarterQuery(text) {
  const value = String(text || '').trim();
  if (!/规划行程|制定行程|做行程|安排行程/.test(value)) return false;
  return !detectCity(value) && !/从.+到|出发|目的地|去[\u4e00-\u9fa5]{2,6}|几天|几日|\d+\s*天|\d+\s*日/.test(value);
}

function extractOriginHintForDiscover(text) {
  const value = String(text || '');
  const route = parseRouteInput(value);
  const fromRoute = findCity(route.origin);
  if (fromRoute) return fromRoute;
  const match = value.match(/(?:我在|从|出发地|当前位置|现在在)\s*([\u4e00-\u9fa5]{2,6})/);
  if (match) return findCity(match[1]) || match[1].replace(/[市省区县]$/g, '');
  return '';
}

async function fetchDestinationDiscover(text) {
  const month = new Date().getMonth() + 1;
  const origin = extractOriginHintForDiscover(text);
  const url = `${TRIPADVISOR_PROXY_BASE}/api/destination/discover?` +
    `month=${month}&origin=${encodeURIComponent(origin)}&limit=6`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 70000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !data.ok) {
      throw new Error((data && data.error) || `HTTP ${res.status}`);
    }
    return data;
  } finally {
    clearTimeout(timer);
  }
}

async function renderDestinationDiscover(text) {
  try {
    const data = await fetchDestinationDiscover(text);
    const month = data.month || (new Date().getMonth() + 1);
    const cards = (data.items || []).map((item, index) => {
      const meta = [
        item.rating ? `${escapeHTML(item.rating)}分` : '',
        item.review_count ? `${escapeHTML(item.review_count)}条评价` : '',
        item.top_poi ? `热门：${escapeHTML(item.top_poi)}` : '',
      ].filter(Boolean).join('｜') || '已联网筛选当季口碑';
      const source = item.source_title ? `来源：${escapeHTML(item.source_title)}` : '来源：实时搜索 + TripAdvisor/RapidAPI';
      return `
        <div class="discover-card">
          <img class="discover-img" src="${escapeHTML(item.image_url)}" alt="${escapeHTML(item.city)}" onerror="handlePlaceImageError(this, '${escapeHTML(item.city)}', '${escapeHTML(item.city)}')">
          <div class="discover-main">
            <div class="discover-topline">
              <div class="discover-city">${index + 1}. ${escapeHTML(item.city)}</div>
              <div class="discover-badge">${escapeHTML(item.fit || '当季推荐')}</div>
            </div>
            <div class="discover-theme">${escapeHTML(item.title || item.season || '当季旅行目的地')}</div>
            <div class="discover-reason">${escapeHTML(item.reason || '')}</div>
            <div class="discover-meta">${meta}</div>
            <div class="discover-source">${source}</div>
            <div class="discover-actions">
              <div class="discover-score">匹配度 ${Math.round(item.score || 80)}</div>
              <button class="discover-btn" onclick="event.stopPropagation();quickAsk('去${escapeHTML(item.city)}玩2天')">生成方案</button>
            </div>
          </div>
        </div>`;
    }).join('');
    const sourceList = (data.search_results || []).slice(0, 2).map(r => escapeHTML(r.title)).filter(Boolean).join('、');
    const html = `
      <div class="discover-result">
        <div class="discover-head">
          <div class="discover-title">${month}月最适合出发的目的地</div>
          <div class="discover-sub">已按当前月份自动筛选：${escapeHTML(data.focus || '季节舒适度、景观窗口、平台口碑')}。${data.origin ? `出发地参考：${escapeHTML(data.origin)}。` : ''}${sourceList ? `参考检索：${sourceList}` : ''}</div>
        </div>
        ${cards || '<div class="discover-sub">没有拿到可用目的地结果，请稍后重试。</div>'}
      </div>`;
    swapThinkingToPlan(html);
  } catch (err) {
    const message = err && err.name === 'AbortError'
      ? '联网检索超过 70 秒，本次请求已超时。请稍后再试，或检查本地代理和网络。'
      : `没有从本地联网代理拿到数据：${escapeHTML(err.message || err)}。请确认 127.0.0.1:8787 的代理服务正在运行。`;
    swapThinkingToPlan(`
      <div class="discover-result">
        <div class="discover-head">
          <div class="discover-title">实时目的地检索失败</div>
          <div class="discover-sub">${message}</div>
        </div>
      </div>`);
  }
}

function handleSend() {
  const v = document.getElementById('ai-input').value.trim();
  if (!v) return;
  document.getElementById('ai-input').value = '';
  syncInputState();
  rememberConversation(v);

  // 切到对话标签，展开抽屉
  switchTab('chat');
  snap(SNAP.max);

  // 显示用户气泡
  addUserBubble(v);

  if (isDestinationDiscoveryQuery(v)) {
    const month = new Date().getMonth() + 1;
    const origin = extractOriginHintForDiscover(v);
    const steps = [
      `正在识别当前月份：${month}月…`,
      '🌐 正在联网检索当季旅行目的地攻略…',
      '🧊 正在按天气舒适度、景观窗口和错峰程度筛选…',
      '⭐ 正在补充 TripAdvisor/RapidAPI 评分与评价数据…',
      origin ? `📍 正在结合出发地：${origin}` : '🧭 正在生成适合本月出发的推荐…',
    ];
    addThinkingBubble(steps);
    setTimeout(() => renderDestinationDiscover(v), thinkDelay(steps));
    return;
  }

  if (isPlanStarterQuery(v)) {
    addPlainAssistantText('收到！请先告诉我你有没有特别想去的目的地？我可以帮你更精准地推荐路线哦～');
    return;
  }

  // 天气指令
  if (['天气变差','下雨','雨天','坏天气','变天'].some(k=>v.includes(k))) {
    addAIBubble(`
      <div class="ai-section">
        <div class="ai-section-title">🌧️ 雨天方案已启用</div>
        <div class="ai-item">户外景点已替换为室内备选方案</div>
        <div class="ai-item">地图标记颜色已同步更新</div>
      </div>`);
    return;
  }
  if (['天气好转','放晴','晴天'].some(k=>v.includes(k))) {
    addAIBubble('☀️ 天气好转！已恢复晴天行程方案。');
    return;
  }

  // 路线规划模式
  const requestedDays = parseTripDays(v);
  const { origin, dest, people, budget } = parseRouteInput(v);
  const originCity = findCity(origin);
  const destCity   = findCity(dest);

  // ユーザー入力の要点を識別
  const intent = parseIntent(v);
  if (intent.hotelBudget) userHotelBudget = intent.hotelBudget;

  if (originCity && destCity && originCity !== destCity) {
    const steps = buildThinkSteps(destCity, intent);
    addThinkingBubble(steps);
    setTimeout(() => renderRoutePlanOptions(originCity, destCity, people, budget, requestedDays, intent), thinkDelay(steps));
    return;
  }

  // 单城市模式
  const city = detectCity(v) || (requestedDays > 1 ? lastPlannedCity : null) || lastPlannedCity;

  if (city && CITY_DB[city] && isHybridPOIQuery(v)) {
    const keyword = keywordFromUserText(v, city);
    const steps = [
      '正在识别城市与游玩偏好…',
      `🎯 已锁定城市：${city}`,
      `🔎 调用 Search_POI_Database 查询：${keyword}`,
      '🌐 正在检索实时地点资料与公开实景图…',
      '🧩 正在组装图文说明和交互卡片…',
    ];
    addThinkingBubble(steps);
    setTimeout(() => renderHybridPOIRecommendation(city, keyword, intent), thinkDelay(steps));
    return;
  }

  // 住宿（住哪）需求：酒店推荐に分岐
  if (intent.lodging && city) {
    lastPlannedCity = city;
    const steps = buildThinkSteps(city, intent);
    addThinkingBubble(steps);
    setTimeout(() => renderHotelRecommendation(city, intent), thinkDelay(steps));
    return;
  }

  if (city && CITY_DB[city]) {
    const steps = buildThinkSteps(city, intent);
    addThinkingBubble(steps);
    setTimeout(() => renderPlanOptions(city, requestedDays, intent), thinkDelay(steps));
    return;
  }

  // 未识别
  addAIBubble(`
    抱歉，暂时没有理解您的需求 🤔<br><br>
    <div class="ai-section">
      <div class="ai-section-title">💡 试试这些格式：</div>
      <div class="ai-item">🏙️ 单城市：<b>去成都</b>、<b>重庆两天</b>、<b>两天</b></div>
      <div class="ai-item">🛣️ 路线：<b>从西安到成都，3人，预算1500元</b></div>
      <div class="ai-item">🌧️ 天气：<b>天气变差</b>（切换室内方案）</div>
    </div>
    支持城市：${Object.keys(CITY_DB).join('、')}
  `);
}

function isGenericPhotoKw(kw) {
  return /(?:^|,)food(?:,|$)|street|travel|landmark|china,city|city,night/.test(String(kw || ''));
}

function spotKw(place, city) {
  const target = placeImageTarget(place || {});
  const name = (target && target.name) || '';
  for (const k of Object.keys(LANDMARK_KW).sort((a, b) => b.length - a.length)) {
    if (name.includes(k)) return LANDMARK_KW[k];
  }
  if (target && target.kw && !isGenericPhotoKw(target.kw)) return target.kw;
  return `${cityKw(city)},china,landmark`;
}

function nodeSearchText(node) {
  return `${node?.name || ''}${node?.tag || ''}${node?.desc || ''}${node?.icon || ''}`;
}

function imageCueKeywords(city, themeCat, audience, cover, intent) {
  const source = `${intent?.rawText || ''}${themeCat || ''}${audience || ''}`;
  const rule = IMAGE_CUE_RULES.find(r => r.re.test(themeCat || ''))
    || IMAGE_CUE_RULES.find(r => r.re.test(source));
  if (!rule) return '';
  if (city === '成都' && /亲子|带娃|孩子|熊猫/.test(source)) return 'giant,panda,chengdu,park';
  return `${cityKw(city)},${rule.kw}`;
}

function coverScoreByText(node, theme, intent) {
  const text = intent?.rawText || '';
  const hay = nodeSearchText(node);
  let score = 0;
  if (text && node?.name && text.includes(node.name.split(/[·•・,，]/)[0])) score += 24;
  if (theme?.match?.(node)) score += 20;
  IMAGE_CUE_RULES.forEach(rule => {
    if (rule.re.test(text) && rule.node.test(hay)) score += 16;
  });
  if (/亲子|带娃|孩子|家庭/.test(text) && /熊猫|公园|博物|乐园|体验/.test(hay)) score += 10;
  return score;
}

function coverIdentities(node) {
  const name = node?.name || '';
  return uniquePhotos([
    name,
    spotSearchTerm(node),
    ...name.split(/[·•・,，/／｜|（）()]/).map(s => s.trim()).filter(Boolean),
  ]);
}

function markCoverUsed(usedCovers, node) {
  if (!usedCovers || !node) return;
  coverIdentities(node).forEach(id => usedCovers.add(id));
}

function isCoverFresh(usedCovers, node) {
  if (!usedCovers || !node) return true;
  return !coverIdentities(node).some(id => usedCovers.has(id));
}

function pickPlanCover(picks, city, theme, intent, usedCovers) {
  const candidates = picks.filter(Boolean);
  const allRanked = candidates
    .map(p => ({ node:p, score:coverScoreByText(p, theme, intent) }))
    .sort((a, b) => b.score - a.score);
  if (usedCovers) {
    const freshRanked = allRanked.filter(x => isCoverFresh(usedCovers, x.node));
    if (freshRanked[0]?.score > 0) return freshRanked[0].node;
    if (freshRanked[0]) return freshRanked[0].node;
  }
  if (allRanked[0]?.score > 0) return allRanked[0].node;
  const fresh = candidates.filter(p => isCoverFresh(usedCovers, p));
  const pool = fresh.length ? fresh : candidates;
  const ranked = pool
    .map(p => ({ node:p, score:coverScoreByText(p, theme, intent) }))
    .sort((a, b) => b.score - a.score);
  return ranked[0]?.node || candidates[0];
}

function planCoverKeywords(cover, city, themeCat, audience, intent) {
  const cue = imageCueKeywords(city, themeCat, audience, cover, intent);
  const base = spotKw(cover, city);
  return cue ? `${base},${cue}` : base;
}

const SPOT_PHOTO_CACHE = {};
function isBadCoverUrl(url) {
  const text = decodeURIComponent(String(url || '')).toLowerCase();
  return !text
    || /\.pdf($|\?)|\/pdf\//i.test(text)
    || /\.(svg|gif)($|\?)/i.test(text)
    || /hanbin,\s*ankang,\s*shaanxi,\s*china\s*-\s*panoramio\s*-\s*monicker|\/cat[\W_]|black[_-]?cat|gato|猫|djvu|webm|montage|collage|cadal|page\d|stamp|seal|logo|icon|map|diagram|scan|manuscript|document|poster|ticket|calligraphy|coin|banknote|plate|signboard/.test(text);
}

async function fetchSpotPhotos(term, limit = 18) {
  if (!term) return [];
  if (SPOT_PHOTO_CACHE[term]) return SPOT_PHOTO_CACHE[term];
  const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search` +
    `&gsrsearch=${encodeURIComponent(term)}&gsrnamespace=6&gsrlimit=${limit}` +
    `&prop=imageinfo&iiprop=url&iiurlwidth=900&format=json&origin=*`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    const pages = (data.query && data.query.pages) || {};
    const urls = Object.values(pages)
      .sort((a, b) => (a.index || 0) - (b.index || 0))
      .map(p => p.imageinfo && p.imageinfo[0] && p.imageinfo[0].thumburl)
      .filter(u => u && /\.(jpe?g|png)/i.test(u) && !isBadCoverUrl(u));
    const uniq = [...new Set(urls)];
    SPOT_PHOTO_CACHE[term] = uniq;
    return uniq;
  } catch (e) { return []; }
}

function uniquePhotos(urls) {
  return [...new Set((urls || []).filter(Boolean))];
}

function precisePlaceTerms(place, city, includeCityFallback = true) {
  const cn = spotSearchTerm(place);
  const en = spotKw(place, city).replace(/,/g, ' ');
  return uniquePhotos([
    cn && city ? `${cn} ${city}` : cn,
    cn,
    en && city ? `${en} ${city}` : en,
    includeCityFallback ? city : '',
  ]);
}

async function searchPlacePhotos(place, city, limit = 12, options = {}) {
  const terms = precisePlaceTerms(place, city, options.includeCityFallback !== false);
  let urls = [];
  for (const term of terms) {
    const found = await fetchSpotPhotos(term, limit);
    urls = uniquePhotos([...urls, ...found]);
    if (urls.length >= Math.min(4, limit)) break;
  }
  return urls.slice(0, limit);
}

// 景点の实景ギャラリー：景点名で取得し、少なければ都市名の实景で補完（重複なし）
async function getRealGallery(place, city, options = {}) {
  const includeCityFallback = options.includeCityFallback !== false;
  let urls = await searchPlacePhotos(place, city, 20, { includeCityFallback });
  if (urls.length < 10 && city && includeCityFallback) {
    const extra = await fetchSpotPhotos(city, 20);
    urls = uniquePhotos([...urls, ...extra]);
  }
  return urls.slice(0, 20);
}

function planCoverCandidates(plan, index = 0) {
  const place = plan.coverPlace || { name: plan.coverTerm, kw: plan.coverKw };
  const lock = (plan.lock || 100) + index * 17;
  const placeKw = spotKw(place, plan.city);
  const cityTravel = `${cityKw(plan.city)},china,travel,landmark`;
  return uniquePhotos([
    `https://loremflickr.com/900/620/${placeKw}/all?lock=${lock}`,
    `https://loremflickr.com/900/620/${plan.coverKw || placeKw}/all?lock=${lock + 5}`,
    `https://loremflickr.com/900/620/${cityTravel}/all?lock=${lock + 11}`,
  ]).filter(u => !isBadCoverUrl(u));
}

function shouldUseWikimediaPlanCover(plan) {
  return !['安康'].includes(plan.city);
}

async function resolvePlanCover(plan, used, index = 0) {
  const place = plan.coverPlace || { name: plan.coverTerm, kw: plan.coverKw };
  const curated = curatedPlanCover(place, plan.city, plan);
  if (curated && !used.has(curated) && !isBadCoverUrl(curated)) return curated;

  if (shouldUseWikimediaPlanCover(plan)) {
    const realPhotos = (await searchPlacePhotos(place, plan.city, 12, { includeCityFallback: false }))
      .filter(u => !isBadCoverUrl(u));
    const realCover = realPhotos.find(u => !used.has(u));
    if (realCover) return realCover;
  }

  const candidates = planCoverCandidates(plan, index);
  return candidates.find(u => !used.has(u)) || candidates[0] || fallbackPlanCoverUrl(plan);
}

async function preparePlanCovers(plans) {
  const used = new Set();
  for (const [i, plan] of (plans || []).entries()) {
    const url = await resolvePlanCover(plan, used, i);
    used.add(url);
    plan.coverUrl = url;
  }
}

const TRIPADVISOR_PLACE_CACHE = {};
async function applyTripAdvisorPhotosToPlaces(places, city) {
  await Promise.all((places || []).map(async place => {
    const target = placeImageTarget(place || {});
    const query = target.name || place.name;
    if (!query) return;
    const cacheKey = `${city}:${query}`;
    let hit = TRIPADVISOR_PLACE_CACHE[cacheKey];
    if (!hit) {
      const items = await fetchTripAdvisorPOIs(city, query, 1);
      hit = items && items[0];
      TRIPADVISOR_PLACE_CACHE[cacheKey] = hit || null;
    }
    const source = hit && hit.source_node;
    const apiPhotos = source?.photoCats?.[0]?.photos || [];
    if (apiPhotos.length) {
      place.photoCats[0].photos = apiPhotos.map((p, i) => ({
        url: p.url,
        caption: `${place.name} · TripAdvisor 实景 ${i + 1}`,
      }));
    }
    if (hit?.content_id) place.content_id = hit.content_id;
    if (hit?.content_type) place.content_type = hit.content_type;
    if (hit?.rating) place.rating = parseFloat(hit.rating) || place.rating;
    const reviewCount = parseInt(String(hit?.heat || '').replace(/[^\d]/g, ''), 10);
    if (reviewCount) place.reviewCount = reviewCount;
  }));
}

function poiMatchesKeyword(poi, keyword) {
  const hay = nodeSearchText(poi);
  if (!keyword || keyword === '经典打卡') return true;
  if (/网红|拍照|出片/.test(keyword)) return /网红|夜景|夜游|古街|街区|观景|灯|🌃|🏮/.test(hay);
  if (/历史|人文|古迹|博物|文化/.test(keyword)) return /历史|人文|古迹|博物|文化|寺|庙|塔|陵|遗址|🏛️|🏯/.test(hay);
  if (/自然|山水|风景|户外|公园/.test(keyword)) return /自然|山|湖|河|海|公园|景区|峡谷|🌊|⛰️|🌿/.test(hay);
  if (/美食|吃|小吃|火锅|夜宵/.test(keyword)) return /美食|餐|面|火锅|小吃|街|🌶️|🍜|🥣/.test(hay);
  if (/亲子|带娃|儿童|家庭/.test(keyword)) return /熊猫|公园|博物|乐园|体验|动物|🐼|🎭/.test(hay);
  return hay.includes(keyword);
}

function priceFromPoi(poi) {
  const desc = poi.desc || '';
  if (/免费/.test(desc)) return '免费';
  const ticket = desc.match(/(?:票价|门票)(\d+(?:\.\d+)?)元/);
  if (ticket) return `¥${ticket[1]}起`;
  const per = desc.match(/人均(\d+(?:\.\d+)?)元/);
  if (per) return `人均 ¥${per[1]}`;
  return '现场确认';
}

const TRIPADVISOR_PROXY_BASE = (
  localStorage.getItem('tripadvisorProxyBase') ||
  (location.protocol === 'file:' ? 'http://127.0.0.1:8787' : location.origin)
).replace(/\/$/, '');

function rapidApiCategoryFromKeyword(keyword) {
  if (/酒店|住宿|民宿|宾馆|客栈/.test(keyword || '')) return 'hotels';
  if (/美食|餐厅|吃|小吃|火锅|早茶|咖啡|饭店/.test(keyword || '')) return 'restaurants';
  return 'attractions';
}

function tripAdvisorHeat(item, index) {
  const count = parseInt(String(item.review_count || '').replace(/[^\d]/g, ''), 10);
  if (count) {
    if (count >= 10000) return `${(count / 10000).toFixed(1)}万+`;
    return `${count}+`;
  }
  return `${(1.1 + index * 0.3).toFixed(1)}万+`;
}

async function fetchTripAdvisorPOIs(city, keyword, limit = 4) {
  const category = rapidApiCategoryFromKeyword(keyword);
  const url = `${TRIPADVISOR_PROXY_BASE}/api/tripadvisor/search?` +
    `city=${encodeURIComponent(city)}&keyword=${encodeURIComponent(keyword || '景点')}` +
    `&category=${encodeURIComponent(category)}&limit=${limit}`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) return [];
    const data = await res.json();
    if (!data.ok || !Array.isArray(data.items)) return [];
    return data.items
      .filter(item => item && item.name)
      .slice(0, limit)
      .map((item, i) => {
        const rating = item.rating || '4.6';
        const reviews = item.review_count ? `${item.review_count}条点评` : 'TripAdvisor 数据';
        const img = item.image_url || `https://loremflickr.com/800/520/${cityKw(city)},travel,landmark/all?lock=${stableHash(item.name) % 900}`;
        const node = {
          name: item.name,
          desc: item.category || item.ranking || reviews,
          city,
          content_id: item.content_id || item.id || '',
          content_type: item.content_type || category.replace(/s$/, ''),
          kw: `${cityKw(city)},${item.name},tripadvisor`,
          tag: category === 'hotels' ? '酒店' : category === 'restaurants' ? '美食' : '景点',
          coords: item.latitude && item.longitude ? [parseFloat(item.latitude), parseFloat(item.longitude)] : (CITY_DB[city]?.center || [0, 0]),
          photoCats: [{ label:'全部', photos:(item.images && item.images.length ? item.images : [img]).map((url, idx) => ({ url, caption:`${item.name} · TripAdvisor ${idx + 1}` })) }],
        };
        return {
          poi_id: `tripadvisor_${item.id || i}`,
          content_id: item.content_id || item.id || '',
          content_type: item.content_type || category.replace(/s$/, ''),
          poi_name: item.name,
          card_title: item.name,
          style_title: category === 'hotels' ? 'TripAdvisor 酒店推荐' : category === 'restaurants' ? 'TripAdvisor 美食推荐' : 'TripAdvisor 热门地点',
          highlight: item.ranking || item.category || `${rating}分，${reviews}`,
          address: item.address || `${city} · ${item.name}`,
          open_time: '以 TripAdvisor/商家实时信息为准',
          suggest_time: category === 'restaurants' ? '1-2小时' : '2-3小时',
          price: item.price || '查看',
          rank: item.ranking || `${city}TripAdvisor推荐第${i + 1}名`,
          heat: tripAdvisorHeat(item, i),
          rating,
          district: item.address || `${city} · TripAdvisor`,
          card_rank: item.ranking || `${city}TripAdvisor推荐 · 第${i + 1}名`,
          action_text: item.url ? '查看' : '详情',
          img_url: img,
          source_url: item.url,
          source_node: node,
        };
      });
  } catch (e) {
    return [];
  } finally {
    clearTimeout(timer);
  }
}

async function fetchTripAdvisorReviews(place, limit = 8) {
  if (!place) return null;
  const known = knownTripAdvisorContent(place);
  const contentId = place.content_id || known?.id || '';
  const category = place.content_type || known?.type || (place.tag === '酒店' ? 'hotels' : place.tag === '美食' ? 'restaurants' : 'attractions');
  const params = new URLSearchParams({
    city: place.city || destCity || '',
    name: place.fullName || place.name || '',
    category,
    contentId,
    limit: String(limit),
  });
  const url = `${TRIPADVISOR_PROXY_BASE}/api/tripadvisor/reviews?${params.toString()}`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) return null;
    const data = await res.json();
    return data.ok ? data : null;
  } catch (e) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function Search_POI_Database(city, keyword) {
  const data = CITY_DB[city];
  if (!data) return [];
  const curated = curatedPOIData(city, keyword);
  if (curated) {
    return Promise.all(curated.map(async (p, i) => {
      const photos = await searchPlacePhotos({ name:p.poi_name, kw:p.kw }, city, 6);
      return {
        ...p,
        name: p.poi_name,
        img_url: photos[0] || `https://loremflickr.com/800/520/${p.kw}?lock=${220 + i}`,
        source_node: { ...p, name: p.poi_name },
      };
    }));
  }
  const tripAdvisorPois = await fetchTripAdvisorPOIs(city, keyword, 4);
  if (tripAdvisorPois.length) return tripAdvisorPois;

  const micro = (typeof MICRO_POI_DB !== 'undefined' && MICRO_POI_DB[city]) || [];
  let pool = [...(data.nodes || []), ...(data.nearby || []), ...micro].filter(isAttraction);
  let picks = pool.filter(p => poiMatchesKeyword(p, keyword));
  picks = dedupeByName((picks.length ? picks : pool).slice(0, 8)).slice(0, 4);
  const hydrated = await Promise.all(picks.map(async (p, i) => {
    const photos = await searchPlacePhotos(p, city, 6);
    const price = priceFromPoi(p);
    const rankCat = rankCategory({ ...p, city });
    return {
      poi_id: `${city}_${i + 1}_${(p.name || '').replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '')}`,
      poi_name: p.name,
      highlight: (p.desc || '本地热门推荐').replace(/·/g, '，'),
      address: `${city} · ${p.name}`,
      open_time: /夜|酒吧|夜市|不夜城/.test(nodeSearchText(p)) ? '建议傍晚至夜间前往' : '以景区当日公示为准',
      suggest_time: /大型|景区|博物|公园|山|湖/.test(nodeSearchText(p)) ? '2-3小时' : '1-2小时',
      price,
      rank: `${city}${rankCat}榜第${i + 1}名`,
      heat: `${(1.2 + i * 0.4).toFixed(1)}万+`,
      img_url: photos[0] || `https://loremflickr.com/800/520/${spotKw(p, city)}?lock=${120 + i}`,
      source_node: p,
    };
  }));
  return hydrated;
}

// 实景写真をカバー要素（img / 背景）に遅延適用（景点→都市の順でフォールバック）
async function hydrateRealCovers(root) {
  if (!root) return;
  const used = new Set();                  // 同一ビュー内で画像の重複を回避
  const els = root.querySelectorAll('[data-term]');
  for (const el of els) {
    if (el.classList.contains('plan-card') || el.dataset.coverLocked === 'true') continue;
    let photos = await fetchSpotPhotos(el.dataset.term, 10);
    if (photos.length < 3 && el.dataset.city) {
      const extra = await fetchSpotPhotos(el.dataset.city, 10);
      photos = [...new Set([...photos, ...extra])];
    }
    if (photos && photos.length) {
      const u = photos.find(p => !used.has(p)) || photos[0];
      used.add(u);
      if (el.tagName === 'IMG') el.src = u;
      else el.style.backgroundImage = `url('${u}')`;
    }
  }
}

// 住宿（どこに泊まる）を尋ねる意図か（行程プラン要求は除外）
function isLodgingQuery(text) {
  const wantStay = /住哪|住哪里|住哪儿|住在哪|哪里住|哪儿住|怎么住|住什么|订酒店|找酒店|订房|订个酒店|酒店推荐|住宿推荐|住宿建议|住的地方|落脚|住宿$/.test(text);
  const wantTrip = /行程|路线|怎么玩|景点|攻略|规划|日游|游玩|玩几天|几日|几天玩|玩.*天/.test(text);
  return wantStay && !wantTrip;
}
function parseIntent(text) {
  const themePrefs = THEME_PREF_MAP.filter(t => t.re.test(text)).map(t => t.cat);
  const audience = (AUDIENCE_MAP.find(x => x.re.test(text)) || {}).a || null;
  const CN_NUM = {'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  const pm = text.match(/([一两二三四五六七八九十\d]+)\s*[人个名]/);
  const people = pm ? (CN_NUM[pm[1]] || parseInt(pm[1]) || null) : null;
  return { rawText:text, days: parseTripDays(text), people, themePrefs, audience, hotelBudget: parseHotelBudget(text), lodging: isLodgingQuery(text) };
}
// 識別した要点から「AI思考」一行ステップを組み立て
function buildThinkSteps(city, intent) {
  const steps = ['正在理解你的需求…'];
  if (city) steps.push(`🎯 已锁定目的地：${city}`);
  if (intent.lodging) {
    steps.push('🏨 识别到「住哪」住宿需求');
    if (intent.hotelBudget) steps.push(`💰 预算：¥${intent.hotelBudget} 左右`);
    steps.push('🔎 综合全网平台查询酒店…');
    steps.push('📍 按热门住宿商圈为你筛选…');
    return steps;
  }
  if (intent.days) steps.push(`📅 行程 ${intent.days} 日 · 规划每日上午/下午/晚上`);
  if (intent.themePrefs.length) steps.push(`✨ 识别到偏好：${intent.themePrefs.join('、')}`);
  if (intent.audience) steps.push(`👥 出行人群：${intent.audience}`);
  if (intent.people) steps.push(`🧑‍🤝‍🧑 同行 ${intent.people} 人`);
  if (intent.hotelBudget) steps.push(`🏨 住宿预算：¥${intent.hotelBudget} 左右`);
  steps.push('🌐 正在全网检索地点资料与公开实景图…');
  steps.push('🖼️ 正在按具体地点匹配更好看的配图…');
  steps.push('🧭 正在为你生成专属方案…');
  return steps;
}
function thinkDelay(steps) { return Math.min(3600, 700 + steps.length * 430); }

}

// 住宿予算をユーザー入力から抽出（「住宿300」「酒店预算500」「200左右的酒店」等）
let userHotelBudget = null;
function parseHotelBudget(text) {
  if (!text) return null;
  let m = text.match(/(?:住宿|酒店|住|房费|房价)[预算费]*\s*[约]?\s*(\d{2,5})/);
  if (m) return parseInt(m[1]);
  m = text.match(/(\d{2,5})\s*元?\s*(?:左右|上下|以内|以下|档)?\s*的?\s*(?:住宿|酒店|宾馆|房)/);
  if (m) return parseInt(m[1]);
  return null;
}

// 都市の方案リストを合成（最大6件）
// 出発点/移動/集合などは「景点」ではない → 推荐去处から除外
function isAttraction(n) {
  if (!n) return false;
  if (n.type === 'drive' || n.type === 'summary') return false;
  if (['出发点','集合','自驾','交通','返程'].includes(n.tag)) return false;
  if (/出发|市区出发|集合|返程|抵达|出发点|火车站|机场|高铁站/.test(n.name || '')) return false;
  return true;
}

// 景点が天数に満たない時の补充スポット（都市汎用）
const FILLER_SPOTS = [
  { suffix:'老街漫步',   kw:'old,street',   tag:'古街' },
  { suffix:'城市公园',   kw:'park',         tag:'公园' },
  { suffix:'特色美食街', kw:'food,street',  tag:'美食' },
  { suffix:'艺术街区',   kw:'art,district', tag:'艺术' },
  { suffix:'滨江步道',   kw:'riverside',    tag:'体验' },
  { suffix:'城市博物馆', kw:'museum',       tag:'博物馆' },
  { suffix:'热闹夜市',   kw:'night,market', tag:'夜游' },
  { suffix:'城市观景台', kw:'viewpoint',    tag:'夜景' },
];
function makeFillerSpots(city, n, startIdx = 0) {
  const out = [];
  for (let k = 0; k < n; k++) {
    const f = FILLER_SPOTS[(startIdx + k) % FILLER_SPOTS.length];
    out.push({
      name: `${city}${f.suffix}`, desc: `${city}${f.suffix}·自由体验`,
      icon: '📍', color: '#7B61FF', tag: f.tag, kw: `${cityKw(city)},${f.kw}`,
    });
  }
  return out;
}

function buildCityPlans(city, days = 1, intent = null) {
  const data = CITY_DB[city];
  if (!data) return [];
  const micro = (typeof MICRO_POI_DB !== 'undefined' && MICRO_POI_DB[city]) || [];
  const pool = [...(data.nodes || []), ...(data.nearby || []), ...micro].filter(isAttraction);
  const target = Math.max(3, (days || 1) * 3);   // 每天 上午/下午/晚上 = 3 行程
  const plans = [];
  const usedCovers = new Set();
  PLAN_THEMES.forEach((theme, ti) => {
    let picks = pool.filter(theme.match);
    picks = picks.concat(pool.filter(n => !picks.includes(n)));
    picks = dedupeByName(picks);
    if (picks.length < 2) return;
    // 天数ぶん（3×days）になるよう补充して、各日に上午/下午/晚上を確保
    if (picks.length < target) picks = picks.concat(makeFillerSpots(city, target - picks.length, picks.length));
    picks = picks.slice(0, target);
    // カバーは方案ごとに異なる景点を優先（画像の重複回避）
    const cover = pickPlanCover(picks, city, theme, intent, usedCovers);
    markCoverUsed(usedCovers, cover);
    const id = `plan_${++__planSeq}`;
    const routeLock = picks.reduce((s, p, k) => s + ((p.name || '').length) * (k + 3), ti * 13);
    const audience = intent?.audience || PLAN_AUDIENCE[ti % PLAN_AUDIENCE.length];
    const plan = {
      id, city, days,
      themeTitle: themeTitleFor(city, theme.cat, theme.title),
      themeCat: theme.cat,
      audience,
      coverKw: planCoverKeywords(cover, city, theme.cat, audience, intent),
      coverTerm: spotSearchTerm(cover),
      coverPlace: cover,
      lock: routeLock,
      nodes: picks,
    };
    window.__PLANS[id] = plan;
    plans.push(plan);
  });
  return plans.slice(0, 6);
}

function dedupeByName(arr) {
  const seen = new Set(); const out = [];
  arr.forEach(n => { if (!seen.has(n.name)) { seen.add(n.name); out.push(n); } });
  return out;
}

function planRouteText(plan) {
  return (plan.nodes || [])
    .slice(0, Math.max(3, Math.min(5, (plan.days || 1) * 3)))
    .map(n => n.name)
    .join(' - ');
}

function planCardHTML(plan) {
  const url = plan.coverUrl || fallbackPlanCoverUrl(plan);
  return `

        <div class="plan-card-cat">${plan.themeCat}｜${plan.audience}</div>

    </div>`;
}

// ユーザー嗜好に合わせて方案を並べ替え・同行者反映
function applyIntentToPlans(plans, intent) {
  if (!intent) return plans;
  if (intent.audience) plans.forEach(p => p.audience = intent.audience);
  if (intent.themePrefs && intent.themePrefs.length) {
    plans.forEach(p => p._match = intent.themePrefs.includes(p.themeCat) ? 1 : 0);
    plans.sort((a, b) => b._match - a._match);
  }
  return plans;
}
function intentFocusText(intent) {
  if (!intent) return '';
  const bits = [...(intent.themePrefs || []), intent.audience].filter(Boolean);
  return bits.length ? `已根据你的偏好（${bits.join('、')}）优先排序，` : '';
}

// 跨城の方案提示（3テーマのルート方案）
async function renderRoutePlanOptions(originCity, destCity, people, budget, days = 1, intent = null) {
  lastPlannedCity = destCity;
  const cities = getRoutePath(originCity, destCity);
  currentPlan = { type:'route', city:destCity, cities, people, budget };
  const validCities = cities.filter(c => CITY_DB[c]);
  let routeThemes = [
    { cat:'经典直达', title:'城际地标串联路线', pick:'经典路线' },
    { cat:'沿途深度', title:'沿途人文深度游', pick:'人文历史' },
    { cat:'美食之旅', title:'一路寻味美食线', pick:'美食之旅' },
    { cat:'夜色经典', title:'夜游地标与城市灯火', pick:'夜色经典' },
    { cat:'自然风光', title:'山水风光轻松慢游', pick:'自然风光' },
    { cat:'小众路线', title:'小众街区与烟火体验', pick:'小众路线' },
  ];
  if (intent?.themePrefs?.length) {
    routeThemes = routeThemes.sort((a, b) =>
      (intent.themePrefs.includes(b.pick) || intent.themePrefs.includes(b.cat) ? 1 : 0) -
      (intent.themePrefs.includes(a.pick) || intent.themePrefs.includes(a.cat) ? 1 : 0));
  }
  const routeUsedCovers = new Set();
  const plans = routeThemes.map((rt, ti) => {
    const themeDef = PLAN_THEMES.find(t => t.cat === rt.pick) || PLAN_THEMES[0];
    let picks = [];
    validCities.forEach(c => {
      const cityPool = [...(CITY_DB[c].nodes||[]), ...(CITY_DB[c].nearby||[])].filter(isAttraction);
      const pool = cityPool.filter(themeDef.match);
      picks = picks.concat((pool.length ? pool : cityPool).slice(0, 2));
    });
    picks = dedupeByName(picks);
    const target = Math.max(3, (days || 1) * 3);
    if (picks.length < target) picks = picks.concat(makeFillerSpots(destCity, target - picks.length, picks.length));
    picks = picks.slice(0, target);
    const cover = pickPlanCover(picks, destCity, themeDef, intent, routeUsedCovers);
    markCoverUsed(routeUsedCovers, cover);
    const id = `plan_${++__planSeq}`;
    const audience = intent?.audience || PLAN_AUDIENCE[ti % PLAN_AUDIENCE.length];
    const plan = {
      id, city: destCity, days, cities,
      themeTitle: rt.title, themeCat: rt.cat,
      audience,
      coverKw: planCoverKeywords(cover, destCity, rt.cat, audience, intent),
      coverTerm: spotSearchTerm(cover||{}),
      coverPlace: cover,
      lock: picks.reduce((s,p,k)=>s+((p.name||'').length)*(k+3), 200+ti*9),
      nodes: picks,
    };
    window.__PLANS[id] = plan;
    return plan;
  }).filter(p => p.nodes.length >= 2);
  applyIntentToPlans(plans, intent);
  await preparePlanCovers(plans);
  const intro = `已根据你的出发地「${originCity}」和目的地「${destCity}」规划。沿途风光与人文交织，${intentFocusText(intent)}并已先完成地点实景检索，为你规划${dayCountText(days)}多主题自驾路线，覆盖${validCities.join('、')}等城市，丰俭由你。`;
  const cardTitle = p => p.themeTitle;
  const html = `
    <div class="plan-intro">${intro}</div>
    <div class="plan-pick-title">选择你的旅行方案</div>
    <div class="plan-grid">${plans.map(p => `
      <div class="plan-card" style="background-image:url('${p.coverUrl || fallbackPlanCoverUrl(p)}')" data-cover-locked="true" data-term="${p.coverTerm||''}" data-city="${destCity}" onclick="openPlanRoute('${p.id}')">
        <div class="plan-card-body">
          <div class="plan-card-title"><span class="city">${originCity}→${destCity}</span> ${cardTitle(p)}</div>
          <div class="plan-card-cat">${p.themeCat}｜${p.audience}</div>
        </div>
        <div class="plan-card-btn">详细方案</div>
      </div>`).join('')}</div>`;
  swapThinkingToPlan(html);
}

  }[c]));
}

// 方案 → NODES 構築（buildNewTrip の enrich を再利用）
function enrichPlanNode(n, idx, city) {
  const sig = (n.id || idx + 1) * 50 + (idx % 5);
  const kw = spotKw(n, city);
  const times = ['09:00','11:00','13:30','15:30','17:30','19:30','20:30'];
  // 景点ごとに 22 枚（その景点に紐づくキーワードで取得・右スワイプ閲覧）
  const PHOTO_N = 22;
  const photos = [];
  const curated = curatedPlaceImage(n, city);
  if (curated && !isBadCoverUrl(curated)) {
    photos.push({ url: curated, caption:`${n.name} · 实景 1` });
  }
  for (let k = 0; photos.length < PHOTO_N; k++) {
    photos.push({ url:`https://loremflickr.com/800/600/${kw}?lock=${sig + k}`, caption:`${n.name} · 实景 ${photos.length + 1}` });
  }
  return {
    ...n,
    id: idx + 1,
    time: times[idx] || n.time || '09:00',
    color: n.color || '#7B61FF',
    tag: n.tag || '景点',
    tagBg: n.tagBg || '#F1EDFF',
    tagColor: n.tagColor || '#7B61FF',
    kw,
    city,
    fullName: n.name,
    rating: parseFloat((4.2 + Math.random() * 0.7).toFixed(1)),
    reviewCount: Math.floor(300 + Math.random() * 1200),
    fullDesc: n.desc + '。这里是 AI Wanderer 推荐的精选打卡地，集自然风光与人文历史于一体，适合深度游览。',
    photoCats: [{ label:'全部', photos }],
    infoList:[
      { icon:'📍', label:'地址', value:n.name, sub:`${city}推荐打卡地` },
      { icon:'⏰', label:'建议游览', value:'1.5–2 小时', sub:'实际因人而异' },
      { icon:'🎫', label:'门票', value: (n.desc||'').includes('免费') ? '免费开放' : (n.desc||'').match(/票价\d+元/)?.[0] || '请现场确认', sub:'' },
    ],
    tags:[n.tag || '景点', '热门推荐', 'AI精选'],
  };
}

window.__PLAN_PLACES = {};
window.__PLAN_HOTELS = {};

const POI_SLOT_LABELS = ['上午','下午','晚上','傍晚','清晨'];

function rankCategory(p) {
  const s = (p.tag||'') + (p.name||'') + (p.desc||'') + (p.icon||'');
  if (/美食|面|火锅|小吃|泡馍|菜|🍜|🥣|🌶️/.test(s)) return '美食';
  if (/夜景|夜游|网红|🌃|🌆|🍻/.test(s)) return '夜景';
  if (/山|湖|河|公园|自然|峡谷|温泉|⛰️|🌊|💧|🌿/.test(s)) return '自然风光';
  if (/古|历史|博物|文化|遗址|寺|塔|庙|陵/.test(s)) return '人文古迹';
  return '城市景观';
}

function placeReason(p) {
  const base = (p.desc || '').split('·')[0] || p.name;
  const tmpls = [
    `${base}，${p.city}地标核心，繁华商圈与历史记忆交汇之地。`,
    `${base}，到访${p.city}不可错过的经典体验。`,
    `${base}，人气与口碑兼具的热门打卡地。`,
    `${base}，深度感受${p.city}独特氛围的绝佳去处。`,
  ];
  return tmpls[(p.id || 1) % tmpls.length];
}

async function openPlanRoute(planId) {
  const plan = window.__PLANS[planId];

  const city = plan.city;
  const places = plan.nodes.map((n, i) => enrichPlanNode(n, i, city));
  await applyTripAdvisorPhotosToPlaces(places, city);
  plan.places = places;
  // 详细方案推荐图使用每个地点自己的关键词图，避免公开图库把小众地点误匹配成无关图片。
  places.forEach(p => { window.__PLAN_PLACES[`${plan.id}_${p.id}`] = p; });

  const days = plan.days || 1;
  const SLOTS = 3;   // 每天 上午/下午/晚上
  const dayGroups = [];
  for (let d = 0; d < days; d++) {
    const grp = places.slice(d * SLOTS, d * SLOTS + SLOTS);

      <div class="ov-day">Day ${d + 1}</div>
      <div class="ov-hl">${grp.map(p => p.name).join(' – ')}</div>
    </div>`).join('');

  // 推荐去处（榜单は実時の前三名のみ表示）
  let rankSeq = 0;
  const recDays = dayGroups.map((grp, d) => {
    const items = grp.map((p, gi) => {
      const slot = POI_SLOT_LABELS[Math.min(gi, POI_SLOT_LABELS.length - 1)];
      const rank = `${city}${rankCategory(p)}景点榜第${(rankSeq++ % 3) + 1}名`;
      const url = p.photoCats[0].photos[0].url;

        <div class="rec-slot">• ${slot}</div>
        <div class="rec-name" onclick="openPlacePOIByKey('${key}')">📍 ${p.name}</div>
        <img class="rec-photo" src="${url}" data-cover-locked="true" data-place-name="${escapeHTML(p.name)}" data-place-city="${escapeHTML(city)}" loading="lazy" onclick="openPlacePOIByKey('${key}')" onerror="handlePlaceImageError(this, this.dataset.placeName, this.dataset.placeCity)">
        <div class="rec-rank">🏆 ${rank}</div>
        <div class="rec-reason">推荐理由：${placeReason(p)}</div>`;
    }).join('');
    return `<div class="rec-day-title">Day ${d + 1} ${city}</div>${items}`;
  }).join('');

  const hotelHTML = await recommendHotelHTML(city, plan.id, places);

  const html = `
    <div class="plan-intro">开启一场${city}的精彩之旅。踏上「${plan.themeTitle}」之旅，感受当地独特魅力。</div>

function hotelPriceFromDesc(desc) {
  const m = String(desc || '').match(/约(\d+(?:\.\d+)?)元\/晚|(\d+(?:\.\d+)?)元\/晚|约(\d+(?:\.\d+)?)元|(\d+(?:\.\d+)?)元/);
  return m ? Math.round(parseFloat(m[1] || m[2] || m[3] || m[4])) : null;
}

function pickHotelSource(city, budget = null) {
  const hotels = HOTEL_DB[city] || [];
  if (hotels.length) {
    if (budget) {
      return hotels
        .map(h => ({ h, price: hotelPriceFromDesc(h.desc) || budget }))
        .sort((a, b) => Math.abs(a.price - budget) - Math.abs(b.price - budget))[0].h;
    }
    return hotels.find(h => /经济|舒适|精品|全季|汉庭|如家/.test(`${h.name}${h.desc}`)) || hotels[0];
  }
  const brand = GENERIC_HOTELS[0];
  return { name:`${brand.name}·${city}${HOTEL_LANDMARKS[city] || '市中心'}店`, desc:`${brand.tier}·近${HOTEL_LANDMARKS[city] || '市中心'}`, icon:brand.icon };
}

function hotelImageUrl(hotel, city, size = '320/320', offset = 0) {
  const lock = (stableHash(`${city}${hotel.name}hotel`) + offset) % 900;
  return `https://loremflickr.com/${size}/hotel,room,${cityKw(city)}/all?lock=${lock}`;
}

function handleHotelImageError(img, name, city) {

    if (img) img.classList.add('img-fail');
    return;
  }
  img.dataset.fallbackApplied = 'true';
  img.classList.remove('img-fail');
  img.src = hotelImageUrl({ name }, city, '320/320', 91);
}

function fallbackImageForPlace(name, city, size = '800/600') {
  const target = placeImageTarget({ name });

  if (curated && !isBadCoverUrl(curated)) return curated;

}

    { area:'临潼兵马俑', landmark:'兵马俑', district:'临潼区', re:/兵马俑|华清/ },
  ],
};

function inferStayArea(city, places = []) {
  const defaults = { area:`${city}${HOTEL_LANDMARKS[city] || '市中心'}`, landmark:HOTEL_LANDMARKS[city] || '市中心', district:'市中心' };
  const rules = HOTEL_STAY_AREAS[city] || [];
  if (!rules.length) return defaults;
  const names = (places || []).map(p => `${p.name || ''}${p.desc || ''}${p.tag || ''}`).join(' ');
  const scored = rules
    .map(rule => ({ ...rule, score:(names.match(rule.re) || []).length }))
    .sort((a, b) => b.score - a.score);
  const hit = scored[0];
  return hit && hit.score > 0 ? hit : { ...rules[0], score:0 };
}

const HOTEL_CN_NAME_MAP = [
  { re:/Iseya.*Jiefangbei.*Raffles|Panoramic Hotel.*Jiefangbei/i, name:'重庆解放碑来福士广场全景酒店' },
  { re:/Glenview|Chongqing Jiefangbei/i, name:'重庆解放碑格兰维酒店' },
  { re:/Hongyadong|Hongya Cave/i, name:'重庆洪崖洞江景酒店' },
];

function localizedHotelName(source, city, stay, budget = null) {
  const raw = String(source?.name || '').replace(/^\d+\.\s*/, '').trim();
  if (/[\u4e00-\u9fff]/.test(raw)) return raw.includes('·') ? raw : `${raw}·${city}${stay.landmark}店`;
  const mapped = HOTEL_CN_NAME_MAP.find(item => item.re.test(raw));
  if (mapped) return mapped.name;
  const brands = budget && budget <= 260
    ? ['汉庭酒店', '如家酒店', '锦江之星']
    : ['全季酒店', '亚朵酒店', '维也纳酒店'];
  const brand = brands[stableHash(`${city}${stay.area}${raw}`) % brands.length];
  return `${brand}·${city}${stay.landmark}店`;
}

function hotelTierLabel(source, apiHotel, budget = null) {
  if (budget && budget <= 260) return '经济型';
  const text = `${source?.name || ''}${source?.desc || ''}`;
  if (/五星|高档|豪华|亚朵|格兰维|全景/.test(text)) return '高档型';
  if (/经济|汉庭|如家|锦江/.test(text)) return '经济型';
  return apiHotel ? '行程优选' : '舒适型';
}

    ...(CITY_DB[city]?.nodes || []),
    ...(CITY_DB[city]?.nearby || []),
    ...(MICRO_POI_DB[city] || []),
  ];
  const seen = new Set();
  return base
    .filter(isAttraction)
    .filter(p => {
      const name = p.name || '';
      if (!name || name === place.name || name === place.fullName) return false;
      if (seen.has(name)) return false;
      seen.add(name);
      return true;
    })
    .map((p, i) => {
      const dist = Array.isArray(place.coords) && Array.isArray(p.coords)
        ? haversine(place.coords, p.coords)
        : 999 + i;
      return { ...p, cityName: city, city, dist };
    })
    .sort((a, b) => a.dist - b.dist);
}

function renderNearbyContent(place) {
  const city = place.city || destCity || '';
  const items = nearbyCandidatePool(place).slice(0, 5);
  if (!items.length) {
    return `<div class="poi-nearby-panel"><div class="poi-nearby-summary">暂未找到 ${escapeHTML(place.name)} 附近可展示的游玩地点。</div></div>`;

  return `
    <div class="poi-nearby-panel">
      <div class="poi-nearby-summary">根据 ${escapeHTML(place.name)} 的位置，优先展示附近可顺路游玩的地点。</div>
      ${items.map((p, i) => {
        const key = `nearby_${stableHash(`${place.name || ''}_${p.name || ''}_${i}`)}`;
        window.__POI_NEARBY[key] = p;

        return `

// ── 多智能体角色定义 ──
const AGENTS = [
  { key:'trip',    name:'行程助手',   emoji:'🧭', color:'#4A90D9' },
  { key:'traffic', name:'交通顾问',   emoji:'✈️', color:'#0EA5E9' },
  { key:'hotel',   name:'酒店顾问',   emoji:'🏨', color:'#7C3AED' },
  { key:'food',    name:'本地导游',   emoji:'🍜', color:'#EA580C' },
  { key:'budget',  name:'预算管理师', emoji:'💰', color:'#16A34A' },
];

// ══════════════════════════════════════════
// MockAPI —— 统一数据层（预留真实接口）
// ══════════════════════════════════════════
const MockAPI = {
  // TODO: 接入航司/GDS 实时报价。入参 origin/dest 城市名，返回机票列表
  getFlights(origin, dest, people = 1) {
    const airlines = [
      { name:'国航 CA',  emoji:'✈️', base:680 },
      { name:'东航 MU',  emoji:'🛫', base:540 },
      { name:'南航 CZ',  emoji:'🛬', base:610 },
    ];
    return airlines.map((a, i) => {
      const price = Math.round(a.base + Math.random()*260);
      const dep = 7 + i*4;
      return {
        airline:a.name, emoji:a.emoji,
        route:`${origin} → ${dest}`,
        time:`${String(dep).padStart(2,'0')}:${i%2?'30':'05'} 起飞`,
        price, seats: Math.floor(2 + Math.random()*8),
        discount: i===1 ? '限时立减¥120' : '',
      };
    }).sort((x,y)=>x.price-y.price);
  },

  // TODO: 接入酒店供应链实时价格/库存。budgetLevel 影响档次
  getHotels(city, budgetLevel = 'mid') {
    const pool = (typeof HOTEL_DB !== 'undefined' && HOTEL_DB[city]) ? HOTEL_DB[city] : [
      { name:`${city}城市精选酒店`, icon:'🏨', desc:'近地铁·含早' },
      { name:`${city}经济连锁`,     icon:'🏩', desc:'高性价比' },
    ];
    const factor = budgetLevel === 'low' ? 0.7 : budgetLevel === 'high' ? 1.6 : 1;
    return pool.slice(0,3).map((h, i) => {
      const m = (h.desc||'').match(/约([\d,]+)元/);
      const base = m ? parseInt(m[1].replace(',','')) : [220,480,900][i]||300;
      return {
        name:h.name, icon:h.icon||'🏨', desc:h.desc||'优选住宿',
        price: Math.round(base * factor),
        rating: (4.2 + Math.random()*0.7).toFixed(1),
        rooms: Math.floor(1 + Math.random()*6),
      };
    }).sort((x,y)=>x.price-y.price);
  },

  // TODO: 接入出行平台目的地热度大数据。返回三大指数(0-100)
  getHeatIndex(city) {
    const seed = [...city].reduce((s,c)=>s+c.charCodeAt(0),0);
    const r = (off) => 30 + ((seed*7+off*13)%70);
    const fewer = r(1), cool = r(2), value = r(3);
    const lvl = v => v>=70?'高':v>=45?'中':'低';
    return {
      crowd:   { val: 100-fewer, label:'客流热度', emoji:'🔥', tip:lvl(100-fewer) },
      fewer:   { val: fewer,     label:'人少指数', emoji:'🧘', tip:lvl(fewer) },
      cool:    { val: cool,      label:'清凉指数', emoji:'❄️', tip:lvl(cool) },
      value:   { val: value,     label:'性价比',   emoji:'💎', tip:lvl(value) },
    };
  },

};

function budgetLevelOf(v) { return v < 1200 ? 'low' : v > 2800 ? 'high' : 'mid'; }

function onBudgetSlide(v) {
  v = parseInt(v);
  currentPlan.budget = v;
  const valEl = document.getElementById('budget-val');
  if (valEl) valEl.textContent = `¥${v}`;
  // 重新生成商品卡（酒店档次随预算变化）
  renderProductPanel();
  // 费用校验
  const est = estimatePlanPerPerson();
  const st = document.getElementById('budget-status');
  if (st) {
    const ok = est <= v;
    st.className = 'budget-status ' + (ok ? 'ok' : 'warn');
    st.textContent = ok
      ? `✅ 预估人均 ¥${est}，在预算内（结余 ¥${v-est}）`
      : `⚠️ 预估人均 ¥${est}，超出预算 ¥${est-v}，建议调高或精简行程`;
  }
}

// 估算当前方案人均（机票最低价 + 酒店最低价 + 景点票价）
function estimatePlanPerPerson() {
  const lvl = budgetLevelOf(currentPlan.budget || 1500);
  const city = currentPlan.city || currentPlan.cities[currentPlan.cities.length-1] || '成都';
  const flights = currentPlan.type === 'route' || currentPlan.cities.length
    ? MockAPI.getFlights(currentPlan.cities[0]||'出发地', city)
    : [];
  const hotels = MockAPI.getHotels(city, lvl);
  const flightMin = flights.length ? flights[0].price : 0;
  const hotelMin = hotels.length ? hotels[0].price : 0;
  const poiCost = NODES.filter(n=>n.type!=='drive'&&n.type!=='summary')
    .reduce((s,n)=>s+estimateCost(n.desc), 0);
  return Math.round(flightMin + hotelMin + poiCost);
}

          <div class="prod-sub">${f.time}${f.discount?` · <span style="color:#16A34A">${f.discount}</span>`:''}</div>
          <div class="prod-stock">仅剩 ${f.seats} 张</div>
        </div>
        <div class="prod-right">
          <div class="prod-price"><small>¥</small>${f.price}</div>
          <button class="prod-book" onclick="bookProduct('机票 ${f.airline}', ${f.price})">预订</button>
        </div>
      </div>`).join('')}` : ''}

    <div class="prod-section-title">🏨 推荐酒店（${lvl==='low'?'经济':lvl==='high'?'高端':'舒适'}档 · 房态 Mock）</div>
    ${hotels.map(h=>`
      <div class="prod-card">
        <div class="prod-icon" style="background:#F3E8FF">${h.icon}</div>
        <div class="prod-main">
          <div class="prod-name">${h.name}</div>
          <div class="prod-sub">⭐ ${h.rating} · ${h.desc}</div>
          <div class="prod-stock">仅剩 ${h.rooms} 间</div>
        </div>
        <div class="prod-right">
          <div class="prod-price"><small>¥</small>${h.price}<small>/晚</small></div>
          <button class="prod-book" onclick="bookProduct('${h.name}', ${h.price})">预订</button>
        </div>
      </div>`).join('')}`;
}

function bookProduct(name, price) {
  // TODO: 接入出行平台下单/支付流程
  showToast(`已加入预订：${name} ¥${price}（接入支付后下单）`);
}

// 规划完成后统一填充地图下方的扩展模块
function renderPlanExtras() {

  renderHeatPanel(city);
  renderBudgetPanel();
  renderProductPanel();

// ══════════════════════════════════════════
// 加 / 减 停留点
// ══════════════════════════════════════════
function openAddStop() {
  if (NODES.length === 0) { showToast('请先规划一个行程 🗺️'); return; }
  const city = currentPlan.city || currentPlan.cities[currentPlan.cities.length-1] || '安康';
  const pool = (typeof CITY_DB !== 'undefined' && CITY_DB[city]?.nearby) ? CITY_DB[city].nearby
             : (CITY_DB['安康']?.nearby || []);
  const existing = new Set(NODES.map(n=>n.name));
  const candidates = pool.filter(p=>!existing.has(p.name));
  showModal('＋ 添加停留点', `从「${city}」周边精选地点中选择，加入当前行程`, `
    ${candidates.length ? candidates.map((p,idx)=>`
      <div class="modal-poi" onclick="addStopNode(${idx})">
        <div class="prod-icon" style="background:${p.color}22">${p.icon}</div>
        <div class="prod-main">
          <div class="prod-name">${p.name}</div>
          <div class="prod-sub">${p.desc}</div>
        </div>
        <div style="color:#7B61FF;font-weight:800;font-size:18px">＋</div>
      </div>`).join('') : '<div class="modal-sub">附近暂无更多可添加的地点</div>'}
  `);
  window._addStopCandidates = candidates;
}

function addStopNode(idx) {
  const p = window._addStopCandidates?.[idx];
  if (!p) return;
  const id = Math.max(0, ...NODES.map(n=>n.id)) + 1;
  const node = {
    id, time:'新增', name:p.name, icon:p.icon, color:p.color,
    tag:'新增', tagBg:'#EFF6FF', tagColor:'#4A90D9',
    desc:p.desc, coords:p.coords, fullName:p.name,
    rating:(4.2+Math.random()*0.7).toFixed(1), reviewCount:Math.floor(200+Math.random()*800),
    fullDesc:p.desc+'。这是你手动添加到行程中的停留点。',
    photoCats:[{label:'全部',photos:[{url:`https://loremflickr.com/800/520/china,travel/all?lock=${id}`,caption:p.name}]}],
    infoList:[{icon:'📍',label:'地点',value:p.name,sub:''},{icon:'🎫',label:'门票',value:p.desc.match(/票价\d+元/)?.[0]||'请现场确认',sub:''}],
    tags:['手动添加','停留点'],
  };
  NODES.push(node);
  const mkr = makeMarker(node, false);
  mkr.on('click', ()=>focusNode(node.id, true));
  markers[node.id] = { marker:mkr, node, domEl:null };
  if (currentPlan.cities.length || NODES.length>1) {
    map.eachLayer(l=>{ if (l instanceof L.Polyline) map.removeLayer(l); });
    L.polyline(NODES.map(n=>n.coords),{color:'#4A90D9',weight:3.5,opacity:0.7}).addTo(map);
  }
  renderTimeline();
  closeModal();
  showToast(`已添加「${p.name}」到行程 ✅`);
}

// 删除停留点（时间轴卡片长按 / 删除按钮调用）
function removeStopNode(id) {
  const i = NODES.findIndex(n=>n.id===id);
  if (i<0) return;
  if (markers[id]) { markers[id].marker.remove(); delete markers[id]; }
  NODES.splice(i,1);
  map.eachLayer(l=>{ if (l instanceof L.Polyline) map.removeLayer(l); });
  if (NODES.length>1) L.polyline(NODES.map(n=>n.coords),{color:'#4A90D9',weight:3.5,opacity:0.7}).addTo(map);
  renderTimeline();
  showToast('已移除该停留点');
}

// ══════════════════════════════════════════
// 手绘攻略海报（分享）
// ══════════════════════════════════════════
function generateSharePoster() {
  if (NODES.length === 0) { showToast('请先规划一个行程再生成攻略 🎨'); return; }
  const title = document.getElementById('timeline-title')?.textContent || '我的旅行攻略';
  const stops = NODES.filter(n=>n.type!=='drive'&&n.type!=='summary');
  const dayChunks = [];
  for (let i=0;i<stops.length;i+=3) dayChunks.push(stops.slice(i,i+3));
  const daysHTML = dayChunks.map((c,di)=>`
    <div class="p-day">
      <div class="p-day-t">Day ${di+1}</div>
      ${c.map(n=>`<div class="p-line">${n.icon} ${n.name}</div>`).join('')}
    </div>`).join('');
  showModal('', '', `
    <div id="poster">
      <div class="p-emoji">🗺️</div>
      <div class="p-title">${title}</div>
      <div class="p-sub">AI Wanderer · 问一问 为你定制</div>
      ${daysHTML}
      <div class="p-foot">共 ${stops.length} 个打卡点 · 扫码查看完整行程</div>
      <div class="p-qr">▦</div>
    </div>
    <button class="prod-book" style="width:100%;margin-top:14px;padding:11px"
            onclick="showToast('攻略图片已保存到相册 🎉（接入分享SDK后可一键分享）')">
      💾 保存 / 分享攻略
    </button>
  `);
}

// ══════════════════════════════════════════
// 通用弹层
// ══════════════════════════════════════════
function showModal(title, sub, bodyHTML) {
  let bd = document.getElementById('app-modal');
  if (!bd) {
    bd = document.createElement('div');
    bd.id = 'app-modal'; bd.className = 'modal-backdrop';
    bd.onclick = e => { if (e.target === bd) closeModal(); };
    document.body.appendChild(bd);
  }
  bd.innerHTML = `
    <div class="modal-card">
      ${title ? `<div class="modal-title">${title}</div>` : ''}
      ${sub ? `<div class="modal-sub">${sub}</div>` : ''}
      ${bodyHTML}
      <button class="modal-close" onclick="closeModal()">关闭</button>
    </div>`;
  requestAnimationFrame(()=>bd.classList.add('open'));
}
function closeModal() {
  const bd = document.getElementById('app-modal');
  if (bd) bd.classList.remove('open');
}

// ══════════════════════════════════════════
// 语音 / 方言输入（Web Speech API）
// ══════════════════════════════════════════
let recognition = null, recognizing = false;
function handleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('mic-btn');
  if (!SR) {
    // TODO: 接入出行平台/第三方 ASR 服务以支持方言
    showToast('当前浏览器不支持语音识别，可改用文字输入');
    return;
  }
  if (recognizing) { recognition && recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'zh-CN';            // 支持普通话；方言需后端ASR
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.onstart = () => { recognizing = true; micBtn?.classList.add('recording'); showToast('🎙️ 正在聆听，请说出你的旅行需求…'); };
  recognition.onresult = e => {
    let txt = '';
    for (let i=0;i<e.results.length;i++) txt += e.results[i][0].transcript;
    document.getElementById('ai-input').value = txt;
  };
  recognition.onerror = () => { showToast('语音识别失败，请重试或改用文字'); };
  recognition.onend = () => {
    recognizing = false; micBtn?.classList.remove('recording');
    const v = document.getElementById('ai-input').value.trim();
    if (v) handleSend();
  };
  recognition.start();
}
