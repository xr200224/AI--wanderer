function fallbackHomeSpot(city, category, index = 0) {
  const food = category === 'food';
  const list = (food ? HOME_FALLBACK_SPOTS.food[city] : HOME_FALLBACK_SPOTS.classic[city])
    || (food ? HOME_FALLBACK_SPOTS.food.default : HOME_FALLBACK_SPOTS.classic.default);
  const item = list[index % list.length];
  return {
    name: item.name,
    desc: item.desc,
    tag: item.tag || (food ? '美食' : '景点'),
    category: food ? 'food' : 'classic',
    coords: item.coords || getHomeCityCenter(city),
    img: item.img,
    tags: item.tags || (food ? [item.tag || '本地风味', index ? '夜间' : '午餐'] : [item.tag || '景点', index ? '傍晚' : '白天']),
  };
}

function homeFallbackImage(city, category, index = 0) {
  const cleanCity = normalizeHomeCityName(city);
  if (category === 'food') {
    const curatedFoodPool = (CURATED_CITY_CATEGORY_PHOTOS[cleanCity]?.food || []).filter(isUsableHomeImage);
    if (curatedFoodPool.length) return curatedFoodPool[index % curatedFoodPool.length];
  }
  if (category !== 'food') {
    const curatedClassicPool = (CURATED_CITY_CATEGORY_PHOTOS[cleanCity]?.classic || []).filter(isUsableHomeImage);
    if (curatedClassicPool.length) return curatedClassicPool[index % curatedClassicPool.length];
  }
  return placeholderImage(
    category === 'food' ? `${cleanCity || '本地'}美食` : `${cleanCity || '本地'}景点`,
    '实景图待同步'
  );
}

function isPrototypeHomeImage(url) {
  return /^assets\/prototype\//i.test(String(url || '').trim());
}

function firstCuratedHomePhotoForSpot(spot, city, category = '', index = 0) {
  const cleanCity = normalizeHomeCityName(city);
  const exact = curatedPlacePhotoOverride(spot, cleanCity, index);
  if (isUsableHomeImage(exact)) return exact;
  const gallery = typeof curatedHomeGalleryUrls === 'function' ? curatedHomeGalleryUrls({ ...spot, city: cleanCity }) : [];
  const galleryPhoto = gallery.find(isUsableHomeImage);
  if (galleryPhoto) return galleryPhoto;
  const curated = curatedPlaceImage(spot, cleanCity);
  if (isUsableHomeImage(curated)) return curated;
  const categoryPhoto = curatedCategoryPhoto(cleanCity, category, `${spot?.name || spot?.poi_name || ''}${index}`);
  if (isUsableHomeImage(categoryPhoto)) return categoryPhoto;
  return '';
}

function homeFoodPlaceImage(spot, city) {
  const cleanCity = normalizeHomeCityName(city);
  const text = `${spot?.name || ''}${spot?.desc || ''}${spot?.tag || ''}`;
  const exact = curatedPlacePhotoOverride(spot, cleanCity);
  if (isUsableHomeImage(exact)) return exact;
  const galleryPhoto = (typeof curatedHomeGalleryUrls === 'function' ? curatedHomeGalleryUrls({ ...spot, city: cleanCity }) : [])
    .find(isUsableHomeImage);
  if (isUsableHomeImage(galleryPhoto)) return galleryPhoto;
  const curated = curatedPlaceImage(spot, cleanCity);
  if (isUsableHomeImage(curated)) return curated;
  if (cleanCity === '西安' && /贾三|灌汤包|汤包/.test(text)) {
    return 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Bei_Yuan_Men.JPG/960px-Bei_Yuan_Men.JPG';
  }
  if (cleanCity === '西安' && /回民街|回坊|羊肉泡馍/.test(text)) {
    return 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Muslim_food_street_market%2C_Xi%27an%2C_May%2C_2018-1.jpg/960px-Muslim_food_street_market%2C_Xi%27an%2C_May%2C_2018-1.jpg';
  }
  if (cleanCity === '西安' && /永兴坊|摔碗酒/.test(text)) {
    return 'https://www.westchinago.com/wp-content/uploads/2025/01/yongxingfang-20250107i1.jpg';
  }
  if (/顺德特色火锅|火锅|面点|灌汤包|汤包|点心/.test(text)) {
    return homeFallbackImage(cleanCity, 'food', stableHash(text) % 5);
  }
  return '';
}

function isUsableHomeImage(url) {
  const raw = String(url || '');
  return !!raw
    && !/^data:image\/svg\+xml/i.test(raw)
    && !/真实图片待同步|%E7%9C%9F%E5%AE%9E%E5%9B%BE%E7%89%87%E5%BE%85%E5%90%8C%E6%AD%A5/i.test(raw)
    && !isSyntheticImageUrl(raw)
    && !isBadCoverUrl(raw);
}

function pushHomeImageCandidate(list, url) {
  if (!isUsableHomeImage(url) || isPrototypeHomeImage(url)) return;
  if (!list.includes(url)) list.push(url);
}

function homeRecommendationImageCandidates(spot, city, category, index = 0) {
  const cleanCity = normalizeHomeCityName(city);
  const candidates = [];
  if (category === 'food') {
    pushHomeImageCandidate(candidates, homeFoodPlaceImage(spot, cleanCity));
  }
  pushHomeImageCandidate(candidates, firstCuratedHomePhotoForSpot(spot, cleanCity, category, index));
  const explicit = spot?.img || spot?.image_url || spot?.img_url || spot?.photo_url;
  pushHomeImageCandidate(candidates, explicit);
  if (category === 'food') {
    for (let offset = 0; offset < 8; offset += 1) {
      pushHomeImageCandidate(candidates, homeFallbackImage(cleanCity, category, index + offset));
      pushHomeImageCandidate(candidates, curatedCategoryPhoto(cleanCity, category, `${spot?.name || ''}${index + offset}`));
    }
    return candidates;
  }
  const curated = curatedPlaceImage(spot, cleanCity);
  pushHomeImageCandidate(candidates, curated);
  homeAllCitySpots(cleanCity)
    .filter(item => !isHomeFoodSpot(item))
    .map(item => item?.img || item?.image_url || item?.img_url || item?.photo_url || curatedPlaceImage(item, city))
    .forEach(url => pushHomeImageCandidate(candidates, url));
  for (let offset = 0; offset < 8; offset += 1) {
    pushHomeImageCandidate(candidates, homeFallbackImage(cleanCity, category, index + offset));
    pushHomeImageCandidate(candidates, curatedCategoryPhoto(cleanCity, category, `${spot?.name || ''}${index + offset}`));
  }
  return candidates;
}

function homeRecommendationImage(spot, city, category, index = 0) {
  return homeRecommendationImageCandidates(spot, city, category, index)[0]
    || homeFallbackImage(city, category, index);
}

function uniqueHomeRecommendationImage(spot, city, category, index, usedImages) {
  const candidates = homeRecommendationImageCandidates(spot, city, category, index);
  const picked = candidates.find(url => !usedImages.has(url)) || candidates[0] || homeFallbackImage(city, category, index);
  if (picked) usedImages.add(picked);
  return picked;
}

function homeRecommendationCity() {
  return homeHasItinerary() ? homeTripCity() : homeEmptyCity();
}

function homeSpotLatLng(spot, city = homeRecommendationCity()) {
  const lngLat = spotLngLat(spot);
  if (lngLat && Number.isFinite(Number(lngLat[0])) && Number.isFinite(Number(lngLat[1]))) {
    return [Number(lngLat[1]), Number(lngLat[0])];
  }
  const center = getHomeCityCenter(city);
  return Array.isArray(center) && Number.isFinite(Number(center[0])) && Number.isFinite(Number(center[1]))
    ? [Number(center[0]), Number(center[1])]
    : null;
}

function homeRouteAnchorCoords() {
  if (!homeHasItinerary()) return [];
  return homeTripNodes()
    .map(node => homeSpotLatLng(node, homeTripCity()))
    .filter(Boolean);
}

function homeNearestRouteDistanceKm(spot, anchors, city) {
  if (!anchors?.length) return Number.POSITIVE_INFINITY;
  const target = homeSpotLatLng(spot, city);
  if (!target) return Number.POSITIVE_INFINITY;
  return Math.min(...anchors.map(anchor => haversine(anchor, target)));
}

function homeSpotHotScore(spot, category = homeActiveRecommendation, index = 0, city = homeRecommendationCity()) {
  const text = `${spot?.name || ''}${spot?.desc || ''}${spot?.tag || ''}${spot?.category || ''}`;
  const base = 78 + (stableHash(`${city}_${category}_${spot?.name || index}`) % 18);
  const ratingBoost = Number(spot?.rating) ? Math.round((Number(spot.rating) - 4) * 8) : 0;
  const reviewBoost = Number(spot?.reviewCount) ? Math.min(8, Math.round(Math.log10(Number(spot.reviewCount) + 1) * 2)) : 0;
  const foodBoost = category === 'food' && /店|馆|楼|街|市|火锅|面|粉|茶|小吃|早茶|夜市|餐|饭|菜/.test(text) ? 6 : 0;
  const viewBoost = category !== 'food' && /景区|公园|园|山|湖|街|塔|博物馆|古镇|地标|夜景|免费|5A/.test(text) ? 6 : 0;
  return Math.max(72, Math.min(99, base + ratingBoost + reviewBoost + foodBoost + viewBoost - index));
}

function homeRecommendationSpots(city = homeSelectedCity, category = homeActiveRecommendation, limit = 2, options = {}) {
  const { fillFallback = true } = options;
  const cleanCity = normalizeHomeCityName(city);
  const anchors = homeRouteAnchorCoords();
  const allSpots = homeAllCitySpots(cleanCity);
  const pool = uniqueHomeSpots(category === 'food'
    ? allSpots
    : allSpots.filter(spot => typeof isAttraction === 'function' ? isAttraction(spot) : true));
  const primary = category === 'food'
    ? pool.filter(isHomeFoodSpot)
    : pool.filter(spot => !isHomeFoodSpot(spot));
  const fallback = category === 'food'
    ? pool.filter(spot => !primary.includes(spot) && isHomeFoodSpot(spot))
    : pool.filter(spot => !primary.includes(spot));
  const ranked = uniqueHomeSpots([...primary, ...fallback])
    .map((spot, index) => ({
      spot,
      index,
      score: homeSpotHotScore(spot, category, index, cleanCity),
      distance: homeNearestRouteDistanceKm(spot, anchors, cleanCity),
    }))
    .sort((a, b) => {
      if (anchors.length && Number.isFinite(a.distance) && Number.isFinite(b.distance)) {
        const delta = a.distance - b.distance;
        if (Math.abs(delta) > 0.25) return delta;
      }
      return b.score - a.score || a.index - b.index;
    })
    .map(item => item.spot);
  const picked = ranked.slice(0, limit);
  let fallbackIndex = 0;
  while (fillFallback && picked.length < limit && fallbackIndex < limit * 3) {
    const spot = fallbackHomeSpot(cleanCity, category, fallbackIndex++);
    const key = homeSpotUniqueKey(spot.name);
    if (picked.some(item => homeSpotUniqueKey(item?.name) === key)) continue;
    picked.push(spot);
  }
  return picked;
}

function homeCardTags(spot, category) {
  if (Array.isArray(spot?.tags) && spot.tags.length) return spot.tags.slice(0, 2);
  const raw = String(spot?.tag || '').replace(/出发点|返程/g, '').trim();
  const desc = String(spot?.desc || '');
  if (category === 'food') {
    if (/早|早餐|早茶/.test(desc)) return [raw || '本地风味', '早餐或午餐'];
    if (/夜|晚/.test(desc)) return [raw || '本地风味', '晚餐或夜间'];
    return [raw || '本地风味', '午餐'];
  }
  if (/夜|灯|酒吧/.test(desc + raw)) return [raw || '夜景', '傍晚或夜间'];
  if (/免费/.test(desc)) return [raw || '景点', '免费'];
  return [raw || '景点', '白天游览'];
}

function homeCardFromSpot(city, category, spot, index = 0, usedImages = null) {
  const name = String(spot?.name || `${city}推荐`).trim();
  const desc = String(spot?.sub_name || spot?.desc || (category === 'food' ? '本地高频风味' : '精选城市打卡地'))
    .replace(/·/g, '，')
    .trim();
  const rawImg = usedImages
    ? uniqueHomeRecommendationImage(spot, city, category, index, usedImages)
    : homeRecommendationImage(spot, city, category, index);
  const id = `home_${stableHash(`${city}_${category}_${name}_${index}`)}`;
  const hotScore = homeSpotHotScore(spot, category, index, city);
  const rating = spot?.rating || (4.5 + (hotScore % 5) / 10).toFixed(1);
  const reviewCount = spot?.reviewCount || (68 + (stableHash(`${city}_${name}_reviews`) % 420));
  return {
    ...spot,
    id,
    city,
    category,
    name,
    desc,
    img: rawImg,
    tags: homeCardTags(spot, category),
    hotScore,
    rating,
    reviewCount,
    coords: Array.isArray(spot?.coords) ? spot.coords : getHomeCityCenter(city),
  };
}

function homeRecommendationCards(city = homeSelectedCity, category = homeActiveRecommendation, limit = 2, options = {}) {
  const usedImages = new Set();
  return homeRecommendationSpots(city, category, limit, options)
    .map((spot, index) => homeCardFromSpot(city, category, spot, index, usedImages));
}

function updateHomeHero(city) {
  const carousel = document.getElementById('home-hero-carousel');
  if (!carousel) return;
  const hasTrip = homeHasItinerary();
  const activeCity = hasTrip ? homeTripCity() : homeEmptyCity();
  const nodes = hasTrip ? homeTripNodes().filter(node => node && node.type !== 'drive') : [];
  const overviewCard = hasTrip ? {
    city: activeCity,
    spots: nodes,
    coverSpot: homeHeroCoverSpot(nodes, activeCity),
  } : null;
  const cards = [overviewCard];
  const total = cards.length;
  carousel.classList.toggle('is-single', total <= 1);
  carousel.classList.toggle('is-multi', total > 1);
  carousel.setAttribute('aria-label', hasTrip ? `${activeCity}行程卡片，点击查看完整行程` : '暂无行程');
  carousel.innerHTML = cards.map((day, index) => homeHeroCardHTML({
    hasTrip,
    city: activeCity,
    day,
    index,
    total,

function homeRouteDataFromCurrentPlan() {
  const activeRoute = homeActiveRouteData();
  if (activeRoute) return activeRoute;
  const city = homeTripCity();
  const nodes = homeTripNodes();
  const route = {
    title: `${city} 我的旅行规划`,
    start_date: homePlannedStartDateISO(),
    match_rate: '已定制',
    tags: ['我的旅行规划', `${nodes.length}个地点`],
    itinerary: [{
      day: 1,
      title: `${city}路线`,
      spots: nodes.map((node, index) => {
        const lngLat = lngLatFromSpot(node);
        const img = safeImageUrl(node.img || node.image_url || curatedPlaceImage(node, city), node.name, `${city}实景图待同步`);
        return {
          ...node,
          id: node.id || `home_route_${index + 1}`,
          time: node.time || '',
          sub_name: node.desc || node.tag || '已加入行程',
          reason: node.desc || '已加入行程',
          img,
          img_url: img,
          image_url: img,
          lng: lngLat?.[0],
          lat: lngLat?.[1],
          location: lngLat ? `${lngLat[0]},${lngLat[1]}` : node.location,
        };
      }),
    }],
  };
  return normalizeAIItineraryData(route, { city, themeTitle: '我的旅行规划' });
}

function curatedHomeGalleryUrls(card) {
  const city = normalizeHomeCityName(card?.city || '');
  const text = `${card?.name || ''}${card?.desc || ''}${card?.tag || ''}`;
  const exact = CURATED_PLACE_PHOTO_OVERRIDES.find(item => item.city === city && item.re.test(text));
  if (exact?.urls?.length) return exact.urls.filter(isHomeRealPhotoUrl);
  const hit = CURATED_HOME_GALLERIES.find(item => item.city === city && item.re.test(text));
  return hit ? hit.urls.filter(isHomeRealPhotoUrl) : [];
}

function homeAlbumPhotoSources(card) {
  const photos = [];
  const cats = Array.isArray(card?.photoCats) ? card.photoCats : [];
  cats.forEach(cat => (cat?.photos || []).forEach(photo => photos.push(photo?.url || photo)));
  if (Array.isArray(card?.photos)) photos.push(...card.photos.map(photo => photo?.url || photo));
  if (Array.isArray(card?.images)) photos.push(...card.images);
  photos.push(card?.img, card?.photo_url, card?.image_url, card?.img_url);
  photos.push(...curatedHomeGalleryUrls(card));
  const curated = curatedPlaceImage(card, card?.city);
  if (curated) photos.push(curated);
  if (card?.img && curated && card.img === curated) photos.push(card.img);
  return uniquePhotos(photos).filter(isHomeRealPhotoUrl);
}

function syncHomeSheetAlbumDots(scroller) {
  const album = scroller?.closest?.('.home-sheet-album');
  if (!album) return;
  const gap = parseFloat(getComputedStyle(scroller).columnGap || getComputedStyle(scroller).gap || '0') || 0;
  const step = Math.max(1, scroller.clientWidth + gap);
  const index = Math.round(scroller.scrollLeft / step);
  album.querySelectorAll('.home-sheet-album-dots span').forEach((dot, dotIndex) => {
    dot.classList.toggle('is-active', dotIndex === index);
  });
}

function refreshHomeSheetAlbumDots(album) {
  if (!album) return;
  const photos = album.querySelectorAll('.home-sheet-photo');
  const dots = album.querySelector('.home-sheet-album-dots');
  if (!photos.length) {
    album.innerHTML = '<div class="home-sheet-album-empty">暂未获取到对应地点实景相册</div>';
    return;
  }
  if (!dots) return;
  dots.innerHTML = Array.from(photos).map((_, index) => `<span class="${index ? '' : 'is-active'}"></span>`).join('');
  if (photos.length < 2) dots.remove();
}

function removeHomeSheetPhoto(img) {
  const album = img?.closest?.('.home-sheet-album');
  img?.closest?.('.home-sheet-photo')?.remove();
  refreshHomeSheetAlbumDots(album);
}

function startHomeSheetAlbumDrag(event, scroller) {
  if (!scroller || (event.pointerType === 'mouse' && event.button !== 0)) return;
  scroller.dataset.dragging = '1';
  scroller.dataset.dragStartX = String(event.clientX);
  scroller.dataset.dragScrollLeft = String(scroller.scrollLeft);
  scroller.classList.add('is-dragging');
  scroller.setPointerCapture?.(event.pointerId);
}

function moveHomeSheetAlbumDrag(event, scroller) {
  if (!scroller || scroller.dataset.dragging !== '1') return;
  event.preventDefault();
  const startX = Number(scroller.dataset.dragStartX || event.clientX);
  const startScrollLeft = Number(scroller.dataset.dragScrollLeft || 0);
  scroller.scrollLeft = startScrollLeft - (event.clientX - startX);
}

function endHomeSheetAlbumDrag(event, scroller) {
  if (!scroller || scroller.dataset.dragging !== '1') return;
  scroller.dataset.dragging = '';
  scroller.classList.remove('is-dragging');
  scroller.releasePointerCapture?.(event.pointerId);
  syncHomeSheetAlbumDots(scroller);
}

function homeRecommendationRouteSpot(card, route) {
  const firstDay = (route?.itinerary || [])[0] || { spots: [] };
  const nextIndex = firstDay.spots?.length || 0;
  const lngLat = lngLatFromSpot(card) || spotLngLat(card);
  const img = card.img || homeRecommendationImage(card, card.city, card.category, nextIndex);
  const food = card.category === 'food' || isHomeFoodSpot(card);
  return {
    id: `home_added_${stableHash(`${card.city}_${card.name}_${nextIndex}`)}`,
    name: card.name,
    sub_name: card.desc || (food ? '已加入美食计划' : '已加入行程'),
    reason: card.desc || '从首页推荐加入',
    desc: card.desc || '',
    time: card.time || ['09:30', '12:00', '14:30', '17:30', '19:30', '20:30'][nextIndex % 6],
    tag: food ? '美食' : '景点',
    category: card.category,
    img,
    img_url: img,
    image_url: img,
    coords: Array.isArray(card.coords) ? card.coords : undefined,
    lng: lngLat?.[0],
    lat: lngLat?.[1],
    location: lngLat ? `${lngLat[0]},${lngLat[1]}` : card.location,
    addedFromHome: true,
  };
}

function syncHomeRouteAfterAdd(route) {
  const activePlan = homeActiveRoutePlan();
  const normalized = normalizeAIItineraryData(route, activePlan || {
    city: homeTripCity(),
    themeTitle: '我的旅行规划',
    startDate: homePlannedStartDateISO(),
  });
  const routeDays = Math.max(1, Number(normalized.days || normalized.day_count || activePlan?.days || currentPlan?.days || normalized.itinerary?.length || 1));
  normalized.days = routeDays;
  normalized.day_count = routeDays;
  normalized.itinerary = (normalized.itinerary || []).map((day, dayIndex) => ({
    ...day,
    day: Number(day.day || dayIndex + 1),
    spots: day.spots || [],
  }));
  setRouteData(normalized);
  if (activePlan) {
    activePlan.days = routeDays;
    activePlan.routeData = normalized;
    activePlan.nodes = flattenInstantItinerary(normalized).map((spot, index) => ({
      id: index + 1,
      name: spot.name,
      desc: spot.sub_name || spot.reason || spot.desc || '已加入行程',
      tag: spot.time || timeLabelForIndex(index),
      coords: lngLatFromSpot(spot),
    }));
    if (activePlan.id && window.__PLANS?.[activePlan.id]) {
      window.__PLANS[activePlan.id].routeData = normalized;
      window.__PLANS[activePlan.id].nodes = activePlan.nodes;
      window.__HOME_ACTIVE_PLAN_ID = activePlan.id;
    }
    if (activePlan.id && window.__INSTANT_ROUTE_STATE?.[activePlan.id]) {
      window.__INSTANT_ROUTE_STATE[activePlan.id].data = cloneRouteData(normalized);
    }
  }
  const city = normalizeHomeCityName(activePlan?.city || normalized.city || currentPlan?.city || homeSelectedCity || HOME_DEFAULT_CITY);
  currentPlan = {
    ...currentPlan,
    type: currentPlan?.type || 'city',
    city,
    cities: [city],
    days: routeDays,
    startDate: normalized.start_date || normalized.startDate || currentPlan?.startDate || dateOnlyISO(),
    travelDate: normalized.start_date || normalized.startDate || currentPlan?.travelDate || dateOnlyISO(),
    routeData: normalized,
  };
  homeSelectedCity = city;
  setHomeCityName(city);
}

function addHomeRecommendationToTrip(id) {
  const card = window.__HOME_RECOMMENDATIONS?.[id];
  if (!card) return;
  if (!homeHasItinerary()) {
    closeHomeSheet();
    homeStartPlanning();
    if (typeof showToast === 'function') showToast('先规划行程，再把推荐加入路线');
    return;
  }
  const activePlan = homeActiveRoutePlan();
  const baseRoute = activePlan?.routeData || routeData || homeActiveRouteData() || homeRouteDataFromCurrentPlan();
  const route = cloneRouteData(normalizeAIItineraryData(baseRoute, activePlan || currentPlan));
  if (!route.itinerary.length) {
    route.itinerary = [{ day: 1, day_title: `${homeTripCity()}路线`, title: `${homeTripCity()}路线`, spots: [] }];
  }
  const targetDay = route.itinerary[0];
  targetDay.spots = Array.isArray(targetDay.spots) ? targetDay.spots : [];
  const key = normalizeSpotKey(card.name);
  const exists = targetDay.spots.some(spot => normalizeSpotKey(spot.name || spot.poi_name || '') === key);
  if (exists) {
    closeHomeSheet();
    if (typeof showToast === 'function') showToast(`${card.name} 已在行程里`);
    return;
  }
  targetDay.spots.push(homeRecommendationRouteSpot(card, route));
  route.tags = ['我的旅行规划', `${flattenInstantItinerary(route).length}个地点`];
  syncHomeRouteAfterAdd(route);
  renderHomeTripState();
  renderHomeRecommendations();
  if (typeof renderTimeline === 'function') renderTimeline();
  closeHomeSheet();
  if (typeof showToast === 'function') showToast(`已加入 ${card.name}`);
}

function runAgentPlanning(container, onDone) {
  container.innerHTML = `
    <div style="font-weight:800;color:#1A1A1A;margin-bottom:10px;font-size:13px">
      🐾 多智能体协同规划中…
    </div>

  const wrap = container.querySelector('#agent-steps');
  const lines = [
    { a:AGENTS[0], t:'拆解需求，制定整体路线框架…' },
    { a:AGENTS[1], t:'比价机票与城际交通，匹配最优班次…' },
    { a:AGENTS[2], t:'筛选沿途高性价比酒店与房态…' },
    { a:AGENTS[3], t:'精选本地美食与必玩景点…' },
    { a:AGENTS[4], t:'按预算分配费用，校验是否超支…' },

  let i = 0;
  const timer = setInterval(() => {
    if (i < lines.length) {
      const { a, t } = lines[i];
      const el = document.createElement('div');
      el.className = 'agent-step';
      el.innerHTML = `

function budgetLevelOf(v) { return v < 1200 ? 'low' : v > 2800 ? 'high' : 'mid'; }

function onBudgetSlide(v) {
  v = parseInt(v);
  currentPlan.budget = v;
  const valEl = document.getElementById('budget-val');
  if (valEl) valEl.textContent = `¥${v}`;
  // 重新生成商品卡（酒店档次随预算变化）
  renderProductPanel();
  // 费用校验
  const est = estimatePlanPerPerson();
  const st = document.getElementById('budget-status');
  if (st) {
    const ok = est <= v;
    st.className = 'budget-status ' + (ok ? 'ok' : 'warn');
    st.textContent = ok
      ? `✅ 预估人均 ¥${est}，在预算内（结余 ¥${v-est}）`
      : `⚠️ 预估人均 ¥${est}，超出预算 ¥${est-v}，建议调高或精简行程`;
  }
}

// 估算当前方案人均（机票最低价 + 酒店最低价 + 景点票价）
function estimatePlanPerPerson() {
  const lvl = budgetLevelOf(currentPlan.budget || 1500);
  const city = currentPlan.city || currentPlan.cities[currentPlan.cities.length-1] || '成都';
  const flights = currentPlan.type === 'route' || currentPlan.cities.length
    ? MockAPI.getFlights(currentPlan.cities[0]||'出发地', city)
    : [];
  const hotels = MockAPI.getHotels(city, lvl);
  const flightMin = flights.length ? flights[0].price : 0;
  const hotelMin = hotels.length ? hotels[0].price : 0;
  const poiCost = NODES.filter(n=>n.type!=='drive'&&n.type!=='summary')
    .reduce((s,n)=>s+estimateCost(n.desc), 0);
  return Math.round(flightMin + hotelMin + poiCost);
}

function itineraryAddRouteBase() {
  const activePlan = typeof homeActiveRoutePlan === 'function' ? homeActiveRoutePlan() : null;
  const baseRoute = activePlan?.routeData
    || routeData
    || (typeof timelineRouteData === 'function' ? timelineRouteData() : null)
    || (typeof homeRouteDataFromCurrentPlan === 'function' ? homeRouteDataFromCurrentPlan() : null);
  if (!baseRoute?.itinerary?.length) return null;
  return {
    activePlan,
    route: cloneRouteData(normalizeAIItineraryData(baseRoute, activePlan || currentPlan || {})),
  };
}

function itineraryAddCards(city, route) {
  const existing = new Set((route?.itinerary || [])
    .flatMap(day => day.spots || [])
    .map(spot => normalizeSpotKey(spot?.name || spot?.poi_name || spot?.card_title || ''))
    .filter(Boolean));
  const cards = typeof homeRecommendationCards === 'function'
    ? homeRecommendationCards(city, 'classic', 18, { fillFallback: true })
    : [];
  const seen = new Set();
  return cards.filter(card => {
    const key = normalizeSpotKey(card?.name || '');
    if (!key || existing.has(key) || seen.has(key)) return false;
    seen.add(key);
    return true;
  }).slice(0, 12);
}

function closeItineraryAddSpotSheet() {

    || null;
  const image = card?.img || card?.img_url || card?.image_url || safeImageUrl('', card?.name || city, `${city}实景图待同步`);
  return {
    ...card,
    city,
    name: card?.name || '热门地点',
    fullName: card?.name || '热门地点',
    desc: card?.desc || card?.sub_name || '热门地点，适合顺路加入',
    highlight: card?.highlight || card?.desc || card?.sub_name || '热门地点，适合顺路加入',
    tag: card?.tag || card?.category || '景点',
    category: card?.category || card?.tag || '景点',
    img: image,
    img_url: image,
    image_url: image,
    coords: Array.isArray(card?.coords) ? card.coords : geo,
    lng: card?.lng ?? geo?.[0],

function itinerarySpotFromAddCard(card, targetDay) {
  const nextIndex = Array.isArray(targetDay?.spots) ? targetDay.spots.length : 0;
  const lngLat = lngLatFromSpot(card) || spotLngLat(card) || homeSpotLatLng(card, card.city);
  const img = card.img || homeRecommendationImage(card, card.city, 'classic', nextIndex);
  return {
    id: `itinerary_added_${stableHash(`${card.city}_${card.name}_${Date.now()}`)}`,
    name: card.name,
    sub_name: card.desc || '手动添加的热门景点',
    reason: card.desc || '从热门景点加入',
    desc: card.desc || '',
    time: card.time || ['09:30', '12:00', '14:30', '17:30', '19:30'][nextIndex % 5],
    tag: card.tag || '景点',
    category: 'classic',
    img,
    img_url: img,
    image_url: img,
    coords: Array.isArray(card.coords) ? card.coords : lngLat,
    lng: lngLat?.[0],
    lat: lngLat?.[1],
    location: lngLat ? `${lngLat[0]},${lngLat[1]}` : card.location,
    addedFromTimeline: true,
  };
}

function addItinerarySpotFromPicker(cardId) {
  const state = window.__ITINERARY_ADD_SPOT_STATE;
  const card = state?.cards?.find(item => item.id === cardId);
  if (!card) return;
  const base = itineraryAddRouteBase();
  if (!base) return;
  const route = base.route;
  route.itinerary = Array.isArray(route.itinerary) ? route.itinerary : [];
  let targetDay = route.itinerary.find(day => Number(day.day) === Number(state.dayNumber));
  if (!targetDay) {
    targetDay = { day: Number(state.dayNumber) || 1, title: `${state.city}路线`, day_title: `${state.city}路线`, spots: [] };
    route.itinerary.push(targetDay);
    route.itinerary.sort((a, b) => Number(a.day || 0) - Number(b.day || 0));
  }
  targetDay.spots = Array.isArray(targetDay.spots) ? targetDay.spots : [];
  const key = normalizeSpotKey(card.name);
  if (targetDay.spots.some(spot => normalizeSpotKey(spot.name || '') === key)) {
    closeItineraryAddSpotSheet();
    showToast(`${card.name} 已在当天行程里`);
    return;
  }
  targetDay.spots.push(itinerarySpotFromAddCard(card, targetDay));
  route.tags = ['我的旅行规划', `${flattenInstantItinerary(route).length}个地点`];
  if (!route.start_date && !route.startDate) {
    route.start_date = timelinePlanStartISO();
    route.startDate = route.start_date;
  }
  if (typeof syncHomeRouteAfterAdd === 'function') syncHomeRouteAfterAdd(route);
  else setRouteData(route);
  timelineActiveDay = Number(targetDay.day) || 'all';
  renderTimeline();
  if (typeof renderHomeTripState === 'function') renderHomeTripState();
  if (typeof renderHomeRecommendations === 'function') renderHomeRecommendations();
  closeItineraryAddSpotSheet();
  showToast(`已添加「${card.name}」`);
}

function openAddStop(dayNumber = null) {
  if (timelineRouteData()?.itinerary?.length) {
    openItineraryAddSpotSheet(dayNumber);
    return;
  }
  if (NODES.length === 0) { showToast('请先规划一个行程 🗺️'); return; }
  const city = currentPlan.city || currentPlan.cities[currentPlan.cities.length-1] || '安康';
  const pool = (typeof CITY_DB !== 'undefined' && CITY_DB[city]?.nearby) ? CITY_DB[city].nearby
             : (CITY_DB['安康']?.nearby || []);
  const existing = new Set(NODES.map(n=>n.name));
  const candidates = pool.filter(p=>!existing.has(p.name));
  showModal('＋ 添加停留点', `从「${city}」周边精选地点中选择，加入当前行程`, `
    ${candidates.length ? candidates.map((p,idx)=>`
      <div class="modal-poi" onclick="addStopNode(${idx})">
        <div class="prod-icon" style="background:${p.color}22">${p.icon}</div>
        <div class="prod-main">
          <div class="prod-name">${p.name}</div>
          <div class="prod-sub">${p.desc}</div>
        </div>
        <div style="color:#7B61FF;font-weight:800;font-size:18px">＋</div>
      </div>`).join('') : '<div class="modal-sub">附近暂无更多可添加的地点</div>'}
  `);
  window._addStopCandidates = candidates;
}

function addStopNode(idx) {
  const p = window._addStopCandidates?.[idx];
  if (!p) return;
  const id = Math.max(0, ...NODES.map(n=>n.id)) + 1;
  const node = {
    id, time:'新增', name:p.name, icon:p.icon, color:p.color,
    tag:'新增', tagBg:'#EFF6FF', tagColor:'#4A90D9',
    desc:p.desc, coords:p.coords, fullName:p.name,
    rating:p.rating || null, reviewCount:p.reviewCount || null,
    fullDesc:p.desc+'。这是你手动添加到行程中的停留点。',
    photoCats:[{label:'全部',photos:[{url:safeImageUrl(curatedPlaceImage(p, currentPlan.city || destCity) || p.image_url, p.name, '真实图片待同步'),caption:p.name}]}],
    infoList:[{icon:'📍',label:'地点',value:p.name,sub:''},{icon:'🎫',label:'门票',value:p.desc.match(/票价\d+元/)?.[0]||'请现场确认',sub:''}],
    tags:['手动添加','停留点'],
  };
  NODES.push(node);
  const mkr = makeMarker(node, false);
  mkr.on('click', ()=>focusNode(node.id, true));
  markers[node.id] = { marker:mkr, node, domEl:null };
  if (currentPlan.cities.length || NODES.length>1) {
    map.eachLayer(l=>{ if (l instanceof L.Polyline) map.removeLayer(l); });
    L.polyline(NODES.map(n=>n.coords),{color:'#4A90D9',weight:3.5,opacity:0.7}).addTo(map);
  }
  renderTimeline();
  renderHomeTripState();
  closeModal();
  showToast(`已添加「${p.name}」到行程 ✅`);
}

// 删除停留点（时间轴卡片长按 / 删除按钮调用）
function removeStopNode(id) {
  const i = NODES.findIndex(n=>n.id===id);
  if (i<0) return;
  if (markers[id]) { markers[id].marker.remove(); delete markers[id]; }
  NODES.splice(i,1);
  map.eachLayer(l=>{ if (l instanceof L.Polyline) map.removeLayer(l); });
  if (NODES.length>1) L.polyline(NODES.map(n=>n.coords),{color:'#4A90D9',weight:3.5,opacity:0.7}).addTo(map);
  renderTimeline();
  renderHomeTripState();
  showToast('已移除该停留点');
}

// ══════════════════════════════════════════
// 手绘攻略海报（分享）
// ══════════════════════════════════════════
function generateSharePoster() {
  if (NODES.length === 0) { showToast('请先规划一个行程再生成攻略 🎨'); return; }
  const title = document.getElementById('timeline-title')?.textContent || '我的旅行攻略';
  const stops = NODES.filter(n=>n.type!=='drive'&&n.type!=='summary');
  const dayChunks = [];
  for (let i=0;i<stops.length;i+=3) dayChunks.push(stops.slice(i,i+3));
  const daysHTML = dayChunks.map((c,di)=>`
    <div class="p-day">
      <div class="p-day-t">Day ${di+1}</div>
      ${c.map(n=>`<div class="p-line">${n.icon} ${n.name}</div>`).join('')}
    </div>`).join('');
  showModal('', '', `
    <div id="poster">
      <div class="p-emoji">🗺️</div>
      <div class="p-title">${title}</div>
      <div class="p-sub">AI Wanderer · 问一问 为你定制</div>
      ${daysHTML}
      <div class="p-foot">共 ${stops.length} 个打卡点 · 扫码查看完整行程</div>
      <div class="p-qr">▦</div>
    </div>
    <button class="prod-book" style="width:100%;margin-top:14px;padding:11px"
            onclick="showToast('攻略图片已保存到相册 🎉（接入分享SDK后可一键分享）')">
      💾 保存 / 分享攻略
    </button>
  `);
}

// ══════════════════════════════════════════
// 通用弹层
// ══════════════════════════════════════════
function showModal(title, sub, bodyHTML) {
  let bd = document.getElementById('app-modal');
  if (!bd) {
    bd = document.createElement('div');
    bd.id = 'app-modal'; bd.className = 'modal-backdrop';
    bd.onclick = e => { if (e.target === bd) closeModal(); };
    document.body.appendChild(bd);
  }
  bd.innerHTML = `
    <div class="modal-card">
      ${title ? `<div class="modal-title">${title}</div>` : ''}
      ${sub ? `<div class="modal-sub">${sub}</div>` : ''}
      ${bodyHTML}
      <button class="modal-close" onclick="closeModal()">关闭</button>
    </div>`;
  requestAnimationFrame(()=>bd.classList.add('open'));
}
function closeModal() {
  const bd = document.getElementById('app-modal');
  if (bd) bd.classList.remove('open');
}

// ══════════════════════════════════════════
// 语音 / 方言输入（Web Speech API）
// ══════════════════════════════════════════
let recognition = null, recognizing = false;
function handleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('mic-btn');
  if (!SR) {
    // TODO: 接入出行平台/第三方 ASR 服务以支持方言
    showToast('当前浏览器不支持语音识别，可改用文字输入');
    return;
  }
  if (recognizing) { recognition && recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'zh-CN';            // 支持普通话；方言需后端ASR
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.onstart = () => { recognizing = true; micBtn?.classList.add('recording'); showToast('🎙️ 正在聆听，请说出你的旅行需求…'); };
  recognition.onresult = e => {
    let txt = '';
    for (let i=0;i<e.results.length;i++) txt += e.results[i][0].transcript;
    document.getElementById('ai-input').value = txt;
  };
  recognition.onerror = () => { showToast('语音识别失败，请重试或改用文字'); };
  recognition.onend = () => {
    recognizing = false; micBtn?.classList.remove('recording');
    const v = document.getElementById('ai-input').value.trim();
    if (v) handleSend();
  };
  recognition.start();
}
