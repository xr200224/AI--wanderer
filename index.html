/* Profile tab: screenshot-matched personal center, without system chrome. */
#profile-panel {
  width: min(382px, calc(100vw - 34px));
  height: 100%;
  max-height: 100svh;
  margin: 0 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 70px 0 calc(108px + env(safe-area-inset-bottom));
  color: #16201d;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
#profile-panel::-webkit-scrollbar {
  display: none;
}
.profile-page {
  min-height: calc(100svh - 178px);
}
.profile-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 2px 26px;
}
.profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 999px;
  background: rgba(255,255,255,.45);
  border: 2px solid rgba(255,255,255,.86);
  box-shadow:
    0 16px 28px rgba(49,57,43,.13),
    inset 0 0 0 1px rgba(255,255,255,.42);
}
.profile-name {
  color: #111816;
  font-size: 23px;
  line-height: 1.05;
  font-weight: 950;
  letter-spacing: 0;
}
.profile-city {
  margin-top: 9px;
  color: #6f7771;
  font-size: 13px;
  line-height: 1;
  font-weight: 650;
}
.profile-logout {
  height: 35px;
  min-width: 62px;
  border: 0;
  border-radius: 999px;
  background: #1E2A37;
  color: #fff;
  box-shadow: 0 14px 24px rgba(24,36,47,.23);
  font-size: 13px;
  font-weight: 850;
}
.profile-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  min-height: 75px;
  border-radius: 18px;
  background: rgba(255,255,255,.66);
  box-shadow:
    0 18px 34px rgba(70,82,58,.08),
    inset 0 1px 0 rgba(255,255,255,.72);
  backdrop-filter: blur(18px);
  padding: 17px 5px 14px;
}
.profile-stat {
  min-width: 0;
  text-align: center;
}
.profile-stat-value {
  color: #087B79;
  font-size: 22px;
  line-height: 1;
  font-weight: 950;
  letter-spacing: .03em;
  white-space: nowrap;
}
.profile-stat-label {
  margin-top: 10px;
  color: #6E7670;
  font-size: 12px;
  line-height: 1;
  font-weight: 720;
  white-space: nowrap;
}
.profile-memory {
  margin-top: 32px;
  min-height: 258px;
  border-radius: 22px;
  background: rgba(255,255,255,.56);
  box-shadow:
    0 20px 34px rgba(70,82,58,.10),
    inset 0 0 0 1px rgba(255,255,255,.62);
  padding: 24px 18px 28px;
}
.profile-memory-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.profile-memory-title {
  color: #2C4942;
  font-size: 22px;
  line-height: 1;
  font-weight: 950;
}
.profile-memory-count {
  color: #444F49;
  font-size: 12px;
  line-height: 1;
  font-weight: 820;
}
.profile-memory-tools {
  display: flex;
  align-items: center;
  gap: 10px;
}
.profile-memory-upload-btn {
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  color: #fff;
  background: #1E2A37;
  font-size: 12px;
  font-weight: 850;
  box-shadow: 0 10px 18px rgba(24,36,47,.15);
}
.profile-memory-input {
  display: none;
}
.profile-polaroids {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 10px;
  min-height: 176px;
  margin-top: 24px;
  padding: 0 2px;
}
.profile-polaroid {
  position: relative;
  width: 31%;
  max-width: 104px;
  min-width: 0;
  padding: 8px 8px 17px;
  background: #fff;
  box-shadow: 0 14px 22px rgba(43,48,38,.16);
  transform: rotate(var(--profile-tilt, 0deg));
  transform-origin: 50% 16px;
}
.profile-polaroid:nth-child(1) {
  --profile-tilt: -8deg;
  margin-top: 8px;
}
.profile-polaroid:nth-child(2) {
  --profile-tilt: 5deg;
}
.profile-polaroid:nth-child(3) {
  --profile-tilt: 7deg;
  margin-top: 7px;
}
.profile-polaroid::before {
  content: "";
  position: absolute;
  top: -11px;
  left: 50%;
  width: 13px;
  height: 13px;
  border-radius: 999px;
  background: #ED4056;
  box-shadow: 0 4px 8px rgba(237,64,86,.28);
  transform: translateX(-50%);
}
.profile-polaroid-delete {
  position: absolute;
  top: -12px;
  right: -8px;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border: 2px solid rgba(255,255,255,.9);
  border-radius: 999px;
  color: #fff;
  background: rgba(30,42,55,.94);
  box-shadow: 0 8px 14px rgba(20,28,36,.18);
  font-size: 16px;
  line-height: 1;
  font-weight: 820;
}
.profile-polaroid img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1.13;
  object-fit: cover;
  background: #EEF2EE;
}
.profile-polaroid-city {
  margin-top: 10px;
  overflow: hidden;
  color: #4D5751;
  font-size: 12px;
  line-height: 1;
  font-weight: 650;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.profile-memory-empty {
  display: flex;
  flex-direction: column;
  place-items: center;
  align-items: center;
  justify-content: center;
  gap: 18px;
  min-height: 172px;
  color: #7E8982;
  font-size: 14px;
  font-weight: 760;
  text-align: center;
}
.profile-memory-empty .profile-memory-upload-btn {
  height: 36px;
  padding: 0 18px;
}
@media (max-width: 430px) {
  #profile-panel {
    width: calc(100vw - 32px);
    padding-top: 68px;
  }
  .profile-head {
    gap: 14px;
  }
  .profile-avatar {
    width: 70px;
    height: 70px;
  }
}

/* Bill tab: screenshot-matched ledger surface, without system chrome. */
#bill-panel {
  width: min(382px, calc(100vw - 34px));
  height: 100%;
  max-height: 100svh;
  margin: 0 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 42px 0 calc(108px + env(safe-area-inset-bottom));
  color: #151719;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
#bill-panel::-webkit-scrollbar {
  display: none;
}
.bill-summary-card {
  position: relative;
  min-height: 136px;
  border-radius: 24px;
  overflow: hidden;
  background:
    radial-gradient(circle at 88% 22%, rgba(255,219,122,.34), transparent 28%),
    radial-gradient(circle at 55% 80%, rgba(110,229,221,.23), transparent 38%),
    rgba(255,255,255,.82);
  box-shadow: 0 16px 30px rgba(64,76,63,.09);
  backdrop-filter: blur(18px);
  padding: 34px 22px 24px;
}
.bill-summary-amount {
  position: relative;
  z-index: 2;
  margin: 0 0 20px;
  color: #121415;
  font-size: 36px;
  line-height: .95;
  font-weight: 950;
  letter-spacing: -.5px;
}
.bill-summary-sub {
  position: relative;
  z-index: 2;
  color: #191B1D;
  font-size: 16px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: .2px;
}
.bill-summary-art {
  position: absolute;
  right: 14px;
  top: 27px;
  width: 112px;
  height: 86px;
  object-fit: contain;
  opacity: .96;
}
.bill-action-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 14px;
}
.bill-action-card {
  min-height: 78px;
  border-radius: 13px;
  border: 0;
  background: rgba(255,255,255,.92);
  box-shadow: 0 12px 24px rgba(64,76,63,.08);
  display: grid;
  grid-template-columns: 40px minmax(0,1fr);
  align-items: center;
  gap: 8px;
  padding: 15px 12px;
  text-align: left;
  color: #151719;
}
.bill-action-icon {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.bill-action-icon svg {
  width: 22px;
  height: 22px;
  stroke-width: 2.5;
}
.bill-action-icon.split {
  color: #0E1114;
  background: #FFDCE8;
}
.bill-action-icon.invite {
  color: #0E1114;
  background: #B9F2E2;
}
.bill-action-title {
  display: block;
  font-size: 18px;
  line-height: 1.05;
  font-weight: 950;
  white-space: nowrap;
}
.bill-action-sub {
  display: block;
  margin-top: 7px;
  color: #9A9EA2;
  font-size: 11.5px;
  line-height: 1;
  font-weight: 760;

.bill-day-head {

  justify-content: space-between;
  margin: 20px 4px 10px;

  font-size: 14px;
  line-height: 1;
  font-weight: 950;
  letter-spacing: 1px;

.bill-day-count {
  color: #8B8F93;
  font-size: 13px;
  font-weight: 850;
  letter-spacing: 0;

.bill-ledger-list {

.bill-ledger-icon svg {
  width: 20px;
  height: 20px;

.bill-ledger-title {
  color: #191B1D;
  font-size: 16px;
  line-height: 1.05;

.bill-ledger-sub {
  margin-top: 6px;

.bill-ledger-amount {

.bill-empty-state {

.bill-empty-icon svg {
  width: 23px;
  height: 23px;
  stroke-width: 2.4;
}
.bill-empty-title {

  font-size: 17px;

  font-weight: 920;
}
.bill-empty-copy {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.45;
  font-weight: 720;
}
.bill-empty-add,
.bill-quick-add,

.bill-quick-add svg {
  width: 18px;

.bill-entry-root {
  position: fixed;

  backdrop-filter: blur(8px);
}
.bill-entry-root.is-open {

.bill-entry-sheet {
  width: min(413px, calc(100vw - 20px));
  border-radius: 26px 26px 0 0;
  background: rgba(255,255,255,.97);
  box-shadow: 0 -18px 52px rgba(31,41,55,.20);
  padding: 10px 20px calc(22px + env(safe-area-inset-bottom));
  transform: translateY(16px);

// 匹配城市
function detectCity(text) {
  const value = String(text || '').trim();
  if (CITY_DB[value]) return value;
  for (const [city, kws] of Object.entries(CITY_KEYWORDS)) {
    if (kws.some(k => value.includes(k))) return city;
  }
  return null;
}

// Leaflet 初始化
// ══════════════════════════════════════════
const map = L.map('map', { zoomControl: true, attributionControl: false })
             .setView([32.6903, 109.0193], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

// ── 首页默认中心（无定位时回退）──
const DEFAULT_LOCATION = [32.6903, 109.0193];
let userMarker = null;

// 放置 / 更新「我的位置」标记
function setUserLocation(coords, recenter = true) {
  if (userMarker) map.removeLayer(userMarker);
  const icon = L.divIcon({
    className: '',
    html: `<div style="position:relative;width:22px;height:22px">
      <div style="position:absolute;inset:0;border-radius:50%;background:#7B61FF;
           border:3px solid #fff;box-shadow:0 2px 8px rgba(123,97,255,0.6);z-index:2"></div>
      <div style="position:absolute;inset:-9px;border-radius:50%;background:rgba(74,144,217,0.25);
           animation:userPulse 2s ease-out infinite;z-index:1"></div>
    </div>`,
    iconSize: [22, 22], iconAnchor: [11, 11],
  });
  userMarker = L.marker(coords, { icon, zIndexOffset: 1000 })
    .addTo(map)
    .bindPopup('<b style="font-size:13px">📍 我的位置</b>', { maxWidth: 160 });
  if (recenter) map.setView(coords, 13);
}

// 浏览器定位（失败则用默认位置），并加载附近 POI
function initUserLocationAndNearby() {
  const loadNearby = (coords) => {
    setUserLocation(coords, true);
    const nearestCity = nearestCityByCoords(coords) || '安康';
    addNearbyMarkers(CITY_DB[nearestCity]?.nearby || [], nearestCity);
  };
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => loadNearby([pos.coords.latitude, pos.coords.longitude]),
      ()  => loadNearby(DEFAULT_LOCATION),
      { enableHighAccuracy: true, timeout: 6000 }
    );
  } else {
    loadNearby(DEFAULT_LOCATION);
  }
}

function nearestCityByCoords(coords) {
  if (!Array.isArray(coords)) return null;
  const ranked = Object.entries(CITY_DB || {})
    .filter(([, info]) => Array.isArray(info.center))
    .map(([city, info]) => ({ city, dist: haversine(coords, info.center) }))
    .sort((a, b) => a.dist - b.dist);
  return ranked[0]?.city || null;
}

function normalizeCityContext(cityContext) {
  if (!cityContext) return [];
  const list = Array.isArray(cityContext) ? cityContext : [cityContext];
  return [...new Set(list.filter(city => CITY_DB[city] || HOTEL_DB[city] || MICRO_POI_DB[city]))];
}

function defaultPoiTier(index) {
  if (index < 2) return 1;

function addNearbyMarkers(pois, cityContext = null) {
  clearNearbyMarkers();

  // 合并酒店 + 微 POI。路线传入城市列表时，会自动叠加沿途酒店。
  const cityNames = normalizeCityContext(cityContext);
  const hotels = cityNames.flatMap(cityName =>
    (HOTEL_DB[cityName] || []).map((hotel, index) => ({
      ...hotel,
      cityName,
      kind: 'hotel',
      tier: index === 0 ? 2 : 3,
    }))
  );
  const micros = cityNames.flatMap(cityName =>
    (MICRO_POI_DB[cityName] || []).map(poi => ({
      ...poi,
      cityName,
      kind: 'micro',
      tier: 3,
    }))
  );
  const allPois = [
    ...pois.map((p, index) => ({...p, tier: p.tier || defaultPoiTier(index), kind: p.kind || 'poi'})),
    ...hotels,
    ...micros,
  ];

  allPois.forEach(poi => {
    const tier  = poi.tier || 1;
    const sz    = tier === 3 ? 28 : tier === 2 ? 30 : 32;
    const isHotel = poi.icon === '🏨' || poi.icon === '🏩' || poi.icon === '🏡';

    const icon = L.divIcon({
      className: '',
      html: `<div style="
        width:${sz}px;height:${sz}px;
        border-radius:${isHotel ? '8px' : '50%'};
        background:${poi.color};
        border:2px solid rgba(255,255,255,0.9);
        display:flex;align-items:center;justify-content:center;
        font-size:${sz-16}px;
        box-shadow:0 2px 8px rgba(0,0,0,0.2);
        opacity:0;transition:opacity .4s,transform .35s;transform:scale(0.5);
      " class="nearby-dot" data-tier="${tier}">${poi.icon}</div>`,
      iconSize: [sz, sz], iconAnchor: [sz/2, sz/2],
    });
    const mkr = L.marker(poi.coords, { icon })
      .addTo(map)
      .bindPopup(`
        <div style="font-family:-apple-system,sans-serif;min-width:150px">
          <b style="font-size:13px">${poi.icon} ${poi.name}</b><br>
          <span style="font-size:11px;color:#888">${poi.desc}</span>
          ${isHotel ? `<br><span style="font-size:11px;color:#0EA5E9;font-weight:600">🏨 点击查看详情</span>` : ''}
        </div>
      `, { maxWidth: 220 });

    // 酒店点击跳转到 POI 卡
    if (isHotel) {
      mkr.on('click', () => {
        openHotelPOI(poi);
      });
      hotelMarkerIndex[poi.name] = { marker: mkr, poi };
    } else {
      mkr.on('click', () => {
        openNearbyPOI(poi);
      });
      nearbyPoiIndex[poi.name] = { marker: mkr, poi };
    }

    nearbyMarkers.push({ marker: mkr, tier, poi });
  });

  updateNearbyVisibility();
}

function clearNearbyMarkers() {
  nearbyMarkers.forEach(({marker}) => map.removeLayer(marker));
  nearbyMarkers = [];
  hotelMarkerIndex = {};
  nearbyPoiIndex = {};
}

function updateNearbyVisibility() {
  const zoom = map.getZoom();
  nearbyMarkers.forEach(({marker, tier}) => {
    // tier-1: zoom≥9  tier-2: zoom≥11  tier-3(酒店/餐厅): zoom≥13
    const threshold = tier === 3 ? 13 : tier === 2 ? 11 : 9;
    const visible = zoom >= threshold;
    const el = marker.getElement()?.querySelector('.nearby-dot');
    if (el) {
      el.style.opacity = visible ? '1' : '0';
      el.style.transform = visible ? 'scale(1)' : 'scale(0.5)';
      el.style.pointerEvents = visible ? 'auto' : 'none';
    }
  });
}

// 时间轴渲染
// ══════════════════════════════════════════
let timelineActiveDay = 'all';

function timelineSafeValue(getter, fallback = null) {
  try {
    const value = getter();
    return value ?? fallback;
  } catch (error) {
    return fallback;
  }
}

function timelineCssEscape(value) {
  return timelineSafeValue(() => CSS.escape(String(value)), String(value).replace(/[^a-zA-Z0-9_-]/g, '\\$&'));
}

function timelineCurrentPlan() {
  return timelineSafeValue(() => currentPlan, null);
}

function timelineRouteData() {
  const activeRoute = timelineSafeValue(() => homeActiveRouteData(), null);
  if (activeRoute?.itinerary?.length) return activeRoute;
  const latestRoute = timelineSafeValue(() => routeData, null) || window.__ROUTE_DATA;
  if (latestRoute?.itinerary?.length) return normalizeAIItineraryData(latestRoute);
  return null;
}

function normalizeLooseCityName(city) {
  return String(city || '')
    .replace(/\s+/g, '')
    .replace(/^中国/, '')
    .replace(/市$/, '')
    .trim();
}

function itineraryCityFromText(text) {
  const value = String(text || '').trim();
  if (!value) return '';
  const patterns = [
    /^([\u4e00-\u9fa5A-Za-z]{2,12})\s*\d+\s*[日天晚]/,
    /^([\u4e00-\u9fa5A-Za-z]{2,12})\s*(?:路线|行程|主推路线)/,
    /^([\u4e00-\u9fa5A-Za-z]{2,12})\s*[|｜·•]/,
    /(?:^|[\s(（])([\u4e00-\u9fa5A-Za-z]{2,12})\s*[·•]/,
  ];
  for (const pattern of patterns) {
    const match = value.match(pattern);
    const city = normalizeLooseCityName(match?.[1] || '');
    if (city) return city;
  }
  return '';
}

function itineraryRouteCity(route, plan = null) {
  const routeCity = normalizeLooseCityName(
    route?.city
    || route?.destination
    || route?.destCity
    || route?.cities?.[route.cities.length - 1]
  );
  if (routeCity) return routeCity;
  const titleCity = itineraryCityFromText(route?.title || route?.name || route?.themeTitle || '');
  if (titleCity) return titleCity;
  const dayTitleCity = (route?.itinerary || [])
    .map(day => itineraryCityFromText(day?.title || day?.day_title || ''))
    .find(Boolean);
  if (dayTitleCity) return dayTitleCity;
  const firstSpot = (route?.itinerary || []).flatMap(day => day?.spots || []).find(Boolean);
  const spotCity = normalizeLooseCityName(
    firstSpot?.city
    || firstSpot?.destination
    || firstSpot?.poi_city
    || firstSpot?.city_name
  );
  if (spotCity) return spotCity;
  const spotContextCity = itineraryCityFromText([
    firstSpot?.location,
    firstSpot?.address,
    firstSpot?.sub_name,
    firstSpot?.reason,
  ].filter(Boolean).join(' '));
  if (spotContextCity) return spotContextCity;
  return normalizeLooseCityName(plan?.city || plan?.cities?.[plan.cities.length - 1] || '');
}

function timelineCityName() {
  const plan = timelineCurrentPlan();
  const route = timelineRouteData();
  return timelineSafeValue(() => itineraryRouteCity(route, plan), null)
    || timelineSafeValue(() => plan?.city || plan?.cities?.[plan.cities.length - 1], null)
    || timelineSafeValue(() => homeSelectedCity, null)
    || '顺德';
}

function dateOnlyISO(value = new Date()) {
  const date = value instanceof Date ? value : new Date(value);
  const safeDate = Number.isNaN(date.getTime()) ? new Date() : date;
  const year = safeDate.getFullYear();
  const month = String(safeDate.getMonth() + 1).padStart(2, '0');
  const day = String(safeDate.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function dateFromISO(value) {
  const matched = String(value || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!matched) return new Date();
  const date = new Date(Number(matched[1]), Number(matched[2]) - 1, Number(matched[3]));
  return Number.isNaN(date.getTime()) ? new Date() : date;
}

function addDaysToISO(value, offset = 0) {
  const date = dateFromISO(value);
  date.setDate(date.getDate() + Number(offset || 0));
  return dateOnlyISO(date);
}

function normalizeDateParts(year, month, day) {
  const date = new Date(Number(year), Number(month) - 1, Number(day));
  if (
    Number.isNaN(date.getTime())
    || date.getFullYear() !== Number(year)
    || date.getMonth() !== Number(month) - 1
    || date.getDate() !== Number(day)
  ) {
    return dateOnlyISO();
  }
  return dateOnlyISO(date);
}

function parseTravelDate(text, base = new Date()) {
  const value = String(text || '');
  const baseDate = base instanceof Date ? base : new Date(base);
  const safeBase = Number.isNaN(baseDate.getTime()) ? new Date() : baseDate;
  if (/后天/.test(value)) return addDaysToISO(dateOnlyISO(safeBase), 2);
  if (/明天|翌日|次日/.test(value)) return addDaysToISO(dateOnlyISO(safeBase), 1);
  if (/今天|今日|当天/.test(value)) return dateOnlyISO(safeBase);
  const full = value.match(/(20\d{2})\s*(?:年|[./-])\s*(\d{1,2})\s*(?:月|[./-])\s*(\d{1,2})\s*(?:日|号)?/);
  if (full) return normalizeDateParts(full[1], full[2], full[3]);
  const monthDay = value.match(/(^|[^\d])(\d{1,2})\s*(?:月|[./-])\s*(\d{1,2})\s*(?:日|号)?/);
  if (monthDay) {
    const iso = normalizeDateParts(safeBase.getFullYear(), monthDay[2], monthDay[3]);
    const planned = dateFromISO(iso);
    if (planned.getTime() < safeBase.getTime() - 1000 * 60 * 60 * 24 * 60) {
      return normalizeDateParts(safeBase.getFullYear() + 1, monthDay[2], monthDay[3]);
    }
    return iso;
  }
  return dateOnlyISO(safeBase);
}

function shortDateFromISO(value) {
  const date = dateFromISO(value);
  return `${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
}

function titleDateFromISO(value) {
  const date = dateFromISO(value);
  return `${String(date.getMonth() + 1).padStart(2, '0')}月${String(date.getDate()).padStart(2, '0')}日`;
}

function timelinePlanStartISO() {
  const plan = timelineCurrentPlan();
  const route = timelineRouteData();
  return route?.start_date
    || route?.startDate
    || plan?.startDate
    || plan?.travelDate
    || timelineSafeValue(() => currentPlan?.startDate || currentPlan?.travelDate, null)
    || dateOnlyISO();
}

function timelineDate(index = 0) {
  const iso = addDaysToISO(timelinePlanStartISO(), index);
  return {
    iso,
    short: shortDateFromISO(iso),
    title: titleDateFromISO(iso),
  };
}

function timelineDateRange(dayCount) {
  if (!dayCount) return '';
  const start = timelineDate(0).short;
  const end = timelineDate(Math.max(0, dayCount - 1)).short;
  return dayCount > 1
    ? `${start}至${end} ${dayCount}天${Math.max(0, dayCount - 1)}晚`
    : `${start} 1天`;
}

function timelineSpotPhoto(spot, city) {
  const cats = Array.isArray(spot?.photoCats) ? spot.photoCats : [];
  const catPhoto = cats.flatMap(cat => Array.isArray(cat.photos) ? cat.photos : [])
    .map(photo => typeof photo === 'string' ? photo : photo?.url)
    .find(Boolean);
  const raw = spot?.img || spot?.img_url || spot?.image_url || spot?.photo_url || catPhoto || curatedPlaceImage(spot, city);
  return safeImageUrl(raw, spot?.name || city, `${city}实景图待同步`);
}

function timelineTicketText(spot) {
  const text = `${spot?.price || ''}${spot?.ticket || ''}${spot?.desc || ''}${spot?.sub_name || ''}${spot?.reason || ''}`;
  if (/免费/.test(text)) return '免费或以现场为准';
  const matched = text.match(/票价\s*\d+\s*元|门票\s*\d+\s*元|\d+\s*元/);
  return matched ? matched[0].replace(/\s+/g, '') : '请现场确认';
}

function timelineFoodText(spot) {
  const text = `${spot?.category || ''}${spot?.tag || ''}${spot?.desc || ''}${spot?.sub_name || ''}${spot?.name || ''}`;
  if (/美食|餐|饭|菜|面|小吃|火锅|早茶|夜宵|吃/.test(text)) {
    return spot?.sub_name || spot?.desc || '本地热门风味';
  }
  return '附近顺路补餐';
}

function timelineTimeText(spot, index) {
  const raw = String(spot?.time || spot?.time_cost || spot?.suggest_time || '').trim();
  if (raw) return raw;
  return ['上午', '中午', '下午', '晚上'][index % 4] || '按路线安排';
}

function timelineDaysFromRoute(route, city) {
  return (route?.itinerary || []).map((day, dayIndex) => {
    const spots = (day.spots || []).filter(Boolean).map((spot, spotIndex) => ({
      ...spot,
      id: spot.id || `${city}_${dayIndex + 1}_${spotIndex + 1}`,
      day: Number(day.day) || dayIndex + 1,
    }));
    return {
      day: Number(day.day) || dayIndex + 1,
      date: timelineDate(dayIndex),
      spots,
    };
  }).filter(day => day.spots.length);
}

function timelineDaysFromNodes(city) {
  const stops = (NODES || []).filter(node => node?.type !== 'summary');
  if (!stops.length) return [];
  const byDay = new Map();
  stops.forEach((node, index) => {
    const day = Number(node.day || node.dayIndex || 1);
    if (!byDay.has(day)) byDay.set(day, []);
    byDay.get(day).push({ ...node, id: node.id || index + 1, day });
  });
  return [...byDay.entries()].map(([day, spots], index) => ({
    day,
    date: timelineDate(index),
    spots,
  }));
}

function timelineViewModel() {
  const city = timelineCityName();
  const route = timelineRouteData();
  const days = route ? timelineDaysFromRoute(route, city) : timelineDaysFromNodes(city);
  const hasTrip = days.some(day => day.spots?.length);
  return {
    city,
    days,
    hasTrip,
    dateRange: hasTrip ? timelineDateRange(days.length) : '',
  };
}

window.__TIMELINE_SPOT_DETAILS = window.__TIMELINE_SPOT_DETAILS || {};
window.__TIMELINE_SPOT_PHOTO_CACHE = window.__TIMELINE_SPOT_PHOTO_CACHE || {};

function timelineSpotDetailKey(city, day, index, spot) {

function timelineSpotDetailNode(spot, city) {

function openTimelineSpotDetail(key) {

function handleTimelineSpotKey(event, key) {

function selectTimelineDay(day) {

function timelineSpotPhotoCacheKey(spot, city) {
  return `${normalizeHomeCityName(city || '')}:${normalizeSpotKey(spot?.name || '')}`;
}

function scheduleTimelinePhotoHydration(view) {
  const token = ++timelinePhotoHydrationToken;
  setTimeout(() => hydrateTimelineSpotPhotos(view, token), 40);
}

async function hydrateTimelineSpotPhotos(view, token) {
  if (!view?.hasTrip || token !== timelinePhotoHydrationToken) return;
  const route = timelineRouteData();
  const city = view.city;
  const spots = view.days.flatMap(day => (day.spots || []).map((spot, index) => ({ day: day.day, index, spot })));
  await Promise.allSettled(spots.map(async ({ day, index, spot }) => {
    const cacheKey = timelineSpotPhotoCacheKey(spot, city);
    let photos = window.__TIMELINE_SPOT_PHOTO_CACHE[cacheKey];
    if (!photos) {
      const exact = (await searchPlacePhotos(spot, city, 6, { includeCityFallback: false })).filter(isUsablePlacePhoto);
      const fallback = routeSpotPhotoGallery(spot, { city }, null).map(photo => photo.url);
      photos = uniquePhotos([...exact, ...fallback]).filter(isUsablePlacePhoto).slice(0, 8);
      window.__TIMELINE_SPOT_PHOTO_CACHE[cacheKey] = photos;
    }
    if (token !== timelinePhotoHydrationToken || !photos?.length) return;
    const gallery = [{ label: '全部', photos: photos.map((url, photoIndex) => ({ url, caption: `${spot.name || '景点'} · 实景 ${photoIndex + 1}` })) }];
    spot.img = photos[0];
    spot.img_url = photos[0];
    spot.image_url = photos[0];
    spot.photoCats = gallery;
    route?.itinerary?.forEach(routeDay => {
      (routeDay?.spots || []).forEach(routeSpot => {
        if (normalizeSpotKey(routeSpot?.name || '') !== normalizeSpotKey(spot?.name || '')) return;
        routeSpot.img = photos[0];
        routeSpot.img_url = photos[0];
        routeSpot.image_url = photos[0];
        routeSpot.photoCats = gallery;
      });
    });
    const imgEl = document.querySelector(`.itinerary-stop[data-timeline-node="${timelineCssEscape(spot.id)}"] .itinerary-stop-photo`);
    if (imgEl && imgEl.getAttribute('src') !== photos[0]) {
      imgEl.classList.remove('img-fail');
      imgEl.dataset.fallbackApplied = '';
      imgEl.src = photos[0];
    }
    Object.values(window.__TIMELINE_SPOT_DETAILS || {}).forEach(detail => {
      if (normalizeSpotKey(detail?.name || '') !== normalizeSpotKey(spot?.name || '')) return;
      detail.img = photos[0];
      detail.img_url = photos[0];
      detail.image_url = photos[0];
      detail.photoCats = gallery;
    });
  }));
}

function renderTimeline() {
  const el = document.getElementById('timeline');

  const daysToShow = timelineActiveDay === 'all'

  const tabsHTML = [
    `<button class="itinerary-day-tab ${timelineActiveDay === 'all' ? 'is-active' : ''}" type="button" onclick="selectTimelineDay('all')">总览</button>`,
    ...view.days.map((day, index) => `

        ${escapeHTML(day.date.short)}
      </button>`),
  ].join('');
  const daysHTML = daysToShow.length ? daysToShow.map(day => {
    const stopsHTML = day.spots.map((spot, index) => {
      const detailKey = timelineSpotDetailKey(view.city, day.day, index, spot);
      window.__TIMELINE_SPOT_DETAILS[detailKey] = timelineSpotDetailNode(spot, view.city);
      const clickAttr = `role="button" tabindex="0" onclick="openTimelineSpotDetail('${homeJsString(detailKey)}')" onkeydown="handleTimelineSpotKey(event, '${homeJsString(detailKey)}')"`;
      return `
        <article class="itinerary-stop" ${clickAttr} data-timeline-node="${escapeHTML(spot.id)}">
          <div class="itinerary-stop-index">${index + 1}</div>
          <div class="itinerary-stop-main" id="card-${escapeHTML(spot.id)}">
            <div class="itinerary-stop-name">${escapeHTML(spot.name || '未命名地点')}</div>
            <div class="itinerary-stop-meta">
              <div class="itinerary-meta-line"><i data-lucide="clock-3" aria-hidden="true"></i><span>时间：${escapeHTML(timelineTimeText(spot, index))}</span></div>
              <div class="itinerary-meta-line"><i data-lucide="ticket" aria-hidden="true"></i><span>票价参考：${escapeHTML(timelineTicketText(spot))}</span></div>
              <div class="itinerary-meta-line"><i data-lucide="utensils" aria-hidden="true"></i><span>吃什么：${escapeHTML(timelineFoodText(spot))}</span></div>
            </div>
          </div>
          <img class="itinerary-stop-photo" src="${escapeHTML(timelineSpotPhoto(spot, view.city))}" alt="${escapeHTML(spot.name || '行程地点')}" loading="lazy" onerror="handlePlaceImageError(this, '${homeJsString(spot.name || view.city)}', '${homeJsString(view.city)}')">
        </article>`;
    }).join('');
    return `
      <section class="itinerary-day-section" data-route-day="${day.day}">
        <div class="itinerary-day-head">
          <div class="itinerary-day-title">第${day.day}天 · ${escapeHTML(day.date.title)}</div>
          <div class="itinerary-day-count">${day.spots.length}个地点</div>
        </div>
        <div class="itinerary-stop-list">${stopsHTML}</div>
        <div class="itinerary-day-actions">
          <button class="itinerary-day-action" type="button" onclick="openAddStop(${day.day})"><i data-lucide="plus" aria-hidden="true"></i>添加景点</button>
        </div>
      </section>`;
  }).join('') : `<div class="itinerary-empty">暂无行程，去“我的旅行规划”定制后会在这里展示。</div>`;
  el.innerHTML = `
    <div class="itinerary-route-view ${view.hasTrip ? 'has-trip' : 'has-no-trip'}" aria-label="${escapeHTML(view.city)}行程">
      ${view.hasTrip ? `
        <header class="itinerary-route-hero">
          <div class="itinerary-route-city">${escapeHTML(view.city)}</div>
          <div class="itinerary-route-meta">${escapeHTML(view.dateRange)}</div>
        </header>` : ''}
      <section class="itinerary-route-sheet">
        ${view.hasTrip ? `<div class="itinerary-day-tabs" role="tablist" aria-label="行程日期">${tabsHTML}</div>` : ''}
        <div class="itinerary-day-list">${daysHTML}</div>
        <div class="itinerary-route-bottom-spacer" aria-hidden="true"></div>
      </section>
    </div>`;
  view.days.flatMap(day => day.spots).forEach(spot => {
    const numericId = Number(spot.id);
    if (Number.isFinite(numericId) && markers[numericId]) {
      markers[numericId].domEl = el.querySelector(`#card-${timelineCssEscape(spot.id)}`);
    }
  });
  if (window.lucide?.createIcons) window.lucide.createIcons();
  scheduleTimelinePhotoHydration(view);
}

let currentId = null;

function focusNode(id, openCard) {
  const tgt = markers[id];
  if (!tgt) return;

  if (currentId !== null) {
    const prev = markers[currentId];
    if (prev.domEl) prev.domEl.classList.remove('active');
    prev.marker.remove();
    prev.marker = makeMarker(prev.node, false);
    prev.marker.on('click', () => focusNode(prev.node.id, true));
  }

  currentId = id;
  if (tgt.domEl) {
    tgt.domEl.classList.add('active');
    tgt.domEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  tgt.marker.remove();
  tgt.marker = makeMarker(tgt.node, true);
  tgt.marker.on('click', () => focusNode(id, true));

  collapseSheet();
  setTimeout(() => {
    map.flyTo(tgt.node.coords, 14, { animate: true, duration: 1.1, easeLinearity: 0.25 });
    if (openCard) setTimeout(() => openPOI(tgt.node), 1200);
  }, 160);
}

let currentNode = null, currentCatIdx = 0, currentPhotoIdx = 0;

function normalizePhotoCatsForPlace(node) {
  const city = node?.city || node?.cityName || lastPlannedCity || destCity || '';
  const title = node?.name || node?.fullName || '目的地';
  const cats = Array.isArray(node?.photoCats) ? node.photoCats : [];
  const normalized = cats.map(cat => {
    const trusted = (cat.photos || [])
      .filter(p => p?.url && !isSyntheticImageUrl(p.url) && !isBadCoverUrl(p.url))
      .map((p, i) => ({
        url: p.url,
        caption: p.caption || `${title} · 实景 ${i + 1}`,
      }));
    return trusted.length ? { label: cat.label || '全部', photos: trusted } : null;
  }).filter(Boolean);
  if (normalized.length) return normalized;
  const fallbackCategory = typeof normalizeSpotCategory === 'function'
    ? normalizeSpotCategory(node?.category, node)
    : 'classic';
  const fallbackUrls = uniquePhotos([
    node?.img,
    node?.img_url,
    node?.image_url,
    node?.photo_url,
    curatedPlaceImage(node, city),
    curatedPlacePhotoOverride(node, city, 0),
    curatedPlacePhotoOverride(node, city, 1),
    curatedPlacePhotoOverride(node, city, 2),
    curatedCategoryPhoto(city, fallbackCategory, title),
    curatedCategoryPhoto(city, 'classic', title),
    ...(typeof curatedHomeGalleryUrls === 'function' ? curatedHomeGalleryUrls({ ...node, city }) : []),
  ]).filter(isUsablePlacePhoto);
  if (fallbackUrls.length) {
    return [{
      label: '全部',
      photos: fallbackUrls.slice(0, 8).map((url, index) => ({
        url,
        caption: `${title} · 实景 ${index + 1}`,
      })),
    }];
  }
  return [{
    label: '全部',
    photos: [{
      url: placeholderImage(title, city ? `${city}实景图待同步` : '真实图片待同步'),
      caption: `${title} · 真实图片待同步`,
    }],
  }];
}

// 互換ラッパ：旧 node（nearby/hotel/timeline）でもOTA风格POIを開く
function openPOI(node) {
  if (!node) return;

function renderPhotoUI(photos, activeIdx) {
  const thumbsRow = document.getElementById('poi-thumbs-row');

  // 缩略图横滚

function renderPoiHeroDots(total, activeIdx) {

function updatePoiHeroHint(total) {
  const hint = document.getElementById('poi-hero-hint');
  if (!hint) return;
  hint.classList.toggle('is-hidden', total <= 1);
}

function updatePoiGalleryUI(idx, options = {}) {
  const photos = currentNode?.photoCats?.[currentCatIdx]?.photos || [];
  if (!photos.length) return;
  const safeIdx = Math.max(0, Math.min(photos.length - 1, Number(idx) || 0));
  currentPhotoIdx = safeIdx;
  document.getElementById('poi-img-cur').textContent = safeIdx + 1;
  document.getElementById('poi-img-total').textContent = photos.length;
  renderPoiHeroDots(photos.length, safeIdx);

  if (options.scrollHero !== false) {
    const heroTrack = document.getElementById('poi-hero-track');
    const slideWidth = heroTrack.clientWidth || 1;
    heroTrack.scrollTo({ left: slideWidth * safeIdx, behavior: options.instant ? 'auto' : 'smooth' });
  }

  document.querySelectorAll('#poi-album-row .poi-thumb').forEach((el, i) => {
    const active = i === safeIdx;
    el.classList.toggle('active', active);
    if (active) el.scrollIntoView({ behavior: options.instant ? 'auto' : 'smooth', inline:'center', block:'nearest' });
  });
}

function switchPhoto(idx) {
  updatePoiGalleryUI(idx);
}

function setHeroImg(url, idx, total) {

    const heroTrack = document.getElementById('poi-hero-track');
    const slideWidth = heroTrack.clientWidth || 1;
    const nextIdx = Math.round(heroTrack.scrollLeft / slideWidth);
    updatePoiGalleryUI(nextIdx, { scrollHero: false, instant: true });

// 地图缩放到当前节点范围（地图隐藏时跳过，由 switchTab 在显示时补做）
function mapIsVisible() {
  const p = document.getElementById('timeline-panel');
  return p && p.style.display !== 'none' && p.offsetParent !== null;
}
function fitMapToNodes(animate = true) {
  if (!mapIsVisible() || NODES.length === 0) return;
  try {
    map.invalidateSize();
    map.flyToBounds(NODES.map(n => L.latLng(n.coords)), { padding:[40,50], duration: animate ? 1 : 0 });
  } catch (e) { /* 隐藏或尺寸为0时忽略 */ }
}

function resetView() {
  if (currentId !== null) {
    const prev = markers[currentId];
    if (prev.domEl) prev.domEl.classList.remove('active');
    prev.marker.remove();
    prev.marker = makeMarker(prev.node, false);
    prev.marker.on('click', () => focusNode(prev.node.id, true));
    currentId = null;
  }
  closePOI();
  // 有行程节点则回到行程总览；否则（首页）回到「我的位置」
  if (NODES.length > 0) {
    fitMapToNodes(true);
  } else if (userMarker) {
    try { map.invalidateSize(); map.flyTo(userMarker.getLatLng(), 13, { duration: 1 }); } catch(e){}
  }
}

function showToast(msg, dur = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.opacity = '0', dur);
}

function syncLockedTripHomeLayout() {
  const body = document.body;
  if (!body?.classList.contains('trip-overview-mode')) {
    body?.classList.remove('trip-shell-locked', 'trip-home-locked');
    return;
  }
  const activeTab = body.dataset.activeTab || currentTab || 'chat';
  const shouldLockHome = activeTab === 'chat';
  body.classList.add('trip-shell-locked');
  body.classList.toggle('trip-home-locked', shouldLockHome);
  if (!shouldLockHome) return;

  const refWidth = 413;
  const refHeight = 744;
  const viewport = window.visualViewport;
  const viewportWidth = Math.max(320, Math.round(viewport?.width || window.innerWidth || refWidth));
  const viewportHeight = Math.max(568, Math.round(viewport?.height || window.innerHeight || refHeight));
  const scale = Math.min(1, viewportWidth / refWidth, viewportHeight / refHeight);
  const stageTop = Math.max(0, Math.round((viewportHeight - (refHeight * scale)) / 2));

  body.style.setProperty('--trip-home-scale', scale.toFixed(6));
  body.style.setProperty('--trip-home-stage-top', `${stageTop}px`);
}

function bindLockedTripHomeLayout() {
  syncLockedTripHomeLayout();
  window.addEventListener('resize', syncLockedTripHomeLayout, { passive: true });
  window.visualViewport?.addEventListener('resize', syncLockedTripHomeLayout, { passive: true });
  window.visualViewport?.addEventListener('scroll', syncLockedTripHomeLayout, { passive: true });
}

function setStep(nextStep) {
  step = nextStep;
  document.body.dataset.step = nextStep;
}

function setCardStage(nextStage = '') {
  if (nextStage) document.body.dataset.cardStage = nextStage;
  else document.body.removeAttribute('data-card-stage');
}

function setSelectedSpots(nextSelectedSpots) {
  selectedSpots = [...(nextSelectedSpots || [])];
  if (typeof spotSelectorState !== 'undefined') {
    spotSelectorState.selectedSpots = selectedSpots;
  }
  return selectedSpots;
}

function curatedPlacePhotoOverride(place, city, index = 0) {
  const text = `${place?.name || ''}${place?.poi_name || ''}${place?.card_title || ''}${place?.kw || ''}${place?.tag || ''}${place?.desc || ''}`;
  const match = CURATED_PLACE_PHOTO_OVERRIDES.find(item => item.city === city && item.re.test(text));
  if (!match?.urls?.length) return '';
  return match.urls[Math.abs(stableHash(`${text}${index}`)) % match.urls.length];
}

function curatedCategoryPhoto(city, category, seed = '') {
  const pool = CURATED_CITY_CATEGORY_PHOTOS[city]?.[category] || CURATED_CITY_CATEGORY_PHOTOS[city]?.classic || [];
  if (!pool.length) return '';
  return pool[Math.abs(stableHash(`${city}${category}${seed}`)) % pool.length];
}

  const raw = String(category || '').toLowerCase();
  if (/food|美食|餐|吃|小吃|夜宵|市集|本地风味/.test(raw)) return 'food';
  if (/classic|spot|view|景点|经典|文化|园林|街巷|夜景|出片|商业/.test(raw)) return 'classic';
  return 'classic';
}

function localHomeRecommendationImage(city, category, index = 0) {
  const cleanCity = normalizeHomeCityName(city);
  const normalizedCategory = normalizeRecommendationCategory(category);
  const cityPool = (CURATED_CITY_CATEGORY_PHOTOS[cleanCity]?.[normalizedCategory]
    || CURATED_CITY_CATEGORY_PHOTOS[cleanCity]?.classic
    || [])
    .filter(url => /^assets\//i.test(String(url || '')));
  const fallbackPool = LOCAL_HOME_RECOMMENDATION_FALLBACKS[normalizedCategory] || LOCAL_HOME_RECOMMENDATION_FALLBACKS.classic;
  const pool = cityPool.length ? cityPool : fallbackPool;
  if (!pool?.length) return '';
  const offset = Number.isFinite(Number(index)) ? Number(index) : 0;
  return pool[((offset % pool.length) + pool.length) % pool.length];
}

function isPlaceholderPhotoUrl(url) {
  const raw = String(url || '');
  return !raw
    || /^data:image\/svg\+xml/i.test(raw)
    || /真实图片待同步|实景图待同步|图片待同步|placeholder|placehold|dummyimage/i.test(raw);
}

function isUsablePlacePhoto(url) {
  return !!url && !isPlaceholderPhotoUrl(url) && !isSyntheticImageUrl(url) && !isBadCoverUrl(url);
}

function initialSelectablePhoto(node, city, category, index = 0) {
  const explicit = node?.img || node?.img_url || node?.image_url || node?.photo_url || curatedPlaceImage(node, city);
  if (isUsablePlacePhoto(explicit)) return explicit;
  const exact = curatedPlacePhotoOverride(node, city, index);
  if (isUsablePlacePhoto(exact)) return exact;
  const categoryPhoto = curatedCategoryPhoto(city, category, `${node?.name || node?.poi_name || ''}${index}`);
  if (isUsablePlacePhoto(categoryPhoto)) return categoryPhoto;
  return placeholderImage(node?.name || node?.poi_name || '目的地', city ? `${city}实景图待同步` : '真实图片待同步');
}

}

function selectedSpotNamesFromIntent(intent) {
  return (intent?.selectedSpotIds || []).map(spotNameById).filter(Boolean);

function nodeMatchesSelectedSpot(node, selectedIds = []) {
  if (!selectedIds.length || !node) return false;
  const hay = `${node.name || ''}${node.fullName || ''}${node.desc || ''}${node.tag || ''}`;
  return selectedIds.some(id => (spotSelectorTokens[id] || [spotNameById(id)])

function spotCategoryFromNode(node) {
  const hay = spotCategoryEvidenceText(node);
  if (spotMatchesCategory(node, 'food')) return 'food';
  if (spotMatchesCategory(node, 'night')) return 'night';
  if (spotMatchesCategory(node, 'art')) return 'art';
  if (/景区|地标|公园|海滨|博物|古迹|世界|湾|山|湖|步道|慢游|街区|城墙|钟楼|鼓楼|寺|塔|陵|宫|古城|遗址|故居|广场/.test(hay)) return 'classic';
  return 'classic';
}

function isInternalCategoryValue(value) {
  return ['classic', 'night', 'art', 'food', 'walk', 'photo'].includes(String(value || '').trim());
}

function categoryTextValue(value) {
  const text = String(value || '').trim();
  return isInternalCategoryValue(text) ? '' : text;
}

function spotCategoryEvidenceText(spot = {}) {
  const raw = spot?.raw || {};
  const sourceNode = spot?.source_node || {};
  return [
    spot?.name,
    spot?.poi_name,
    spot?.card_title,
    spot?.desc,
    spot?.sub_name,
    spot?.highlight,
    spot?.tag,
    spot?.icon,
    spot?.ranking,
    spot?.rank,
    spot?.card_rank,
    spot?.style_title,
    spot?.address,
    spot?.district,
    categoryTextValue(spot?.category),
    categoryTextValue(sourceNode?.category),
    sourceNode?.name,
    sourceNode?.desc,
    sourceNode?.tag,
    raw?.name,
    raw?.type,
    raw?.typecode,
    raw?.address,
  ].filter(Boolean).join(' ');
}

function spotLooksLikeTravelChoice(spot = {}, city = '', category = '') {
  const name = String(spot?.name || spot?.poi_name || spot?.card_title || '').trim();
  const text = spotCategoryEvidenceText(spot);
  if (!name) return false;
  if (/第[一二三四五六七八九十\d]+批|文物保护单位|保护单位名录|名单|列表|行政区划|市辖区|街道办|委员会|办事处|公司|医院/.test(name + text)) return false;
  if (/火车站|高铁站|机场|地铁站|汽车站|公交站/.test(name) && !/(老|旧址|遗址|博物|景区|公园|街|夜景|美食)/.test(name + text)) return false;
  if (city && !text.includes(city) && !String(spot?.source || '').includes('city_curated') && !Array.isArray(spot?.coords)) return false;
  if (category && !spotMatchesCategory(spot, category)) return false;
  return true;
}

};

function spotHasAmapTypePrefix(spot, prefix) {
  return spotAmapTypeCode(spot).startsWith(prefix);
}

function spotMatchesCategory(spot, category) {
  const text = spotCategoryEvidenceText(spot);
  if (!text) return false;
  if (CATEGORY_REJECT_PATTERNS[category]?.test(text)) return false;
  if (category === 'food') return spotHasAmapTypePrefix(spot, '05') || CATEGORY_POSITIVE_PATTERNS.food.test(text);
  if (category === 'night') return CATEGORY_POSITIVE_PATTERNS.night.test(text);
  if (category === 'art') return spotHasAmapTypePrefix(spot, '14') || CATEGORY_POSITIVE_PATTERNS.art.test(text);
  if (category === 'classic') {
    if (spotMatchesCategory(spot, 'food')) return false;
    return spotHasAmapTypePrefix(spot, '11') || spotHasAmapTypePrefix(spot, '14') || CATEGORY_POSITIVE_PATTERNS.classic.test(text);
  }
  return false;
}

function inferStrictSpotCategory(spot) {
  if (spotMatchesCategory(spot, 'food')) return 'food';
  if (spotMatchesCategory(spot, 'night')) return 'night';
  if (spotMatchesCategory(spot, 'art')) return 'art';
  if (spotMatchesCategory(spot, 'classic')) return 'classic';
  return 'classic';
}

function normalizeSpotCategory(category, spot = null) {
  const raw = String(category || '').trim();
  const mapped = raw === 'walk' ? 'classic' : raw === 'photo' ? 'art' : raw;
  if (['classic', 'night', 'art', 'food'].includes(mapped) && spotMatchesCategory(spot || {}, mapped)) return mapped;
  return spotCategoryFromNode({ ...(spot || {}), category: raw });
}

function selectorDescFromNode(node) {
  return String(node?.desc || node?.tag || '精选目的地')
    .replace(/·/g, '，')
    .replace(/\s+/g, ' ')

}

function normalizeSpotKey(name = '') {
  const text = String(name || '').trim();
  if (/兵马俑/.test(text)) return '兵马俑';
  if (/大唐不夜城/.test(text)) return '大唐不夜城';
  if (/城墙/.test(text)) return '西安城墙';
  if (/华清/.test(text)) return '华清宫';
  if (/永兴坊/.test(text)) return '永兴坊';
  if (/大雁塔|大慈恩寺/.test(text)) return '大雁塔';
  if (/陕西历史|陕历博/.test(text)) return '陕西历史博物馆';
  if (/碑林/.test(text)) return '碑林博物馆';
  if (/钟楼|鼓楼|钟鼓楼/.test(text)) return '钟鼓楼';
  if (/回民街|回坊/.test(text)) return '回民街';
  if (/小雁塔|西安博物院/.test(text)) return '小雁塔';
  if (/芙蓉园/.test(text)) return '大唐芙蓉园';
  return text
    .replace(/[·｜|()（）《》\s]/g, '')
    .replace(/博物馆|博物院|风景区|景区|旅游区|步行街|美食街|广场|温泉|骑行/g, '')
    .slice(0, 18);
}

function inferSpotCluster(spot, city) {
  if (spot?.cluster) return spot.cluster;
  const name = String(spot?.name || spot?.poi_name || '');
  if (/兵马俑|华清|临潼/.test(name)) return 'east';
  if (/大雁塔|不夜城|芙蓉园|陕西历史|陕历博/.test(name)) return 'qujiang';
  if (/城墙|钟|鼓|回民街|永兴坊|碑林|小雁塔|西安博物/.test(name)) return 'center';
  const center = CITY_DB[city]?.center;
  if (center && Array.isArray(spot?.coords)) {
    const distance = haversine(center, spot.coords);
    return distance > 18 ? 'outer' : 'center';
  }
  return 'center';
}

function inferSpotBestSlots(spot) {
  if (Array.isArray(spot?.bestSlots) && spot.bestSlots.length) return spot.bestSlots;
  const hay = `${spot?.name || ''}${spot?.desc || ''}${spot?.tag || ''}${spot?.category || ''}${spot?.icon || ''}`;
  if (/早餐|早市|清晨/.test(hay)) return ['清晨', '上午'];
  if (/美食|小吃|泡馍|餐|饭|夜市|回民街|永兴坊/.test(hay)) return ['中午', '晚上'];
  if (/夜景|夜游|灯|不夜城|酒吧|演艺|芙蓉园/.test(hay)) return ['傍晚', '晚上'];
  if (/拍照|出片|钟楼|鼓楼|城墙/.test(hay)) return ['傍晚', '上午'];
  if (/博物|碑林|历史|兵马俑/.test(hay)) return ['上午', '下午'];
  return ['上午', '下午'];
}

function inferSpotDuration(spot) {
  if (Number(spot?.duration)) return Number(spot.duration);
  const text = `${spot?.suggest_time || ''}${spot?.time_cost || ''}${spot?.desc || ''}${spot?.name || ''}`;
  if (/3小时|三小时|大型|兵马俑|博物馆|历史博物馆/.test(text)) return 150;
  if (/2小时|两小时|景区|公园|温泉|芙蓉园|不夜城/.test(text)) return 120;
  if (/美食|小吃|街|广场/.test(text)) return 75;
  return 90;
}

function inferSpotPopularity(spot, index = 0) {
  if (Number(spot?.popularity)) return Number(spot.popularity);
  const text = `${spot?.heat || ''}${spot?.rank || ''}${spot?.card_rank || ''}${spot?.rating || ''}`;
  const heat = parseInt(text.replace(/[^\d]/g, ''), 10);
  let score = Number.isFinite(heat) ? Math.min(98, 68 + Math.log10(Math.max(heat, 10)) * 8) : 78 - index;
  if (/第1名|榜首|5A|世界|国宝|必去|热门/.test(text)) score += 10;
  if (/小众|人少|安静/.test(`${spot?.desc || ''}${spot?.tag || ''}`)) score -= 4;
  return Math.max(54, Math.min(99, Math.round(score)));
}

function selectorSpotId(city, spot, index, source = 'spot') {
  if (spot?.id && String(spot.id).startsWith('xa_')) return String(spot.id);
  const key = normalizeSpotKey(spot?.name || spot?.poi_name || spot?.card_title || `spot_${index + 1}`)
    .replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
  return `${city || 'city'}_${source}_${index + 1}_${key || 'spot'}`;
}

function categoryLabelForSpot(category) {
  return ({
    classic: '景点',
    night: '夜景',
    art: '出片',
    food: '美食',
  }[category]) || '精选';
}

function cityCategoryCuratedSpots(city, category = '') {
  const citySet = CITY_CATEGORY_RECOMMENDATIONS[city] || {};
  const categoriesToUse = category ? [category] : categories.map(item => item.id);
  return categoriesToUse.flatMap(cat => (citySet[cat] || []).map((spot, index) => {
    const normalized = selectableSpotFromNode({
      ...spot,
      city,
      category: cat,
      tag: categoryLabelForSpot(cat),
      desc: spot.desc || categorySpotDesc(cat, spot, city),
      source: 'city_curated',
    }, city, index, 'city_curated');
    return normalized ? { ...normalized, ...spot, category: cat, source: 'city_curated' } : null;
  })).filter(Boolean);
}

function selectableSpotFromNode(node, city, index = 0, source = 'local') {
  const name = String(node?.name || node?.poi_name || node?.card_title || '').trim();
  if (!name) return null;
  const category = normalizeSpotCategory(node?.category || spotCategoryFromNode(node), node);
  const img = initialSelectablePhoto({ ...node, name }, city, category, index);
  const duration = inferSpotDuration(node);
  const price = node?.price || node?.ticket || node?.cost || (node?.rating ? `评分 ${node.rating}` : '价格以现场为准');
  return {
    id: selectorSpotId(city, node, index, source),
    name,
    desc: selectorDescFromNode(node),
    sub_name: String(node?.sub_name || node?.highlight || selectorDescFromNode(node)).slice(0, 28),
    category,
    img,
    price,
    time_cost: node?.time_cost || node?.timeCost || `${Math.round(duration / 60 * 10) / 10}小时左右`,
    coords: Array.isArray(node?.coords) ? node.coords : null,
    cluster: inferSpotCluster(node, city),
    bestSlots: inferSpotBestSlots(node),
    duration,
    popularity: inferSpotPopularity(node, index),
    source,
  };
}

function selectableSpotFromRawPoolSpot(spot, city, index = 0) {
  if (!spot) return null;
  const node = {
    ...spot,
    name: spot.name,
    desc: spot.sub_name || spot.desc || spot.address || '高德实时精选地点',
    img: spot.img || spot.photo_url || spot.image_url,
    category: normalizeSpotCategory(spot.category, spot),
    price: spot.price || spot.cost || '价格以现场为准',
    time_cost: spot.time_cost || spot.timeCost || '约1.5小时',
  };
  const normalized = selectableSpotFromNode(node, city, index, 'raw_spots_pool');
  return normalized ? { ...normalized, ...node, id: spot.id || normalized.id } : null;
}

function spotSourceRank(source = '') {
  if (source === 'city_curated') return 36;
  if (source === 'realtime') return 28;
  if (source === 'wikidata') return 22;
  if (source === 'wikipedia') return 18;
  if (source === 'city') return 10;
  if (source === 'seed') return 8;
  if (source === 'category_fallback') return 3;
  return 0;
}

function mergeSelectableSpots(...groups) {
  const seen = new Set();
  const merged = [];
  groups.flat().filter(Boolean).forEach((spot, index) => {
    const normalized = spot?.name ? selectableSpotFromNode(spot, spot.city || spotSelectorState.city, index, spot.source || 'local') : null;
    if (!normalized) return;
    const key = normalizeSpotKey(normalized.name);
    if (!key || seen.has(key)) return;
    seen.add(key);
    const mergedSpot = { ...normalized, ...spot, id: spot.id || normalized.id };
    merged.push({ ...mergedSpot, category: normalizeSpotCategory(mergedSpot.category, mergedSpot) });
  });
  return merged;
}

function dedupeSelectableByName(spots = []) {
  const seen = new Set();
  return (spots || []).filter(spot => {
    const key = normalizeSpotKey(spot?.name || '');
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function rankSelectableSpots(spots) {
  return [...spots].sort((a, b) => {
    const sourceA = spotSourceRank(a.source) + (a.id?.startsWith('xa_') ? 6 : 0);
    const sourceB = spotSourceRank(b.source) + (b.id?.startsWith('xa_') ? 6 : 0);
    return ((b.popularity || 0) + sourceB) - ((a.popularity || 0) + sourceA);
  });
}

function getSelectableSpots(city) {
  const data = CITY_DB[city];
  const micro = (typeof MICRO_POI_DB !== 'undefined' && MICRO_POI_DB[city]) || [];
  const seed = city === '西安' ? availableSpots : [];
  const cityPool = [...(data?.nodes || []), ...(data?.nearby || []), ...micro].filter(isAttraction);
  const mappedCityPool = cityPool.map((node, index) => selectableSpotFromNode(node, city, index, 'city'));
  const mappedSeed = seed.map((spot, index) => selectableSpotFromNode({ ...spot, city }, city, index, 'seed'));
  const curated = cityCategoryCuratedSpots(city);
  return rankSelectableSpots(mergeSelectableSpots(curated, mappedSeed, mappedCityPool))
    .filter(spot => spotLooksLikeTravelChoice(spot, city, normalizeSpotCategory(spot.category, spot)))
    .slice(0, 28);
}

function categorySpotDesc(category, spot, city) {
  const name = spot?.name || city;
  return ({
    classic: `${name}是${city}热门路线里的高频选择，适合优先纳入行程。`,
    night: `${name}可作为${city}傍晚或夜间段落，适合看城市灯光与夜游氛围。`,
    art: `${name}适合拍照、建筑观察或城市漫步，画面辨识度更强。`,
    food: `${name}周边适合顺路补餐，AI 会按午餐/晚餐时段衔接。`,
  }[category]) || (spot?.desc || `${city}精选地点`);
}

function categoryFallbackCandidateScore(spot, category) {
  const text = smartSpotText(spot);
  if (!spotMatchesCategory(spot, category)) return -Infinity;
  let score = inferSpotPopularity(spot);
  if (category === 'classic' && CATEGORY_POSITIVE_PATTERNS.classic.test(text)) score += 24;
  if (category === 'night' && CATEGORY_POSITIVE_PATTERNS.night.test(text)) score += 28;
  if (category === 'art' && CATEGORY_POSITIVE_PATTERNS.art.test(text)) score += 26;
  if (category === 'food' && CATEGORY_POSITIVE_PATTERNS.food.test(text)) score += 30;
  return score;
}

function cloneSpotForCategory(spot, category, city, index = 0) {
  if (!spot || !spotMatchesCategory(spot, category)) return null;
  return {
    ...spot,
    id: `${spot.id || selectorSpotId(city, spot, index, 'category')}_${category}`,
    category,
    desc: categorySpotDesc(category, spot, city),
    source: spot.source === 'realtime' || spot.source === 'wikipedia' || spot.source === 'wikidata'
      ? spot.source
      : 'category_fallback',
    popularity: Math.max(50, (spot.popularity || 70) - 2),
  };
}

function ensureSpotCategoryCoverage(spots = [], city = '') {
  const curated = cityCategoryCuratedSpots(city);
  const base = rankSelectableSpots(mergeSelectableSpots(curated, spots, getSelectableSpots(city)));
  const byId = new Map();
  base.forEach((spot, index) => {
    const category = normalizeSpotCategory(spot.category, spot);
    if (!spotMatchesCategory(spot, category)) return;
    if (!spotLooksLikeTravelChoice(spot, city, category)) return;
    const normalized = selectableSpotFromNode({ ...spot, category }, city, index, spot.source || 'local');
    if (!normalized) return;
    const merged = { ...normalized, ...spot, category };
    byId.set(merged.id, merged);
  });
  const values = [...byId.values()];
  categories.forEach(({ id: category }) => {
    const existing = values.filter(spot => normalizeSpotCategory(spot.category, spot) === category && spotMatchesCategory(spot, category));
    if (existing.length >= MIN_SPOTS_PER_CATEGORY) return;
    const fillers = rankSelectableSpots(mergeSelectableSpots(
      cityCategoryCuratedSpots(city, category),
      base.filter(spot => spotMatchesCategory(spot, category))
    ));
    fillers.forEach((spot, index) => {
      if (values.filter(item => normalizeSpotCategory(item.category, item) === category).length >= MIN_SPOTS_PER_CATEGORY) return;
      if (!spotLooksLikeTravelChoice(spot, city, category)) return;
      const normalized = selectableSpotFromNode({ ...spot, category }, city, index, spot.source || 'category_fallback');
      if (!normalized) return;
      const key = normalizeSpotKey(normalized.name);
      if (values.some(item => normalizeSpotKey(item.name) === key)) return;
      values.push({ ...normalized, ...spot, category });
    });
  });
  return rankSelectableSpots(values).slice(0, 32);
}

function showSpotSelectorPanel(city, days = 1, intent = null) {
  setStep('select_spots');
  spotSelectorState.activeCategory = 'classic';
  setSelectedSpots([]);
  spotSelectorState.spots = ensureSpotCategoryCoverage(getSelectableSpots(city), city);
  spotSelectorState.city = city || '西安';
  spotSelectorState.days = days || 1;
  spotSelectorState.intent = intent || {};
  renderSpotSelectorPanel();
  const overlay = document.getElementById('spot-selector-overlay');
  overlay?.classList.remove('closing');
  overlay?.classList.add('open');
  overlay?.setAttribute('aria-hidden', 'false');
}

function closeSpotSelectorPanel({ animate = true, nextStep = null, afterClose = null } = {}) {
  const overlay = document.getElementById('spot-selector-overlay');
  if (!overlay) {
    if (nextStep) setStep(nextStep);
    if (typeof afterClose === 'function') afterClose();
    return;
  }
  const finish = () => {
    overlay.classList.remove('open', 'closing');
    overlay.setAttribute('aria-hidden', 'true');
    if (nextStep) setStep(nextStep);
    if (typeof afterClose === 'function') afterClose();
  };
  if (animate && overlay.classList.contains('open')) {
    overlay.classList.add('closing');
    setTimeout(finish, 220);
  } else {
    finish();
  }
}

function renderSpotSelectorPanel() {
  const overlay = document.getElementById('spot-selector-overlay');
  if (!overlay) return;
  const filtered = spotSelectorState.spots.filter(spot => {
    const category = normalizeSpotCategory(spot.category, spot);
    return category === spotSelectorState.activeCategory && spotMatchesCategory(spot, category);
  });
  const tabs = spotCategoryTabs.map(tab => `
    <button type="button"
      class="spot-selector-tab ${spotSelectorState.activeCategory === tab.id ? 'active' : ''}"
      aria-pressed="${spotSelectorState.activeCategory === tab.id}"
      onclick="setSpotCategory('${tab.id}')">${escapeHTML(tab.label)}</button>`).join('');
  const cards = filtered.map(spot => {
    const selected = selectedSpots.includes(spot.id);
    return `
      <button type="button"
        class="spot-card ${selected ? 'selected' : ''}"
        aria-pressed="${selected}"
        onclick="toggleSpotSelection('${spot.id}')">
        ${selected ? '<span class="spot-check-badge" aria-hidden="true">✓</span>' : ''}
        <img class="spot-card-img" src="${escapeHTML(spot.img)}" alt="${escapeHTML(spot.name)}" loading="lazy">
        <div class="spot-card-name">${escapeHTML(spot.name)}</div>
        <div class="spot-card-desc">${escapeHTML(spot.desc)}</div>
      </button>`;
  }).join('');
  const selectedCount = selectedSpots.length;
  overlay.innerHTML = `
    <div class="spot-selector-shell" onclick="event.stopPropagation()">
      <div class="spot-selector-handle"></div>
      <div class="spot-selector-head">
        <div>
          <div class="spot-selector-title">选择想去的${escapeHTML(spotSelectorState.city)}景点</div>
          <div class="spot-selector-sub">${selectedCount ? `已选 ${selectedCount} 个，AI 会优先安排这些地点` : '点亮心愿清单，下一步直接定制路线'}</div>
        </div>
        <button class="spot-selector-skip" type="button" onclick="skipSpotSelection()">跳过</button>
      </div>
      <div class="spot-selector-tabs" aria-label="景点分类筛选">${tabs}</div>
      <div class="spot-selector-grid">${cards}</div>
    </div>
    <div class="spot-selector-action">
      <button class="spot-selector-btn" type="button" onclick="confirmSpotSelection()">开始 AI 定制</button>
    </div>`;
}

function setSpotCategory(category) {
  spotSelectorState.activeCategory = category;
  renderSpotSelectorPanel();
}

function toggleSpotSelection(spotId) {
  const current = selectedSpots;
  setSelectedSpots(current.includes(spotId)
    ? current.filter(id => id !== spotId)
    : [...current, spotId]);
  renderSpotSelectorPanel();
}

function cancelSpotSelection() {
  setSelectedSpots([]);
  closeSpotSelectorPanel({ nextStep: 'input' });
}

function handleSpotBackdropClick(event) {
  if (event.target && event.target.id === 'spot-selector-overlay') {
    cancelSpotSelection();
  }
}

function skipSpotSelection() {
  setSelectedSpots([]);
  onConfirmSpotSelection([]);
}

function onConfirmSpotSelection(selectedSpots) {
  const { city, days, intent } = spotSelectorState;
  const selectedNames = selectedSpots.map(spotNameById).filter(Boolean);
  const nextIntent = {
    ...(intent || {}),
    selectedSpotIds: selectedSpots,
    spotSelectorConfirmed: true,
  };
  closeSpotSelectorPanel({
    afterClose: () => generateCustomizedItinerary({ city, days, intent: nextIntent, selectedSpotIds: selectedSpots, selectedNames })
  });
}

function confirmSpotSelection() {
  onConfirmSpotSelection([...selectedSpots]);
}

function selectedSpotObjectsByIds(ids = [], pool = null) {
  const byId = new Map([...(pool || []), ...(spotSelectorState.spots || []), ...availableSpots].map(spot => [spot.id, spot]));
  return ids.map(id => byId.get(id)).filter(Boolean);
}

const SMART_ROUTE_SLOT_ORDER = ['清晨', '上午', '中午', '下午', '傍晚', '晚上'];
const SMART_ROUTE_SLOT_TIME = {
  清晨: '08:30',
  上午: '09:30',
  中午: '12:00',
  下午: '14:30',
  傍晚: '17:30',
  晚上: '19:30',
};

function smartRouteVariantLabel(variant) {
  return ({
    relax: '轻松版',
    niche: '小众版',
    photo: '拍照版',
  }[variant]) || '智能推荐';
}

function smartSpotText(spot) {
  return `${spot?.name || ''}${spot?.desc || ''}${spot?.tag || ''}${spot?.category || ''}${spot?.source || ''}`;
}

function smartSpotDistance(a, b) {
  if (!Array.isArray(a?.coords) || !Array.isArray(b?.coords)) return null;
  return haversine(a.coords, b.coords);
}

function smartSpotScore(spot, context = {}) {
  const selectedIds = context.selectedIds || new Set();
  const anchors = context.anchors || [];
  const variant = context.variant || 'base';
  const selected = selectedIds.has(spot.id);
  const text = smartSpotText(spot);
  let score = inferSpotPopularity(spot) + (selected ? 1000 : 0);

  if (anchors.length && !selected) {
    let bestDistance = Infinity;
    anchors.forEach(anchor => {
      const dist = smartSpotDistance(spot, anchor);
      if (Number.isFinite(dist)) bestDistance = Math.min(bestDistance, dist);
    });
    if (bestDistance < 2) score += 28;
    else if (bestDistance < 8) score += 18;
    else if (bestDistance < 20) score += 8;
    else if (Number.isFinite(bestDistance)) score -= variant === 'relax' ? 24 : 8;
  }

  if (anchors.some(anchor => anchor.cluster && anchor.cluster === spot.cluster)) score += 18;
  if (spot.source === 'realtime') score += 10;

  if (variant === 'relax') {
    score += (inferSpotDuration(spot) <= 90 ? 18 : 0);
    if (spot.cluster === 'east' && !selected) score -= 20;
    if (/咖啡|公园|街|广场|小雁塔|碑林|钟鼓楼|永兴坊|回民街/.test(text)) score += 14;
  } else if (variant === 'niche') {
    score += Math.max(0, 94 - inferSpotPopularity(spot)) * 0.8;
    if (/小雁塔|碑林|永兴坊|西安博物院|书院门|老街|微 POI|美食/.test(text)) score += 26;
    if (/兵马俑|大唐不夜城/.test(text) && !selected) score -= 16;
  } else if (variant === 'photo') {
    if (['art', 'night'].includes(spot.category) || /拍照|出片|夜景|夜游|灯|不夜城|钟鼓楼|城墙|芙蓉园|大雁塔/.test(text)) score += 34;
    if (inferSpotBestSlots(spot).some(slot => ['傍晚', '晚上'].includes(slot))) score += 18;
  } else {
    if (spot.cluster === 'center' || spot.cluster === 'qujiang') score += 5;
  }

  const preferenceText = explicitPreferenceLabels(context.intent, 4).join('');
  if (preferenceText && smartSpotText(spot).includes(preferenceText)) score += 20;
  return score;
}

function smartCompanionSpots(pool, picks, limit = 2) {
  const pickedKeys = new Set(picks.map(spot => normalizeSpotKey(spot.name)));
  const clusters = new Set(picks.map(spot => spot.cluster).filter(Boolean));
  return pool
    .filter(spot => !pickedKeys.has(normalizeSpotKey(spot.name)) && clusters.has(spot.cluster))
    .sort((a, b) => inferSpotPopularity(b) - inferSpotPopularity(a))
    .slice(0, limit);
}

function smartCandidateSlots(count, spots) {
  const hasFood = spots.some(spot => spot.category === 'food' || /美食|小吃|泡馍|餐|夜市|回民街|永兴坊/.test(smartSpotText(spot)));
  const hasNight = spots.some(spot => /夜|灯|不夜城|酒吧|夜景|演艺/.test(smartSpotText(spot)));
  if (count >= 5) return ['上午', '中午', '下午', '傍晚', '晚上'];
  if (count === 4) return hasFood ? ['上午', '中午', '下午', hasNight ? '晚上' : '傍晚'] : ['上午', '下午', '傍晚', '晚上'];
  if (count === 3) return hasNight ? ['上午', '下午', '晚上'] : ['上午', '中午', '下午'];
  if (count === 2) return ['上午', hasNight ? '晚上' : '下午'];
  return ['上午'];
}

function smartSlotScore(spot, slot, variant = 'base') {
  const bestSlots = inferSpotBestSlots(spot);
  const text = smartSpotText(spot);
  let score = bestSlots.includes(slot) ? 80 : 0;
  if (/美食|小吃|泡馍|餐|夜市|回民街|永兴坊/.test(text)) {
    if (slot === '中午') score += 54;
    if (slot === '晚上') score += 42;
  }
  if (/夜景|夜游|灯|不夜城|酒吧|演艺/.test(text)) {
    if (slot === '晚上') score += 62;
    if (slot === '傍晚') score += 46;
  }
  if (/拍照|出片|钟鼓楼|城墙|大雁塔|芙蓉园/.test(text) || variant === 'photo') {
    if (slot === '傍晚') score += 34;
    if (slot === '晚上') score += 24;
  }
  if (/博物|碑林|历史|兵马俑/.test(text)) {
    if (slot === '上午') score += 46;
    if (slot === '下午') score += 28;
    if (slot === '晚上') score -= 42;
  }
  if (spot.cluster === 'east') {
    if (slot === '上午') score += 30;
    if (slot === '晚上') score -= 48;
  }
  const firstBest = SMART_ROUTE_SLOT_ORDER.indexOf(bestSlots[0] || '上午');
  const current = SMART_ROUTE_SLOT_ORDER.indexOf(slot);
  score -= Math.abs(current - firstBest) * 6;
  return score;
}

function assignSmartSlots(daySpots, variant = 'base') {
  const slots = smartCandidateSlots(daySpots.length, daySpots);
  const assignments = daySpots.map((spot, index) => ({
    spot,
    slot: slots[Math.min(index, slots.length - 1)] || '上午',
  }));
  return assignments.sort((a, b) => SMART_ROUTE_SLOT_ORDER.indexOf(a.slot) - SMART_ROUTE_SLOT_ORDER.indexOf(b.slot));
}

function smartSpotSubName(spot, slot, prevSpot = null) {
  const desc = selectorDescFromNode(spot);
  const duration = inferSpotDuration(spot);
  const best = inferSpotBestSlots(spot).includes(slot) ? `${slot}更适合` : '顺路补充';
  const dist = prevSpot ? smartSpotDistance(spot, prevSpot) : null;
  const distanceText = Number.isFinite(dist) && dist < 8 ? `距上一站约${Math.max(0.5, dist).toFixed(1)}km` : best;
  const prefix = duration <= 75 ? '轻量停留' : `${Math.round(duration / 30) / 2}小时左右`;
  return `${distanceText} · ${prefix} · ${desc}`;
}

function chunkSmartRouteDays(picks, days, variant = 'base', selectedOnly = false) {
  const normalizedDays = Math.max(1, days || 1);
  const baseCount = Math.floor(picks.length / normalizedDays);
  const extraCount = picks.length % normalizedDays;
  let cursor = 0;
  const itinerary = [];
  for (let day = 0; day < normalizedDays; day++) {
    const take = baseCount + (day < extraCount ? 1 : 0);
    const daySpots = picks.slice(cursor, cursor + take);
    cursor += take;
    if (!daySpots.length) continue;
    const assigned = assignSmartSlots(daySpots, variant);
    itinerary.push({
      day: day + 1,
      day_title: `Day ${day + 1}｜${selectedOnly ? '已选地点顺序' : variant === 'relax' ? '少跨区轻松串联' : variant === 'niche' ? '热门旁的小众顺路线' : variant === 'photo' ? '黄金光线与夜景优先' : '按最佳时段与近距离串联'}`,
      spots: assigned.map((item, index) => {
        const prev = assigned[index - 1]?.spot || null;
        const geo = lngLatFromSpot(item.spot);
        const photo = item.spot.img || item.spot.img_url || item.spot.image_url || item.spot.photo_url || '';
        return {
          id: item.spot.id || `${day + 1}_${index + 1}`,
          name: item.spot.name,
          sub_name: smartSpotSubName(item.spot, item.slot, prev),
          desc: item.spot.desc || item.spot.sub_name || selectorDescFromNode(item.spot),
          tag: item.spot.tag || item.spot.category || '景点',
          category: item.spot.category || item.spot.tag || '景点',
          time: SMART_ROUTE_SLOT_TIME[item.slot] || item.slot,
          img: photo,
          img_url: photo,
          image_url: photo,
          coords: Array.isArray(item.spot.coords) ? item.spot.coords : geo,
          lng: geo ? geo[0] : undefined,
          lat: geo ? geo[1] : undefined,
          location: geo ? `${geo[0]},${geo[1]}` : undefined,
        };
      }),
    });
  }
  return itinerary;
}

function buildSmartBackupPool(pool, picks, itinerary, variant) {
  const pickedKeys = new Set(picks.map(spot => normalizeSpotKey(spot.name)));
  const unused = pool.filter(spot => !pickedKeys.has(normalizeSpotKey(spot.name)));
  const fallback = picks[picks.length - 1] || pool[0] || { id:'spot_1', name:'城市漫步', desc:'顺路补充' };
  const makeAlt = (type, matcher, reason) => {
    const spot = unused.find(matcher) || unused[0] || fallback;
    return [{
      target_id: fallback.id,
      replace_day: Math.max(1, itinerary.length),
      new_name: spot.name,
      new_sub_name: spot.desc || '顺路精选地点',
      reason,
    }];
  };
  return {
    niche_alternatives: makeAlt('niche', spot => inferSpotPopularity(spot) < 86, variant === 'niche'
      ? '已切到小众模式：优先选择热度稍低但顺路的真实地点，避免只围着经典三件套打转。'
      : '可切到小众模式：系统会从未使用景点中挑低拥挤度、同区域的地点重排整条路线。'),
    relax_alternatives: makeAlt('relax', spot => inferSpotDuration(spot) <= 90, variant === 'relax'
      ? '已切到轻松模式：减少远距离跨区，把更多节点压到同一片区，控制步行和通勤消耗。'
      : '可切到轻松模式：系统会减少远距离移动，保留更短停留、更近距离的多个地点。'),
    photo_alternatives: makeAlt('photo', spot => ['art', 'night'].includes(spot.category) || /夜景|出片|灯|城墙|钟鼓楼/.test(smartSpotText(spot)), variant === 'photo'
      ? '已切到拍照模式：把夜景、傍晚光线和高辨识度地点放到更合适的时间段。'
      : '可切到拍照模式：系统会按傍晚、夜景和地标辨识度重新安排整条路线。'),
  };
}

function routeDayNumber(day, index = 0) {
  const numeric = Number(day?.day);
  if (Number.isFinite(numeric) && numeric > 0) return numeric;
  const matched = String(day?.day_title || day?.title || '').match(/Day\s*(\d+)|第\s*(\d+)\s*天/i);
  const parsed = Number(matched?.[1] || matched?.[2]);
  return Number.isFinite(parsed) && parsed > 0 ? parsed : index + 1;
}

function routeHasUnbalancedDays(routeData, expectedDays = 1) {
  const route = normalizeAIItineraryData(routeData);
  const normalizedDays = Math.max(1, Number(expectedDays || route.days || route.day_count || route.itinerary?.length || 1));
  if (normalizedDays < 2) return false;
  const counts = Array.from({ length: normalizedDays }, (_, index) => {
    const day = (route.itinerary || []).find((item, dayIndex) => routeDayNumber(item, dayIndex) === index + 1);
    return Array.isArray(day?.spots) ? day.spots.length : 0;
  });
  const total = counts.reduce((sum, count) => sum + count, 0);
  if (total < normalizedDays + 2) return false;
  const low = Math.floor(total / normalizedDays) - 1;
  const high = Math.ceil(total / normalizedDays) + 1;
  return counts.some(count => count === 0 || count < low || count > high);
}

function orderSmartRoutePicks(picks, selected = [], variant = 'base') {
  const hasEast = picks.some(spot => spot.cluster === 'east') || selected.some(spot => spot.cluster === 'east');
  const selectedClusters = new Set(selected.map(spot => spot.cluster).filter(Boolean));
  const clusterOrder = selectedClusters.has('east')
    ? ['east', 'center', 'qujiang', 'outer']
    : variant === 'relax'
    ? ['center', 'qujiang', 'east', 'outer']
    : hasEast
      ? ['east', 'qujiang', 'center', 'outer']
      : ['center', 'qujiang', 'east', 'outer'];
  const clusterRank = spot => {
    const index = clusterOrder.indexOf(spot.cluster || 'center');
    return index === -1 ? clusterOrder.length : index;
  };
  return [...picks].sort((a, b) => {
    const clusterDelta = clusterRank(a) - clusterRank(b);
    if (clusterDelta) return clusterDelta;
    const aSlot = SMART_ROUTE_SLOT_ORDER.indexOf(inferSpotBestSlots(a)[0] || '上午');
    const bSlot = SMART_ROUTE_SLOT_ORDER.indexOf(inferSpotBestSlots(b)[0] || '上午');
    return aSlot - bSlot || inferSpotPopularity(b) - inferSpotPopularity(a);
  });
}

function buildSmartRouteData(city, days = 1, selectedSpotIds = [], intent = null, options = {}) {
  const variant = options.variant || intent?.routeVariant || 'base';
  const normalizedDays = Math.max(1, days || 1);
  const startDate = intent?.travelDate || intent?.startDate || dateOnlyISO();
  const basePool = mergeSelectableSpots(
    selectedSpotObjectsByIds(selectedSpotIds),
    spotSelectorState.spots || [],
    getSelectableSpots(city)
  );
  const pool = rankSelectableSpots(basePool);
  const selectedIds = new Set(selectedSpotIds);
  const selected = selectedSpotObjectsByIds(selectedSpotIds, pool);
  const selectedOnly = selected.length > 0;
  const perDayTarget = variant === 'relax' ? 4 : 5;
  const target = selectedOnly
    ? selected.length
    : Math.min(pool.length, Math.max(selected.length, normalizedDays * perDayTarget, selected.length + 2));
  const picks = [];
  const pickedKeys = new Set();
  const pushPick = spot => {
    if (!spot?.name) return;
    const key = normalizeSpotKey(spot.name);
    if (!key || pickedKeys.has(key)) return;
    pickedKeys.add(key);
    picks.push(spot);
  };

  selected.forEach(pushPick);
  if (!picks.length) {
    const first = [...pool].sort((a, b) => smartSpotScore(b, { variant, intent, selectedIds }) - smartSpotScore(a, { variant, intent, selectedIds }))[0];
    pushPick(first);
  }
  if (!selectedOnly) {
    smartCompanionSpots(pool, picks, variant === 'relax' ? 1 : 2).forEach(pushPick);
  }

  while (!selectedOnly && picks.length < target) {
    const next = pool
      .filter(spot => !pickedKeys.has(normalizeSpotKey(spot.name)))
      .sort((a, b) => smartSpotScore(b, { variant, intent, selectedIds, anchors: picks }) - smartSpotScore(a, { variant, intent, selectedIds, anchors: picks }))[0];
    if (!next) break;
    pushPick(next);
  }

  const ordered = selectedOnly ? picks : orderSmartRoutePicks(picks, selected, variant);
  const itinerary = chunkSmartRouteDays(ordered, normalizedDays, variant, selectedOnly);
  const selectedNames = selected.map(spot => spot.name);
  const flatCount = itinerary.reduce((sum, day) => sum + (day.spots || []).length, 0);
  const titleSuffix = selectedOnly
    ? '已选地点路线'
    : variant === 'relax'
    ? '轻松顺路慢游'
    : variant === 'niche'
      ? '小众顺路探索'
      : variant === 'photo'
        ? '黄金时段出片路线'
        : '热门景点智能串联';
  const reason = selectedOnly
    ? `只展示你选择的“${selectedNames.join('、')}”，不自动补充其他景点；可点“修改”继续增减。`
    : `已从 ${pool.length} 个热门/实时候选中筛出 ${flatCount} 个地点，并按距离近和最佳游玩时段重新排布。`;

  return normalizeAIItineraryData({
    title: `${city}${normalizedDays > 1 ? `${normalizedDays}日` : '1日'}｜${titleSuffix}`,
    start_date: startDate,
    days: normalizedDays,
    day_count: normalizedDays,
    match_rate: selectedOnly ? '100%' : variant === 'relax' ? '88%' : '92%',
    tags: selectedOnly
      ? [`已选择 ${selectedNames.length} 个地点`, '不自动补点', '可继续修改']
      : [
        smartRouteVariantLabel(variant),
        `热门景点池 ${pool.length} 个`,
        variant === 'relax' ? '少跨区' : variant === 'photo' ? '最佳光线' : '按时段重排',
      ],
    reason,
    itinerary,
    backup_pool: buildSmartBackupPool(pool, ordered, itinerary, variant),
  });
}

function buildFallbackRouteData(city, days = 1, selectedSpotIds = [], intent = null) {
  return buildSmartRouteData(city, days, selectedSpotIds, intent, { variant: intent?.routeVariant || 'base' });
}

async function fetchSpotCustomizedItinerary({ city, days, selectedSpotIds, intent }) {
  const selectedNames = selectedSpotIds.map(spotNameById).filter(Boolean);
  const preferences = [...selectedNames, ...itineraryPrefsFromIntent(intent)];
  const response = await fetch('/.netlify/functions/get-itinerary', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      city,
      days,
      selectedSpots: selectedSpotIds,
      selectedSpotNames: selectedNames,
      preferences,
      spotCatalog: spotSelectorState.spots,
    }),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok || payload.ok === false) {
    throw new Error(payload.error || `get-itinerary failed: ${response.status}`);
  }
  return normalizeAIItineraryData(payload.itinerary || payload);
}

function morphSpotDetailPhotos(spot, state) {
  const city = state?.city || spot?.city || '';
  const name = spot?.name || '景点';
  const explicit = [
    spot?.img,
    spot?.img_url,
    spot?.image_url,
    spot?.photo_url,
  ].filter(isUsablePlacePhoto);
  const photos = [
    ...explicit.map((url, index) => ({ url, caption: `${name} · 实景 ${index + 1}` })),
    ...((Array.isArray(spot?.photoCats) ? spot.photoCats : [])
      .flatMap(cat => Array.isArray(cat?.photos) ? cat.photos : [])
      .map((photo, index) => ({
        url: typeof photo === 'string' ? photo : photo?.url,
        caption: typeof photo === 'string'
          ? `${name} · 实景 ${index + 1}`
          : (photo?.caption || `${name} · 实景 ${index + 1}`),
      }))),
  ].filter(photo => isUsablePlacePhoto(photo?.url));
  const unique = [];
  const seen = new Set();
  photos.forEach(photo => {
    const key = String(photo.url || '').trim();
    if (!key || seen.has(key)) return;
    seen.add(key);
    unique.push(photo);
  });
  if (unique.length) return unique;
  return [{
    url: safeImageUrl(spot?.img, name, city ? `${city}实景图待同步` : '真实图片待同步'),
    caption: `${name} · 真实图片待同步`,

}

function morphDayTitle(day, dayIndex) {

    .replace(/｜/g, ' | ')
    .trim();

  return /上午.*下午.*晚上/.test(base) ? `📅 ${base}` : `📅 ${base} | 上午 ➔ 下午 ➔ 晚上`;
}

function normalizeInstantMetaText(text) {
  const clean = String(text || '').replace(/^相距约/, '距上一站约').trim();
  const hour = clean.match(/^(\d+(?:\.\d+)?)小时左右$/);
  if (hour) return `停留${hour[1]}h`;
  const minutes = clean.match(/^(\d+)分钟左右$/);
  if (minutes) return `停留${minutes[1]}min`;
  return clean;
}

function instantSpotDetailParts(spot, index = 0) {
  const raw = String(spot?.sub_name || spot?.reason || 'AI 定制推荐')
    .replace(/相距约/g, '距上一站约')
    .replace(/\s+/g, ' ')
    .trim();
  const parts = raw.split(/\s*[·｜|]\s*/).map(part => part.trim()).filter(Boolean);
  const meta = [];
  const reason = [];
  parts.forEach(part => {
    const normalized = normalizeInstantMetaText(part);
    if (/^距上一站约/.test(normalized)) {
      if (index > 0) meta.push({ text: normalized, type: 'distance' });
      return;
    }
    if (/^停留/.test(normalized) || /更适合$/.test(normalized) || /轻量停留|顺路补充/.test(normalized)) {
      meta.push({ text: normalized, type: 'meta' });
      return;
    }
    reason.push(normalized);
  });
  if (!meta.length && spot?.time && !/\d{1,2}:\d{2}/.test(String(spot.time))) {
    meta.push({ text: `${spot.time}时段`, type: 'meta' });
  }
  return {
    meta: meta.slice(0, 2),
    reason: reason.join(' · ') || raw || 'AI 定制推荐',
  };
}

function instantSpotDetailHTML(spot, index = 0) {
