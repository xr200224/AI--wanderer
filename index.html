<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Wanderer · 智能旅行伴侣</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
  --brand-1:#7B61FF; --brand-2:#5B8DEF;          /* 通义 主グラデ */
  --brand-grad: linear-gradient(135deg,#7B61FF,#5B8DEF);
  --accent-warm:#FF7A3D;                          /* 出行平台 サブアクセント */
  --accent-warm-grad: linear-gradient(135deg,#FF8A3D,#FF6A2C);
  --ink:#1A1A1A; --ink-2:#4B5563; --ink-3:#9CA3AF;
  --bg:#FFFFFF; --surface:#fff; --line:#EEF0F4;
  --radius:18px; --radius-lg:22px;
  --shadow-soft:0 4px 20px rgba(80,70,160,0.08);
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; margin: 0; padding: 0; overflow: hidden;
  font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg);
}

/* ── 地图（内嵌在行程方案内，非全屏背景） ── */
#map-wrap {
  position: relative; width: 100%; height: 220px;
  border-radius: 16px; overflow: hidden; margin: 4px 0 14px;
  box-shadow: 0 2px 14px rgba(0,0,0,0.10); background: #e8eef3;
}
#map { position: absolute; inset: 0; z-index: 0; }
.leaflet-control-attribution { display: none !important; }
.leaflet-control-zoom { margin: 12px !important; }
.leaflet-control-zoom a {
  width: 36px !important; height: 36px !important; line-height: 36px !important;
  border-radius: 10px !important; border: none !important;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15) !important;
  background: rgba(255,255,255,0.95) !important;
  backdrop-filter: blur(8px) !important; color: #333 !important; font-size: 18px !important;
}

/* ── 顶部搜索栏 ── */
#topbar {
  display: none;
}
#search-bar {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.93); backdrop-filter: blur(16px);
  border-radius: 16px; padding: 10px 14px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.15); pointer-events: all;
}

/* ── 主界面容器（对话优先，全屏） ── */
#sheet {
  position: fixed; inset: 0; z-index: 30;
  background:
    radial-gradient(ellipse 70% 26% at 6% 105%, rgba(255, 216, 104, 0.28), rgba(255, 216, 104, 0.10) 34%, transparent 70%),
    radial-gradient(ellipse 74% 30% at 92% 106%, rgba(123, 97, 255, 0.18), rgba(123, 97, 255, 0.07) 38%, transparent 72%),
    radial-gradient(ellipse 54% 22% at 52% 112%, rgba(91, 141, 239, 0.10), transparent 70%),
    linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 74%, #FFFEFB 88%, #FBFAFF 100%);
  display: flex; flex-direction: column;
}
/* 顶部品牌条 */
#brand-bar {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: max(20px, env(safe-area-inset-top)) 22px 0;
  background: transparent; border-bottom: none;
}
.top-icon-btn {
  width: 34px; height: 34px; border: none; background: transparent; color: #111318;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; border-radius: 10px;
}
.top-icon-btn:active { background: rgba(17,24,39,0.06); transform: scale(0.96); }
.top-svg {
  display:block; overflow:visible;
  fill:none; stroke:#111318; stroke-linecap:round; stroke-linejoin:round;
}
.menu-svg { width:25px; height:25px; stroke-width:2.7; }
.new-chat-svg { width:27px; height:27px; stroke-width:2.45; transform: translate(1px, 0); }
/* 隐藏旧抽屉把手 */
#handle-zone { display: none; }
#handle-bar, #handle-label { display: none; }
#sheet-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* ── 视图切换 tab ── */
#view-tabs {
  display: none;
}
.view-tab {
  padding: 9px 16px; font-size: 13px; font-weight: 600;
  color: #9CA3AF; cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .18s; white-space: nowrap; user-select: none;
}
.view-tab.active { color: var(--brand-1); border-bottom-color: var(--brand-1); }

/* ── 聊天消息区 ── */
#chat-panel {
  flex: 1; overflow-y: auto; padding: 8px 28px 10px;
  -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px;
}
#chat-panel::-webkit-scrollbar { display: none; }

/* 用户气泡 */
.bubble-user {
  align-self: flex-end; width: fit-content; max-width: min(82%, 420px); min-width: 0;
  background: #ECE9FF; color: #20222A;
  border-radius: 18px 18px 6px 18px;
  padding: 12px 16px; font-size: 15px; line-height: 1.5;
  white-space: normal; word-break: break-word; overflow-wrap: anywhere;
  box-shadow: 0 10px 26px rgba(123,97,255,0.12);
}
/* AI 气泡 */
.bubble-ai {
  align-self: flex-start; max-width: 92%;
  background: var(--surface); color: var(--ink);
  border-radius: 4px var(--radius) var(--radius) var(--radius);
  padding: 13px 15px; font-size: 13.5px; line-height: 1.65;
  box-shadow: var(--shadow-soft);
  border: 1px solid var(--line);
}
.bubble-ai-header {
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 9px; padding-bottom: 8px;
  border-bottom: 1px solid #F5F5F5;
}
.bubble-ai-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand-grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(123,97,255,0.28);
}
.bubble-ai-name { font-size: 12px; font-weight: 700; color: var(--brand-1); }
.home-hero {
  margin-top: clamp(34px, 8vh, 72px);
  padding: 0 0 18px;
}
.home-title {
  color:#252936; font-size: 25.5px; line-height: 1.34; font-weight: 760;
  letter-spacing: 0; margin-bottom: 22px;
}
.home-actions { display:flex; flex-direction:column; align-items:flex-start; gap:13px; }
.home-action-pill {
  border: none; background: rgba(255,255,255,0.82); color:#20222A;
  border-radius: 20px; padding: 14px 24px; font-size: 17px; font-weight: 700;
  box-shadow: 0 14px 34px rgba(17,24,39,0.07); backdrop-filter: blur(18px);
  cursor:pointer; max-width:100%; text-align:left;
}
.home-action-pill:active { transform: scale(0.98); background:#fff; }
.home-spark { color:#7B4B43; margin-right:10px; font-size:14px; }
.bubble-ai.itinerary-answer {
  max-width: 94%;
  background: linear-gradient(150deg, #7B61FF 0%, #5B8DEF 100%);
  color: #fff;
  border: none;
  border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
  padding: 20px 24px;
  font-size: 15px;
  line-height: 1.55;
  box-shadow: 0 12px 30px rgba(91,141,239,0.28);
}
.bubble-ai.itinerary-answer .bubble-ai-header { display: none; }
.assistant-plain {
  align-self: stretch; color:#171923; font-size: 17px; line-height: 1.75;
  font-weight: 500; padding: 10px 4px 4px; letter-spacing: 0;
}
.itinerary-intro {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 22px;
}
.itinerary-day { margin-top: 24px; }
.itinerary-day:first-of-type { margin-top: 0; }
.itinerary-day-title {
  font-size: 16px;
  font-weight: 850;
  margin-bottom: 16px;
}
.itinerary-line {
  margin: 7px 0;
  font-size: 15px;
  font-weight: 780;
  color: rgba(255,255,255,0.96);
}
.itinerary-line .time {
  display: inline-block;
  min-width: 46px;
  font-variant-numeric: tabular-nums;
}
.itinerary-total {
  margin-top: 28px;
  font-size: 16px;
  font-weight: 850;
}
.itinerary-note {
  margin-top: 26px;
  font-size: 15px;
  font-weight: 760;
  color: rgba(255,255,255,0.94);
}
.itinerary-hotels {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.22);
}
.itinerary-hotels-title {
  font-size: 15px;
  font-weight: 850;
  margin-bottom: 10px;
}
.bubble-ai.itinerary-answer .ai-place-link {
  color: #E0F2FE;
  text-decoration-color: rgba(224,242,254,0.78);
}
.bubble-ai.itinerary-answer .ai-place-link:active { color: #fff; }
/* AI 气泡内的结构化段落 */
.ai-section { margin: 8px 0; }
.ai-section-title {
  font-size: 13px; font-weight: 700; color: #1A1A1A;
  margin-bottom: 5px; display: flex; align-items: center; gap: 5px;
}
.ai-item {
  font-size: 13px; color: #4B5563; padding: 3px 0 3px 14px;
  border-left: 2px solid #E5E7EB; margin: 3px 0; line-height: 1.5;
}
.ai-item b { color: #1A1A1A; }
.ai-place-link {
  color: var(--brand-1);
  font-weight: 800;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
  cursor: pointer;
}
.ai-place-link:active { color: #5B8DEF; }
.ai-highlight {
  display: inline-block; background: #F1EDFF; color: var(--brand-1);
  border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 600;
}
.ai-tag-ok   { background: #DCFCE7; color: #16A34A; }
.ai-tag-warn { background: #FEF2F2; color: #DC2626; }
/* 思考中动画 */
.bubble-thinking {
  display: flex; gap: 5px; align-items: center; padding: 4px 2px;
}
.bubble-thinking span {
  width: 7px; height: 7px; border-radius: 50%; background: #9CA3AF;
  animation: blink 1.2s infinite;
}
.bubble-thinking span:nth-child(2) { animation-delay: .2s; }
.bubble-thinking span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

/* ── 旅行方案：枠なしプレーン応答 + カードグリッド ── */
.plan-response { align-self: stretch; max-width: 100%; padding: 2px 2px 4px; }
.plan-response.response-enter {
  opacity: 0;
  transform: translateY(12px);
}
.plan-response.response-enter.is-visible {
  opacity: 1;
  transform: translateY(0);
  transition: opacity .56s ease, transform .56s cubic-bezier(.2,.8,.2,1);
}
.ai-thinking-line { display: flex; align-items: center; gap: 9px; padding: 8px 2px; font-size: 14px; color: #6B7280; font-weight: 500; }
.ai-think-spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #E4DBFF; border-top-color: var(--brand-1); animation: aiSpin .8s linear infinite; flex-shrink: 0; }
@keyframes aiSpin { to { transform: rotate(360deg); } }
.plan-intro {
  font-size: 16px; line-height: 1.7; color: var(--ink); font-weight: 500;
  margin: 2px 0 18px;
}
.plan-pick-title { font-size: 17px; font-weight: 800; color: var(--ink); margin: 0 0 14px; }
.preference-panel {
  display:flex; flex-direction:column; gap:10px; margin: 0 0 16px;
  border:1px solid rgba(235,237,242,0.92); border-radius:18px; padding:12px;
  background:rgba(255,255,255,0.72); box-shadow:0 10px 28px rgba(17,24,39,0.05);
}
.preference-title { font-size:13px; color:#6B7280; font-weight:750; }
.preference-chips { display:flex; flex-wrap:wrap; gap:7px; }
.preference-chip {
  border:1px solid rgba(123,97,255,0.14); background:#F5F2FF; color:#5954D8;
  border-radius:999px; padding:6px 10px; font-size:12px; font-weight:800; line-height:1;
  cursor:pointer;
}
.preference-chip.muted { background:#F8FAFC; color:#6B7280; border-color:#EDF0F4; }
.route-decision {
  display:flex; flex-direction:column; gap:14px; margin-top:2px;
}
.primary-route-card {
  position:relative; overflow:hidden; min-height:268px; border-radius:22px;
  background-size:cover; background-position:center; cursor:pointer;
  box-shadow:0 18px 44px rgba(31,41,55,0.14);
  border:1px solid rgba(255,255,255,0.72);
}
.primary-route-card::after {
  content:''; position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(11,18,32,0.24) 0%, rgba(11,18,32,0.52) 58%, rgba(11,18,32,0.76) 100%),
    radial-gradient(circle at 12% 10%, rgba(123,97,255,0.34), transparent 42%);
}
.primary-route-body {
  position:relative; z-index:1; min-height:268px; padding:16px;
  display:flex; flex-direction:column; justify-content:space-between; gap:18px;
  color:#fff;
}
.route-eyebrow { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.route-badge {
  display:inline-flex; align-items:center; gap:6px; border-radius:999px;
  background:rgba(255,255,255,0.20); border:1px solid rgba(255,255,255,0.26);
  padding:6px 9px; font-size:11px; font-weight:850; backdrop-filter:blur(12px);
}
.route-score {
  border-radius:999px; padding:6px 10px; font-size:11px; font-weight:900;
  background:rgba(236,232,255,0.92); color:#5E55D9;
}
.primary-route-title {
  font-size:22px; line-height:1.25; font-weight:900; letter-spacing:0;
  text-shadow:0 2px 12px rgba(0,0,0,0.36);
}
.primary-route-title .city { color:#FFE16A; }
.primary-route-sub {
  margin-top:8px; font-size:13px; line-height:1.5; color:rgba(255,255,255,0.9);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.primary-route-reasons {
  display:grid; gap:7px; margin-top:12px;
}
.primary-route-reason {
  display:flex; align-items:flex-start; gap:7px; font-size:12px; line-height:1.42;
  color:rgba(255,255,255,0.94);
}
.primary-route-reason span {
  width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,0.22);
  display:inline-flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0;
}
.primary-route-cta {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.primary-route-path {
  min-width:0; font-size:11.5px; line-height:1.35; color:rgba(255,255,255,0.76);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.primary-route-btn {
  border:none; border-radius:14px; padding:9px 15px; flex-shrink:0;
  background:rgba(255,255,255,0.92); color:#202532; font-size:13px; font-weight:900;
  box-shadow:0 10px 28px rgba(0,0,0,0.18);
}
.route-adjust-row {
  display:flex; gap:8px; overflow-x:auto; padding:0 1px 2px; scrollbar-width:none;
}
.route-adjust-row::-webkit-scrollbar { display:none; }
.route-adjust-row button {
  border:1px solid rgba(123,97,255,0.14); background:#fff; color:#4B5563;
  border-radius:999px; padding:8px 11px; font-size:12px; font-weight:850;
  white-space:nowrap; box-shadow:0 8px 20px rgba(17,24,39,0.05);
}
.instant-route-card {
  position:relative; overflow:hidden; border-radius:22px; padding:15px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.96), rgba(248,250,255,0.9)),
    radial-gradient(circle at 88% 0%, rgba(123,97,255,0.16), transparent 34%);
  border:1px solid rgba(234,237,245,0.95);
  box-shadow:0 18px 44px rgba(31,41,55,0.10);
}
.instant-route-top { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:8px 12px; }
.instant-route-kicker { display:flex; align-items:center; gap:8px; margin-bottom:0; }
.instant-route-badge {
  display:inline-flex; align-items:center; border-radius:999px; padding:5px 8px;
  background:#F5F2FF; color:#655AE7; font-size:11px; font-weight:900;
}
.instant-route-rate {
  flex-shrink:0; border-radius:999px; padding:7px 10px;
  background:linear-gradient(135deg, #6B5CFF, #7EA6FF); color:#fff;
  font-size:12px; font-weight:950; box-shadow:0 8px 20px rgba(107,92,255,0.24);
}
.instant-route-title {
  grid-column:1 / -1; min-width:0; color:#1F2937; font-size:18px; line-height:1.28; font-weight:950; letter-spacing:0;
  word-break:keep-all; overflow-wrap:break-word;
}
.instant-route-tags {
  position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:11px 0 14px;
}
.instant-route-tags.has-edit-action {
  padding-right:50px;
}
.instant-route-tag {
  border-radius:999px; padding:5px 8px; background:#F6F7FB; color:#5F6676;
  font-size:11px; line-height:1; font-weight:850; border:1px solid #ECEEF5;
}
.instant-tags-edit {
  position:absolute; right:0; bottom:0; height:25px; padding:0 10px;
  border-radius:999px; border:1px solid rgba(123,97,255,0.20);
  background:linear-gradient(135deg, #F7F4FF, #EEF5FF); color:#5E55D9;
  font-size:11px; line-height:1; font-weight:950; white-space:nowrap;
  box-shadow:0 8px 18px rgba(107,92,255,0.12); cursor:pointer;
  transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
}
.instant-tags-edit:active {
  transform:scale(.95);
  box-shadow:0 5px 12px rgba(107,92,255,0.10);
}
.instant-day-list {
  display:grid; gap:10px; margin:0 0 13px;
}
.instant-day-block {
  position:relative; padding:11px; border-radius:18px;
  background:rgba(255,255,255,0.86); border:1px solid #EEF1F7;
  box-shadow:0 8px 22px rgba(17,24,39,0.045);
}
.instant-day-title {
  color:#202532; font-size:13px; line-height:1.35; font-weight:950;
  margin:0 0 9px;
}
.instant-spot-flow {
  display:grid; gap:8px;
}
.instant-day-spot {
  position:relative; display:grid; grid-template-columns:52px minmax(0,1fr);
  gap:9px; align-items:center; min-height:74px; padding:10px;
  border-radius:16px; background:#fff; border:1px solid #EEF0F6;
  box-shadow:0 8px 18px rgba(17,24,39,0.04);
}
.instant-day-spot:not(:last-child)::after {
  content:''; position:absolute; left:35px; bottom:-9px; width:2px; height:9px;
  background:linear-gradient(180deg, #DDE3F1, transparent);
}
.instant-spot-time {
  width:46px; padding:5px 0; border-radius:999px; text-align:center;
  background:#F2EFFF; color:#665BEB; font-size:10.5px; font-weight:950;
}
.instant-spot-content { min-width:0; display:grid; gap:5px; }
.instant-spot-name {
  min-width:0; color:#222633; font-size:13.5px; line-height:1.28; font-weight:950;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.instant-spot-sub {
  margin-top:3px; color:#7A8495; font-size:11.5px; line-height:1.35; font-weight:750;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.instant-spot-meta {
  display:flex; align-items:center; gap:5px; min-width:0; overflow:hidden;
}
.instant-spot-chip {
  flex:0 0 auto; max-width:118px; min-width:0; border-radius:999px;
  padding:4px 7px; background:#F5F2FF; color:#665BEB;
  font-size:10px; line-height:1; font-weight:900;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.instant-spot-chip.is-distance {
  background:#EFF6FF; color:#3978D6;
}
.instant-spot-reason {
  color:#7A8495; font-size:11.3px; line-height:1.38; font-weight:760;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; overflow-wrap:anywhere;
}
.instant-day-spot.is-changed .instant-spot-name,
.instant-day-spot.is-changed .instant-spot-sub {
  animation: instantSpotFade 0.3s ease both;
}
.instant-day-spot.is-changed .instant-spot-name {
  color:#5E55D9;
  animation: instantSpotFade 0.3s ease both, instantSpotFlash 1.05s ease;
}
.instant-route-chain {
  display:flex; align-items:stretch; gap:7px; margin:0 0 13px;
  overflow-x:auto; scrollbar-width:none; padding-bottom:1px;
}
.instant-route-chain::-webkit-scrollbar { display:none; }
.instant-spot {
  position:relative; display:flex; align-items:center; gap:7px; min-width:112px; max-width:160px;
  padding:10px 10px; border-radius:15px; background:#fff; border:1px solid #EEF0F6;
  box-shadow:0 8px 20px rgba(17,24,39,0.05);
}
.instant-spot-index {
  width:20px; height:20px; border-radius:50%; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  background:#F1EEFF; color:#655AE7; font-size:10.5px; font-weight:950;
}
.instant-spot-name {
  min-width:0; color:#222633; font-size:12.5px; line-height:1.32; font-weight:900;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.instant-route-arrow {
  align-self:center; color:#A9B1C1; font-size:16px; font-weight:900; flex-shrink:0;
}

.cartoon-landmark-stop.pos-right .cartoon-landmark-label { left:22px; top:-13px; }

.cartoon-inline-empty {

}
.cartoon-inline-days::-webkit-scrollbar { display:none; }
.cartoon-inline-day {
  flex:0 0 auto; height:28px; border:none; border-radius:999px; padding:0 10px;

}

@keyframes cartoonInlineIn {

  to { opacity:1; transform:translateY(0) scale(1); }
}

}
@keyframes cartoonRoutePanel {

}

}

.alt-route-head {

}
.alt-route-title { font-size:15px; font-weight:900; }
.alt-route-note { font-size:11.5px; color:#8A94A6; font-weight:700; }
.alt-route-list { display:grid; gap:10px; }
.alt-route-card {
  display:grid; grid-template-columns:76px minmax(0,1fr) auto; gap:10px; align-items:center;
  padding:9px; border-radius:18px; background:rgba(255,255,255,0.82);

}
.alt-route-img {

.alt-route-name {

.alt-route-meta {

.alt-route-score {

}
.alt-route-go {

}
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.plan-card {

.plan-card-body { position: relative; z-index: 1; padding: 11px 11px 0; }
.plan-card-title {

}
.plan-card-title .city { color: #FFD54A; }
.plan-card-cat {

  padding: 7px 10px; border-radius: 11px;

  .plan-card-body { padding: 10px 10px 0; }

  .plan-card-cat { font-size: 10.5px; margin-top: 4px; }
  .plan-card-fit { font-size: 10px; padding: 4px 6px; }

/* ── 图文混合推荐：飞猪式长文 + OTA卡 ── */
.mixed-poi-result {

  padding: 2px 0 18px;
}
.mixed-poi-section {
  margin: 0 0 14px; padding: 14px 12px 12px;
  background: rgba(255,255,255,0.72); border: 1px solid #EEF0F4;
  border-radius: 18px; box-shadow: 0 8px 24px rgba(17,24,39,0.05);
}
.mixed-poi-kicker {
  font-size: 17px; font-weight: 850; line-height: 1.3;

}

.mixed-poi-pin { color: #F05B4F; font-size: 18px; line-height: 1; flex-shrink:0; }

.mixed-poi-bullets b { font-weight: 850; }
.mixed-poi-card {
  position: relative; display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 12px;

.mixed-poi-card:active { transform: scale(0.988); }

.mixed-poi-img {

.mixed-poi-main { min-width: 0; align-self: start; padding-top: 1px; padding-right: 2px; }
.mixed-poi-title {
  font-size: 17px; font-weight: 900; color: #151721; line-height: 1.25; margin-bottom: 7px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.mixed-poi-meta {
  font-size: 13px; color: #6B7280; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.mixed-poi-score { color: #6970E8; font-size: 14px; font-weight: 850; }
.mixed-poi-rank-card {
  font-size: 12.5px; color: #6B7280; line-height: 1.45; margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.mixed-poi-side {

.mixed-poi-price { color: #171923; font-size: 12px; white-space: nowrap; }
.mixed-poi-price b { font-size: 22px; font-weight: 950; letter-spacing: 0; }
.mixed-poi-discount { display:none; }
.mixed-poi-btn {
  border: none; background: #ECE8FF; color: #7271E8; font-size: 14px;

}
.mixed-poi-json { display: none; }
.discover-result { display:flex; flex-direction:column; gap:12px; padding: 2px 0 8px; }
.discover-head { padding: 4px 2px 2px; }
.discover-title { font-size: 20px; font-weight: 900; color:#171923; line-height:1.3; }
.discover-sub { margin-top:6px; font-size: 13px; line-height:1.55; color:#6B7280; }
.discover-card {

  background: rgba(255,255,255,0.9); border:1px solid rgba(229,231,235,0.9);
  border-radius:18px; padding:10px; box-shadow:0 14px 34px rgba(17,24,39,0.07);

.discover-img { width:112px; height:126px; object-fit:cover; border-radius:14px; background:#E9EEF5; display:block; }

.discover-topline { display:flex; align-items:center; gap:7px; min-width:0; }
.discover-city { font-size:18px; font-weight:900; color:#171923; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.discover-badge { flex-shrink:0; background:#F0ECFF; color:#6B5CFF; font-size:11px; font-weight:800; padding:3px 7px; border-radius:99px; }
.discover-theme { font-size:14px; font-weight:800; color:#374151; line-height:1.35; }
.discover-reason { font-size:12.5px; color:#6B7280; line-height:1.5; }
.discover-meta { font-size:12px; color:#8A94A6; line-height:1.45; }
.discover-source { font-size:11.5px; color:#9CA3AF; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.discover-actions { margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.discover-score { color:#6B5CFF; font-size:13px; font-weight:900; }
.discover-btn { border:none; background:var(--brand-grad); color:#fff; font-size:13px; font-weight:850; padding:8px 12px; border-radius:12px; cursor:pointer; }
@media (max-width: 430px) {
  .mixed-poi-section { margin-left: -2px; margin-right: -2px; padding: 12px 10px; border-radius: 16px; }
  .mixed-poi-kicker { font-size: 16.5px; }
  .mixed-poi-link { font-size: 16.5px; }

  .mixed-poi-score { font-size: 13.5px; }
  .mixed-poi-price b { font-size: 20px; }
  .mixed-poi-btn { font-size: 13.5px; padding: 8px 12px; }

  .discover-img { width:96px; height:118px; border-radius:13px; }
  .discover-title { font-size:18px; }
  .discover-city { font-size:16px; }
  .discover-theme { font-size:13px; }

/* ── チャット内インライン地図 ── */
.chat-map-bubble {

.chat-map-title { font-size: 14px; font-weight: 800; color: var(--ink); margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }

.leaflet-tooltip.poi-name-tip {

/* ── 时间轴面板 ── */
#timeline-panel {
  flex: 1; overflow-y: auto; padding: 4px 14px 24px;
  -webkit-overflow-scrolling: touch;
}
#timeline-panel::-webkit-scrollbar { display: none; }

  flex: 1;

  overflow: hidden;

  padding: 0;

  right: 0;
  top: 62px;
  bottom: 86px;

  gap: 10px;
  padding: 8px 28px 34px;

.planner-send-btn {

  height: 28px;
  border: none;

  align-items: center;
  justify-content: center;
  padding: 0;
  color: #fff;
  background: #111318;
  box-shadow: 0 8px 18px rgba(17,19,24,0.18);

body[data-active-tab="planner"] #ai-input-wrap {
  display: block !important;
  z-index: 1500;

}

}

body.trip-overview-mode[data-active-tab="route"] #timeline {

}
.itinerary-route-view {

}
.itinerary-route-view.has-no-trip .itinerary-route-hero,
.itinerary-route-view.has-no-trip .itinerary-route-meta,
.itinerary-route-view.has-no-trip .itinerary-day-tabs {

}
.itinerary-route-view.has-no-trip .itinerary-route-sheet {

}
.itinerary-route-hero {

.itinerary-route-meta {
  margin-top: 8px;

}
.itinerary-route-sheet {
  position: relative;
  min-height: calc(100svh - 112px);

.itinerary-day-tabs {

.itinerary-day-tab {

  justify-content: center;

}
.itinerary-day-tab.is-active {

  background: #fff;

}
.itinerary-day-list {
  padding: 0 clamp(15px, 4.6vw, 26px) 0;
}
.itinerary-route-bottom-spacer {
  height: calc(var(--trip-nav-h, 72px) + var(--trip-nav-bottom, 24px) + env(safe-area-inset-bottom) + 48px);

}
.itinerary-day-section {
  padding: 17px 0 20px;
  border-bottom: 1px solid rgba(229,231,235,0.70);
}
.itinerary-day-section:last-child {
  border-bottom: none;
}
.itinerary-day-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 13px;
}
.itinerary-day-title {
  color: #3D913B;
  font-size: clamp(20px, 5.3vw, 28px);
  line-height: 1.08;
  font-weight: 950;
  letter-spacing: 0;
}
.itinerary-day-count {
  color: #9CA3AF;
  font-size: clamp(12px, 3.35vw, 16px);
  font-weight: 900;
  white-space: nowrap;
}
.itinerary-stop-list {
  display: grid;
  gap: 16px;
}
.itinerary-stop {
  position: relative;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) clamp(62px, 17vw, 82px);
  gap: 10px;
  align-items: start;
  min-height: 88px;
  border-radius: 14px;
  cursor: pointer;
  transition: background .16s ease, transform .16s ease;
}
.itinerary-stop:active {
  transform: translateY(1px);
}
.itinerary-stop:focus-visible {
  outline: 2px solid rgba(122, 188, 78, 0.55);
  outline-offset: 4px;
}
.itinerary-stop:hover {
  background: rgba(247, 250, 244, 0.72);
}
.itinerary-stop:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 16px;
  top: 31px;
  bottom: -13px;
  width: 2px;
  background: #E8E0D3;
}
.itinerary-stop-index {
  position: relative;
  z-index: 1;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  margin: 2px auto 0;
  background: #8DC449;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
  font-weight: 950;
}
.itinerary-stop-main {
  min-width: 0;
  padding-top: 0;
}
.itinerary-stop-name {
  color: #111827;
  font-size: clamp(17px, 4.6vw, 23px);
  line-height: 1.16;
  font-weight: 950;
  letter-spacing: 0;
  overflow-wrap: anywhere;
}
.itinerary-stop-meta {
  display: grid;
  gap: 2px;
  margin-top: 8px;
}
.itinerary-meta-line {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  color: #89909D;
  font-size: clamp(11.5px, 3.15vw, 14.5px);
  line-height: 1.2;
  font-weight: 760;
}
.itinerary-meta-line i {
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  stroke-width: 2.35;
  color: #93A0AD;
}
.itinerary-meta-line span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.itinerary-stop-photo {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 11px;
  object-fit: cover;
  background: #EDF2F0;
  align-self: center;
  box-shadow: 0 8px 18px rgba(17,24,39,0.08);
}
.itinerary-day-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 16px 0 0;
}
.itinerary-day-action {
  min-width: 112px;
  height: 36px;
  border: 1.5px solid #EEE7D9;
  border-radius: 999px;
  background: #FFFDF8;
  color: #9AA1AD;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 0 14px;
  font-size: 13px;
  font-weight: 950;
  cursor: pointer;
}
.itinerary-day-action i {
  width: 14px;
  height: 14px;
  stroke-width: 2.6;
}
.itinerary-add-backdrop {
  position: fixed;
  inset: 0;
  z-index: 132;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: rgba(17, 24, 39, 0.20);
  padding: 0 clamp(10px, 3vw, 18px) max(8px, env(safe-area-inset-bottom));
  opacity: 0;
  transition: opacity .2s ease;
  backdrop-filter: blur(6px);
}
.itinerary-add-backdrop.open {
  display: flex;
  opacity: 1;
}
.itinerary-add-sheet {
  width: min(100%, 520px);
  max-height: min(72vh, 560px);
  overflow: hidden;
  border-radius: 28px 28px 18px 18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(250,252,249,0.98) 100%);
  box-shadow: 0 18px 44px rgba(20, 28, 42, 0.16);
  border: 1px solid rgba(235, 239, 232, 0.95);
  backdrop-filter: blur(18px);
  transform: translateY(106%);
  transition: transform .28s cubic-bezier(.2,.8,.2,1);
}
.itinerary-add-backdrop.open .itinerary-add-sheet {
  transform: translateY(0);
}
.itinerary-add-handle {
  width: 38px;
  height: 4px;
  border-radius: 999px;
  background: #DDE3EA;
  margin: 9px auto 9px;
}
.itinerary-add-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  padding: 0 18px 13px;
}
.itinerary-add-title {
  font-size: 21px;
  line-height: 1.2;
  font-weight: 950;
  color: #111827;
}
.itinerary-add-sub {
  margin-top: 4px;
  font-size: 12px;
  line-height: 1.35;
  font-weight: 800;
  color: #7C8797;
}
.itinerary-add-close {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: rgba(241, 244, 247, 0.95);
  color: #1F2937;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  cursor: pointer;
}
.itinerary-add-close i {
  width: 18px;
  height: 18px;
  stroke-width: 2.7;
}
.itinerary-add-back {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: rgba(241, 244, 247, 0.95);
  color: #1F2937;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  cursor: pointer;
}
.itinerary-add-back i {
  width: 18px;
  height: 18px;
  stroke-width: 2.7;
}
.itinerary-add-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  overflow: auto;
  max-height: calc(min(72vh, 560px) - 80px);
  padding: 0 18px 18px;
  -webkit-overflow-scrolling: touch;
}
.itinerary-add-grid::-webkit-scrollbar { display: none; }
.itinerary-add-card {
  position: relative;
  appearance: none;
  padding: 0;
  border: 1px solid rgba(232, 237, 228, 0.98);
  border-radius: 14px;
  background: #fff;
  overflow: hidden;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 8px 20px rgba(20, 28, 42, 0.065);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.itinerary-add-card:active {
  transform: scale(.988);
  border-color: rgba(128, 187, 92, 0.38);
  box-shadow: 0 7px 16px rgba(20, 28, 42, 0.09);
}
.itinerary-add-card img {
  width: 100%;
  height: 78px;
  object-fit: cover;
  display: block;
  background: #EEF4F2;
}
.itinerary-add-card-body {
  display: block;
  padding: 8px 9px 9px;
}
.itinerary-add-card-name {
  font-size: 14px;
  line-height: 1.25;
  font-weight: 950;
  color: #111827;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.itinerary-add-card-desc {
  margin-top: 3px;
  font-size: 10.5px;
  line-height: 1.28;
  font-weight: 750;
  color: #8791A0;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 14px;
}
.itinerary-add-card-foot {
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.itinerary-add-tag {
  max-width: 76px;
  border-radius: 999px;
  background: #F2F5F7;
  color: #8B94A1;
  font-size: 10px;
  line-height: 1;
  font-weight: 850;
  padding: 4px 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.itinerary-add-plus {
  width: 26px;
  height: 26px;
  border: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #101827;
  color: #fff;
  flex: 0 0 auto;
  box-shadow: 0 8px 18px rgba(16, 24, 39, 0.18);
  cursor: pointer;
}
.itinerary-add-plus i {
  width: 14px;
  height: 14px;
  stroke-width: 3;
}
.itinerary-add-empty {
  grid-column: 1 / -1;
  min-height: 120px;
  border-radius: 18px;
  background: #F8FAFC;
  color: #8A94A3;
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 13px;
  font-weight: 850;
}
.itinerary-add-detail {
  max-height: calc(min(72vh, 560px) - 80px);
  overflow: auto;
  padding: 0 18px 18px;
  -webkit-overflow-scrolling: touch;
}
.itinerary-add-detail::-webkit-scrollbar { display: none; }
.itinerary-add-detail .home-sheet-album {
  margin: 0;
}
.itinerary-add-detail .home-sheet-hero {
  height: 142px;
  border-radius: 18px;
}
.itinerary-add-detail .home-sheet-photo {
  min-width: 100%;
}
.itinerary-add-detail-copy {
  margin-top: 12px;
  border-radius: 18px;
  background: rgba(248, 250, 252, 0.88);
  border: 1px solid rgba(232, 237, 228, 0.92);
  padding: 14px;
}
.itinerary-add-detail-name {
  font-size: 20px;
  line-height: 1.2;
  font-weight: 950;
  color: #111827;
}
.itinerary-add-detail-desc {
  margin-top: 7px;
  font-size: 13px;
  line-height: 1.55;
  font-weight: 760;
  color: #6F7A89;
}
.itinerary-add-detail-tags {
  margin-top: 11px;
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.itinerary-add-detail-tags span {
  border-radius: 999px;
  background: #F1F4F6;
  color: #8791A0;
  font-size: 11px;
  line-height: 1;
  font-weight: 850;
  padding: 6px 8px;
}
.itinerary-add-detail-action {
  width: 100%;
  height: 46px;
  margin-top: 13px;
  border: none;
  border-radius: 999px;
  background: #101827;
  color: #fff;
  font-size: 15px;
  font-weight: 950;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 12px 26px rgba(16, 24, 39, 0.18);
}
.itinerary-add-detail-action i {
  width: 17px;
  height: 17px;
  stroke-width: 3;
}
@media (max-width: 360px) {
  .itinerary-add-backdrop {
    padding-inline: 12px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  .itinerary-add-sheet {
    max-height: min(56vh, 410px);
    border-radius: 24px;
  }
  .itinerary-add-grid {
    gap: 7px;
    padding-inline: 14px;
    max-height: calc(min(56vh, 410px) - 78px);
  }
  .itinerary-add-card img {
    height: 70px;
  }
  .itinerary-add-card-body {
    padding: 7px 8px 8px;
  }
  .itinerary-add-card-name {
    font-size: 13.5px;
  }
  .itinerary-add-card-desc {
    font-size: 10px;
    min-height: 13px;
  }
  .itinerary-add-detail {
    max-height: calc(min(56vh, 410px) - 78px);
    padding-inline: 14px;
  }
  .itinerary-add-detail .home-sheet-hero {
    height: 118px;
  }
}
.itinerary-empty {
  margin: 28px clamp(18px, 5vw, 30px);
  border-radius: 22px;
  padding: 34px 20px;
  background: #FAFAF7;
  color: #8B93A0;
  text-align: center;
  font-weight: 850;
}
 .itinerary-route-view.has-no-trip .itinerary-empty {
  max-width: 280px;
  margin: 34px auto 0;
  padding: 0;
  border-radius: 0;
  background: transparent;
  color: #7F8897;
  box-shadow: none;
 }
@media (max-width: 380px) {
  .itinerary-route-hero {
    padding-top: 16px;
  }
  .itinerary-stop {
    grid-template-columns: 31px minmax(0, 1fr) 58px;
    gap: 8px;
  }
  .itinerary-stop-index {
    width: 26px;
    height: 26px;
    font-size: 13px;
  }
  .itinerary-stop:not(:last-child)::before {
    left: 15px;
  }
  .itinerary-day-action {
    min-width: 88px;
    height: 34px;
    font-size: 12.5px;
  }
}

/* ── 输入栏 ── */
#ai-input-wrap {
  padding: 0 18px max(28px, env(safe-area-inset-bottom)); flex-shrink: 0;
  transition: opacity .32s ease, transform .32s cubic-bezier(.2,.8,.2,1);
}
body:not(.trip-overview-mode)[data-card-stage="loading_pick"] #ai-input-wrap,
body:not(.trip-overview-mode)[data-card-stage="generating"] #ai-input-wrap {
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
}
body[data-card-stage="display_route"] #ai-input-wrap {
  opacity: 1;
  transform: translateY(0);
}
body[data-active-tab="planner"] #ai-input-wrap {
  display: block !important;
  opacity: 1 !important;
  pointer-events: none;
}
body[data-active-tab="planner"] .trip-tabbar {
  display: grid !important;
  opacity: 1 !important;
  visibility: visible !important;
  transform: none !important;
  pointer-events: auto;
}
body.trip-overview-mode #ai-input-wrap {
  opacity: 1 !important;
  pointer-events: none;
}
body.trip-overview-mode .trip-tabbar {
  display: grid !important;
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto;
}
#ai-input-inner {
  min-height: 50px; display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.92); border-radius: 22px; padding: 6px 13px 6px 18px;
  border: 1.4px solid rgba(92,73,154,0.88); transition: all .2s;
  box-shadow: 0 14px 34px rgba(80,70,160,0.10); backdrop-filter: blur(18px);
}
#ai-input-inner:focus-within { border-color: var(--brand-1); background: #fff; box-shadow: 0 4px 18px rgba(123,97,255,0.16); }
#ai-input { flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: #1A1A1A; min-width:0; }
#ai-input::placeholder { color: #C0C0C0; }
#mic-btn {
  width:28px; height:28px; border:none; border-radius:50%; background:transparent;
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  cursor:pointer; padding:0; color:#171923; transition:background .18s, color .18s, transform .18s;
}
#mic-btn svg { width:20px; height:20px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; display:block; }
#mic-btn:active { background:rgba(17,24,39,0.06); transform:scale(0.95); }
#mic-btn.recording { color:#6B5CFF; background:#F0ECFF; animation:micPulse 1s infinite; }
#send-btn {
  width:34px; height:34px; border:none; border-radius:50%; background:var(--brand-grad);
  display:none; align-items:center; justify-content:center; color:#fff; font-size:18px;
  font-weight:800; box-shadow:0 10px 22px rgba(91,104,239,0.24); cursor:pointer; flex-shrink:0;
}
#ai-input-inner.has-text #send-btn { display:flex; }
#send-btn:active { transform: scale(0.96); }
.bottom-nav-lite {
  display:none;
}
.bottom-mini-btn {
  width:34px; height:34px; border:none; border-radius:50%; background:rgba(255,255,255,0.75);
  color:#30323A; box-shadow:0 8px 20px rgba(17,24,39,0.07);
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px;
}
.account-avatar {
  background: linear-gradient(135deg,#7B61FF,#5B8DEF); color:#fff; font-size:15px; font-weight:900;
}

/* ── 底部抽屉式景点选择器：城市输入后的下一步 ── */
#spot-selector-overlay {
  position: fixed; inset: 0; z-index: 180;
  display: none; align-items: flex-end;
  background: rgba(0,0,0,0.40);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #10131A; opacity: 0;
  transition: opacity .22s ease;
}
#spot-selector-overlay.open { display: flex; opacity: 1; }
#spot-selector-overlay.closing { opacity: 0; }
.spot-selector-shell {
  width: 100%; max-width: 430px; height: 75vh; margin: 0 auto;
  display: flex; flex-direction: column;
  border-radius: 28px 28px 0 0;
  background:
    radial-gradient(ellipse 80% 40% at 8% 104%, rgba(255,216,104,0.16), transparent 70%),
    radial-gradient(ellipse 72% 36% at 96% 100%, rgba(91,141,239,0.12), transparent 72%),
    #FFFFFF;
  box-shadow: 0 -24px 60px rgba(17,24,39,0.24);
  padding: 10px 16px calc(env(safe-area-inset-bottom) + 88px);
  animation: spotSheetUp .26s cubic-bezier(.2,.8,.2,1) both;
  overflow: hidden;
}
#spot-selector-overlay.closing .spot-selector-shell {
  animation: spotSheetDown .22s cubic-bezier(.4,0,1,1) both;
}
.spot-selector-handle {
  width: 42px; height: 5px; border-radius: 999px; background: #D9DEE8;
  margin: 0 auto 13px; flex-shrink: 0;
}
.spot-selector-head {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 0 2px 14px; flex-shrink: 0;
}
.spot-selector-title { font-size: 22px; line-height: 1.22; font-weight: 900; letter-spacing: 0; color: #171923; }
.spot-selector-sub { margin-top: 6px; font-size: 12.5px; line-height: 1.45; color: #6B7280; font-weight: 600; }
.spot-selector-skip {
  flex-shrink: 0; border: none; border-radius: 999px;
  background: #F3F4F6; color: #4B5563; font-size: 13px; font-weight: 900;
  padding: 8px 13px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.spot-selector-skip:active { transform: scale(0.96); background: #E5E7EB; }
.spot-selector-tabs {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 0 -16px; padding: 0 16px 12px; flex-shrink: 0;
}
.spot-selector-tabs::-webkit-scrollbar { display: none; }
.spot-selector-tab {
  flex: 0 0 auto; border: 1px solid #E5E7EB; background: #F8FAFC; color: #5B6472;
  border-radius: 999px; padding: 8px 15px; font-size: 13px; font-weight: 800;
  cursor: pointer; transition: transform .18s, background .18s, border-color .18s, color .18s;
}
.spot-selector-tab.active { border-color: #111827; background: #111827; color: #fff; box-shadow: 0 8px 20px rgba(17,24,39,0.12); }
.spot-selector-tab:active { transform: scale(0.97); }
.spot-selector-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
  overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px;
  min-height: 0; flex: 1;
}
.spot-selector-grid::-webkit-scrollbar { display: none; }
.spot-card {
  position: relative; border: 2px solid #F1F5F9; background: #fff;
  border-radius: 12px; padding: 8px; text-align: left; cursor: pointer;
  box-shadow: 0 6px 18px rgba(17,24,39,0.06);
  transition: border-color .2s, box-shadow .2s, transform .2s;
}
.spot-card.selected {
  border-color: #3B82F6;
  box-shadow: 0 12px 30px rgba(59,130,246,0.16), 0 0 0 2px rgba(59,130,246,0.05);
}
.spot-card:active { transform: scale(0.98); }
.spot-card-img {
  width: 100%; height: 120px; display: block; object-fit: cover;
  border-radius: 10px; background: #E8EEF3;
}
.spot-card-name {
  margin-top: 10px; font-size: 15px; line-height: 20px; font-weight: 900;
  color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.spot-card-desc {
  margin-top: 4px; height: 36px; overflow: hidden;
  font-size: 12px; line-height: 18px; color: #8A93A3; font-weight: 600;
}
.spot-check-badge {
  position: absolute; top: 14px; right: 14px; z-index: 2;
  width: 25px; height: 25px; border-radius: 50%;
  background: #22C55E; color: #fff; box-shadow: 0 4px 12px rgba(34,197,94,0.36);
  border: 2px solid #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 950; line-height: 1;
}
.spot-selector-action {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 12px 16px calc(env(safe-area-inset-bottom) + 16px);
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid rgba(238,240,246,0.82);
}
.spot-selector-btn {
  width: 100%; max-width: 430px; height: 54px; margin: 0 auto; border: none;
  border-radius: 12px; background: #111827; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900;
  box-shadow: 0 14px 34px rgba(17,24,39,0.25);
}
.spot-selector-btn:active { transform: scale(0.99); background: #1F2937; }
.itinerary-result {
  display: flex; flex-direction: column; gap: 12px; padding: 2px 0 12px;
}
.itinerary-result-head {
  border-radius: 20px; padding: 15px;
  background: linear-gradient(145deg, #111827, #263044);
  color: #fff; box-shadow: 0 18px 44px rgba(17,24,39,0.16);
}
.itinerary-result-kicker { font-size: 11px; font-weight: 900; opacity: .78; letter-spacing: 0; }
.itinerary-result-title { margin-top: 8px; font-size: 20px; line-height: 1.3; font-weight: 950; }
.itinerary-result-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.itinerary-result-tag {
  border-radius: 999px; padding: 5px 8px; background: rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.92); font-size: 11px; font-weight: 850;
}
.itinerary-result-day {
  border-radius: 20px; padding: 13px; background: rgba(255,255,255,0.92);
  border: 1px solid #EEF1F7; box-shadow: 0 12px 32px rgba(17,24,39,0.07);
}
.itinerary-result-day-title { font-size: 15px; font-weight: 950; color: #202532; margin-bottom: 10px; }
.itinerary-result-spot {
  display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 10px; align-items: center;
  min-height: 58px; padding: 10px; border-radius: 16px; background: #fff;
  border: 1px solid #EEF0F6; box-shadow: 0 8px 18px rgba(17,24,39,0.04);
}
.itinerary-result-spot + .itinerary-result-spot { margin-top: 8px; }
.itinerary-result-time {
  width: 42px; padding: 5px 0; border-radius: 999px; text-align: center;
  background: #F2EFFF; color: #665BEB; font-size: 11px; font-weight: 950;
}
.itinerary-result-name { font-size: 14px; line-height: 1.28; font-weight: 950; color: #1F2937; }
.itinerary-result-sub { margin-top: 4px; font-size: 12px; line-height: 1.4; font-weight: 700; color: #7A8495; }
.itinerary-reason-panel {
  border-radius: 18px; padding: 12px; background: linear-gradient(135deg, #F7F5FF, #F8FBFF);
  border: 1px solid rgba(123,97,255,0.12); color: #4B5568;
  font-size: 12.5px; line-height: 1.55; font-weight: 750;
}
@keyframes spotSheetUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@keyframes spotSheetDown {
  from { transform: translateY(0); }
  to { transform: translateY(100%); }
}

/* ── 时间轴节点 ── */
.node-item { position: relative; display: flex; gap: 10px; padding-bottom: 4px; }
.node-item::before {
  content: ''; position: absolute; left: 16px; top: 36px; bottom: 0; width: 2px;
  background: repeating-linear-gradient(to bottom, #E5E7EB 0, #E5E7EB 5px, transparent 5px, transparent 11px);
}
.node-item:last-child::before { display: none; }
.node-icon-wrap {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; margin-top: 4px; position: relative; z-index: 1;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.node-card {
  flex: 1; border-radius: 16px; padding: 10px 12px; margin-bottom: 8px;
  cursor: pointer; border: 1.5px solid transparent; overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow-soft);
  transition: all .2s cubic-bezier(0.34,1.56,0.64,1);
  -webkit-user-select: none; user-select: none;
}
.node-card:active { transform: scale(0.97); }
.node-card.active {
  border-color: var(--accent); background: #fff;
  box-shadow: 0 4px 18px rgba(0,0,0,0.09), 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
}
/* 缩略图在卡片内 */
.card-thumb-row {
  display: flex; gap: 5px; margin-top: 8px; height: 64px;
}
.card-thumb-img {
  flex: 1; border-radius: 8px; object-fit: cover;
  background: #eee; min-width: 0;
  transition: opacity .3s;
}
.card-thumb-img:nth-child(1) { flex: 2; }   /* 首图更宽 */
.node-time  { font-size: 11px; color: #9CA3AF; font-weight: 500; margin-bottom: 2px; }
.node-name  { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 2px; line-height: 1.3; }
.node-desc  { font-size: 11px; color: #6B7280; line-height: 1.4; }
.node-tag   { display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }

/* ── Marker ── */
.custom-marker {
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.85);
  box-shadow: 0 3px 12px rgba(0,0,0,0.25); font-size: 16px;
}
.custom-marker.pulse { animation: mPulse 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes mPulse { 0%{transform:scale(1)} 55%{transform:scale(1.55)} 100%{transform:scale(1.2)} }

/* ── 定位按钮（浮在内嵌地图右下角） ── */
#locate-btn {
  position: absolute; right: 10px; bottom: 10px; z-index: 20; width: 38px; height: 38px;
  border-radius: 11px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
  border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; transition: transform .15s;
}
#locate-btn:active { transform: scale(0.92); }

/* ── 「我的位置」脉冲动画 ── */
@keyframes userPulse {
  0%   { transform: scale(0.6); opacity: 0.7; }
  70%  { transform: scale(1.6); opacity: 0; }
  100% { transform: scale(1.6); opacity: 0; }
}

/* ══════════════════════════════════════════
   POI 详情卡  ── 高德风格重设计
══════════════════════════════════════════ */
#poi-backdrop {
  position: fixed; inset: 0; z-index: 1600;
  background: rgba(15,23,42,0.24);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .32s ease;
}
#poi-backdrop.active { opacity: 1; pointer-events: all; }

#poi-card {
  position: fixed; left: 50%; bottom: 0; z-index: 1610;
  width: min(100vw, 430px);
  max-width: 100vw;
  background: #fff;
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -18px 52px rgba(15,23,42,0.18);
  transform: translate(-50%, 100%);
  transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
  height: min(76svh, 620px);
  max-height: calc(100svh - max(76px, env(safe-area-inset-top)));
  display: flex; flex-direction: column;
  overflow: hidden;
}
#poi-card.open { transform: translate(-50%, 0); }
body.poi-open #ai-input-wrap,
body.poi-open .planner-topbar,
body.poi-open #recent-backdrop,
body.poi-open #recent-drawer,
body.poi-open #recent-menu {
  opacity: 0;
  pointer-events: none;
}
body.poi-open #sheet-content {
  pointer-events: none;
}
body.poi-open #poi-backdrop,
body.poi-open #poi-card {
  pointer-events: auto;
}

/* 顶部标题栏 */
#poi-top-bar {
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 5;
  min-height: 48px;
  padding: 10px 18px 12px;
  border-bottom: 1px solid #F0F0F0;
  background: rgba(255,255,255,0.98);
}
#poi-top-title {
  font-size: 18px; font-weight: 900; color: var(--ink);
  max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#poi-close {
  position: absolute; right: 14px; top: 8px;
  width: 32px; height: 32px; border-radius: 50%;
  background: #F3F4F6; border: none; color: #6B7280; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#poi-close:active { background: #E5E7EB; }

/* 可滚动主体 */
#poi-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: calc(env(safe-area-inset-bottom) + 28px);
}
#poi-scroll::-webkit-scrollbar { display: none; }

/* ── 英雄图 ── */
#poi-hero {
  position: relative; width: 100%; height: clamp(140px, 24vh, 190px); flex-shrink: 0; overflow: hidden;
  background: #e8eef3;
}
#poi-hero-track {
  width: 100%;
  height: 100%;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  scroll-behavior: smooth;
}
#poi-hero-track::-webkit-scrollbar { display: none; }
.poi-hero-slide {
  position: relative;
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  background: #e8eef3;
  scroll-snap-align: start;
  cursor: default;
}
.poi-hero-slide img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  background: #e8eef3;
}
#poi-img-counter {
  position: absolute; top: 10px; right: 12px; z-index: 5;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
  color: rgba(255,255,255,0.9); font-size: 12px; font-weight: 500;
  padding: 3px 9px; border-radius: 99px;
  display: flex; align-items: center; gap: 5px;
}
#poi-hero-hint {
  position: absolute; left: 50%; bottom: 9px; transform: translateX(-50%); z-index: 5;
  font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,0.92);
  background: rgba(0,0,0,0.34); backdrop-filter: blur(6px);
  padding: 4px 12px; border-radius: 99px; white-space: nowrap; pointer-events: none;
}
#poi-hero-hint.is-hidden { opacity: 0; }
#poi-hero-dots { display: none; }

/* 相册缩略图 */
#poi-album-row {
  display: flex; gap: 6px; padding: 9px 14px; overflow-x: auto; background:#fff;
  -webkit-overflow-scrolling: touch;
}
#poi-album-row::-webkit-scrollbar { display: none; }
.poi-thumb {
  flex-shrink: 0; width: 68px; height: 50px; border-radius: 9px;
  object-fit: cover; cursor: pointer; background: #eee;
  border: 2px solid transparent; transition: all .18s;
}
.poi-thumb.active { border-color: var(--brand-1); }
.img-fail { opacity: 0.25; }

/* ── 主体信息（OTA风格）── */
#poi-body2 { padding: 12px 14px 14px; }
.poi-loc-chip {
  display: inline-flex; align-items: center; gap: 3px;
  background: #F3F4F6; color: #4B5563; font-size: 12px; font-weight: 600;
  padding: 4px 10px; border-radius: 99px;
}
#poi-name2 { font-size: 20px; font-weight: 850; color: var(--ink); margin: 9px 0 7px; line-height: 1.2; }
#poi-rating2 { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
.poi-score { font-size: 16px; font-weight: 850; color: var(--brand-1); }
.poi-score-tag {
  background: var(--brand-1); color: #fff; font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 6px; margin-left: 3px;
}
.poi-review { font-size: 13px; color: #6B7280; }
.poi-arrow { color: #9CA3AF; font-size: 14px; }
.poi-rating-click { display:inline-flex; align-items:center; gap:4px; cursor:pointer; border-radius:10px; padding:4px 6px; margin-left:-6px; transition:background .16s; }
.poi-rating-click:active { background:#F3F4F6; }

/* 状态行 */
#poi-status-row {
  display: flex; align-items: center; gap: 10px;
  background: #F7F8FA; border-radius: 14px; padding: 10px 12px; margin-bottom: 10px;
}
.poi-status-item { flex: 1; min-width: 0; }
.poi-status-k { font-size: 13.5px; font-weight: 800; color: var(--ink); }
.poi-status-k.open { color: var(--brand-1); }
.poi-status-v { font-size: 11.5px; color: #9CA3AF; margin-top: 3px; }
.poi-status-detail { font-size: 13px; color: #6B7280; flex-shrink: 0; align-self: center; cursor: pointer; }

/* 地址行 */
#poi-addr-row {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid #F0F0F0; border-radius: 14px; padding: 10px 12px; margin-bottom: 12px;
}
.poi-addr-main { flex: 1; min-width: 0; }
.poi-addr-line { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.4;
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
.poi-addr-sub { font-size: 11.5px; color: #9CA3AF; margin-top: 4px; }
.poi-addr-acts { display: flex; gap: 16px; flex-shrink: 0; }
.poi-addr-act { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 17px; color: var(--brand-1); cursor: pointer; }
.poi-addr-act span { font-size: 11px; color: #6B7280; }

/* サブタブ */
.poi-subtabs { display: flex; gap: 22px; border-bottom: 1px solid #F0F0F0; margin-bottom: 14px; }
.poi-subtab { font-size: 15px; font-weight: 700; color: #9CA3AF; padding-bottom: 10px; cursor: pointer; position: relative; }
.poi-subtab.active { color: var(--ink); }
.poi-subtab.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; border-radius:99px; background:var(--brand-1); }

/* 超值特惠 商品カード */
.poi-prod-card { border: 1.5px solid #FF7A3D; border-radius: 14px; overflow: hidden; }
.poi-prod-tabs { display: flex; background: #FFF3EC; }
.poi-prod-tab { font-size: 13px; font-weight: 800; color: #B45309; padding: 9px 16px; }
.poi-prod-tab.active { background: #FF7A3D; color: #fff; border-radius: 0 12px 0 0; }
.poi-prod-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; }
.poi-prod-info { flex: 1; min-width: 0; }
.poi-prod-name { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.45; }
.poi-prod-flag { background:#DC2626; color:#fff; font-size:10px; font-weight:700; padding:1px 5px; border-radius:4px; margin-right:5px; }
.poi-prod-sold { font-size: 11px; color: #9CA3AF; margin-top: 5px; }
.poi-prod-right { flex-shrink: 0; text-align: right; }
.poi-prod-old { font-size: 11px; color: #9CA3AF; text-decoration: line-through; }
.poi-prod-price { font-size: 17px; font-weight: 850; color: #FF5A1F; }
.poi-prod-price small { font-size: 11px; font-weight: 600; }
.poi-prod-book {
  margin-top: 4px; background: var(--accent-warm-grad); color: #fff; border: none;
  font-size: 14px; font-weight: 800; padding: 7px 20px; border-radius: 10px; cursor: pointer;
}
.poi-prod-newcomer { background:#FFF3EC; color:#DC2626; font-size:11.5px; font-weight:600; padding:7px 14px; }
.poi-review-panel { display:flex; flex-direction:column; gap:12px; }
.poi-review-summary {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:#F8F7FF; border-radius:14px; padding:12px 14px;
}
.poi-review-score-big { font-size:24px; font-weight:900; color:var(--brand-1); }
.poi-review-summary-text { flex:1; min-width:0; font-size:12.5px; color:#6B7280; line-height:1.5; }
.poi-review-card {
  border:1px solid #ECEEF3; border-radius:16px; background:#fff; padding:13px 14px;
  box-shadow:0 8px 22px rgba(17,24,39,0.05);
}
.poi-review-card.with-photo { border-color:#E4E0FF; }
.poi-review-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
.poi-review-avatar {
  width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  background:var(--brand-grad); color:#fff; font-size:13px; font-weight:900; margin-right:8px;
}
.poi-review-user-wrap { display:flex; align-items:center; min-width:0; }
.poi-review-user { font-size:14px; font-weight:850; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.poi-review-score-mini { font-size:13px; font-weight:850; color:var(--brand-1); white-space:nowrap; }
.poi-review-photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:9px 0 10px; }
.poi-review-photo-grid img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; background:#EEF2F7; }
.poi-review-text { font-size:13.5px; line-height:1.65; color:#374151; }
.poi-review-tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
.poi-review-tag { font-size:11.5px; font-weight:700; color:#6B7280; background:#F3F4F6; border-radius:999px; padding:4px 8px; }
.poi-nearby-panel { display:flex; flex-direction:column; gap:10px; }
.poi-nearby-summary { border:1px solid #ECEEF3; border-radius:14px; padding:12px 14px; background:#F8FAFC; color:#4B5563; font-size:13px; line-height:1.55; }
.poi-nearby-card {

.poi-nearby-icon {

.poi-nearby-main { flex:1; min-width:0; }

.poi-nearby-meta { font-size:12px; color:var(--brand-1); font-weight:800; white-space:nowrap; }

/* ══ 详细方案：推荐去处 + 酒店推荐 ══ */
.detail-title { font-size: 26px; font-weight: 850; color: var(--ink); line-height: 1.25; margin: 6px 0 20px; }
.detail-sub { font-size: 19px; font-weight: 800; color: var(--ink); margin: 4px 0 12px; }

.rec-section { margin-top: 4px; }
.rec-day-title { font-size: 20px; font-weight: 850; color: var(--ink); margin: 18px 0 14px; }
.rec-slot { font-size: 15px; font-weight: 700; color: #4B5563; margin: 14px 0 10px; }
.rec-name { font-size: 17px; font-weight: 800; color: var(--brand-1); margin-bottom: 12px; cursor: pointer; }
.rec-photo {
  width: min(168px, 48vw); height: min(168px, 48vw); aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px;

}

.rec-rank { font-size: 15px; font-weight: 700; color: var(--ink); margin: 12px 0 8px; }
.rec-reason { font-size: 15px; color: #374151; line-height: 1.65; margin-bottom: 6px; }
.plan-fit-summary {

}
.plan-fit-title { font-size:14px; font-weight:850; color:#202532; margin-bottom:6px; }
.plan-fit-copy { font-size:12.5px; line-height:1.55; color:#566074; }
.plan-feedback {

}
.plan-feedback button {
  border:1px solid #ECEEF4; background:#fff; color:#4B5563;

}

.plan-refine-note {
  display:inline-flex; width:fit-content; max-width:100%; align-items:center; gap:6px;
  margin:0 0 12px; padding:8px 11px; border-radius:999px;

  font-size:12.5px; font-weight:850;
}

/* 酒店推荐カード */
.hotel-rec-head { font-size: 18px; font-weight: 850; color: var(--ink); margin: 26px 0 14px; }
.lodging-area { font-size: 19px; font-weight: 850; color: var(--ink); margin: 8px 0 16px; }
.lodging-hotel-name { font-size: 17px; font-weight: 800; color: var(--ink); margin: 20px 0 8px; }
.lodging-reason { font-size: 14px; color: #4B5563; line-height: 1.6; margin-bottom: 13px; }
.hotel-rec-card { display: flex; gap: 13px; cursor: pointer; margin-bottom: 18px; align-items: flex-start; }
.hotel-rec-reason { font-size: 12.5px; color: #6B7280; line-height: 1.55; margin-top: 9px; }
.hotel-rec-img { width: 116px; height: 116px; border-radius: 14px; object-fit: cover; background:#e8eef3; flex-shrink: 0; }
.img-fail,
.trusted-placeholder {
  object-fit: cover;
  background: linear-gradient(145deg, #F8FAFF 0%, #EEF3FB 55%, #F8F1FF 100%);
}
.hotel-rec-main { flex: 1; min-width: 0; }
.hotel-rec-name { font-size: 16px; font-weight: 800; color: var(--ink); line-height: 1.3;
  display:flex; align-items:center; gap:8px; }
.hotel-rec-name { display:block; }
.hotel-rec-badge { display:inline-block; background:#F3F4F6; color:#6B7280; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; margin-left:6px; vertical-align:middle; }
.hotel-rec-rate { font-size: 13px; color: #6B7280; margin-top: 8px; }
.hotel-rec-rate b { color: var(--brand-1); font-size: 15px; }
.hotel-rec-rank { color: #9CA3AF; }
.hotel-rec-dist { font-size: 12px; color: #9CA3AF; margin-top: 6px; }
.hotel-rec-price-row { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 10px; }
.hotel-rec-price-box { line-height: 1.1; }
.hotel-rec-price { font-size: 20px; font-weight: 850; color: var(--ink); }
.hotel-rec-qi { font-size: 12px; color: #6B7280; margin-left: 2px; }
.hotel-rec-cut { font-size: 11px; color: #FF5A1F; margin-top: 3px; }
.hotel-rec-btn { background: var(--brand-grad); color: #fff; border: none; font-size: 14px; font-weight: 800; padding: 9px 22px; border-radius: 12px; cursor: pointer; }

/* ══ 酒店预订画面 ══ */
#hotel-booking {
  position: fixed; inset: 0; z-index: 120; background: #F5F6FA;
  transform: translateX(100%); transition: transform .35s cubic-bezier(0.32,0.72,0,1);
  display: flex; flex-direction: column;
}
#hotel-booking.open { transform: translateX(0); }
#hb-bar { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #fff; border-bottom: 1px solid #F0F0F0; }
#hb-close, #hb-share { width: 34px; height: 34px; border: none; background: #F3F4F6; border-radius: 50%; font-size: 18px; color: #374151; cursor: pointer; }
#hb-title { flex: 1; text-align: center; font-size: 16px; font-weight: 800; color: var(--ink); }
#hb-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#hb-scroll::-webkit-scrollbar { display: none; }
#hb-img { width: 100%; height: 220px; object-fit: cover; background:#e8eef3; display: block; }
#hb-info { background: #fff; padding: 16px; margin-bottom: 10px; }
#hb-name { font-size: 20px; font-weight: 850; color: var(--ink); line-height: 1.3; }
#hb-meta { font-size: 13px; color: #6B7280; margin-top: 9px; }
#hb-meta b { color: var(--brand-1); font-size: 15px; }
.hb-badge { display:inline-block; background:#F3F4F6; color:#6B7280; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; margin-right:8px; }
#hb-addr { font-size: 12.5px; color: #6B7280; margin-top: 12px; }
.hb-map { color: var(--brand-1); font-weight: 600; cursor: pointer; }
#hb-rooms-title { font-size: 16px; font-weight: 800; color: var(--ink); padding: 4px 16px 10px; }
#hb-rooms { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.hb-room { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px; padding: 14px; box-shadow: var(--shadow-soft); }
.hb-room-main { flex: 1; min-width: 0; }
.hb-room-name { font-size: 15px; font-weight: 800; color: var(--ink); }
.hb-room-meta { font-size: 12px; color: #9CA3AF; margin-top: 5px; }
.hb-room-right { flex-shrink: 0; text-align: right; }
.hb-room-price { font-size: 18px; font-weight: 850; color: #FF5A1F; }
.hb-room-price small { font-size: 11px; font-weight: 600; color: #9CA3AF; }
.hb-room-btn { display: block; margin-top: 5px; background: var(--accent-warm-grad); color: #fff; border: none; font-size: 13px; font-weight: 800; padding: 6px 18px; border-radius: 9px; cursor: pointer; }
#hb-footer { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px env(safe-area-inset-bottom, 14px); background: #fff; border-top: 1px solid #F0F0F0; }
#hb-foot-price { font-size: 13px; color: #6B7280; font-weight: 600; }
#hb-foot-btn { flex-shrink: 0; background: var(--brand-grad); color: #fff; border: none; font-size: 16px; font-weight: 800; padding: 13px 40px; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(123,97,255,0.32); }

/* ── 全屏图片浏览 ── */
#photo-viewer {
  position: fixed; inset: 0; z-index: 100;
  background: #000;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
}
#photo-viewer.open { display: flex; }
#viewer-img {
  max-width: 100%; max-height: 80vh; object-fit: contain;
  transition: opacity .2s;
}
#viewer-close {
  position: absolute; top: 16px; right: 16px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.15); border: none;
  color: #fff; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#viewer-counter {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.8); font-size: 14px;
}
#viewer-prev, #viewer-next {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.12); border: none; color: #fff;
  font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
#viewer-prev { left: 14px; }
#viewer-next { right: 14px; }
#viewer-caption {
  position: absolute; bottom: 40px; left: 0; right: 0;
  text-align: center; color: rgba(255,255,255,0.75); font-size: 13px; padding: 0 20px;
}

/* ── Toast ── */
#toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.72); color: #fff; backdrop-filter: blur(8px);
  padding: 10px 20px; border-radius: 22px; font-size: 13px;
  z-index: 9999; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
}

/* ══════════════════════════════════════════
   出行平台「问一问」功能模块样式
══════════════════════════════════════════ */

/* —— 推荐 chips —— */
#suggest-chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.chip {
  font-size:12px; font-weight:600; color:var(--brand-1); background:#F1EDFF;
  border:1px solid #E4DBFF; border-radius:99px; padding:6px 12px; cursor:pointer;
  transition:all .15s; user-select:none;
}
.chip:active { transform:scale(0.95); background:#E4DBFF; }
.home-actions .chip {
  display:inline-flex; align-items:center; width:fit-content; max-width:100%;

  border-radius: 17px; padding: 11px 19px; font-size: 15.5px; font-weight: 650;
  box-shadow: 0 14px 34px rgba(17,24,39,0.07); backdrop-filter: blur(18px);
}
.home-actions .chip::before {
  content:'✦'; color:#7B4B43; margin-right:10px; font-size:12px;
}
.home-actions .chip:active { background:#fff; transform: scale(0.98); }

#recent-backdrop {
  position:fixed; inset:0; z-index:280; background:rgba(17,24,39,0.16);
  opacity:0; pointer-events:none; transition:opacity .24s; backdrop-filter: blur(2px);
}
#recent-backdrop.open { opacity:1; pointer-events:all; }
#recent-drawer {
  position:fixed; left:0; top:0; bottom:0; width:min(82vw, 320px); height:100dvh; max-height:100dvh; z-index:281;
  background:rgba(255,255,255,0.96); box-shadow:24px 0 60px rgba(17,24,39,0.16);
  transform:translateX(-102%); transition:transform .28s cubic-bezier(.2,.75,.2,1);
  padding: max(22px, env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:contain;
}
#recent-drawer.open { transform:translateX(0); }
.recent-head { flex:0 0 auto; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
.recent-title { font-size:22px; font-weight:900; color:#171923; }
.recent-sub { font-size:12px; color:#9CA3AF; margin-top:4px; }
.recent-close {
  width:34px; height:34px; border:none; border-radius:50%; background:#F3F4F6;
  color:#4B5563; font-size:22px; cursor:pointer;
}
#recent-list {
  flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column; gap:10px; padding-right:2px;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y;
}

.recent-item {
  flex:0 0 auto; border:none; border-radius:16px; padding:13px 14px; text-align:left; cursor:pointer;
  background:#F8FAFC; color:#1F2937; touch-action:pan-y;
}
.recent-item:active { transform: scale(0.99); background:#F2F6FC; }
.recent-item-title { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.recent-item-meta { font-size:11.5px; color:#9CA3AF; margin-top:5px; }
.recent-empty { color:#9CA3AF; font-size:13px; line-height:1.6; padding:14px 4px; }
.recent-new-btn {
  flex:0 0 auto; margin-top:14px; border:none; border-radius:16px; padding:13px 16px;
  background:var(--brand-grad); color:#fff; font-weight:850; font-size:15px; cursor:pointer;
}
.recent-menu {
  position:fixed; z-index:9999; min-width:116px; padding:6px;
  border-radius:12px; background:#fff; box-shadow:0 14px 36px rgba(17,24,39,0.18);
  border:1px solid rgba(229,231,235,0.9); display:none;
}
.recent-menu.open { display:block; }
.recent-menu button {
  width:100%; border:none; background:transparent; color:#EF4444;

}
.recent-menu button:active, .recent-menu button:hover { background:#FEF2F2; }

/* —— 多智能体步骤 —— */
.agent-step { display:flex; align-items:center; gap:9px; padding:6px 0; opacity:0; transform:translateY(4px); transition:all .35s; }
.agent-step.show { opacity:1; transform:none; }
.agent-ava {
  width:26px; height:26px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;
}
.agent-text { font-size:12.5px; color:#374151; }
.agent-text b { color:#1A1A1A; }
.agent-done { margin-left:auto; color:#16A34A; font-size:13px; }

/* —— 客流热力指数 —— */
#heat-panel:empty, #budget-panel:empty, #product-panel:empty { display:none; }
.heat-box {
  background:#fff; border:1px solid #F0F0F0; border-radius:14px; padding:12px 14px; margin:2px 0 12px;
  box-shadow:0 1px 6px rgba(0,0,0,0.05);
}
.heat-title { font-size:12.5px; font-weight:700; color:#1A1A1A; margin-bottom:9px; display:flex; align-items:center; gap:5px; }
.heat-row { display:flex; gap:8px; }
.heat-item { flex:1; text-align:center; background:#F8FAFC; border-radius:10px; padding:8px 4px; }
.heat-emoji { font-size:17px; }
.heat-val { font-size:15px; font-weight:800; margin-top:2px; }
.heat-label { font-size:10px; color:#9CA3AF; margin-top:1px; }

/* —— 预算滑块 —— */
.budget-box {
  background:linear-gradient(135deg,#F5F2FF,#EEF4FF); border:1px solid #E4DBFF;
  border-radius:14px; padding:13px 15px; margin:2px 0 12px;
}
.budget-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; }
.budget-head .t { font-size:13px; font-weight:700; color:#1A1A1A; }
.budget-head .v { font-size:16px; font-weight:850; color:var(--brand-1); }

.budget-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
  background:var(--brand-1); cursor:pointer; box-shadow:0 2px 6px rgba(123,97,255,0.5); border:3px solid #fff;
}
.budget-status { font-size:11.5px; margin-top:8px; font-weight:600; }
.budget-status.ok { color:#16A34A; }
.budget-status.warn { color:#DC2626; }

/* —— 商品卡（机票/酒店） —— */
.prod-section-title { font-size:13px; font-weight:800; color:#1A1A1A; margin:6px 0 9px; display:flex; align-items:center; gap:6px; }
.prod-card {
  display:flex; align-items:center; gap:11px; background:#fff; border:1px solid #F0F0F0;
  border-radius:13px; padding:11px 13px; margin-bottom:9px; box-shadow:0 1px 6px rgba(0,0,0,0.05);
}

.prod-main { flex:1; min-width:0; }
.prod-name { font-size:13px; font-weight:700; color:#1A1A1A; }
.prod-sub { font-size:11px; color:#9CA3AF; margin-top:2px; }
.prod-stock { font-size:10px; color:#EA580C; margin-top:2px; font-weight:600; }
.prod-right { text-align:right; flex-shrink:0; }
.prod-price { font-size:15px; font-weight:850; color:#FF5A5F; }
.prod-price small { font-size:10px; font-weight:600; color:#9CA3AF; }
.prod-book {
  margin-top:5px; border:none; background:linear-gradient(135deg,#FF7E5F,#FF5A5F); color:#fff;
  font-size:11px; font-weight:700; padding:5px 13px; border-radius:99px; cursor:pointer;
}
.prod-book:active { transform:scale(0.95); }

/* —— 添加停留点按钮 —— */
#add-stop-btn {
  width:100%; margin:6px 0 10px; padding:11px; border:1.5px dashed #C9BEF0; background:#FAF8FF;
  color:var(--brand-1); font-size:13px; font-weight:700; border-radius:12px; cursor:pointer;
}
#add-stop-btn:active { transform:scale(0.98); }

/* —— 添加停留点 / 手绘攻略 弹层 —— */
.modal-backdrop {
  position:fixed; inset:0; z-index:260; background:rgba(0,0,0,0.4);
  display:flex; align-items:center; justify-content:center; padding:22px;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.modal-backdrop.open { opacity:1; pointer-events:all; }
.modal-card {
  width:100%; max-width:360px; max-height:80vh; overflow-y:auto; background:#fff;
  border-radius:20px; padding:18px; box-shadow:0 12px 50px rgba(0,0,0,0.3);
  transform:translateY(20px) scale(0.97); transition:transform .3s;
}

  border-radius:12px; margin-bottom:8px; cursor:pointer;
}
.modal-poi:active { background:#F8FAFC; }
.modal-close {
  width:100%; margin-top:6px; padding:11px; border:none; background:#F3F4F6; color:#374151;
  font-size:13px; font-weight:700; border-radius:12px; cursor:pointer;
}
.review-list { display:flex; flex-direction:column; gap:12px; }
.review-item { border:1px solid #EEF0F4; border-radius:14px; padding:13px 14px; background:#fff; }
.review-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px; }
.review-user { font-size:14px; font-weight:850; color:var(--ink); }
.review-score { font-size:13px; font-weight:850; color:var(--brand-1); white-space:nowrap; }
.review-text { font-size:13.5px; line-height:1.65; color:#374151; }
.review-tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
.review-tag { font-size:11.5px; font-weight:700; color:#6B7280; background:#F3F4F6; border-radius:999px; padding:4px 8px; }

/* —— 手绘攻略海报 —— */
#poster {
  background:linear-gradient(160deg,#7B61FF 0%,#5B8DEF 100%); color:#fff;
  border-radius:18px; padding:22px 20px; text-align:center;
}
#poster .p-emoji { font-size:40px; }
#poster .p-title { font-size:20px; font-weight:850; margin:8px 0 3px; }
